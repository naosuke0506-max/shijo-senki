function frameUrl(def, motion, frameIndex1based){
  if (def.frameFileMap && def.frameFileMap[motion]) return def.imageBase + def.frameFileMap[motion]; // ファイル名を1つずつ指定する場合(望楼台・壁など)
  const base = (def.motionImageBase && def.motionImageBase[motion]) || def.imageBase;
  const alias = def.motionAlias && def.motionAlias[motion]; // 別モーションの絵を(逆順で)流用する指定(ゲートの消滅など)
  let m = motion, i = frameIndex1based;
  if (alias){
    m = alias.as;
    if (alias.reverse) i = (def.frameCounts[motion] || 1) - frameIndex1based + 1;
  }
  return base + (def.imagePrefix || "") + m + "_" + i + ".png";
}

function removeUnit(unit){
  if (unit.buffFxEl) unit.buffFxEl.remove();
  unit.el.remove();
  if (battle) battle.units = battle.units.filter(u => u !== unit);
}

/* ---------- 鼓舞バフ ---------- */

function getBuffStacks(unit){
  return unit.buffSources ? unit.buffSources.size : 0;
}
// このユニットの陣営に、生きているテイマーがいるかどうか(範囲無限)
function hasLivingTamerAlly(unit){
  if (!battle) return false;
  return battle.units.some(u => !u.dead && u.side === unit.side && u.kind === "tamer");
}
// 鼓舞バフの倍率：バフをかけている鼓舞兵(buffSources)ごとの倍率を掛け合わせる(倍率は鼓舞兵の定義に持たせている)
function getBuffFactor(unit, key){
  if (!unit.buffSources || !unit.buffSources.size) return 1;
  let m = 1;
  unit.buffSources.forEach(src => { const v = src.def[key]; if (v != null) m *= v; });
  return m;
}
// 相手ごとの攻撃力の補正：種族(槍兵は獣に強い)・役職狩り(斬込隊は敵の役職者に強い)・先手必勝(先手は新しい相手への最初の一撃が強い)。
// commit=true のときだけ、先手の「最初の一撃」を使ったことにする
function attackBonus(unit, target, commit){
  let m = (unit.def.bonusVsRace && unit.def.bonusVsRace[target.def.race]) || 1;
  if (unit.def.bonusVsBuilding && (target.def.structureUnit || target.def.countsAsBuilding)) m *= unit.def.bonusVsBuilding; // 破城槌：建物への特攻
  if (unit.def.bonusVsNoCombat && target.def.noCombat) m *= unit.def.bonusVsNoCombat; // 斥候：非戦闘の支援役(穽鬼・鼓鬼・巫鬼など)への追加ダメージ
  if (unit.aura){                                    // リーダー効果：魔獣への攻撃力(槍兵)・建物への攻撃力(破城槌)・火属性の攻撃力(火槍手)・突進系の威力(鬼犀)
    if (unit.aura.charge !== 1 && unit.def.race === "beast" && (unit.def.laneSpan || 1) === 1) m *= unit.aura.charge;
    if (unit.aura.vsBeast !== 1 && target.def.race === "beast") m *= unit.aura.vsBeast;
    if (unit.aura.vsBuilding !== 1 && (target.def.structureUnit || target.def.countsAsBuilding)) m *= unit.aura.vsBuilding;
    if (unit.aura.fire !== 1 && unit.def.attackFlags && unit.def.attackFlags.fire) m *= unit.aura.fire;
  }
  return m;
}
function getEffectiveAtk(unit){
  let atk = unit.def.atk * getBuffFactor(unit, "buffAtkMult") * (unit.aura ? unit.aura.atk : 1) * envMult(battle && battle.env, unit, "atk");     // 朝・昼・夜
  if (unit.def.tamerBuffEligible && hasLivingTamerAlly(unit)){
    atk *= 1.10; // テイマーが在陣している間、攻撃力+10%(範囲無限、テイマーが死ぬと自動的に外れる)
  }
  return atk;
}
function getEffectiveSpeed(unit, baseSpeed){
  return baseSpeed * (unit.slowMs > 0 ? .5 : 1) * (unit.berserk ? 1.3 : 1) * getBuffFactor(unit, "buffSpeedMult") * (unit.aura ? unit.aura.speed : 1) * envMult(battle && battle.env, unit, "speed");     // 夜・雨
}
function getDamageCutMultiplier(unit){
  let f = (unit.bossLeader && bossUpgTier() >= 3 && unit.hp < unit.hpMax * .5 ? .8 : 1) * getBuffFactor(unit, "buffDamageCutMult") * (unit.aura ? unit.aura.cut : 1) * (unit.homeCut || 1);   // 本拠地の力：物理・属性・毒/炎上・特殊攻撃、どれも同じだけ軽くなる
  if (unit.hornBuffUntil && battle && battle.time < unit.hornBuffUntil) f *= (unit.hornDamageCutMult != null ? unit.hornDamageCutMult : 0.5); // 指揮官の号令：被ダメージ大幅軽減
  return f;
}

// このユニットが死亡/消滅した際、そのユニットが与えていたバフを全員から取り除く
function clearBuffsFrom(deadUnit){
  if (!battle) return;
  battle.units.forEach(u => {
    if (u.buffSources) u.buffSources.delete(deadUnit);
  });
}

// 鼓舞兵の太鼓判定：近くに味方ゴブリンが一定数いれば太鼓を叩いてバフを付与する
function updateInspire(unit, dtMs){
  const def = unit.def;
  if (!def.canInspire || unit.dead) return;
  if (unit.inspireCooldown > 0){
    unit.inspireCooldown = Math.max(0, unit.inspireCooldown - dtMs);
    return;
  }
  if (unit.motion !== "walk" && unit.motion !== "idle") return; // 怯み中などは判定しない

  const nearbyGoblinAllies = battle.units.filter(other =>
    other !== unit && !other.dead && other.side === unit.side &&
    (other.def.race === "goblin" || other.def.buffEligible) && canReachLane(unit, other) &&
    Math.abs(other.x - unit.x) <= def.inspireRange
  );

  if (nearbyGoblinAllies.length < (def.inspireRequiredAllies || 2)) return;

  // 太鼓を叩くモーションへ(数ループ再生してから歩行に戻る)
  let loops = 0;
  const maxLoops = 2;
  const onDrumLoopEnd = () => {
    loops++;
    if (loops < maxLoops && !unit.dead){
      setMotion(unit, "drum", { onEnd: onDrumLoopEnd });
    } else if (!unit.dead){
      setMotion(unit, "walk", { loop:true });
    }
  };
  setMotion(unit, "drum", { onEnd: onDrumLoopEnd });
  unit.inspireCooldown = def.inspireCooldownMs || 4000;

  // 太鼓の衝撃波エフェクト
  if (def.fxDrumWave){
    const fx = def.fxDrumWave;
    for (let i = 0; i < fx.count; i++){
      btimeout(() => {
        spawnFx(fx.imageBase + fx.prefix + (i+1) + ".png", unit.x, { height: 60, bottom: unit.baseB || 74, lifespan: fx.durations[i] });
      }, i * (fx.durations[i] || 130));
    }
  }

  // バフ付与(このドラマーからまだ受けていない、かつ上限未満の味方ゴブリンのみ)
  nearbyGoblinAllies.forEach(ally => {
    if (!ally.buffSources) ally.buffSources = new Set();
    if (ally.buffSources.has(unit)) return;
    if (ally.buffSources.size >= (def.buffMaxStacks || 3)) return;
    ally.buffSources.add(unit);

    // rage_charge(猛突進)を持つキャラは、鼓舞された瞬間にそれを発動する(スーパーアーマー等を無視して割り込む)
    if (ally.def.frameCounts && ally.def.frameCounts.rage_charge){
      startRageCharge(ally);
    }

    // 特殊モーション(ゴブリン長)：鼓舞された瞬間に発動する
    if (ally.def.frameCounts && ally.def.frameCounts.special){
      startChiefSpecial(ally);
    }

    // 鼓舞を受けた瞬間、そのゴブリンは何をしていても強制的に咆哮する(スーパーアーマー等を無視して割り込む)
    if (ally.def.frameCounts && ally.def.frameCounts.roar){
      setMotion(ally, "roar", {
        onEnd: () => { if (!ally.dead) setMotion(ally, "walk", { loop:true }); }
      });
      const rfx = ally.def.fxRoarWave;
      if (rfx){
        const flip = ally.facing === -1; // キャラが左向きなら音波も反転
        for (let i = 0; i < rfx.count; i++){
          btimeout(() => {
            if (ally.dead) return;
            spawnFx(rfx.imageBase + rfx.prefix + (i+1) + ".png", ally.x, { height: 50, bottom: (ally.baseB || 74) + 26, lifespan: rfx.durations[i], flip });
          }, i * (rfx.durations[i] || 175));
        }
      }
    }
  });
}

/* ---------- 罠兵：罠の設置 ---------- */

// 罠を置く位置をランダムに1マス選ぶ(望楼兵の設置と同じ考え方で、戦場のどこかに自由に置く。両端の1マスずつは除く)
function pickRandomTrapColumnX(){
  const cols = Math.max(3, Math.floor(STAGE_W / GRID_CELL));
  const col = 2 + Math.floor(Math.random() * (cols - 3));
  return (col - 0.5) * GRID_CELL;
}

// 罠兵：チェックポイント(18マス目・10マス目を交互に)まで歩いて1つ置いたら、振り向いて自城へ戻り、
// クールタイム(既定80秒)が明けたら、また次のチェックポイントへ向けて出撃する、という巡回を繰り返す
function updateTrapperAI(unit, dtMs){
  if (unit.dead) return;
  const def = unit.def;
  if (!unit.trapPhase) unit.trapPhase = "advancing";

  if (unit.trapPhase === "cooldown"){
    unit.trapCooldownMs = (unit.trapCooldownMs || 0) - dtMs;
    if (unit.trapCooldownMs <= 0){
      unit.trapPhase = "advancing";
      setMotion(unit, "walk", { loop:true });
    }
    return;
  }

  if (unit.trapPhase === "returning"){
    const dir = unit.side === "player" ? 1 : -1;
    unit.facing = dir;
    const field = document.getElementById("battlefield");
    const fieldWidth = field ? field.clientWidth : STAGE_W;
    const siteMode = unit.siteRoster && battle.stage.siteBattle;
    const homeX = siteMode                                                                     // 味方の城による進める限界より、必ず手前になる位置
      ? (unit.side === "player" ? fieldWidth - CASTLE_APPROACH_GAP - bodyWidth(unit) - 30 : CASTLE_APPROACH_GAP + bodyWidth(unit) + 30)
      : (unit.side === "player" ? fieldWidth - 90 : 90);
    unit.x += moveWithCollision(unit, dir * getEffectiveSpeed(unit, def.walkSpeed) * (dtMs / 1000));
    applyFrame(unit);
    const reached = unit.side === "player" ? unit.x >= homeX : unit.x <= homeX;
    if (reached){
      if (siteMode){ siteBuilderExit(unit, def.trapResupplyCooldownMs); return; }               // 拠点の戦闘：画面から消えて、召喚欄・クールタイムへ(望楼兵などと同じ)
      unit.trapPhase = "cooldown";
      unit.trapCooldownMs = def.trapResupplyCooldownMs || 80000;
      setMotion(unit, "idle", { loop:true });
    }
    return;
  }

  if (unit.trapPhase === "placing") return; // モーションのonEndで次の状態(returning)へ移る

  // "advancing"：出撃のたびランダムに選んだ1マスへ向けて歩く(望楼兵と同じく、場所は固定しない)
  if (unit.trapTargetX == null) unit.trapTargetX = pickRandomTrapColumnX();
  const targetX = unit.trapTargetX;
  const forwardDir = targetX >= unit.x ? 1 : -1;
  unit.facing = forwardDir;

  if (unit.motion !== "walk") setMotion(unit, "walk", { loop:true });
  const reachTolerance = 3;
  const reached = Math.abs(unit.x - targetX) <= reachTolerance;
  if (!reached){
    unit.x += moveWithCollision(unit, forwardDir * getEffectiveSpeed(unit, def.walkSpeed) * (dtMs / 1000));
    applyFrame(unit);
    return;
  }

  unit.trapPhase = "placing";
  setMotion(unit, "place_trap", {
    onEnd: () => {
      if (unit.dead) return;
      spawnTrap(unit, targetX);
      unit.trapTargetX = null; // 次の出撃時、また新しい場所をランダムに選び直す
      unit.trapPhase = "returning";
      setMotion(unit, "walk", { loop:true });
    }
  });
}

// 罠エンティティを生成(見た目の網はtrap_fx_1〜6を使い、起動するまではtrap_fx_1のまま静止)
function spawnTrap(owner, trapX){
  const def = owner.def;
  const field = document.getElementById("battlefield");
  if (!field) return;

  const el = document.createElement("img");
  el.className = "fx-sprite trap-sprite";
  el.style.height = "36px";
  el.style.bottom = ((owner.baseB || 74) - 8) + "px"; // 設置した罠兵のレーンの足元
  el.style.transform = "translateX(" + trapX + "px)";
  el.src = def.imageBase + "trap_fx_1.png";
  field.appendChild(el);

  battle.traps.push({
    owner, side: owner.side, x: trapX, el, lane: owner.lane,
    state: "arming",     // arming → armed → triggering → holding
    armTimer: def.trapArmDelayMs || 1000,
    frameIndex: 0,
    frameTimer: 0,
    captured: [],
    removed: false
  });
}

// 全ての罠の状態更新：起動判定、網の展開アニメ、拘束対象の解放チェック
function updateTraps(dtMs){
  if (!battle || !battle.traps.length) return;
  battle.traps.forEach(trap => {
    if (trap.removed) return;
    const def = trap.owner.def;
    const durations = (def.frameDurations && def.frameDurations.trap_fx) || [1000];
    const frameCount = (def.frameCounts && def.frameCounts.trap_fx) || durations.length;

    if (trap.state === "arming"){
      trap.armTimer -= dtMs;
      if (trap.armTimer <= 0) trap.state = "armed";
      return;
    }

    if (trap.state === "armed"){
      const enemySide = trap.side === "player" ? "enemy" : "player";
      const trigR = def.trapTriggerRadius || 50;
      // 罠と同じレーンにいる敵だけが踏む
      const nearby = battle.units.filter(u =>
        u.side === enemySide && !u.dead && !u.restrained && !u.mounted &&
        lanesOverlap(trap.lane, trap.lane, u.laneLo, u.laneHi) &&
        Math.abs(u.x - trap.x) <= trigR
      );
      // 斥候・狼筅手など、近接で罠そのものを壊せるキャラが踏んだ場合は、起動せず罠だけ消える
      if (nearby.some(u => u.def.canDisarmTraps)){
        trap.removed = true;
        trap.el.remove();
        return;
      }
      const stepping = nearby.filter(u => !u.def.netResistant); // 耐性持ちは罠にかからない
      if (stepping.length === 0) return; // 誰もいない、または耐性持ちしかいない間は起動しない

      // 複数レーンを占める敵は、占有レーンの数だけ罠が必要。足りないと、踏まれた瞬間に罠が壊れるだけで捕まらない
      const armedTraps = battle.traps.filter(t => !t.removed && t.state === "armed" && t.side === trap.side);
      const coverTraps = u => {
        const list = [];
        for (let L = u.laneLo; L <= u.laneHi; L++){
          const t = armedTraps.find(x => x.lane === L && Math.abs(u.x - x.x) <= trigR);
          if (!t) return null;
          list.push(t);
        }
        return list;
      };
      const catchable = stepping.filter(u => coverTraps(u) !== null);
      if (catchable.length === 0){
        trap.removed = true; // 罠が足りず、壊されただけ
        trap.el.remove();
        return;
      }
      // 捕まえる敵を覆っている他のレーンの罠は、ここで使い切る(見た目は、この罠の網1つ)
      catchable.forEach(u => {
        coverTraps(u).forEach(t => { if (t !== trap){ t.removed = true; t.el.remove(); } });
      });

      trap.state = "triggering";
      trap.frameIndex = 1; // trap_fx_2(起動の瞬間)から再生開始
      trap.frameTimer = 0;
      trap.captured = catchable;

      // 捕獲対象の中で最も表示サイズが大きいキャラに合わせて網のエフェクトサイズを調整
      const maxHeight = Math.max(36, ...catchable.map(u => u._displayHeight || 60));
      trap.el.style.height = Math.round(maxHeight * 0.9) + "px";

      catchable.forEach(u => {
        u.restrained = true;
        const trapMs = (def.netRestrainDurationMs != null ? def.netRestrainDurationMs : 50000) * (trap.owner.aura && trap.owner.aura.trapMul ? trap.owner.aura.trapMul : 1);   // 穽鬼のリーダー効果で、最大時間が伸びる
        u.restrainRemainingMs = (u.def.netBreakTimeMs != null) ? Math.min(u.def.netBreakTimeMs, trapMs) : trapMs;
        u.img.style.visibility = "hidden"; // 本体だけ隠す(HPバーはelの子のまま残るので見え続ける)
      });
      return;
    }

    if (trap.state === "triggering" || trap.state === "holding"){
      trap.frameTimer += dtMs;
      const curDur = durations[Math.min(trap.frameIndex, durations.length - 1)];
      if (trap.frameTimer >= curDur && trap.frameIndex < frameCount - 1){
        trap.frameTimer -= curDur;
        trap.frameIndex++;
        if (trap.frameIndex >= frameCount - 1) trap.state = "holding";
      }
      trap.el.src = def.imageBase + "trap_fx_" + (trap.frameIndex + 1) + ".png";

      // 捕獲対象が全員(死亡または脱出で)いなくなったら罠を消滅させる
      trap.captured = trap.captured.filter(u => !u.dead && u.restrained);
      if (trap.state === "holding" && trap.captured.length === 0){
        trap.removed = true;
        trap.el.remove();
      }
    }
  });
  battle.traps = battle.traps.filter(t => !t.removed);
}

// 拘束時間の経過処理：netBreakTimeMsが設定されている敵は時間経過で自力脱出する
function updateRestraints(dtMs){
  if (!battle) return;
  battle.units.forEach(unit => {
    if (!unit.restrained || unit.dead) return;
    if (unit.restrainRemainingMs === Infinity) return;
    unit.restrainRemainingMs -= dtMs;
    if (unit.restrainRemainingMs <= 0){
      unit.restrained = false;
      unit.img.style.visibility = "visible";
      unit.target = null;
      const fallback = unit.def.frameCounts.walk ? "walk" : (unit.def.approachMotion || "walk");
      setMotion(unit, fallback, { loop:true });
    }
  });
}

/* ---------- 弓兵：毒の継続ダメージ ---------- */

// 毒状態の継続ダメージ処理(attacker=nullで自傷扱いにしない、applyDamageToUnitに再度毒を上書きさせない)
function updatePoison(unit, dtMs){
  if (unit.dead || !unit.poisonRemainingMs || unit.poisonRemainingMs <= 0) return;
  unit.poisonRemainingMs -= dtMs;
  unit.poisonTickTimer -= dtMs;
  if (unit.poisonTickTimer <= 0){
    unit.poisonTickTimer += unit.poisonTickIntervalMs || 1000;
    applyDamageToUnit(unit, unit.poisonDamagePerTick || 0, null);
  }
  if (unit.poisonRemainingMs <= 0){
    unit.poisonRemainingMs = 0;
  }
}

/* ---------- 炎(火槍手・ガス缶)：燃えている見た目だけの状態(ダメージ自体はfireZoneが処理する) ---------- */
const FIRE_STATUS_FX = { count:4, prefix:"burn_fx_", durations:[200,200,200,200], imageBase: IMG_FX_COMMON2 };
// 炎上の蓄積(0〜100%)。攻撃の火炎+25%・地面に広がる炎1ヒット+5%・爆発+35%。100%で発動し、
// 最大HPの50%を20秒かけて削る(発動のたびに、その時点の最大HPで20秒分を計算し直す)
function addBurnBuildup(unit, pct, src){
  if (!unit || unit.dead) return;
  pct *= envFireMult(battle && battle.env);                                             // 雨：炎上も、たまりにくい
  unit.burnBuildup = (unit.burnBuildup || 0) + pct;
  if (unit.burnBuildup >= 100){
    unit.burnBuildup = 0;
    unit.burnStatusRemainingMs = 20000;
    unit.burnStatusDamagePerMs = (unit.hpMax * 0.5) / 20000 * ((src && src.homeAtk) || 1);   // 本拠地の力：炎上のダメージも、火元の攻撃力に応じて上がる(受ける側の軽減は、毎回のダメージ適用で掛かる)
    unit.burningFxDef = FIRE_STATUS_FX;
  }
}
function updateBurningStatus(unit, dtMs){
  if (unit.dead || !unit.burnStatusRemainingMs || unit.burnStatusRemainingMs <= 0) return;
  applyDamageToUnit(unit, (unit.burnStatusDamagePerMs || 0) * dtMs, null);
  if (unit.dead) return;
  unit.burnStatusRemainingMs -= dtMs;
  if (unit.burnStatusRemainingMs <= 0) unit.burnStatusRemainingMs = 0;
}
function updateBurningFx(unit, dtMs){
  const active = !unit.dead && unit.burnStatusRemainingMs > 0 && unit.burningFxDef;
  if (active && !unit.burningFxEl){
    const img = document.createElement("img");
    img.className = "fx-sprite burning-status-fx";
    unit.el.appendChild(img);
    unit.burningFxEl = img;
    unit.burningFxFrame = 0;
    unit.burningFxTimer = 0;
  }
  if (!active && unit.burningFxEl){
    unit.burningFxEl.remove();
    unit.burningFxEl = null;
  }
  if (!unit.burningFxEl) return;
  const fxDef = unit.burningFxDef;
  unit.burningFxTimer += dtMs;
  const dur = fxDef.durations[unit.burningFxFrame] || 300;
  if (unit.burningFxTimer >= dur){
    unit.burningFxTimer -= dur;
    unit.burningFxFrame = (unit.burningFxFrame + 1) % fxDef.count;
  }
  unit.burningFxEl.src = keyedFxSrc(fxDef.imageBase + fxDef.prefix + (unit.burningFxFrame + 1) + ".png");
  unit.burningFxEl.style.height = Math.round((unit._displayHeight || 92) * 0.8) + "px";
  unit.burningFxEl.style.left = "50%";
  unit.burningFxEl.style.top = "10%";
}

/* ---------- 黒背景の効果画像(毒・出血・回復)を透過に変換する ---------- */
// 黒背景のままだと、ユニットに重ねたときに黒い四角が見えてしまうため、読み込んだ画像の「黒い部分」を透明にした画像に差し替える。
// 変換が終わるまでは元の画像を使う。戦闘開始時に、使う画像をあらかじめ変換しておく。
const keyedFxCache = new Map(); // url -> 変換後のdataURL / "pending" / "fail"
// opts: { bp: 黒とみなす明るさ(これ以下は透明), wp: 完全に不透明とみなす明るさ, sub: trueなら背景の明るさ(bp)を差し引いた色にする }
// 背景が真っ黒でなく暗い灰色のグラデーションになっている画像(回復エフェクト)は、bp/wpを大きめにして sub:true で使う
const FX_KEY_DEFAULT = { bp: 6, wp: 50, sub: false };
const FX_KEY_HEAL = { bp: 52, wp: 175, sub: true };
const FX_KEY_IMPACT = { bp: 24, wp: 120, sub: true }; // 岩の着弾(暗い灰色の背景)
function keyedFxSrc(url, opts){
  const c = keyedFxCache.get(url);
  if (c && c !== "pending" && c !== "fail") return c;
  if (!c) loadKeyedFx(url, opts || FX_KEY_DEFAULT);
  return url;
}
function loadKeyedFx(url, opts){
  keyedFxCache.set(url, "pending");
  const im = new Image();
  im.crossOrigin = "anonymous";
  im.onload = () => {
    try {
      const cv = document.createElement("canvas");
      cv.width = im.naturalWidth; cv.height = im.naturalHeight;
      const ctx = cv.getContext("2d");
      ctx.drawImage(im, 0, 0);
      const data = ctx.getImageData(0, 0, cv.width, cv.height);
      const d = data.data;
      const bp = opts.bp, wp = opts.wp;
      for (let i = 0; i < d.length; i += 4){
        const m = Math.max(d[i], d[i+1], d[i+2]);
        let a = (m - bp) / (wp - bp); // 明るさに応じて不透明にする(暗い=透明、明るい=不透明)
        a = a < 0 ? 0 : (a > 1 ? 1 : a);
        if (opts.sub && m > 0){
          // 背景の明るさ(bp)を差し引いた色にして、暗い背景のもやが残らないようにする
          const k = Math.max(0, m - bp) / m;
          d[i] *= k; d[i+1] *= k; d[i+2] *= k;
        }
        if (a > 0 && a < 1){
          d[i]   = Math.min(255, d[i]   / a);
          d[i+1] = Math.min(255, d[i+1] / a);
          d[i+2] = Math.min(255, d[i+2] / a);
        }
        d[i+3] = Math.round(d[i+3] * a);
      }
      ctx.putImageData(data, 0, 0);
      keyedFxCache.set(url, cv.toDataURL("image/png"));
    } catch (e) {
      keyedFxCache.set(url, "fail"); // 変換できなければ元の画像のまま使う
    }
  };
  im.onerror = () => keyedFxCache.set(url, "fail");
  im.src = url;
}
function warmKeyedFx(){
  Object.keys(CHAR_DEFS).forEach(k => {
    const d = CHAR_DEFS[k];
    if (d.fxImpact && d.fxImpactKey) keyedFxSrc(d.imageBase + d.fxImpact, FX_KEY_IMPACT);
    [[d.fxPoisonStatus, FX_KEY_DEFAULT], [d.fxBleed, FX_KEY_DEFAULT], [d.fxHealAura, FX_KEY_HEAL]].forEach(pair => {
      const fx = pair[0];
      if (!fx) return;
      for (let i = 0; i < fx.count; i++) keyedFxSrc(fx.imageBase + fx.prefix + (i + 1) + ".png", pair[1]);
    });
    if (d.chromaKeyMotions){ // 黒背景のまま渡された、ユニット本体のコマ(ガス缶の爆発など)も、あらかじめ透過処理しておく
      d.chromaKeyMotions.forEach(m => keyedFxSrc(frameUrl(d, m, 1), d.chromaKeyOpts || FX_KEY_DEFAULT));
    }
  });
  for (let i = 1; i <= 9; i++) keyedFxSrc(IMG_FX_COMMON2 + "fx_burn_" + i + ".png", FX_KEY_DEFAULT); // 火槍手：噴射のエフェクト(9コマ)
  for (let i = 1; i <= 3; i++) keyedFxSrc(IMG_FX_COMMON2 + "fx_groundflame_" + i + ".png", FX_KEY_DEFAULT); // 火槍手：地面に広がる炎のエフェクト
  for (let i = 1; i <= 4; i++) keyedFxSrc(IMG_FX_COMMON2 + "burn_fx_" + i + ".png", FX_KEY_DEFAULT); // 炎上の状態異常エフェクト
  for (let i = 1; i <= 3; i++) keyedFxSrc(IMG_FX_COMMON2 + "slash_wave_" + i + ".png", FX_KEY_DEFAULT); // 指揮官：斬道の衝撃波
  for (let i = 1; i <= 3; i++) keyedFxSrc(IMG_FX_COMMON2 + "cmd_wind_" + i + ".png", FX_KEY_DEFAULT); // 指揮官：角笛の風
}

// 毒状態の紫霧エフェクトをユニットの上に重ねてループ表示する(鼓舞バフのオーラと同じ仕組み)
function updatePoisonFx(unit, dtMs){
  const active = !unit.dead && unit.poisonRemainingMs > 0 && unit.poisonFxDef;

  if (active && !unit.poisonFxEl){
    const img = document.createElement("img");
    img.className = "fx-sprite poison-status-fx";
    unit.el.appendChild(img);
    unit.poisonFxEl = img;
    unit.poisonFxFrame = 0;
    unit.poisonFxTimer = 0;
  }
  if (!active && unit.poisonFxEl){
    unit.poisonFxEl.remove();
    unit.poisonFxEl = null;
  }
  if (!unit.poisonFxEl) return;

  const fxDef = unit.poisonFxDef;
  unit.poisonFxTimer += dtMs;
  const dur = fxDef.durations[unit.poisonFxFrame] || 300;
  if (unit.poisonFxTimer >= dur){
    unit.poisonFxTimer -= dur;
    unit.poisonFxFrame = (unit.poisonFxFrame + 1) % fxDef.count;
  }
  unit.poisonFxEl.src = keyedFxSrc(fxDef.imageBase + fxDef.prefix + (unit.poisonFxFrame + 1) + ".png");
  unit.poisonFxEl.style.mixBlendMode = "normal"; // 黒を透過に変換済みの画像なので、通常合成
  unit.poisonFxEl.style.height = Math.round((unit._displayHeight || 92) * 0.8) + "px"; // キャラの大きさに合わせる
  unit.poisonFxEl.style.left = "50%";
  unit.poisonFxEl.style.top = "10%";
}

/* ---------- 打ち上げ・吹き飛ばし(ラッシャーなど) ---------- */

const LAUNCH_GRAVITY = 1400; // px/s^2

// 対象を空中に打ち上げる(knockback:trueで後方への水平吹き飛びも同時に加える)
function launchUnit(target, attacker, opts){
  if (target.dead) return;
  if (target.def.immobile) return; // ゲートなど動かないものは、打ち上げ・吹き飛ばしを受けない
  if (target.def.noKnockback) return; // 拒馬を担いでいる間など、打ち上げ・吹き飛ばしを受け付けない状態
  if (target.perch) return;         // 望楼台・壁の上にいる間は、打ち上げ・吹き飛ばしを受けない(台が崩れたときは別の処理)
  if (target.def.staggerOnLaunch){ startStagger(target, attacker); return; } // 巨体は宙に浮かない
  opts = opts || {};
  target.launched = true;
  target.launchVY = opts.upSpeed || 380;
  if (opts.knockback){
    // 攻撃者から見て奥(=対象から見て後方)へ弾き飛ばす
    const awayDir = attacker ? Math.sign(target.x - attacker.x) || (target.side === "player" ? 1 : -1) : 1;
    // 吹き飛びは、レーンをまたがず、後ろへ2マス分だけ飛ぶ(滞空時間で割って速度を決める)
    const airtime = 2 * target.launchVY / LAUNCH_GRAVITY;
    target.launchVX = awayDir * (opts.knockbackDist || 2 * GRID_CELL) * (attacker && attacker.aura ? attacker.aura.knock : 1) / airtime;     // 吹き飛ばしの距離(鬼犀のリーダー効果で伸びる)
  } else {
    target.launchVX = 0;
  }
  // 空中にいる間は吹き飛び&かち上げモーションを表示し続ける(着地するまでループ)
  if (target.def.frameCounts && target.def.frameCounts.blowback){
    setMotion(target, "blowback", { loop: true });
  }
}

// 打ち上げ中の物理更新(重力で放物線を描き、着地したらdown→getupを経ないと動けるようにならない)
function updateLaunch(unit, dtMs){
  if (!unit.launched) return;
  if (unit.dead){ unit.launched = false; return; }
  if (unit.motion !== "blowback") return; // 既に着地後のdown→getupを再生中：通常のadvanceUnitに任せる

  const dt = dtMs / 1000;
  unit.launchVY -= LAUNCH_GRAVITY * dt;
  unit.launchY += unit.launchVY * dt;
  if (unit.launchVX){
    unit.x += unit.launchVX * dt;
  }
  if (unit.launchY <= 0){
    unit.launchY = 0;
    unit.launchVY = 0;
    unit.launchVX = 0;
    unit.needsPullBack = true; // 着地した先で敵と重なっていたら、手前に引く

    const def = unit.def;
    const finishRecovery = () => {
      unit.launched = false; // ここで初めて動けるようになる
      if (unit.dead) return;
      const fallback = def.frameCounts.walk ? "walk" : (def.approachMotion || "walk");
      setMotion(unit, fallback, { loop:true });
    };
    // 着地の衝撃：down→getupの順で再生し切るまでunit.launchedをtrueのままにしてAIを止めておく
    if (def.frameCounts && def.frameCounts.down){
      setMotion(unit, "down", {
        onEnd: () => {
          if (unit.dead) return;
          if (def.frameCounts.getup){
            setMotion(unit, "getup", { onEnd: finishRecovery });
          } else {
            finishRecovery();
          }
        }
      });
    } else if (def.frameCounts && def.frameCounts.getup){
      setMotion(unit, "getup", { onEnd: finishRecovery });
    } else {
      finishRecovery();
    }
  }
  applyFrame(unit);
}

/* ---------- ヒーラー：回復オーラ ---------- */

// 鼓舞兵の太鼓と同じ仕組み：クールタイムが明けたら詠唱モーションを1回再生し、
// その瞬間に範囲内でHPが減っている味方をまとめて固定量回復する
// 修復兵：戦わず、自城のそばに留まって、城のHPをゆっくり回復し続ける(巫鬼のように味方を癒すのではなく、城そのものを直す)
// ---- 望楼兵・望楼台・壁：設置まわりの一式 ----
function columnOfX(x){ return Math.max(1, Math.min(20, Math.floor(x / GRID_CELL) + 1)); }
function columnCenterX(col){ return (col - 0.5) * GRID_CELL; }
function findStructureAt(col, lane){
  return battle && battle.units.find(u => !u.dead && u.def.structureUnit && u.structureCol === col && u.lane === lane);
}
function findPlatformInColumn(col){
  return battle && battle.units.find(u => !u.dead && u.def.structureKind === "platform" && u.structureCol === col);
}
// 召喚ボタンから、設置系のキャラを選んだとき：戦場をタップして、築く場所(列・戦列)を選ぶモードに入る
function startPlacementPick(kind){
  const def = CHAR_DEFS[kind];
  const waiting = findResuppliedUnit(kind);
  if (waiting){
    battle.placementPending = { kind, reuseUnit: waiting };
    const ov = document.getElementById("grid-overlay"); if (ov) ov.style.display = "";
    showToast(def.name + "：築く場所を、戦場でお選びください(補充済み、屍はかからない)");
    return;
  }
  const cost = getDeployCost(def);
  battle.placementCooldowns = battle.placementCooldowns || {};
  const remain = (battle.placementCooldowns[kind] || 0);
  if (remain > 0){ showToast(def.name + "：あと" + Math.ceil(remain / 1000) + "秒で、また使える"); return; }
  if (battle.corpse < cost){ showToast("屍が足りぬ"); return; }
  battle.placementPending = { kind };
  const ov = document.getElementById("grid-overlay"); if (ov) ov.style.display = ""; // 場所を選ぶ間は、普段の表示設定に関わらずマス目を見せる
  showToast(def.name + "：築く場所を、戦場でお選びください");
}
// 選んだマス目に、実際に召喚し、そこへ向かわせる(この時点で屍を払い、クールタイムを起こす)。
// 既に補充済みの待機ユニットがいれば、新規召喚せずそれを送り出す(屍はかからない)
function commitPlacement(kind, col, lane){
  const pending = battle.placementPending;
  if (pending && pending.forIncendiary){
    // 火槍手：ガス缶を選んだ場所に据え置き、選んでおいた戦列へ本人(たち)を召喚する
    if (findStructureAt(col, lane)){ showToast("そこには、すでに何かある"); return false; }
    const info = pending.forIncendiary;
    const def = CHAR_DEFS[info.kind];
    const totalCost = getDeployCost(def) * info.lanes.length;
    if (battle.corpse < totalCost){ showToast("屍が足りぬ"); return false; }
    battle.corpse -= totalCost; updateWalletUI();
    const can = spawnUnit("gascan", "player", 0, { lane });
    can.x = columnCenterX(col) - (can.def.structureDisplayWidth || 0) / 2; can.structureCol = col;
    setMotion(can, "normal", { loop:true });
    applyFrame(can);
    info.lanes.forEach(l => {
      const u = spawnUnit(info.kind, "player", 0, { lane: l });
      u.deployedKind = info.kind;
    });
    return true;
  }
  const def = CHAR_DEFS[kind];
  if (findStructureAt(col, lane)){ showToast("そこには、すでに何かある"); return false; }
  if (pending && pending.reuseUnit && !pending.reuseUnit.dead){
    const u = pending.reuseUnit;
    u.resupplied = false;
    u.buildStarted = false; // 再出撃なので、建設中フラグを立て直す
    setUnitLane(u, lane);
    u.buildTargetCol = col; u.buildTargetLane = lane; u.buildTargetX = columnCenterX(col);
    const fallback = u.def.frameCounts.walk ? "walk" : "idle";
    setMotion(u, fallback, { loop:true });
    updateDeployReadyTags(); // 「準備完了」の札を消す
    return true;
  }
  const cost = getDeployCost(def);
  if (battle.corpse < cost){ showToast("屍が足りぬ"); return false; }
  battle.corpse -= cost; updateWalletUI();
  battle.placementCooldowns = battle.placementCooldowns || {};
  battle.placementCooldowns[kind] = def.placementCooldownMs || 0;
  const u = spawnUnit(kind, "player", 0, { lane });
  u.buildTargetCol = col; u.buildTargetLane = lane; u.buildTargetX = columnCenterX(col);
  u.deployedKind = kind;
  u.originalKind = kind;                          // 補充システム用：素手状態から元に戻すときの、本来の種類
  u.resupplyCooldownMs = def.resupplyCooldownMs || 0;
  return true;
}
// 修復兵：召喚ボタンを押すと、戦場をタップして直す対象(自城・望楼台・壁)を選ぶモードに入る。
// タップしただけでは召喚されず、その建物がハイライトされるだけ。ハイライトされた状態でもう一度ボタンを押すと、初めて召喚される
let repairHighlightEl = null;
function repairTargetEl(target){
  return target.kind === "castle" ? document.querySelector("#battlefield .castle.player") : target.ref.el;
}
function setRepairHighlight(target){
  clearRepairHighlight();
  const el = target && repairTargetEl(target);
  if (el){ el.classList.add("repair-highlight"); repairHighlightEl = el; }
}
function clearRepairHighlight(){
  if (repairHighlightEl){ repairHighlightEl.classList.remove("repair-highlight"); repairHighlightEl = null; }
}
function confirmOrStartRepairPick(kind){
  const def = CHAR_DEFS[kind];
  const pending = battle.repairPickPending;
  if (pending && pending.kind === kind){
    if (!pending.target){ showToast("先に、直す建物を戦場でお選びください"); return; } // ハイライトされていなければ、まだ召喚できない
    if (pending.target.kind === "structure" && pending.target.ref.dead){
      showToast("その建物は、もう無い"); pending.target = null; clearRepairHighlight(); return;
    }
    if (commitRepairTarget(kind, pending.target)){
      clearRepairHighlight();
      battle.repairPickPending = null;
    }
    return;
  }
  const cost = getDeployCost(def);
  if (battle.corpse < cost){ showToast("屍が足りぬ"); return; }
  battle.repairPickPending = { kind, target: null };
  showToast(def.name + "：直す建物を、戦場でお選びください(自城も可)");
}
// タップした場所に、直せる建物(自城・望楼台・壁)があるかを調べる
function repairTargetAtPoint(lx, ly){
  if (lx >= STAGE_W - 120) return { kind: "castle" }; // 自城の近く(右端)をタップ
  const u = unitAtPoint(lx, ly);
  if (u && u.def.structureUnit && u.side === "player") return { kind: "structure", ref: u };
  return null;
}
// 選んだ対象へ、実際に修復兵を出す(この時点で屍を払う)
function commitRepairTarget(kind, target){
  const def = CHAR_DEFS[kind];
  const cost = getDeployCost(def);
  if (battle.corpse < cost){ showToast("屍が足りぬ"); return false; }
  battle.corpse -= cost; updateWalletUI();
  const lane = target.kind === "structure" ? target.ref.lane : defaultLane();
  const u = spawnUnit(kind, "player", 0, { lane });
  u.repairTarget = target;
  u.deployedKind = kind;
  return true;
}
// 修復兵の行動：対象のそばまで歩き、着いたら直し続ける。対象が満タンでも、その場に留まって待ち、減ったらまた直す
function repairCellStructure(t){ const st = findStructureAt(t.col, t.lane); return (st && !st.dead && st.side === "player") ? st : null; }
function repairTargetPos(unit){
  const t = unit.repairTarget;
  if (t.kind === "none") return null;
  if (t.kind === "cell"){ const st = repairCellStructure(t); return st ? columnCenterX(st.structureCol) + 60 : null; }                   // 指定のマスに、建物が築かれたら、その建物のそばへ
  if (t.kind === "castle"){
    const field = document.getElementById("battlefield");
    return unit.side === "player" ? (field ? field.clientWidth - 90 : STAGE_W - 90) : 90;
  }
  if (t.ref.dead) return null; // 対象(望楼台・壁)が既に壊れていた
  return columnCenterX(t.ref.structureCol) + 60; // 建物の少し手前に立つ
}
function repairTargetHp(unit){
  const t = unit.repairTarget;
  if (t.kind === "none") return null;
  if (t.kind === "cell"){ const st = repairCellStructure(t); return st ? { hp:st.hp, max:st.hpMax } : null; }
  if (t.kind === "castle") return { hp: battle.playerCastleHp, max: battle.playerCastleHpMax };
  if (t.ref.dead) return null;
  return { hp: t.ref.hp, max: t.ref.hpMax };
}
function healRepairTarget(unit, amount){
  const t = unit.repairTarget;
  if (t.kind === "cell"){ const st = repairCellStructure(t); if (st){ st.hp = Math.min(st.hpMax, st.hp + amount); if (st.def.structureUnit) updateStructureStage(st); } return; }
  if (t.kind === "castle"){
    battle.playerCastleHp = Math.min(battle.playerCastleHpMax, battle.playerCastleHp + amount);
    updateCastleBars();
    if (battle.stage && battle.stage.winByFullHeal && battle.playerCastleHp >= battle.playerCastleHpMax && !battle.ended){
      endBattle(true, false, "repair");
    }
    return;
  }
  if (t.ref.dead) return;
  t.ref.hp = Math.min(t.ref.hpMax, t.ref.hp + amount);
  if (t.ref.def.structureUnit) updateStructureStage(t.ref);
}
function updateRepairerAI(unit, dtMs){
  const def = unit.def;
  const destX = repairTargetPos(unit);
  if (destX == null){
    // 対象が既になくなっていた：その場に立ち尽くす
    if (unit.motion !== "idle") setMotion(unit, "idle", { loop:true });
    return;
  }
  const dx = destX - unit.x;
  if (Math.abs(dx) > 6){
    const dir = dx > 0 ? 1 : -1;
    unit.x += moveWithCollision(unit, dir * (def.walkSpeed || 30) * (dtMs / 1000));
    if (unit.motion !== "walk" && def.frameCounts.walk) setMotion(unit, "walk", { loop:true });
    applyFrame(unit);
    return;
  }
  if (unit.motion !== "repair"){
    if (unit.motion === "idle" || unit.motion === "walk") setMotion(unit, "repair", { loop:true });
    return;
  }
  unit.repairCooldown -= dtMs;
  if (unit.repairCooldown <= 0){
    unit.repairCooldown = def.repairTickIntervalMs || 2000;
    const cur = repairTargetHp(unit);
    if (cur && cur.hp < cur.max) healRepairTarget(unit, (def.repairAmountPerTick || 0) * (unit.aura ? unit.aura.repair : 1));
    // 満タンでも、対象のそばに留まって待ち続け、減り次第また直す(この関数を呼び出すupdateUnitAIが、毎tick様子を見ている)
  }
}
function updateBuilderAI(unit, dtMs){
  if (unit.buildStarted) return; // 建設中(build)：setMotionのonEndで完了処理をするので、ここでは何もしない
  const dx = unit.buildTargetX - unit.x;
  if (Math.abs(dx) > 4){
    if (unit.motion !== "walk") setMotion(unit, "walk", { loop:true });
    const speed = unit.def.walkSpeed || 30;
    const step = Math.sign(dx) * Math.min(Math.abs(dx), speed * (dtMs / 1000));
    unit.x += moveWithCollision(unit, step); // 敵がそのマス目を塞いでいれば、そこで足止めされる
    applyFrame(unit);
    return;
  }
  unit.x = unit.buildTargetX; applyFrame(unit);
  unit.buildStarted = true;
  const buildMotion = unit.def.buildMotionName || "build";
  setMotion(unit, buildMotion, { onEnd: () => finishPlacement(unit) });
}
function finishPlacement(unit){
  if (!unit.dead){
    const col = unit.buildTargetCol, lane = unit.buildTargetLane;
    if (!findStructureAt(col, lane)){
      const kind = unit.def.structureBuildKind || (findPlatformInColumn(col) ? "watchtowerWall" : "watchtowerPlatform");
      const s = spawnUnit(kind, "player", 0, { lane });
      s.x = columnCenterX(col) - (s.def.structureDisplayWidth || 0) / 2; s.structureCol = col;
      setMotion(s, "normal", { loop:true });
      applyFrame(s);
      freeUnitsTrappedBy(s, unit); // その場に誰かいたら、埋まって動けなくならないよう、その者を外へ押し出す(築いた本人は除く)
    }
  }
  if (unit.def.returnsAfterDeploy && !unit.dead){
    startReturnHome(unit); // 築き終えたら消えず、身一つで自城へ戻り、また使えるようになる
    return;
  }
  removeUnit(unit);
}
// 築き終えた・役目を終えた設置系のキャラが、消えずに自城へ戻る。戻り着くとクールタイムに入り、
// 明ければ(素手→元の姿に戻って)待機し、次にプレイヤーが同じ召喚ボタンを押した時に、新規召喚の代わりに送り出される
function startReturnHome(unit){
  if (unit.def.bareDef) unit.def = CHAR_DEFS[unit.def.bareDef]; // 見た目があるものは、素手の姿に切り替える(拒馬兵など)
  unit.buildTargetCol = null; unit.buildTargetLane = null; unit.buildTargetX = null;
  unit.returningHome = true;
  unit.target = null;
  unit.facing = unit.side === "player" ? 1 : -1; // 振り向く
  const fallback = unit.def.frameCounts.walk ? "walk" : "idle";
  setMotion(unit, fallback, { loop:true });
}
function updateReturnHomeAI(unit, dtMs){
  const def = unit.def;
  if (unit.siteRoster && battle.stage.siteBattle){                          // 拠点の戦闘：自軍の端まで歩いたら、画面から消えて、召喚欄に戻る
    const edge = STAGE_W - CASTLE_APPROACH_GAP - bodyWidth(unit) - 30;    // 味方の城による進める限界より、必ず手前になる位置
    if (unit.x >= edge){ siteBuilderExit(unit); return; }
    unit.x += moveWithCollision(unit, getEffectiveSpeed(unit, def.walkSpeed || 30) * (dtMs / 1000)); applyFrame(unit); return;
  }
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : STAGE_W;
  // 出現位置(自城前)と同じ境界を目指す。ここより奥へは、他の移動処理と同じく誰も進めない
  const homeX = unit.side === "player" ? fieldWidth - 90 : 90;
  const dx = homeX - unit.x;
  if (Math.abs(dx) <= 20){ // 城の当たり判定の際、最後の数pxは自然と足踏みが続く(縮む一方の余地を詰め続ける)ので、閾値はゆったり取る
    unit.returningHome = false;
    unit.awaitingResupply = true;
    unit.resupplyCooldown = unit.resupplyCooldownMs || 0;
    setMotion(unit, "idle", { loop:true });
    return;
  }
  unit.x += moveWithCollision(unit, Math.sign(dx) * getEffectiveSpeed(unit, def.walkSpeed) * (dtMs / 1000));
  applyFrame(unit);
}
// 補充が済み、次の指示を待って自城前で待機している、この種類の既存ユニット(いなければnull)
function findResuppliedUnit(kind){
  return battle && battle.units.find(u => !u.dead && u.originalKind === kind && u.resupplied);
}
// 望楼台・壁が建った、まさにその場所に誰か(多くは敵)が既に立っていた場合、めり込んで身動きが取れなくなるので、
// 自らの後ろ側(来た方向)へ一マスぶん押し出して、外に出す
function freeUnitsTrappedBy(s, builder){
  const ws = bodyWidth(s);
  battle.units.forEach(u => {
    if (u === s || u === builder || u.dead || u.mounted || u.launched || u.laneMoving || u.perch || u.def.structureUnit) return;
    if (!lanesOverlap(u.laneLo, u.laneHi, s.laneLo, s.laneHi)) return;
    const wu = bodyWidth(u);
    const overlap = Math.min(u.x + wu, s.x + ws) - Math.max(u.x, s.x);
    if (overlap <= 0) return; // 重なっていなければ、そのまま
    const back = u.side === "player" ? 1 : -1; // 自陣側(来た方向)へ戻す
    const field = document.getElementById("battlefield");
    const fw = field ? field.clientWidth : STAGE_W;
    u.x = Math.max(30, Math.min(fw - 30 - wu, u.x + back * (overlap + GRID_CELL)));
    applyFrame(u);
  });
}
// ---- 望楼台に登る・壁の足場へ移る・台が壊れて吹き飛ぶ ----
// 遠距離系(1区画・1戦列の大きさ)の味方は、望楼台にぶつかると梯子を登る。台の上には1人だけ。
// 次の者が登ると、台にいた者から順に、同じ列(マス目)で隣り合って続く壁の足場へ、1つずつ外へ移る(壁4枚なら、台と合わせて5人)。
// 台の上・壁の上にいる間は、射程が1.2倍になり、戦列に関係なく全ての戦列の敵を狙える。近接の敵からは狙われない(遠距離の攻撃は届く)
const TOWER_RANGE_MULT = 1.2;   // 台の上での射程の倍率
const TOWER_CLIMB_MS = 1000;    // 梯子を登りきるまでの時間(1倍速)
const TOWER_DETOUR_MS = 3000;   // 台を避けて隣の戦列へ移ったあと、軍令の戦列へ戻ろうとしない時間
function isBigAlly(def){ return (def.laneSpan || 1) >= 3 || (def.heightM || 0) >= 5; } // 壁の下(扉)を通れない大きさ(3戦列以上、または高さ5m以上)
function canClimbTower(unit){
  return unit.side === "player" && unit.def.ranged && (unit.def.laneSpan || 1) === 1 &&
    !unit.perch && !unit.mounted && !unit.def.structureUnit && !unit.bearerOf;
}
// 味方の建造物が、この味方の行く手を塞ぐか：望楼台は誰も通れない。壁は、大きい味方だけが通れない
function structureBlocksAlly(unit, s){
  if (unit.def.structureUnit || unit.buildTargetX != null || unit.returningHome || unit.standX != null) return false;      // 築きに向かう・戻る・持ち場へ歩く兵は、建物をすり抜ける // 望楼兵(築きに向かう途中)は、建造物をすり抜ける
  if (s.def.structureKind === "platform") return true;
  return isBigAlly(unit.def);
}
function perchedAt(col, lane){
  return battle.units.find(u => !u.dead && u.perch && u.perch.col === col && u.perch.lane === lane);
}
// 望楼台から上(dir=1)・下(dir=-1)へ、途切れずに続く壁の戦列の一覧(近い順)
function towerChain(platform, dir){
  const out = [];
  for (let l = platform.lane + dir; l >= 0 && l < GRID_LANES; l += dir){
    const w = findStructureAt(platform.structureCol, l);
    if (!w || w.def.structureKind !== "wall") break;
    out.push(l);
  }
  return out;
}
// 新しく1人が登れるか。登れるなら、どちら側の足場へ、何人ずらすかを返す(満員ならnull)
function towerShiftPlan(platform){
  const col = platform.structureCol;
  if (!perchedAt(col, platform.lane)) return { dir: 0 }; // 台が空いていれば、そのまま登る
  const opts = [];
  [1, -1].forEach(dir => {
    const chain = towerChain(platform, dir);
    const k = chain.findIndex(l => !perchedAt(col, l));
    if (k !== -1) opts.push({ dir, chain, k });
  });
  if (!opts.length) return null;
  const least = Math.min.apply(null, opts.map(o => o.k)); // ずらす人数が少ない側を選ぶ(同じなら、ランダム)
  const cand = opts.filter(o => o.k === least);
  return cand[Math.floor(Math.random() * cand.length)];
}
// 足場の居場所を、外側から順に1つずつずらす(実際の移動はupdatePerchAIが、1人ずつ歩かせる)
function shiftTowerChain(platform, plan){
  const col = platform.structureCol;
  for (let i = plan.k; i >= 1; i--){
    const u = perchedAt(col, plan.chain[i - 1]);
    if (u) u.perch.lane = plan.chain[i];
  }
  const top = perchedAt(col, platform.lane);
  if (top) top.perch.lane = plan.chain[0];
}
function perchHalfW(unit){ return ((unit._bodyW || 44) / 0.55) / 2; }
function towerLadderX(unit, platform){
  const W = platform._displayWidth || platform.def.structureDisplayWidth || 95;
  const frac = platform.facing === 1 ? (platform.def.ladderFrac || 0.86) : 1 - (platform.def.ladderFrac || 0.86);
  return platform.x + frac * W - perchHalfW(unit);
}
function startClimb(unit, platform, plan){
  if (plan.dir) shiftTowerChain(platform, plan);
  unit.perch = { col: platform.structureCol, lane: platform.lane, phase: "toLadder" }; // この時点で台の上の場所を押さえる
  unit.target = null;
  if (unit.motion !== "walk" && unit.def.frameCounts.walk) setMotion(unit, "walk", { loop:true });
}
function clearPerch(unit){
  unit.perch = null;
  unit.elevated = false;
  if (unit.laneTween){ const to = unit.laneTween.toLane; unit.laneTween = null; unit.laneMoving = false; setUnitLane(unit, to); }
  else setUnitLane(unit, unit.lane); // 描く順番(手前・奥)を、普段どおりに戻す
}
// 望楼台・壁が崩れた：上にいた兵は、吹き飛びモーションで後ろへ飛ばされ、ダウン→起き上がりのあと、普段どおりに戻る
function throwFromTower(unit){
  if (unit.dead || !unit.perch) return;
  const onGround = unit.perch.phase === "toLadder";
  const h = unit.rideY || 0;
  clearPerch(unit);
  unit.rideY = 0;
  unit.target = null;
  if (onGround || !unit.def.frameCounts.blowback){
    // まだ梯子の前にいた(または吹き飛びの絵がない)：その場に下ろして、普段どおりに戻す
    applyFrame(unit);
    afterReaction(unit);
    return;
  }
  const back = unit.side === "player" ? 1 : -1; // 後ろ(自城の側)
  launchUnit(unit, null, { upSpeed: 300, knockback: true });
  unit.launchY = h; // 台の高さから落ちる
  const g = LAUNCH_GRAVITY, v = unit.launchVY;
  const airtime = (v + Math.sqrt(v * v + 2 * g * h)) / g;
  const field = document.getElementById("battlefield");
  const room = back > 0 ? (field.clientWidth - 60 - (unit._displayWidth || 60)) - unit.x : unit.x - 30;
  unit.launchVX = back * Math.max(0, Math.min(2 * GRID_CELL, room)) / airtime; // 後ろへ2区画ぶん(画面の端は越えない)
  applyFrame(unit);
}
// 台の上で倒れた：その場から地面へ落ちる
function dropDeadFromTower(unit){
  clearPerch(unit);
  addFxTask(dt => {
    unit.rideY = Math.max(0, (unit.rideY || 0) - 900 * (dt / 1000));
    if (unit.el.isConnected) applyFrame(unit);
    return unit.rideY > 0;
  });
}
// 望楼台にぶつかった味方：遠距離系で空きがあれば登る。登れなければ、上か下の戦列へランダムに移って避ける
function handleTowerBlock(unit, s){
  if (unit.side !== "player" || unit.perch || unit.laneTween || unit.launched || unit.restrained || unit.mounted) return;
  const approach = unit.def.approachMotion || "run";
  if (unit.motion !== "walk" && unit.motion !== approach && unit.motion !== "idle") return; // 攻撃中などは、そのまま
  if (s.def.structureKind !== "platform") return; // 壁の前で止まった大きい味方は、その場で待つ
  if (canClimbTower(unit)){
    const plan = towerShiftPlan(s);
    if (plan){ startClimb(unit, s, plan); return; }
  }
  if ((unit.def.laneSpan || 1) !== 1) return; // 2戦列以上の大きさは、横へ避けられないので、その場で止まる
  const opts = [unit.lane - 1, unit.lane + 1].filter(l => laneAllowed(l));
  if (!opts.length) return; // 1戦列だけの戦線では、避けられずに台の前で止まる
  const to = opts[Math.floor(Math.random() * opts.length)];
  unit.target = null;
  unit.towerDetourMs = TOWER_DETOUR_MS;
  startLaneStep(unit, to, 450);
}
// 台の上・壁の上にいる兵の行動
function findTowerTarget(unit){
  const range = (unit.def.attackRange || 0) * TOWER_RANGE_MULT;
  const minR = unit.def.minAttackRange || 0;
  let best = null, bd = Infinity;
  battle.units.forEach(o => {
    if (o.dead || o.side === unit.side || o.mounted || o.def.invulnerable) return;
    if (o === unit.dodgedPastUnit) return;
    const d = edgeDistance(unit, o); // 戦列は問わない(両隣までしか届かない兵でも、台の上からは端から端まで届く)
    if (d > range || d < minR) return;
    if (d < bd){ bd = d; best = o; }
  });
  return best;
}
function updatePerchAI(unit, dtMs){
  const p = unit.perch, def = unit.def;
  const platform = findPlatformInColumn(p.col);
  const stand = findStructureAt(p.col, p.lane);
  if (!platform || !stand){ throwFromTower(unit); return; } // 足場がなくなった
  const deck = stand.def.deckHeight || 210;

  if (p.phase === "toLadder"){
    const lx = towerLadderX(unit, platform);
    const dx = lx - unit.x;
    if (Math.abs(dx) > 3){
      unit.facing = dx > 0 ? 1 : -1;
      unit.x += Math.sign(dx) * Math.min(Math.abs(dx), (def.walkSpeed || 40) * (dtMs / 1000));
      if (unit.motion !== "walk" && def.frameCounts.walk) setMotion(unit, "walk", { loop:true });
      applyFrame(unit);
      return;
    }
    unit.x = lx;
    p.phase = "climb";
    unit.elevated = true; // 梯子に取りついたら、近接の敵からは届かない
    unit.el.style.zIndex = String(laneZ(unit) + 2); // 梯子は、台の手前に描く
    return;
  }
  if (p.phase === "climb"){
    unit.x = towerLadderX(unit, platform);
    unit.rideY = Math.min(deck, (unit.rideY || 0) + deck * (dtMs / TOWER_CLIMB_MS));
    if (unit.motion !== "walk" && def.frameCounts.walk) setMotion(unit, "walk", { loop:true });
    applyFrame(unit);
    if (unit.rideY >= deck){
      p.phase = "deck";
      unit.facing = unit.side === "player" ? -1 : 1;
      setMotion(unit, "idle", { loop:true });
    }
    return;
  }

  // 台の上・壁の上：胸壁の奥に立つ(足元は胸壁に隠れる)
  unit.rideY = deck;
  unit.x = columnCenterX(p.col) - perchHalfW(unit);
  unit.el.style.zIndex = String(laneZ(unit) - 1);
  const attackMotion = def.attackMotionName || "attack";
  if (unit.motion !== "idle" && unit.motion !== "walk" && unit.motion !== (def.approachMotion || "run") && unit.motion !== "discover"){
    applyFrame(unit);
    return; // 撃っている最中・怯み中は、終わるまで待つ
  }
  // 足場の移動(台から壁へ、壁から外の壁へ)：1人ずつ、隣の足場へ歩いて移る
  if (unit.laneTween) return;
  if (unit.lane !== p.lane){
    const step = p.lane > unit.lane ? unit.lane + 1 : unit.lane - 1;
    unit.facing = unit.side === "player" ? -1 : 1;
    if (unit.motion !== "walk" && def.frameCounts.walk) setMotion(unit, "walk", { loop:true });
    startLaneStep(unit, step, 550);
    return;
  }
  if (unit.motion !== "idle") setMotion(unit, "idle", { loop:true });
  if (!def.ranged) return;

  const enemy = findTowerTarget(unit);
  let shoot = false;
  unit.target = null;
  if (enemy){
    unit.target = enemy;
    unit.facing = Math.sign(unitCenterX(enemy) - unitCenterX(unit)) || (unit.side === "player" ? -1 : 1); // 後ろへ抜けた敵にも、向き直って撃つ
    shoot = true;
  } else {
    const field = document.getElementById("battlefield");
    const castleX = unit.side === "player" ? 60 : field.clientWidth - 60;
    if (Math.abs(unitCenterX(unit) - castleX) <= (def.attackRange || 0) * TOWER_RANGE_MULT){
      unit.facing = unit.side === "player" ? -1 : 1;
      shoot = true; // 敵城が射程に入った
    }
  }
  if (!shoot){ unit.facing = unit.side === "player" ? -1 : 1; applyFrame(unit); return; }
  unit.attackHadTarget = !!unit.target;
  setMotion(unit, attackMotion, {
    onEnd: () => {
      if (unit.dead) return;
      if (unit.perch) setMotion(unit, "idle", { loop:true });
      else afterReaction(unit);
    }
  });
}

// HPの割合に応じて、望楼台・壁の見た目を切り替える(城の損傷表現と同じ考え方)
function updateStructureStage(u){
  const stages = u.def.structureStageMotions; if (!stages) return;
  const ratio = Math.max(0, u.hp) / u.hpMax;
  const idx = Math.min(stages.length - 1, Math.floor((1 - ratio) * stages.length));
  const wanted = stages[idx];
  if (u.motion !== wanted){
    setMotion(u, wanted, { loop:true });
    spawnStructureFx(u, "impact");
  }
}
// 衝撃煙(命中直後)・落下の砂埃(崩れた後)を、望楼台・壁の位置に重ねて出す
function spawnStructureFx(u, type){
  const base = u.def.imageBase || IMG_WATCHTOWER;
  const src = base + (type === "impact" ? "impact_smoke.png" : "fall_dust.png");
  const h = type === "impact" ? 160 : 120;
  spawnFx(src, u.x + (u.def.hitboxWidth || 0) / 2 - h / 2, { height: h, bottom: (u.baseB || 74) - (type === "impact" ? 20 : 30), lifespan: type === "impact" ? 500 : 1400 });
}
// 望楼台・壁が崩れるときの、専用の処理(通常の「down」ではなく「collapsed」を使い、望楼台は同じ列の壁も道連れにする)
function collapseStructure(target){
  battle.units.filter(u => !u.dead && u.perch && u.perch.col === target.structureCol && u.perch.lane === target.lane)
    .forEach(u => throwFromTower(u)); // 上にいた兵(梯子を登っている途中の兵も)は、後ろへ吹き飛ばされる
  setMotion(target, "collapsed", { loop:true });
  spawnStructureFx(target, "impact");
  let wait = 0;
  addFxTask(dt => {
    wait += dt;
    if (wait < 150) return true;
    spawnStructureFx(target, "fall");
    return false;
  });
  if (target.def.structureKind === "platform"){
    battle.units.filter(u => !u.dead && u.def.structureKind === "wall" && u.structureCol === target.structureCol)
      .forEach(w => killUnit(w)); // 望楼台が壊れると、同じ列の壁もまとめて壊れる
  }
  let wait2 = 0;
  addFxTask(dt => {
    wait2 += dt;
    if (wait2 < 2400) return true;
    removeUnit(target);
    return false;
  });
}

function updateHealer(unit, dtMs){
  const def = unit.def;
  if (!def.canHeal || unit.dead || unit.restrained || unit.isReviving) return;
  if (unit.healCooldown > 0){
    unit.healCooldown = Math.max(0, unit.healCooldown - dtMs);
    return;
  }
  if (unit.motion !== "walk" && unit.motion !== "idle") return; // 蘇生中・怯み中などは判定しない

  const nearbyAllies = battle.units.filter(other =>
    other !== unit && !other.dead && other.side === unit.side &&
    other.hp < other.hpMax && canReachLane(unit, other) &&
    edgeDistance(unit, other) <= (def.healRadius || 0)
  );
  if (!nearbyAllies.length) return; // 回復が必要な味方がいなければ詠唱しない

  setMotion(unit, "heal_cast", {
    onEnd: () => { if (!unit.dead && !unit.isReviving) setMotion(unit, "walk", { loop:true }); }
  });
  unit.healCooldown = def.healTickIntervalMs || 1500;

  nearbyAllies.forEach(ally => {
    ally.hp = Math.min(ally.hpMax, ally.hp + (def.healAmountPerTick || 0)); // 回復量は固定
    applyFrame(ally);

    const fx = def.fxHealAura;
    if (fx){
      for (let i = 0; i < fx.count; i++){
        btimeout(() => {
          if (ally.dead) return;
          // 味方の体の中心に、体の大きさに合わせたサイズで重ねる(黒背景は透過に変換済み)
          const H = ally._displayHeight || 92;
          const cx = ally.x + (ally._displayWidth || 0) / 2;
          const el = spawnFx(keyedFxSrc(fx.imageBase + fx.prefix + (i+1) + ".png", FX_KEY_HEAL), cx, {
            height: Math.round(H * 0.6), bottom: Math.round((ally.baseB || 74) + (ally.rideY || 0) + H * 0.25), lifespan: fx.durations[i]
          });
          if (el){
            el.style.mixBlendMode = "normal";
            el.style.transform = "translateX(" + cx + "px) translateX(-50%)";
          }
        }, i * (fx.durations[i] || 200));
      }
    }
  });
}

/* ---------- ゴブリン長：旗バフ・特殊モーション ---------- */

// このユニットに旗バフを与えているゴブリン長を返す(いなければnull)。
// 対象は味方のゴブリン族全員(ゴブリン長本人を含む)、範囲は無制限。複数いても効果は重複しない。
function getFlagSource(unit){
  if (!battle || unit.dead || unit.def.race !== "goblin") return null;
  let best = null;
  battle.units.forEach(o => {
    if (o.dead || o.side !== unit.side || !o.def.flagCastleAtkMult) return;
    if (!best || o.def.flagCastleAtkMult > best.def.flagCastleAtkMult) best = o;
  });
  return best;
}
// 敵城に与えるダメージの倍率(旗バフ)
function getCastleDamageMult(unit){
  const src = getFlagSource(unit);
  return (src ? src.def.flagCastleAtkMult : 1) * castleTakenScale(unit.side) * (unit.aura ? unit.aura.vsCastle : 1);        // 城への攻撃力(礫車のリーダー効果)
}
// 戦線ごとの調整：城が受けるダメージの倍率。stage.castleDmgTaken = { player:自城が受ける, enemy:敵城が受ける }。省略は1倍。
// 最初の戦線(魔野)は、まだ不慣れでも押し切られないよう、自城が受けるダメージを減らしている
function castleTakenScale(attackerSide){
  const t = battle && battle.stage && battle.stage.castleDmgTaken;
  if (!t) return 1;
  const v = attackerSide === "player" ? t.enemy : t.player; // 攻撃した側の反対が、城を殴られる側
  return v != null ? v : 1;
}

// 特殊モーション：鼓舞を受けた瞬間に発動。ステージ上の味方ゴブリン族全員(自身も)に
// 近接攻撃中のスーパーアーマーを付与する(再度鼓舞されると10秒に延長し直す)
function startChiefSpecial(unit){
  if (unit.dead || unit.charging || !battle) return;
  const ms = unit.def.specialArmorMs || 10000;
  battle.units.forEach(o => {
    if (!o.dead && o.side === unit.side && o.def.race === "goblin") o.attackArmorMs = ms;
  });
  setMotion(unit, "special", {
    onEnd: () => { if (!unit.dead) setMotion(unit, "walk", { loop:true }); }
  });
}

// 出血エフェクト：対象の上で1回再生して消える
function playBleedFx(target, attackerDef){
  const fx = attackerDef.fxBleed;
  if (!fx || !target.el) return;
  const img = document.createElement("img");
  img.className = "fx-sprite bleed-fx";
  img.style.height = Math.round((target._displayHeight || 92) * 0.6) + "px"; // キャラの大きさに合わせる
  target.el.appendChild(img);
  let i = 0;
  const step = () => {
    if (i >= fx.count || !img.isConnected){ img.remove(); return; }
    img.src = keyedFxSrc(fx.imageBase + fx.prefix + (i + 1) + ".png");
    const d = fx.durations[i] || 175;
    i++;
    btimeout(step, d);
  };
  step();
}

// 旗バフを受けている間だけ、頭上に小さな旗のアイコンを出す
function updateFlagBuff(unit){
  const src = getFlagSource(unit);
  if (src && !unit.flagFxEl){
    const img = document.createElement("img");
    img.className = "fx-sprite flag-buff-icon";
    img.src = src.def.imageBase + (src.def.fxFlagBuff || "flag_buff_fx_1.png");
    unit.el.appendChild(img);
    unit.flagFxEl = img;
  }
  if (unit.flagFxEl) unit.flagFxEl.style.height = (26 * (unit.scaleMult || 1)) + "px";
  if (!src && unit.flagFxEl){
    unit.flagFxEl.remove();
    unit.flagFxEl = null;
  }
}

/* ---------- ゴブリン長：中距離技(突進×字斬り→後退→5連斬り) ---------- */

// 中距離技の相手：自分と上下1つずつのレーンの敵のうち、間合いに入っている最も近い相手(同じレーンを優先)
function findMidrangeTarget(unit, mid){
  const lo = Math.max(0, unit.lane - 1), hi = Math.min(GRID_LANES - 1, unit.lane + 1);
  let best = null, bestScore = Infinity;
  battle.units.forEach(o => {
    if (o.dead || o.side === unit.side || o.mounted || o.elevated || o.def.invulnerable) return;
    if (!lanesOverlap(lo, hi, o.laneLo, o.laneHi)) return;
    if (o === unit.dodgedPastUnit || !isEngageable(unit, o)) return;
    const d = edgeDistance(unit, o);
    if (d <= unit.def.attackRange || d < mid.minRange || d > mid.maxRange) return;
    const score = d + (lanesOverlap(unit.lane, unit.lane, o.laneLo, o.laneHi) ? 0 : 40);
    if (score < bestScore){ best = o; bestScore = score; }
  });
  return best;
}

function startMidrange(unit){
  const mid = unit.def.midrange;
  unit.midCooldown = skillCd(unit, mid.cooldownMs || 6000);
  unit.attackHadTarget = !!unit.target;
  if (unit.target && !lanesOverlap(unit.lane, unit.lane, unit.target.laneLo, unit.target.laneHi)){
    // 突進(最初の4コマ)のあいだに、相手のレーンへ移る
    const durs = unit.def.frameDurations[mid.motion || "midrange"];
    startLaneStep(unit, laneTowards(unit, unit.target), (durs[0] + durs[1] + durs[2] + durs[3]) * 0.9);
  }
  setMotion(unit, mid.motion || "midrange", { onEnd: onAttackEnd });
}

// 中距離技モーション中の移動。コマごとの移動量(moveByFrame)をそのコマの表示時間で按分して毎tick動かす
function applyMidrangeMove(unit, dtMs){
  const def = unit.def;
  const mid = def.midrange;
  const motion = mid.motion || "midrange";
  const disp = (mid.moveByFrame && mid.moveByFrame[unit.frameIndex]) || 0;
  if (!disp) return;
  const durs = def.frameDurations[motion] || [];
  const dur = durs[unit.frameIndex] || 100;
  let step = disp * (dtMs / dur);
  const forwardDir = unit.side === "player" ? -1 : 1;
  if (step > 0 && unit.target && !unit.target.dead){
    // 前進は相手にめり込む手前で止める
    const gap = edgeDistance(unit, unit.target);
    const stopGap = mid.stopGap != null ? mid.stopGap : 26;
    step = Math.max(0, Math.min(step, gap - stopGap));
  }
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : 800;
  unit.x = Math.max(60, Math.min(fieldWidth - 60, unit.x + moveWithCollision(unit, forwardDir * step)));
  applyFrame(unit);
}

// 中距離技の命中処理：前方の一定距離以内にいる敵全員にダメージ(範囲攻撃)
function resolveMidrangeHit(unit, hit){
  if (!battle || battle.ended || unit.dead) return;
  const mid = unit.def.midrange;
  const enemySide = unit.side === "player" ? "enemy" : "player";
  const forwardDir = unit.side === "player" ? -1 : 1;
  const reach = hit.reach != null ? hit.reach : (mid.hitReach || 80);
  const dmg = getEffectiveAtk(unit) * (hit.mult != null ? hit.mult : 1);
  const victims = battle.units.filter(o =>
    !o.dead && !o.mounted && !o.elevated && !o.def.invulnerable && o.side === enemySide && canReachLane(unit, o) &&
    (Math.sign(o.x - unit.x) === forwardDir || o.x === unit.x) &&
    edgeDistance(unit, o) <= reach
  );
  victims.forEach(o => applyDamageToUnit(o, dmg, unit));
}

/* ---------- バフ・デバフのアイコン ---------- */
// 24x24のSVGで、シンプルな絵柄を描く。色は種類ごとに固定(攻撃=オレンジ、速度=水色、防御=青、毒=紫、出血=赤)
function svgIcon(body){
  return "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + body + '</svg>');
}

// いま掛かっているバフ・デバフの一覧(アイコンのキー)を返す
function getStatusKeys(unit){
  const keys = [];
  const def = unit.def;
  if (getBuffStacks(unit) > 0){
    if (getBuffFactor(unit, "buffAtkMult") > 1) keys.push("atkUp");
    if (getBuffFactor(unit, "buffSpeedMult") > 1 && keys.indexOf("speedUp") === -1) keys.push("speedUp");
    if (getBuffFactor(unit, "buffDamageCutMult") < 1 && keys.indexOf("defUp") === -1) keys.push("defUp");
  }
  if (def.tamerBuffEligible && hasLivingTamerAlly(unit) && keys.indexOf("atkUp") === -1) keys.push("atkUp"); // テイマーがいる間の魔獣の攻撃力+10%
  if (def.bonusVsRace && def.bonusVsRace.beast) keys.push("beastAtk");                                           // 魔獣・獣に対して攻撃力が上がる(槍兵)
  if (getFlagSource(unit)) keys.push("castleAtk");
  if (unit.attackArmorMs > 0) keys.push("armor");
  if (battle.units.some(q => !q.dead && q.side === unit.side && q.barrierMs > 0) && (def.heightM || 2) <= 4 && isShielded(unit)) keys.push("barrier");
  if (unit.transforming || unit.reviveInvulnMs > 0) keys.push("invuln");
  if (unit.poisonRemainingMs > 0) keys.push("poison");
  if (unit.gauges && unit.gauges.bleed > 0) keys.push("bleed");
  if (unit.restrained) keys.push("net");
  return keys;
}

// HPバーの横に、バフ・デバフのアイコンを並べる(内容が変わったときだけ作り直す)
function updateStatusIcons(unit){
  const box = unit.statusEl;
  if (!box) return;
  if (unit.dead || unit.mounted){
    if (box.firstChild) box.innerHTML = "";
    unit.statusSig = "";
    return;
  }
  const keys = getStatusKeys(unit);
  const facing = unit.facing === -1 ? -1 : 1;
  const hpw = unit.def.hpBarWidth || 44;
  const sig = keys.join(",") + "|" + facing + "|" + hpw;
  if (sig === unit.statusSig) return;
  unit.statusSig = sig;
  box.innerHTML = "";
  box.style.left = "calc(50% + " + (hpw / 2 + 4) + "px)";
  keys.forEach(k => {
    const img = document.createElement("img");
    img.src = STATUS_ICON_URLS[k];
    img.title = STATUS_ICON_DEFS[k].title;
    if (facing === -1) img.style.transform = "scaleX(-1)"; // 自軍側は親要素が左右反転しているので、アイコンだけ元に戻す
    box.appendChild(img);
  });
}

const roleBannerQueue = [];

function pumpRoleBanners(){
  if (roleBannerBusy || !roleBannerQueue.length) return;

  if (!layer){ roleBannerQueue.length = 0; return; }
  roleBannerBusy = true;

  el.className = "role-banner " + (b.big ? "big" : "small") + (b.enemy ? " enemy" : "");
  el.textContent = b.text;
  layer.appendChild(el);
  const dur = b.big ? 2400 : 1500;
  btimeout(() => { el.remove(); roleBannerBusy = false; pumpRoleBanners(); }, dur);
}
function queueBanner(text, big, enemy){
  roleBannerQueue.push({ text, big: !!big, enemy: !!enemy });

/* ---------- ゴブリン・キング ---------- */

// 担ぎ手のうち、まだ担いでいる(生きている)数
function kingBearersAlive(k){
  return (k.bearers || []).filter(b => !b.dead && b.bearerOf === k).length;
}

// 担ぎ手の位置・向きを、キングの担ぎ棒の端に合わせる
function updateBearerSync(b){
  const k = b.bearerOf;
  if (!k || b.dead) return;
  const W = k._displayWidth || 100;
  const bw = b._displayWidth || 30;
  const fe = k.facing === 1 ? b.slot.frac : 1 - b.slot.frac;
  b.x = k.x + fe * W - bw / 2;
  b.facing = k.facing;
  applyFrame(b);
}

// 担ぎ手のAI：攻撃はしない。キングが歩いている間は歩き、止まっている間は立つ
function updateBearerAI(b){
  const k = b.bearerOf;
  if (!k || k.dead){ b.bearerOf = null; return; }
  if (b.motion === "walk" || b.motion === "idle"){
    const want = (k.motion === "walk" && !k.grounded) ? "walk" : "idle";
    if (b.motion !== want) setMotion(b, want, { loop: true });
  }
}

// 担ぎ手が倒れた。全員倒れたら玉座が落下する
function onBearerDied(b){
  const k = b.bearerOf;
  b.bearerOf = null;
  if (!k || k.dead) return;
  if (kingBearersAlive(k) === 0) startKingDrop(k);
}

// キングが倒れた：残っている担ぎ手は、普通のユニットに戻る
function releaseBearers(k){
  (k.bearers || []).forEach(b => { if (!b.dead && b.bearerOf === k){ b.bearerOf = null; b.target = null; } });
}

function startKingDrop(k){
  if (k.dead || k.dropping || k.grounded) return;
  k.dropping = true;
  k.elevated = false; // 落ちたら、地上の攻撃も届く
  k.casting = null;
  k.castId = (k.castId || 0) + 1; // 大笑い中だったらゲートの召喚は中止
  setMotion(k, "drop", {
    onEnd: () => {
      k.dropping = false;
      k.grounded = true;
      k.rideY = 0;
      if (!k.dead) setMotion(k, "idle", { loop: true });
    }
  });
}

// 玉座の高さ：落下中(と倒れたあと)は、担ぎ手の肩の高さから地面まで下がる
function updateKingBody(k, dtMs){
  if (!k.def.kingLogic) return;
  if ((k.dropping || k.dead) && k.rideY > 0){
    k.rideY = Math.max(0, k.rideY - (k.def.carryHeight / 0.3) * (dtMs / 1000));
    applyFrame(k);
  }
}

function updateKingAI(k, dtMs){
  const def = k.def;
  if (k.grounded && k.motion === "walk"){ setMotion(k, "idle", { loop:true }); return; }
  if (!k.grounded && k.motion === "idle"){ setMotion(k, "walk", { loop:true }); return; }
  if (k.motion !== "walk" && k.motion !== "idle") return;

  // ゲート召喚：クールタイムが明けていて、敵が近くにいれば、大笑いして玉座を叩く
  const seen = findNearestEnemyInRange(k);
  if (def.gate && k.gateCooldown <= 0 && seen){ startLaugh(k); return; }

  // 敵を初めて見つけたときの反応
  if (!k.discovered && !k.grounded && seen){
    k.discovered = true;
    setMotion(k, "discover", { onEnd: () => setMotion(k, k.grounded ? "idle" : "walk", { loop:true }) });
    return;
  }
  if (k.grounded) return; // 玉座が落ちたら動けない

  // ゆっくり自城を目指す(担ぎ手が減ると遅くなる)
  const field = document.getElementById("battlefield");
  const fieldWidth = field.clientWidth;
  const destX = k.side === "player" ? 60 : fieldWidth - 60 - def.hitboxWidth;
  const dx = destX - k.x;
  const alive = kingBearersAlive(k);
  if (Math.abs(dx) > 2 && alive > 0){
    const speed = getEffectiveSpeed(k, def.walkSpeed) * (alive >= 2 ? 1 : 0.6);
    k.x += moveWithCollision(k, (dx > 0 ? 1 : -1) * speed * (dtMs / 1000));
    applyFrame(k);
  }
}

function startLaugh(k){
  k.gateCooldown = skillCd(k, k.def.gate.cooldownMs);
  k.casting = "laugh";
  k.castId = (k.castId || 0) + 1;
  setMotion(k, "laugh", { onEnd: () => { k.casting = null; if (!k.dead) setMotion(k, k.grounded ? "idle" : "walk", { loop:true }); } });
}

function onKingFrame(k){
  const def = k.def;
  if (k.motion === "laugh" && k.casting === "laugh" && k.frameIndex === def.gate.spawnFrame) spawnGate(k);
  if (k.motion === "ring" && k.frameIndex === def.ringShatterFrame) onKingRingShatter(k);
}

// キングの背後の地面から、ゲートが出てくる
function spawnGate(k){
  const dir = k.side === "player" ? -1 : 1;
  // 通常ゲートは2レーン分。キングのレーンと、その上か下のレーンの2つに、左右(上下)ランダムに出る(壁ならもう一方)
  const gateOpts = [k.lane, k.lane - 1].filter(b => b >= 0 && b <= GRID_LANES - 2);
  const g = spawnUnit(k.def.gate.kind, k.side, 0, { lane: gateOpts[Math.floor(Math.random() * gateOpts.length)] });
  g.owner = k;
  g.lifeMs = g.def.lifeMs || 0;
  g.summonTimer = g.def.firstSummonMs || 1500;
  setMotion(g, "appear", { onEnd: () => setMotion(g, "idle", { loop:true }) });
  const field = document.getElementById("battlefield");
  const gw = 687 * g.def.pixelScale;
  const center = k.x + (k._displayWidth || 100) / 2 - dir * k.def.gate.behind;
  // 城(端から約85px)に重ならない位置までにとどめる
  const castleMargin = 85;
  g.x = Math.max(castleMargin, Math.min(field.clientWidth - castleMargin - gw, center - gw / 2));
  applyFrame(g);
}

// ゲートのAI：動かない。時間切れなら出現の逆再生で消え、出ている間は一定間隔でゴブリンを召喚する
function updateGateAI(g, dtMs){
  const def = g.def;
  if (g.motion === "vanish" || g.dead) return;
  g.age = (g.age || 0) + dtMs; // ゲートが出現してからの経過時間(ms)
  if (def.lifeMs){
    g.lifeMs -= dtMs;
    if (g.lifeMs <= 0){
      g.dead = true; // 敵に狙われないよう、消え始めた時点で撃破扱いにする
      setMotion(g, "vanish", { onEnd: () => removeUnit(g) });
      return;
    }
  }
  if (g.motion !== "idle") return; // 出現の最中は召喚しない(終わったら、予定の時刻を過ぎた分をまとめて召喚する)
  const sched = def.summonSchedule;
  if (sched && sched.length){
    let t = g.age;
    if (def.cycleSec){
      // サイクルを繰り返す(巨大ゲート)：1周したら、予定を最初から数え直す
      const cycleMs = def.cycleSec * 1000;
      t = g.age - (g.cycleCount || 0) * cycleMs;
      while (t >= cycleMs){ g.cycleCount = (g.cycleCount || 0) + 1; g.nextEvent = 0; t -= cycleMs; }
    }
    let i = g.nextEvent || 0;
    while (i < sched.length && sched[i].at * 1000 <= t){
      summonFromGate(g, sched[i].kind);
      i++;
    }
    g.nextEvent = i;
  }
}

// ゲートからキャラを召喚する(ゲートの前に、光の柱とともに現れる)。ゲートの全レーンに同時に出る
function summonFromGate(g, kindArg){
  let kind = kindArg;
  if (!kind){
    // 予定を使わないとき(検証用など)：summonPlanの順、なければsummonListからランダム
    const plan = g.def.summonPlan;
    if (plan && plan.length){
      kind = plan[(g.planIndex || 0) % plan.length];
      g.planIndex = (g.planIndex || 0) + 1;
    } else {
      const list = g.def.summonList || ["goblin"];
      kind = list[Math.floor(Math.random() * list.length)];
    }
  }
  const cdef = CHAR_DEFS[kind];
  const span = cdef.laneSpan || 1;
  const nLanes = g.laneHi - g.laneLo + 1;
  // 出るレーン：1レーンのキャラは、ゲートの全レーンに1体ずつ。
  // 複数レーンを占めるキャラは、収まる位置(隣り合うレーン)のどれかに1体だけ(ゲートと同じ幅なら、またいで1体)
  const ownLanes = [];
  if (span === 1){
    for (let l = g.laneLo; l <= g.laneHi; l++) ownLanes.push(l);
  } else {
    const starts = Math.max(1, nLanes - span + 1);
    const start = g.laneLo + Math.floor(Math.random() * starts);
    ownLanes.push(span >= 3 ? start + 1 : start);
  }
  const gw = g._displayWidth || 80;
  const dir = g.side === "player" ? -1 : 1;
  const baseCx = g.x + gw / 2 + dir * gw * 0.35;
  const fxDef = g.owner && g.owner.def.fx ? g.owner.def.fx : CHAR_DEFS.king.fx;
  const smfx = fxDef.summon;
  ownLanes.forEach(lane => {
    const cx = baseCx + (Math.random() * 30 - 15); // 同じ時刻・同じレーンに続けて出るときに、重なりすぎないようにずらす
    const u = spawnUnit(kind, g.side, 0, { lane });
    u.x = cx - 15;
    applyFrame(u);
    // テイマーのように、魔獣がセットになっているキャラは、通常の出撃と同じく魔獣も一緒に召喚する
    (u.def.summons || []).forEach(sm => {
      const subLanes = summonLanes(u.lane, sm.count); // 魔獣は、両隣のレーンに1匹ずつ(壁ならテイマーと同じレーン)
      for (let i = 0; i < sm.count; i++){
        const sub = spawnUnit(sm.kind, g.side, 0, { lane: subLanes[i] });
        sub.x = cx - 15 + (i - (sm.count - 1) / 2) * 26;
        applyFrame(sub);
      }
    });
    playFxSeq({
      imageBase: fxDef.imageBase, prefix: smfx.prefix, count: smfx.count, durations: constDurations(smfx.count, smfx.dur),
      height: Math.max(smfx.height, Math.round((cdef.laneStdHeight || 0) * 0.6)), pos: () => ({ x: cx, bottom: (u.baseB || 74) - 4 })
    });
  });
}

/* ---- キングの指輪コンボ ---- */

function startKingRingCombo(k){
  if (!k || k.dead) return;
  k.casting = null;
  k.castId = (k.castId || 0) + 1;
  setMotion(k, "ring", { onEnd: () => { if (!k.dead) setMotion(k, k.grounded ? "idle" : "walk", { loop:true }); } });
}

// 指輪が砕けた：割れるエフェクトを出し、エネルギーを自城の前の地面へ飛ばす
function onKingRingShatter(k){
  const fx = k.def.fx;
  const hp = ringHandPos(k);
  const br = fx.ringBreak;
  playFxSeq({
    imageBase: fx.imageBase, prefix: br.prefix, count: br.count, durations: constDurations(br.count, br.dur),
    height: br.height, pos: () => ({ x: hp.x, bottom: hp.b - br.height / 2 })
  });
  const field = document.getElementById("battlefield");
  const cg = k.def.comboGate;
  const tx = k.side === "player" ? field.clientWidth - cg.fromCastle : cg.fromCastle; // 自城の目の前
  const bigBase = laneGeom(CHAR_DEFS[k.def.comboGate.kind], 2).baseB; // 巨大ゲートは3レーン分で、中央のレーン基準
  const ty = bigBase + 2;
  const en = fx.energy;
  const h = en.height, w = h * 1024 / 339;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = h + "px";
  el.src = fx.imageBase + en.prefix + "1.png";
  field.appendChild(el);
  const dx = tx - hp.x, db = ty - hp.b;
  const flip = dx < 0;
  const phi = Math.atan2(-db, Math.abs(dx)) * 180 / Math.PI; // 進行方向の傾き(画面上で下向きが正)
  const len = Math.hypot(dx, db) || 1;
  const ux = dx / len, ub = db / len;
  let t = 0, frame = 0, ft = 0;
  const side = k.side;
  addFxTask(dt => {
    t += dt; ft += dt;
    while (ft >= en.dur){ ft -= en.dur; frame = (frame + 1) % en.count; el.src = fx.imageBase + en.prefix + (frame + 1) + ".png"; }
    const p = Math.min(1, t / cg.flightMs);
    const headX = hp.x + dx * p, headB = hp.b + db * p;
    // 画像の右3分の1にある光の玉が先頭、左へ尾が伸びる
    const cx = headX - ux * w * 0.33, cb = headB - ub * w * 0.33;
    el.style.bottom = (cb - h / 2) + "px";
    el.style.transform = "translateX(" + cx + "px) translateX(-50%) rotate(" + (flip ? -phi : phi) + "deg)" + (flip ? " scaleX(-1)" : "");
    if (p >= 1){
      el.remove();
      const im = fx.impact;
      playFxSeq({
        imageBase: fx.imageBase, prefix: im.prefix, count: im.count, durations: constDurations(im.count, im.dur),
        height: im.height, pos: () => ({ x: tx, bottom: bigBase })
      });
      let wait = 0;
      addFxTask(dt2 => { wait += dt2; if (wait < cg.gateDelayMs) return true; spawnBigGate(k, side, tx); return false; });
      return false;
    }
    return true;
  });
}

// 自城の目の前に、永遠に消えない巨大ゲートが出る
function spawnBigGate(k, side, tx){
  if (!battle) return;
  const g = spawnUnit(k.def.comboGate.kind, side, 0, { lane: 2 }); // 中央のレーン基準
  g.owner = k;
  g.summonTimer = g.def.firstSummonMs || 2400;
  setMotion(g, "appear", { onEnd: () => setMotion(g, "idle", { loop:true }) });
  const gw = 687 * g.def.pixelScale;
  g.x = tx - gw / 2;
  applyFrame(g);
}

/* ---------- レーン ---------- */
// 縦は5レーン(下から 0=最左翼 〜 4=最右翼)。各ユニットは、足元が「いちばん下の占有レーン」の床に立つ。
// laneSpan(1〜3)は縦に何レーン分の大きさか。2レーンは下のレーン、3レーンは真ん中のレーンを「自分のレーン」とする。
// レーンを指定しないで出すとき(検証用ボタンなど)のレーン：選んでいるレーンのいちばん下、なければ最下段
function defaultLane(){
  if (battle && battle.selectedLanes && battle.selectedLanes.size) return Math.min.apply(null, Array.from(battle.selectedLanes));
  return 0;
}
function laneFloor(l){ return GRID_GROUND + l * GRID_CELL; }
function laneZ(u){ return 10 + (GRID_LANES - u.laneLo) * 10; } // 手前(下)のレーンほど前に描く
// 戦線で使える戦列(stage.lanes)。省略なら全5戦列。回避・レーン移動・戦列の選択は、使える戦列の中だけ
function laneAllowed(l){
  if (l < 0 || l >= GRID_LANES) return false;
  const a = battle && battle.stage && battle.stage.lanes;
  return !a || a.indexOf(l) !== -1;
}
function clampLaneForSpan(lane, span){
  if (span >= 3) return Math.max(1, Math.min(GRID_LANES - 2, lane));
  if (span === 2) return Math.max(0, Math.min(GRID_LANES - 2, lane));
  return Math.max(0, Math.min(GRID_LANES - 1, lane));
}
// レーンの位置関係を計算する。複数レーンを占めるキャラは、占有するレーン全体の中心に、立っているときの高さの中心を合わせる
// (2レーンなら2レーンの真ん中、3レーンなら真ん中のレーンが中心。どのレーンを占有しているか分かりやすい)
function laneGeom(def, lane){
  const span = def.laneSpan || 1;
  const l = clampLaneForSpan(lane, span);
  const lo = span >= 3 ? l - 1 : l;
  const hi = lo + span - 1;
  let baseB = laneFloor(lo);
  if (span >= 2){
    const centerY = (laneFloor(lo) + laneFloor(hi) + GRID_CELL) / 2;
    baseB = centerY - (def.laneStdHeight || GRID_CELL * span) / 2;
  }
  return { lane: l, lo, hi, baseB };
}
function setUnitLane(unit, lane){
  const g = laneGeom(unit.def, lane);
  unit.lane = g.lane;
  unit.laneLo = g.lo;
  unit.laneHi = g.hi;
  unit.baseB = g.baseB;
  unit.el.style.bottom = unit.baseB + "px";
  unit.el.style.zIndex = String(laneZ(unit));
}
// 乗っている相手(フォートレス・キング)と同じレーンにそろえる
function copyLane(unit, src, zDelta){
  unit.lane = src.lane; unit.laneLo = src.laneLo; unit.laneHi = src.laneHi; unit.baseB = src.baseB;
  unit.el.style.bottom = unit.baseB + "px";
  unit.el.style.zIndex = String(laneZ(unit) + (zDelta || 0));
}
function lanesOverlap(aLo, aHi, bLo, bHi){ return aLo <= bHi && bLo <= aHi; }
// このユニットが攻撃・効果を届かせられるレーンの範囲。通常は自分のレーンだけ。laneReachがあれば占有レーンの上下にその分広がる
function getReachLanes(unit){
  const r = unit.def.laneReach || 0;
  if (r === 0) return [unit.laneLo, unit.laneHi]; // 2レーン・3レーンを占める大きい体は、占有する全てのレーンに攻撃が届く
  let lo = Math.max(0, unit.laneLo - r), hi = Math.min(GRID_LANES - 1, unit.laneHi + r);
  if (unit.def.laneStep){
    // レーンを移動して攻撃する魔獣は、出現したレーンと、その両隣のレーンまでしか行けない
    lo = Math.max(lo, unit.homeLane - 1);
    hi = Math.min(hi, unit.homeLane + 1);
  }
  return [lo, hi];
}
function canReachLane(unit, target){
  const rl = getReachLanes(unit);
  if (lanesOverlap(rl[0], rl[1], target.laneLo, target.laneHi)) return true;
  // 斥候：戦わぬ敵(穽鬼・鼓鬼・巫鬼など)にだけ、隣のレーンまで踏み込んで攻撃できる
  if (target.def.noCombat && unit.def.noCombatLaneReach){
    const ext = unit.def.noCombatLaneReach;
    const lo = Math.max(0, unit.laneLo - ext), hi = Math.min(GRID_LANES - 1, unit.laneHi + ext);
    if (lanesOverlap(lo, hi, target.laneLo, target.laneHi)) return true;
  }
  return false;
}
// 2体以上を同時に出すとき(魔獣2匹など)の、レーンの振り分け：基準レーンの両隣。壁なら基準レーンと同じ位置
function summonLanes(baseLane, count){
  const out = [];
  for (let i = 0; i < count; i++){
    const l = baseLane + (i % 2 === 0 ? -1 : 1) * (Math.floor(i / 2) + 1);
    out.push(l < 0 || l >= GRID_LANES ? baseLane : l);
  }
  return out;
}

// レーン移動のアニメ(ゴブリンの回避など)。移動中は無敵
function updateLaneTween(unit, dtMs){
  if (unit.laneReturnMs > 0){
    unit.laneReturnMs -= dtMs;
    if (unit.laneReturnMs <= 0){
      unit.laneReturnMs = 0;
      unit.laneReturnPending = true;
    }
  }
  if (unit.laneReturnPending && !unit.dead && !unit.laneTween && !unit.launched && !unit.restrained &&
      (unit.motion === "walk" || unit.motion === "idle" || unit.motion === (unit.def.approachMotion || "run"))){
    unit.laneReturnPending = false;
    laneDodgeMove(unit, unit.dodgeHomeLane, false);
  }
  const tw = unit.laneTween;
  if (!tw) return;
  tw.t += dtMs;
  const p = Math.min(1, tw.t / tw.dur);
  unit.baseB = tw.fromB + (tw.toB - tw.fromB) * p;
  unit.el.style.bottom = unit.baseB + "px";
  if (p >= 1){
    unit.laneTween = null;
    unit.laneMoving = false;
    setUnitLane(unit, tw.toLane);
    unit.needsPullBack = true; // 移動した先で敵と重なっていたら、手前に引く
    if (tw.first) unit.laneReturnMs = 2000; // 隣のレーンに着いてから2秒間は通常どおり(ダメージも受ける・戦える)。そのあと元のレーンへ戻る
  }
}

// 回避モーションで、隣のレーンへ(または元のレーンへ)移動する。モーション中は無敵
function laneDodgeMove(unit, toLane, first){
  const durs = unit.def.frameDurations.dodge || [185,185,185,185,185,185];
  const dur = durs.reduce((a, b) => a + b, 0);
  unit.laneMoving = true;
  unit.laneTween = { fromB: unit.baseB, toB: laneGeom(unit.def, toLane).baseB, toLane, t: 0, dur, first };
  unit.el.style.zIndex = String(Math.max(laneZ(unit), 10 + (GRID_LANES - toLane) * 10));
  setMotion(unit, "dodge", { onEnd: () => afterReaction(unit) });
}

// 攻撃のためにレーンを移動する(魔獣の近接、ゴブリン長の中距離技)。移動中も無敵にはならない
function startLaneStep(unit, toLane, durMs){
  if (unit.laneTween || unit.launched || unit.restrained) return;
  const g = laneGeom(unit.def, toLane);
  if (g.lane === unit.lane) return;
  unit.laneTween = { fromB: unit.baseB, toB: g.baseB, toLane: g.lane, t: 0, dur: Math.max(60, durMs), first: false };
  unit.el.style.zIndex = String(Math.max(laneZ(unit), 10 + (GRID_LANES - g.lo) * 10));
}
// 相手の占有レーンのうち、自分にいちばん近いレーン(すでに重なっていれば今のレーン)
function laneTowards(unit, target){
  return Math.max(target.laneLo, Math.min(target.laneHi, unit.lane));
}
// レーンを上下にずらす(ラッシャーの突進の最終段など)。壁があれば動かない。動けたらtrue
function shiftUnitLane(unit, delta){
  if (!unit || unit.dead || unit.def.immobile || unit.laneTween || unit.mounted || unit.bearerOf) return false;
  const span = unit.def.laneSpan || 1;
  const newLo = unit.laneLo + delta;
  if (newLo < 0 || newLo + span - 1 > GRID_LANES - 1) return false;
  for (let l = newLo; l < newLo + span; l++) if (!laneAllowed(l)) return false; // 使えない戦列へは動けない
  const g = laneGeom(unit.def, unit.lane + delta);
  unit.laneTween = { fromB: unit.baseB, toB: g.baseB, toLane: g.lane, t: 0, dur: 350, first: false };
  unit.el.style.zIndex = String(Math.max(laneZ(unit), 10 + (GRID_LANES - g.lo) * 10));
  return true;
}

// 回避：上下どちらかの隣のレーンへランダムに(壁ならもう一方へ。両方が壁なら回避できない)
function startLaneDodge(unit){
  const opts = [unit.lane + 1, unit.lane - 1].filter(l => laneAllowed(l));
  if (!opts.length) return false;
  const to = opts[Math.floor(Math.random() * opts.length)];
  unit.dodgeUsed = true;
  unit.dodgeHomeLane = unit.lane;
  laneDodgeMove(unit, to, true);
  return true;
}

/* ---------- ゴブリンの女王 ---------- */

function unitCenterX(u){ return u.x + (u._displayWidth || 0) / 2; }

// 毎フレーム進めるタスクを登録する(falseを返すと終了)。一時停止中は進まない
function addFxTask(fn){ if (battle) battle.fxList.push(fn); }

// コマ送りのエフェクトを1つ再生する。loopを指定すると、keep()がtrueの間だけ from〜to のコマを繰り返す
function playFxSeq(spec){
  const field = document.getElementById("battlefield");
  if (!field || !battle) return null;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = spec.height + "px";
  if (spec.width) el.style.width = spec.width + "px";                           // 縦横の比率を変えて、敵の大きさに合わせるとき
  if (spec.blend) el.style.mixBlendMode = spec.blend;
  const urlOf = i => spec.imageBase + spec.prefix + (i + 1) + ".png";
  let frame = 0, t = 0;
  el.src = urlOf(0);
  field.appendChild(el);
  const place = () => {
    const p = spec.pos();
    el.style.bottom = p.bottom + "px";
    el.style.transform = "translateX(" + p.x + "px) translateX(-50%)" + (p.flip ? " scaleX(-1)" : "");
  };
  place();
  addFxTask(dt => {
    if (spec.alive && !spec.alive()){ el.remove(); return false; }
    t += dt;
    place();
    let dur = spec.durations[frame] || 150;
    while (t >= dur){
      t -= dur;
      if (spec.loop && frame === spec.loop.to && spec.loop.keep()) frame = spec.loop.from;
      else frame++;
      if (frame >= spec.count){ el.remove(); if (spec.onDone) spec.onDone(); return false; }
      el.src = urlOf(frame);
      dur = spec.durations[frame] || 150;
    }
    return true;
  });
  return el;
}

/* =========================================================
   穢れ(状態異常)
   ・穢れの攻撃を受けると、穢れのゲージが溜まる(最大100)。しばらく受けないと、少しずつ減る
   ・100に達すると「凶暴化」：10秒間、攻撃×1.5・速さ×1.3・被ダメージ×0.8。敵味方が逆になり、周りの全員を攻撃する。終わるとゲージは空に戻る
   ・解除：穢れ・聖・闇の攻撃は、穢れの溜まった味方にも撃てる。ダメージはなく、穢れだけが減る
   ・灰燼教団の兵・ボスは、穢れが溜まらない(教団の兵は、凶暴化させる側)。数値は仮
   ========================================================= */
const DEFILE_MAX = 100, DEFILE_RAGE_MS = 10000, DEFILE_DECAY_PER_S = 4, DEFILE_DECAY_DELAY_MS = 3000, DEFILE_CLEANSE_MIN = 25;
const DEFILE_FX = { gauge:{ prefix:"defile_gauge_", count:4, durations:[250, 250, 250, 350] }, start:{ prefix:"defile_start_", count:9, durations:[250, 250, 250, 250, 250, 250, 250, 250, 250] } };
// 状態異常ごとに、解除できる攻撃の属性(いまは、穢れだけ、使う。ほかは、属性の攻撃が、入ってから)
const STATUS_CLEANSE = { burn:["water", "ice"], defile:["holy", "dark", "defile"], poison:["holy", "water"], bleed:["holy", "ice"], freeze:["fire"] };
function canCleanse(def, status){ const f = def.attackFlags || {}; return (STATUS_CLEANSE[status] || []).some(a => f[a]); }
function defileImmune(u){ return u.def.race === "cult" || u.def.defileImmune || u.def.invulnerable || u.def.structureUnit || u.isBoss; }
function hostile(a, b){ return a !== b && (a.side !== b.side || !!a.berserk || !!b.berserk); }      // 凶暴化した兵は、味方も敵も、攻撃する
function addDefile(u, amt){
  if (!u || u.dead || u.berserk || defileImmune(u) || !(amt > 0)) return;
  u.defile = Math.min(DEFILE_MAX, (u.defile || 0) + amt); u.defileIdleMs = 0;
  if (u.defile >= DEFILE_MAX) startRage(u);
}
function defileCleanse(u, amt){ if (!u || u.dead || u.berserk) return; u.defile = Math.max(0, (u.defile || 0) - amt); }
function startRage(u){
  if (u.berserk) return; u.berserk = true; u.rageMs = DEFILE_RAGE_MS; u.defile = DEFILE_MAX; u.target = null;
  unitSetMod(u, "rage", 1.5, .8); u.el.classList.add("berserk"); popText(u, "凶暴化");
  const H = Math.max(120, (u._displayHeight || 92) * 2.4);
  playFxSeq({ imageBase:COMMON_FX, prefix:DEFILE_FX.start.prefix, count:DEFILE_FX.start.count, durations:DEFILE_FX.start.durations, width:H, height:H, blend:"screen",
    alive: () => !u.dead, pos: () => ({ x:unitCenterX(u), bottom:(u.baseB || 74) - .04 * H }) });
}
function endRage(u){
  u.berserk = false; u.rageMs = 0; u.defile = 0; u.defileIdleMs = 0; u.target = null; u.el.classList.remove("berserk");
  if (u.mods) { delete u.mods.rage; unitRecalcMods(u); }
}
function updateDefile(u, dt){
  if (u.dead){ if (u.defileFxEl){ u.defileFxEl.remove(); u.defileFxEl = null; } return; }
  if (u.berserk){ u.rageMs -= dt; if (u.rageMs <= 0) endRage(u); }
  else if (u.defile > 0){ u.defileIdleMs = (u.defileIdleMs || 0) + dt; if (u.defileIdleMs > DEFILE_DECAY_DELAY_MS) u.defile = Math.max(0, u.defile - DEFILE_DECAY_PER_S * dt / 1000); }
  const on = (u.defile || 0) > 0.5 || u.berserk;
