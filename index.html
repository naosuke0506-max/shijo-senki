/* ---------- マス(グリッド)の表示 ---------- */
// ゲーム内の広さ：横2000 x 縦600。1マスは正方形(GRID_CELL)で、横に20マス・縦に5レーン。
// 縦は、いまの地面(下から74px)を最下段のレーンの足元とし、その上に4レーンを重ねる。兵士(高さ約92px)がほぼ1マスの大きさ。
const STAGE_W = 2000, STAGE_H = 600;
const GRID_CELL = 100, GRID_LANES = 5, GRID_GROUND = 74;
const LANE_LABELS = ["最左翼", "左翼", "中央", "右翼", "最右翼"]; // 下から上の順(仮)
let gridVisible = true;

// 画面(枠)の大きさに合わせて、ステージ全体を縮小して表示する
function fitStage(){
  const frame = document.getElementById("battlefield-frame");
  if (!frame || !frame.clientWidth || !frame.clientHeight) return;
  const scale = Math.min(frame.clientWidth / STAGE_W, frame.clientHeight / STAGE_H);
  const root = document.documentElement.style;
  root.setProperty("--stage-scale", scale);
  root.setProperty("--stage-offx", ((frame.clientWidth - STAGE_W * scale) / 2) + "px");
  root.setProperty("--stage-offy", (frame.clientHeight - STAGE_H * scale) + "px"); // 下に揃える
}

function buildGrid(){
  const field = document.getElementById("battlefield");
  let overlay = document.getElementById("grid-overlay");
  if (overlay) overlay.remove();
  const cols = Math.floor(STAGE_W / GRID_CELL);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.id = "grid-overlay";
  svg.setAttribute("viewBox", "0 0 " + STAGE_W + " " + STAGE_H);
  const add = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    if (text != null) e.textContent = text;
    svg.appendChild(e);
    return e;
  };
  const yTop = k => STAGE_H - (GRID_GROUND + GRID_CELL * (k + 1)); // レーンkの上端(画面の上からの位置)
  // レーンの色分け(1つおきに薄く塗る)
  for (let k = 0; k < GRID_LANES; k++){
    add("rect", { x: 0, y: yTop(k), width: cols * GRID_CELL, height: GRID_CELL, fill: k % 2 === 0 ? "rgba(255,255,255,0.045)" : "rgba(255,255,255,0.0)" });
  }
  // 縦線(マスの境目)と横線(レーンの足元)
  for (let c = 0; c <= cols; c++){
    add("line", { x1: c * GRID_CELL, y1: yTop(GRID_LANES - 1), x2: c * GRID_CELL, y2: STAGE_H - GRID_GROUND, stroke: "rgba(255,255,255,0.16)", "stroke-width": 2 });
  }
  for (let k = 0; k <= GRID_LANES; k++){
    const y = STAGE_H - (GRID_GROUND + GRID_CELL * k);
    add("line", { x1: 0, y1: y, x2: cols * GRID_CELL, y2: y, stroke: k === 0 ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.16)", "stroke-width": 2 });
  }
  // レーン名(左端)と、列の番号(下)
  for (let k = 0; k < GRID_LANES; k++){
    add("text", { x: 60, y: yTop(k) + GRID_CELL / 2 + 8, fill: "rgba(255,255,255,0.55)", "font-size": 24, "font-family": "sans-serif" }, LANE_LABELS[k]);
    add("text", { x: STAGE_W - 60, y: yTop(k) + GRID_CELL / 2 + 8, fill: "rgba(255,255,255,0.55)", "font-size": 24, "font-family": "sans-serif", "text-anchor": "end" }, LANE_LABELS[k]);
  }
  for (let c = 0; c < cols; c++){
    add("text", { x: c * GRID_CELL + GRID_CELL / 2, y: STAGE_H - GRID_GROUND + 30, fill: "rgba(255,255,255,0.5)", "font-size": 22, "font-family": "sans-serif", "text-anchor": "middle" }, String(c + 1));
  }
  add("text", { x: STAGE_W / 2, y: 30, fill: "rgba(255,255,255,0.6)", "font-size": 24, "font-family": "sans-serif", "text-anchor": "middle" },
      "1マス = " + GRID_CELL + "px (兵士1体ぶん) / 横" + cols + "マス × " + GRID_LANES + "レーン");
  svg.style.display = gridVisible ? "" : "none";
  field.insertBefore(svg, field.firstChild);
}

document.getElementById("grid-toggle").addEventListener("click", e => {
  gridVisible = !gridVisible;
  const ov = document.getElementById("grid-overlay");
  if (ov) ov.style.display = gridVisible ? "" : "none";
  e.target.textContent = "マス表示: " + (gridVisible ? "ON" : "OFF");
});
window.addEventListener("resize", () => { fitStage(); layoutLaneButtons(); });
buildGrid();
buildLaneButtons();
fitStage();
layoutLaneButtons();
/* ---------- レーン選択ボタン ---------- */
// 左端に縦に5つ(下から 最左翼 〜 最右翼)。ここでレーンを選んでから、キャラを召喚する
function buildLaneButtons(){
  const box = document.getElementById("lane-buttons");
  box.innerHTML = "";
  for (let k = 0; k < GRID_LANES; k++){
    const b = document.createElement("button");
    b.textContent = LANE_LABELS[k];
    b.dataset.lane = k;
    b.addEventListener("click", () => {
      if (!battle) return;
      // タップするたびに、選択・解除が切り替わる(5レーン全て選べる)
      if (battle.selectedLanes.has(k)) battle.selectedLanes.delete(k); else battle.selectedLanes.add(k);
      updateLaneButtons();
    });
    box.appendChild(b);
  }
  // 全レーンの選択・解除をまとめて切り替えるボタン
  const all = document.createElement("button");
  all.id = "lane-all-btn";
  all.textContent = "全レーン";
  all.addEventListener("click", () => {
    if (!battle) return;
    if (battle.selectedLanes.size >= GRID_LANES) battle.selectedLanes.clear();
    else for (let k = 0; k < GRID_LANES; k++) battle.selectedLanes.add(k);
    updateLaneButtons();
  });
  box.appendChild(all);
  layoutLaneButtons();
}
function layoutLaneButtons(){
  const frame = document.getElementById("battlefield-frame");
  const box = document.getElementById("lane-buttons");
  if (!frame || !box || !frame.clientHeight) return;
  const scale = Math.min(frame.clientWidth / STAGE_W, frame.clientHeight / STAGE_H);
  const offy = frame.clientHeight - STAGE_H * scale;
  Array.from(box.children).forEach(b => {
    if (b.id === "lane-all-btn"){
      // 「全レーン」ボタンは、いちばん下のレーンの下(地面の下の余白)に置く
      const t = offy + (STAGE_H - GRID_GROUND) * scale + 2;
      b.style.top = t + "px";
      b.style.height = Math.max(16, GRID_GROUND * scale - 4) + "px";
      return;
    }
    const k = Number(b.dataset.lane);
    const top = offy + (STAGE_H - GRID_GROUND - GRID_CELL * (k + 1)) * scale;
    b.style.top = (top + 1) + "px";
    b.style.height = Math.max(20, GRID_CELL * scale - 3) + "px";
  });
}
function updateLaneButtons(){
  const box = document.getElementById("lane-buttons");
  if (!box) return;
  Array.from(box.children).forEach(b => {
    if (b.id === "lane-all-btn"){
      b.classList.toggle("selected", !!battle && battle.selectedLanes.size >= GRID_LANES);
      return;
    }
    b.classList.toggle("selected", !!battle && battle.selectedLanes.has(Number(b.dataset.lane)));
  });
}
function flashLaneButtons(){
  const box = document.getElementById("lane-buttons");
  box.classList.remove("flash");
  void box.offsetWidth;
  box.classList.add("flash");
  setTimeout(() => box.classList.remove("flash"), 1200);
}

})();
</script>
