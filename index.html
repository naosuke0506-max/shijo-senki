  if (on && !u.defileFxEl){ const img = document.createElement("img"); img.className = "fx-sprite defile-status-fx"; img.onerror = () => { img.style.display = "none"; }; u.el.appendChild(img); u.defileFxEl = img; u.defileFxFrame = 0; u.defileFxT = 0; }
  if (!on && u.defileFxEl){ u.defileFxEl.remove(); u.defileFxEl = null; }
  if (!u.defileFxEl) return;
  const f = DEFILE_FX.gauge; u.defileFxT += dt; const dur = f.durations[u.defileFxFrame] || 250;
  if (u.defileFxT >= dur){ u.defileFxT -= dur; u.defileFxFrame = (u.defileFxFrame + 1) % f.count; }
  const el = u.defileFxEl, ratio = u.berserk ? 1 : Math.min(1, (u.defile || 0) / DEFILE_MAX);
  el.src = keyedFxSrc(COMMON_FX + f.prefix + (u.defileFxFrame + 1) + ".png", FX_KEY_DEFAULT); el.style.mixBlendMode = "normal";     // 黒を透明にした絵(毒のエフェクトと同じ)
  el.style.opacity = String(u.berserk ? 1 : .3 + .6 * ratio); el.style.height = Math.round((u._displayHeight || 92) * (u.berserk ? 1.7 : 1.1 + .4 * ratio)) + "px";
}
// 穢れの攻撃の、味方への解除：近くの味方で、穢れが溜まっていれば、そちらを狙う
function findCleanseAlly(unit){
  if (!battle || !unit.def.canCleanse) return null;
  let best = null, bd = Infinity;
  battle.units.forEach(o => {
    if (o === unit || o.dead || o.side !== unit.side || o.berserk || o.mounted || !((o.defile || 0) >= DEFILE_CLEANSE_MIN)) return;
    if (!canReachLane(unit, o)) return;
    const d = edgeDistance(unit, o); if (d > unit.def.attackRange) return;
    if (d < bd){ bd = d; best = o; }
  });
  return best;
}
/* =========================================================
   呪術師(灰燼教団)の技
   ・下位：敵の真下に赤い陣を呼び、赤い光で突き刺す(穢れの陣)
   ・中位：敵の頭上に輪を開き、水色の3本の光線で焼き、赤い穢れのシャワーを降らせる(輪の大きさは、敵に合わせる)
   ・中位は、出るとき、縦の輪が開き、その中から歩いて出てくる
   数値は仮。穢れのゲージ(穢れ状態・凶暴化)は、まだ入っていない
   ========================================================= */
function sumTo(a, n){ let t = 0; for (let i = 0; i < n && i < a.length; i++) t += a[i]; return t; }
// 一定時間後に、1回だけ、実行する(一時停止中は進まない)
function delayFx(ms, fn){ let t = 0; addFxTask(dt => { t += dt; if (t >= ms){ fn(); return false; } return true; }); }
// 効果範囲：中心x・半径の中の、敵(戦列が重なるもの)に、ダメージを与える
const CASTER_MAX_TARGETS = 4;                                                  // 1回の技が、巻き込む人数の上限(中心に近い順)
function casterHit(unit, cx, radius, laneLo, laneHi, dmg, defile){
  if (!battle) return;
  const hits = [];
  battle.units.forEach(u => {
    if (u.dead || !hostile(unit, u) || u.mounted || u.appearing || u.def.invulnerable) return;
    if (!lanesOverlap(u.laneLo, u.laneHi, laneLo, laneHi)) return;
    const d = Math.abs(unitCenterX(u) - cx); if (d > radius + (u._displayWidth || 40) / 2) return;
    hits.push({ u, d });
  });
  hits.sort((a, b) => a.d - b.d).slice(0, CASTER_MAX_TARGETS).forEach(h => {
    applyDamageToUnit(h.u, dmg, unit);
    if (defile) addDefile(h.u, defile);                                       // 穢れが溜まる
  });
}
function startCasterFx(unit){
  const t = unit.target; if (!t || t.dead) return;
  const type = unit.def.castFx.type;
  if (type === "mark") castMark(unit, t); else if (type === "ring") castRing(unit, t);
}
// 下位：足元の陣→赤い光(9コマ)。光が立つころ(1.3秒後)に、ダメージ
function castMark(unit, t){
  const def = unit.def, fx = def.fxMark, cx = unitCenterX(t), gb = t.baseB || 74, tw = t._displayWidth || 60;
  const ringW = Math.max(130, tw * 2.2), W = ringW / .79, H = W * 280 / 512, ay = .55;         // 陣の中心(縦55%)が、足元の高さ
  playFxSeq({ imageBase:def.imageBase, prefix:fx.prefix, count:fx.count, durations:fx.durations, width:W, height:H, blend:"screen", pos: () => ({ x:cx, bottom:gb - (1 - ay) * H }) });
  const lo = t.laneLo - (def.laneReach || 0), hi = t.laneHi + (def.laneReach || 0), dmg = getEffectiveAtk(unit);
  const cleanse = t.side === unit.side && !t.berserk;                                   // 穢れの溜まった味方：ダメージなしで、穢れだけを減らす
  delayFx(fx.hitAtMs, () => { if (cleanse){ if (!t.dead){ defileCleanse(t, def.cleanseAmount || 35); popText(t, "浄化"); } } else casterHit(unit, cx, ringW * fx.radiusMult, lo, hi, dmg, def.defileAmount || 35); });
}
// 中位：頭上の輪(4コマ、3コマめを3秒保つ)→0.5秒後に光線(6コマ)→2秒後に穢れのシャワー(6コマ)
function castRing(unit, t){
  const def = unit.def, cx = unitCenterX(t), gb = t.baseB || 74, th = t._displayHeight || 80, tw = t._displayWidth || 60;
  const ringW = Math.max(110, tw * 1.6), S = ringW / .86, ringCY = th + 30;                    // 輪の大きさは、敵の大きさに合わせる
  const lo = t.laneLo - (def.laneReach || 0), hi = t.laneHi + (def.laneReach || 0), atk = getEffectiveAtk(unit), radius = ringW * .5;
  const fr = def.fxRing, fl = def.fxLaser, fs = def.fxShower;
  playFxSeq({ imageBase:def.imageBase, prefix:fr.prefix, count:fr.count, durations:fr.durations, width:S, height:S, blend:"screen", pos: () => ({ x:cx, bottom:gb + ringCY - S * .5 }) });
  delayFx(fl.startMs, () => {                                                                // 水色の3本の光線(回転)
    const Wl = ringW * 1.1, Hl = ringCY / .78;
    playFxSeq({ imageBase:def.imageBase, prefix:fl.prefix, count:fl.count, durations:fl.durations, width:Wl, height:Hl, blend:"screen", pos: () => ({ x:cx, bottom:gb - .08 * Hl }) });
    for (let k = 1; k <= fl.count; k++) delayFx(fl.durations[0] * k, () => casterHit(unit, cx, radius, lo, hi, atk * .25));        // 光線で焼く(6回。1回は攻撃の25%)
  });
  delayFx(fs.startMs, () => {                                                                // 赤い穢れのシャワー
    const Ws = ringW * .95, Hs = ringCY / .77;
    playFxSeq({ imageBase:def.imageBase, prefix:fs.prefix, count:fs.count, durations:fs.durations, width:Ws, height:Hs, blend:"screen", pos: () => ({ x:cx, bottom:gb - .07 * Hs }) });
    for (let k = 1; k <= 3; k++) delayFx(fs.durations[0] * k * 2, () => casterHit(unit, cx, radius, lo, hi, atk * .15, 8));              // 穢れのシャワー(3回。1回は攻撃の15%。穢れ+8ずつ)
  });
}
// 出現：縦の輪が開き、その中から歩いて出てくる
function startAppear(unit){
  const def = unit.def, fx = def.appearFx; if (!fx || !def.frameCounts.appear) return;
  unit.appearing = true; unit.el.style.visibility = "hidden";
  const H = (def.pixelScale * 525) * 1.2 / .92;
  const fixedX = { v:null };                                                  // 輪は、出始めの位置に、固定する(歩き出しても、動かない)
  playFxSeq({ imageBase:def.imageBase, prefix:fx.prefix, count:fx.count, durations:fx.durations, width:H, height:H, blend:"screen",
    pos: () => { if (fixedX.v == null) fixedX.v = unit.x + (unit.facing === 1 ? 0 : (unit._displayWidth || 60)); return { x:fixedX.v, bottom:(unit.baseB || 74) - .01 * H }; } });
  delayFx(fx.delayMs, () => {
    if (unit.dead){ return; }
    unit.el.style.visibility = ""; setMotion(unit, "appear", { onEnd: () => { unit.appearing = false; setMotion(unit, "walk", { loop:true }); } });
  });
}
// 呪術師の絵を、先に読み込んでおく(初めて出るとき、絵が遅れて出ないように)
function warmDefileFx(){ for (let i = 1; i <= DEFILE_FX.gauge.count; i++) keyedFxSrc(COMMON_FX + DEFILE_FX.gauge.prefix + i + ".png", FX_KEY_DEFAULT); }
function warmCasterFx(def){
  [def.fxMark, def.fxRing, def.fxLaser, def.fxShower, def.appearFx].forEach(f => { if (!f) return; for (let i = 1; i <= f.count; i++){ const im = new Image(); im.src = def.imageBase + f.prefix + i + ".png"; } });
}
function constDurations(count, dur){ const a = []; for (let i = 0; i < count; i++) a.push(dur); return a; }

// バリア内の味方(4m以下)は遠距離攻撃を受けない。バリアは女王の前方にある
function isShielded(target){
  const tx = unitCenterX(target);
  return battle.units.some(q => {
    if (q.dead || q.side !== target.side || !(q.barrierMs > 0) || !q.def.skills || !q.def.skills.shield) return false;
    if (!lanesOverlap(q.laneLo, q.laneHi, target.laneLo, target.laneHi)) return false; // バリアは女王のいるレーン分
    const W = q._displayWidth || 110;
    const reach = q.def.skills.shield.reach;
    const lo = q.facing === -1 ? q.x - reach : q.x;
    const hi = q.facing === -1 ? q.x + W : q.x + W + reach;
    return tx >= lo && tx <= hi;
  });
}

function tryQueenSkills(unit, rangeDist){
  const sk = unit.def.skills;
  if (unit.motion !== "walk" && unit.motion !== unit.def.approachMotion) return false;
  // シールド：射程の長い(遠距離攻撃を持つ)敵が近くにいて、バリアが張られていなければ張る
  if (sk.shield && unit.shieldCooldown <= 0 && !(unit.barrierMs > 0)){
    const threat = battle.units.some(o => !o.dead && o.side !== unit.side && o.def.ranged &&
      Math.abs(unitCenterX(o) - unitCenterX(unit)) <= sk.shield.range);
    if (threat){ startShieldCast(unit); return true; }
  }
  // メテオ：近接の間合いの外にいる相手が、メテオの射程内にいれば唱える
  if (sk.meteor && unit.meteorCooldown <= 0 && rangeDist > unit.def.attackRange + 20 && rangeDist <= sk.meteor.range){
    startMeteorCast(unit);
    return true;
  }
  return false;
}

function startShieldCast(unit){
  const sk = unit.def.skills.shield;
  unit.shieldCooldown = skillCd(unit, sk.cooldownMs);
  unit.casting = "shield";
  unit.castId = (unit.castId || 0) + 1;
  setMotion(unit, "shield", { onEnd: () => { unit.casting = null; onAttackEnd(unit); } });
}

function activateBarrier(unit){
  const sk = unit.def.skills.shield;
  const fx = unit.def.fx.barrier;
  unit.barrierMs = sk.durationMs;
  const aspect = 687 / 1024;
  const width = fx.height * aspect;
  playFxSeq({
    imageBase: unit.def.fx.imageBase, prefix: fx.prefix, count: fx.count, durations: constDurations(fx.count, fx.dur),
    height: fx.height,
    // 完成のコマ(3・4番目)を、バリアが続く間だけ交互に繰り返す。残り0.4秒になったら弱まって砕ける2コマへ
    loop: { from: 2, to: 3, keep: () => unit.barrierMs > fx.dur * 2 },
    alive: () => { if (unit.dead || unit.transforming){ unit.barrierMs = 0; return false; } return true; },
    pos: () => {
      const W = unit._displayWidth || 110;
      const front = unit.facing === 1 ? unit.x + W + width * 0.45 : unit.x - width * 0.45;
      return { x: front, bottom: unit.baseB || 74, flip: unit.facing === -1 };
    }
  });
}

function startMeteorCast(unit){
  const sk = unit.def.skills.meteor;
  unit.meteorCooldown = skillCd(unit, sk.cooldownMs);
  unit.casting = "meteor";
  unit.castId = (unit.castId || 0) + 1;
  unit.castTargetX = unit.target ? unitCenterX(unit.target) : null;
  unit.castTargetLane = unit.target ? unit.target.lane : unit.lane; // メテオは、狙った相手のレーンに落ちる
  unit.attackHadTarget = !!unit.target;
  setMotion(unit, "meteor", { onEnd: () => { unit.casting = null; onAttackEnd(unit); } });
}

// 詠唱の途中で、女王の少し斜め前の上空に黒い穴を開け、穴からメテオを1発ずつ落とす
function openRift(unit){
  const sk = unit.def.skills.meteor;
  const fx = unit.def.fx.rift;
  const id = unit.castId;
  const field = document.getElementById("battlefield");
  const dir = unit.side === "player" ? -1 : 1;
  // 穴は「狙った敵の少し前(女王に近い側)」の上空に開く。開いたあとは動かない
  const tx0 = (unit.target && !unit.target.dead) ? unitCenterX(unit.target)
    : (unit.castTargetX != null ? unit.castTargetX : unitCenterX(unit) + dir * 200);
  const hx = tx0 - dir * sk.holeInFront;
  const tl0 = (unit.target && !unit.target.dead) ? unit.target.lane : (unit.castTargetLane != null ? unit.castTargetLane : unit.lane);
  const hb = Math.min(laneFloor(tl0) + sk.holeHeight, field.clientHeight - sk.holeSize / 2 - 6);
  playFxSeq({
    imageBase: unit.def.fx.imageBase, prefix: fx.prefix, count: fx.count, durations: fx.durations,
    height: sk.holeSize, blend: "normal", // 穴は透過PNGなので通常合成
    alive: () => !unit.dead && unit.castId === id,
    pos: () => ({ x: hx, bottom: hb - sk.holeSize / 2 })
  });
  let t = 0;
  const fired = sk.launchAt.map(() => false);
  addFxTask(dt => {
    if (unit.dead || unit.castId !== id) return false;
    t += dt;
    sk.launchAt.forEach((at, i) => {
      if (!fired[i] && t >= at){
        fired[i] = true;
        // 穴の真下へ降り注ぐ。狙った敵が動いていたら、穴の近く(±40px)まで寄せて落とす
        const tx = (unit.target && !unit.target.dead) ? unitCenterX(unit.target) : hx;
        const land = Math.max(hx - 40, Math.min(hx + 40, tx));
        launchMeteor(unit.def.fx, unit.side, { x: hx, b: hb }, land, { travelMs: sk.travelMs, damage: sk.damage, radius: sk.radius, lane: (unit.target && !unit.target.dead) ? unit.target.lane : tl0 });
      }
    });
    return !fired.every(f => f);
  });
}

// メテオを1発飛ばす(from=発射位置、toX=着弾する横位置)。尾が進行方向の後ろに伸びるよう回転させる
function launchMeteor(fx, side, from, toX, o){
  const field = document.getElementById("battlefield");
  if (!field || !battle) return;
  const m = fx.meteorFly;
  const h = m.height;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = h + "px";
  field.appendChild(el);
  const gb = laneFloor(o.lane != null ? o.lane : 0); // 着弾するレーンの地面の高さ
  const dx = toX - from.x, db = gb - from.b;
  const len = Math.hypot(dx, db) || 1;
  const ux = dx / len, ub = db / len;
  const theta = Math.atan2(-ux, -ub) * 180 / Math.PI;
  let t = 0, frame = 0, ft = 0;
  el.src = fx.imageBase + m.prefix + "1.png";
  addFxTask(dt => {
    t += dt; ft += dt;
    while (ft >= m.dur){ ft -= m.dur; frame = (frame + 1) % m.count; el.src = fx.imageBase + m.prefix + (frame + 1) + ".png"; }
    const p = Math.min(1, t / o.travelMs);
    const hx = from.x + dx * p, hb = from.b + db * p; // 先端(岩)の位置
    const cx = hx - ux * h * 0.3, cb = hb - ub * h * 0.3; // 画像の中心(尾が後ろへ伸びる)
    el.style.bottom = (cb - h / 2) + "px";
    el.style.transform = "translateX(" + cx + "px) translateX(-50%) rotate(" + theta + "deg)";
    if (p >= 1){
      el.remove();
      meteorImpact(fx, side, toX, o);
      return false;
    }
    return true;
  });
}

// 着弾：爆発を出し、範囲内の敵ユニットにダメージを与える(城には当たらない)。味方には当たらない
function meteorImpact(fx, side, ix, o){
  const im = fx.meteorImpact;
  playFxSeq({
    imageBase: fx.imageBase, prefix: im.prefix, count: im.count, durations: constDurations(im.count, im.dur),
    height: im.height, pos: () => ({ x: ix, bottom: laneFloor(o.lane != null ? o.lane : 0) })
  });
  const enemySide = side === "player" ? "enemy" : "player";
  const impLane = o.lane != null ? o.lane : 0; // 着弾は1レーン、1マスぶん
  battle.units.filter(u => !u.dead && !u.mounted && u.side === enemySide && lanesOverlap(impLane, impLane, u.laneLo, u.laneHi) && Math.abs(unitCenterX(u) - ix) <= o.radius)
    .forEach(u => applyDamageToUnit(u, o.damage * ((battle.sideMul && battle.sideMul[side] && battle.sideMul[side].magic) || 1), null));       // 魔法属性の威力(鬼后のリーダー効果)
}

/* ---- 第二形態への移行 ---- */

function startTransform(unit){
  const def = unit.def;
  unit.transformed = true;
  unit.transforming = true;
  unit.casting = null;
  unit.castId = (unit.castId || 0) + 1; // 詠唱中の魔法・バリアはキャンセル
  unit.barrierMs = 0;
  unit.target = null;
  unit.staggerVX = 0;
  setMotion(unit, "transform", { onEnd: () => finishTransform(unit) });
  // 足元に広がる魔法陣：2コマ目と3コマ目を、移行モーションが終わるまで繰り返す
  const fx = def.fx.circle;
  playFxSeq({
    imageBase: def.fx.imageBase, prefix: fx.prefix, count: fx.count, durations: constDurations(fx.count, fx.dur),
    height: fx.height,
    loop: { from: 1, to: 2, keep: () => unit.transforming && !unit.dead },
    pos: () => ({ x: unitCenterX(unit), bottom: (unit.baseB || 74) - 4 })
  });
}

function finishTransform(unit){
  if (unit.dead) return;
  unit.transforming = false;
  unit.def = CHAR_DEFS[unit.def.transformTo];
  unit.form2 = true;
  unit.target = null;
  setMotion(unit, "walk", { loop:true });
}

// 移行モーションの途中で、魔法陣からヒーラーを召喚する
function summonQueenHealers(unit){
  const n = unit.def.transformHealers || 0;
  const center = unitCenterX(unit);
  for (let i = 0; i < n; i++){
    const h = spawnUnit("healer", unit.side, 0, { lane: unit.lane });
    const off = (i % 2 === 0 ? 1 : -1) * (120 + Math.floor(i / 2) * 60);
    h.x = center + off - (h._displayWidth || 30) / 2;
    applyFrame(h);
  }
}

/* ---- 指輪コンボ(キングとの連携) ---- */

// キングと女王がお互い場にいる状態になった瞬間に、指輪を掲げる。キングの動きはキング実装時に追加する
function checkRingCombo(unit){
  if (!battle || !unit.def.comboRole) return;
  const partner = battle.units.find(u => u !== unit && !u.dead && u.side === unit.side &&
    u.def.comboRole && u.def.comboRole !== unit.def.comboRole);
  if (!partner || battle.comboDone[unit.side]) return;
  battle.comboDone[unit.side] = true;
  const queen = unit.def.comboRole === "queen" ? unit : partner;
  const king = unit.def.comboRole === "king" ? unit : partner;
  startRingCombo(queen);
  startKingRingCombo(king);
}

function startRingCombo(queen){
  if (queen.transforming){ // 移行モーション中なら終わるまで待つ
    addFxTask(() => { if (queen.dead) return false; if (queen.transforming) return true; startRingCombo(queen); return false; });
    return;
  }
  if (queen.dead) return;
  queen.casting = null;
  queen.castId = (queen.castId || 0) + 1;
  queen.target = null;
  setMotion(queen, "ring", { onEnd: () => { if (!queen.dead) setMotion(queen, "walk", { loop:true }); } });
  // 20秒後から隕石が降り注ぐ(女王が倒されても降る)
  const cfg = queen.def.comboMeteor;
  const fx = queen.def.fx;
  const side = queen.side;
  let t = 0;
  addFxTask(dt => {
    t += dt;
    if (t < cfg.delayMs) return true;
    startMeteorRain(fx, side, cfg);
    return false;
  });
}

// 手の位置(掲げた指輪)の画面上の位置
function ringHandPos(unit){
  const W = unit._displayWidth || 110, H = unit._displayHeight || 120;
  const hand = unit.def.ringHand;
  const fe = unit.facing === 1 ? hand.x : 1 - hand.x;
  return { x: unit.x + fe * W, b: (unit.baseB || 74) + (unit.rideY || 0) + (1 - hand.y) * H };
}

// 指輪が砕ける瞬間：割れるエフェクトを出し、紫のエネルギーが天へ昇って画面外へ消える
function onRingShatter(unit){
  const fx = unit.def.fx;
  const hp = ringHandPos(unit);
  const br = fx.ringBreak;
  playFxSeq({
    imageBase: fx.imageBase, prefix: br.prefix, count: br.count, durations: constDurations(br.count, br.dur),
    height: br.height, pos: () => ({ x: hp.x, bottom: hp.b - br.height / 2 })
  });
  const en = fx.energy;
  const field = document.getElementById("battlefield");
  const h = en.height;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = h + "px";
  el.src = fx.imageBase + en.prefix + "1.png";
  field.appendChild(el);
  let rise = 0, frame = 0, ft = 0;
  addFxTask(dt => {
    rise += en.riseSpeed * (dt / 1000);
    ft += dt;
    while (ft >= en.dur){ ft -= en.dur; frame = (frame + 1) % en.count; el.src = fx.imageBase + en.prefix + (frame + 1) + ".png"; }
    // 画像の上側が光の玉、下側が尾。玉が手の位置から真上へ昇る
    const bottom = hp.b - h * 0.65 + rise;
    if (bottom > field.clientHeight + 20){ el.remove(); return false; }
    el.style.bottom = bottom + "px";
    el.style.transform = "translateX(" + hp.x + "px) translateX(-50%)";
    return true;
  });
}

// 隕石の雨：ステージのどのレーン・どのマスに落ちるかは分からない(女王の位置や、レーンには関係なし)。同じマスには落ちない
function startMeteorRain(fx, side, cfg){
  const field = document.getElementById("battlefield");
  const fh = field.clientHeight;
  const cols = Math.floor(STAGE_W / GRID_CELL);
  const used = new Set();
  let elapsed = 0, next = 0;
  addFxTask(dt => {
    elapsed += dt;
    if (elapsed >= cfg.durationMs) return false;
    next -= dt;
    while (next <= 0){
      next += cfg.intervalMs;
      if (used.size >= cols * GRID_LANES) used.clear(); // 全マスに落としたら、最初から数え直す
      let col, lane, key, tries = 0;
      do {
        col = Math.floor(Math.random() * cols);
        lane = Math.floor(Math.random() * GRID_LANES);
        key = col + "," + lane;
        tries++;
      } while (used.has(key) && tries < 200);
      used.add(key);
      const best = col * GRID_CELL + GRID_CELL / 2 + (Math.random() * 50 - 25);
      const startX = best + (Math.random() * 120 - 60);
      launchMeteor(fx, side, { x: startX, b: fh + 60 }, best, { travelMs: cfg.travelMs, damage: cfg.damage, radius: cfg.radius, lane });
    }
    return true;
  });
}

// 女王のコマごとの出来事(コマが切り替わった瞬間に呼ばれる)
function onQueenFrame(unit){
  const def = unit.def;
  const sk = def.skills;
  if (unit.motion === "shield" && sk && sk.shield && unit.frameIndex === sk.shield.activateFrame) activateBarrier(unit);
  if (unit.motion === "meteor" && sk && sk.meteor && unit.frameIndex === sk.meteor.riftFrame) openRift(unit);
  if (unit.motion === "transform" && unit.frameIndex === def.healerFrame) summonQueenHealers(unit);
  if (unit.motion === "ring" && unit.frameIndex === def.ringShatterFrame) onRingShatter(unit);
}

/* ---------- ゴブリン・ビースト・フォートレス ---------- */

// 表示倍率(scaleMult)を変えたとき、読み込み済みの画像の大きさを即座に更新する
function applyUnitScale(unit){
  const img = unit.img;
  if (!img.naturalWidth) return;
  const def = unit.def;
  const motionScales = def.motionScale || {};
  const motionFactor = motionScales[img.dataset.motion] != null ? motionScales[img.dataset.motion] : 1;
  const scale = (def.pixelScale || 1) * motionFactor * (unit.scaleMult || 1);
  const dw = img.naturalWidth * scale;
  const dh = img.naturalHeight * scale;
  img.style.width = dw + "px";
  img.style.height = dh + "px";
  unit._displayWidth = dw;
  unit._displayHeight = dh;
}

// ゴブリンをフォートレスの背中に乗せる(小さく描き、フォートレスの画像の後ろ側に重ねる=手すりの奥に見える)
function mountRider(r, mount, slot){
  r.mounted = true;
  r.mount = mount;
  r.slot = slot;
  copyLane(r, mount, -1); // フォートレスと同じレーン(画像の奥側に描く)
  r.scaleMult = mount.def.riderScale || 0.42;
  r.uhpEl.style.display = "none";
  r.el.parentNode.insertBefore(r.el, mount.el);
  syncRiderToMount(r);
}

// 乗っているゴブリンの位置を、フォートレスの現在の位置・向き・大きさに合わせる
function syncRiderToMount(r){
  const m = r.mount;
  if (!m) return;
  const md = m.def;
  const W = m._displayWidth || 240;
  const H = m._displayHeight || 165;
  const rw = r._displayWidth || 20;
  const fe = m.facing === 1 ? r.slot.frac : 1 - r.slot.frac; // 左向き(自軍側)は画像が反転しているので後ろ端が右側
  r.x = m.x + fe * W - rw / 2;
  r.rideY = H * (r.slot.tower ? md.towerHeightFrac : md.deckHeightFrac);
  r.facing = m.facing;
  applyFrame(r);
}

// 乗っている間のゴブリンの行動：その場に立ち、弓兵だけ射程内の敵(いなければ敵城)を撃つ
function updateMountedAI(unit){
  const def = unit.def;
  if (unit.motion === "walk"){ // 太鼓を叩き終えたあと等に歩きモーションへ戻るので、その場に立たせる
    setMotion(unit, "idle", { loop:true });
    return;
  }
  if (!def.ranged || unit.motion !== "idle") return;

  const enemy = findNearestEnemyInRange(unit);
  let shoot = false;
  unit.target = null;
  if (enemy){
    if (edgeDistance(unit, enemy) <= def.attackRange){ unit.target = enemy; shoot = true; }
  } else {
    const field = document.getElementById("battlefield");
    const castleX = unit.side === "player" ? 60 : field.clientWidth - 60;
    if (Math.abs(unit.x - castleX) <= def.attackRange) shoot = true; // 敵城が射程に入った
  }
  if (!shoot) return;
  unit.attackHadTarget = !!unit.target;
  setMotion(unit, def.attackMotionName || "attack", {
    onEnd: () => { if (!unit.dead && unit.mounted && !unit.dismounting) setMotion(unit, "idle", { loop:true }); }
  });
}

function updateMount(unit, dtMs){
  if (!unit.mounted) return;
  if (unit.mount && unit.mount.def.chariotUnit){ syncChariotRider(unit); return; } // チャリオットの乗員は、専用の同期を使う
  if (unit.dismounting) updateDismount(unit, dtMs);
  else syncRiderToMount(unit);
}

// フォートレスが倒れたとき、背中のゴブリンを一人ずつ梯子から降ろし始める
function startDismount(m){
  (m.riders || []).forEach((r, i) => {
    if (r.dead || !r.mounted) return;
    r.dismounting = true;
    r.dismountPhase = "wait";
    r.dismountDelay = 500 + i * 450;
    r.startRideY = r.rideY;
  });
}

function hasRidersLeft(m){
  return (m.riders || []).some(r => !r.dead && r.mount === m);
}

// 梯子まで歩く → 梯子を降りる(降りながら通常の大きさに戻る) → 地上に降りて通常ユニットになる
function updateDismount(r, dtMs){
  const m = r.mount;
  if (!m){ finishDismount(r); return; }
  if (r.dismountDelay > 0){ r.dismountDelay -= dtMs; return; }
  if (r.dismountPhase === "wait"){
    r.dismountPhase = "walk";
    r.el.parentNode.appendChild(r.el); // フォートレスの体より手前に出す(梯子は手前側の側面にある)
    r.el.style.zIndex = String(laneZ(r) + 2);
    if (r.def.frameCounts.walk) setMotion(r, "walk", { loop:true });
  }
  const W = m._displayWidth || 240;
  const fe = m.facing === 1 ? m.def.ladderFrac : 1 - m.def.ladderFrac;
  const ladderX = () => m.x + fe * W - (r._displayWidth || 20) / 2;

  if (r.dismountPhase === "walk"){
    const dx = ladderX() - r.x;
    if (Math.abs(dx) <= 2){ r.dismountPhase = "climb"; return; }
    const dir = dx > 0 ? 1 : -1;
    r.x += dir * 100 * (dtMs / 1000);
    r.facing = dir;
    applyFrame(r);
    return;
  }

  // climb
  r.rideY = Math.max(0, r.rideY - 160 * (dtMs / 1000));
  const p = 1 - r.rideY / (r.startRideY || 1);
  const base = m.def.riderScale || 0.42;
  r.scaleMult = base + (1 - base) * p;
  applyUnitScale(r);
  r.x = ladderX();
  applyFrame(r);
  if (r.rideY <= 0) finishDismount(r);
}

function finishDismount(r){
  r.mounted = false;
  r.mount = null;
  r.dismounting = false;
  r.rideY = 0;
  r.scaleMult = 1;
  applyUnitScale(r);
  r.uhpEl.style.display = "";
  r.target = null;
  r.facing = r.side === "player" ? -1 : 1;
  const fallback = r.def.frameCounts.walk ? "walk" : (r.def.approachMotion || "walk");
  setMotion(r, fallback, { loop:true });
}

// 倒れたフォートレスは、背中のゴブリンが全員降りきるまで消えない
function updateFortressCorpse(unit){
  if (unit.dead && unit.riders && unit.downFinished && !hasRidersLeft(unit)) removeUnit(unit);
}

/* ---------- チャリオット：兵を積んで敵城の間近まで運び、また戻って積み直す ---------- */

// 乗せる(布陣で選んだ4人を積む。今は暫定でdef.riderKindsの固定の顔ぶれ)
function boardChariotRiders(unit){
  const def = unit.def;
  const kinds = unit.riderKinds || def.riderKinds || [];
  unit.chariotRiders = kinds.map((kind, i) => {
    const r = spawnUnit(kind, unit.side, 0, {});
    mountChariotRider(r, unit, i);
    return r;
  });
}
function mountChariotRider(r, mount, slotIndex){
  r.mounted = true;
  r.mount = mount;
  r.chariotSlot = slotIndex;
  r.scaleMult = mount.def.riderScale || 0.6;
  r.uhpEl.style.display = "none";
  r.target = null;
  setMotion(r, "idle", { loop:true });
  copyLane(r, mount, -1); // チャリオットと同じレーン扱い(画像の奥側に描く)
  syncChariotRider(r);
}
// 乗っている兵の見た目の位置を、チャリオットの現在位置・向きに合わせる(荷台の中の決まった位置に並ぶ)
function syncChariotRider(r){
  const m = r.mount;
  if (!m || m.dead){ return; }
  const W = m._displayWidth || 280;
  const H = m._displayHeight || 130;
  const fracs = m.def.riderSlotFracs || [0.3, 0.42, 0.58, 0.7];
  const frac = fracs[r.chariotSlot] != null ? fracs[r.chariotSlot] : 0.5;
  const fe = m.facing === 1 ? frac : 1 - frac;
  const rw = (r._displayWidth || 20) * (r.scaleMult || 1);
  r.x = m.x + fe * W - rw / 2;
  r.rideY = H * (m.def.riderDeckFrac != null ? m.def.riderDeckFrac : 0.32);
  r.facing = m.facing;
  applyFrame(r);
}
// 敵城の目の前で、乗せていた4人を降ろす(独立したユニットとして、その場で戦い始める)
function dropoffChariotRiders(unit){
  const riders = unit.chariotRiders || [];
  riders.forEach((r, i) => {
    if (r.dead) return;
    r.mounted = false;
    r.mount = null;
    r.scaleMult = 1;
    r.rideY = 0;
    r.uhpEl.style.display = "";
    const lane = i % 2 === 0 ? unit.laneLo : unit.laneHi; // チャリオットの2レーンへ、交互に振り分ける
    setUnitLane(r, lane);
    r.x = unit.x + (i - (riders.length - 1) / 2) * 30;
    r.facing = unit.side === "player" ? -1 : 1;
    r.target = null;
    const fallback = r.def.frameCounts.walk ? "walk" : (r.def.approachMotion || "walk");
    setMotion(r, fallback, { loop:true });
    applyFrame(r);
  });
  unit.chariotRiders = [];
}
// チャリオットの一連の動き：出現→1マス前進→停止して積む→敵城近くまで轢き進む(スーパーアーマー)→
// 降ろす→振り向く→自城近くまで戻る→また積む→…の繰り返し
/* ---------- 伝令兵：敵城を探って戻り、鬼の出方を予測。的中したら角笛でその戦列を惑わす ---------- */
const COURIER_DEBUFF_SOURCE = { def: { buffAtkMult: 0.7 } }; // 予測的中による弱体化の印(全伝令兵で共通)
function updateCourierAI(unit, dtMs){
  if (unit.dead) return;
  const def = unit.def;
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : STAGE_W;
  const wu = def.hitboxWidth || 0;
  const enemyGateX = unit.side === "player" ? CASTLE_APPROACH_GAP + GRID_CELL : fieldWidth - CASTLE_APPROACH_GAP - GRID_CELL - wu;
  const homeGateX = unit.side === "player" ? fieldWidth - 90 : 90; // 出現位置と同じ境界(自城前)まで戻る
  if (!unit.courierPhase) unit.courierPhase = "scoutOut";

  if (unit.courierPhase === "scoutOut"){
    const dir = unit.side === "player" ? -1 : 1;
    unit.facing = dir;
    unit.x += moveWithCollision(unit, dir * getEffectiveSpeed(unit, def.walkSpeed) * (dtMs / 1000));
    applyFrame(unit);
    if (unit.side === "player" ? unit.x <= enemyGateX : unit.x >= enemyGateX) unit.courierPhase = "scoutBack";
    return;
  }
  if (unit.courierPhase === "scoutBack"){
    const dir = unit.side === "player" ? 1 : -1;
    unit.facing = dir;
    unit.x += moveWithCollision(unit, dir * getEffectiveSpeed(unit, def.walkSpeed) * (dtMs / 1000));
    applyFrame(unit);
    if (unit.side === "player" ? unit.x >= homeGateX : unit.x <= homeGateX) startCourierWatch(unit);
    return;
  }
  // "watching"(見張り中)・"signaling"(角笛の最中)は、その場で待つだけ
}
function startCourierWatch(unit){
  const stage = battle.stage;
  const lanes = (stage && stage.lanes && stage.lanes.length) ? stage.lanes : [0, 1, 2, 3, 4];
  if (lanes.length <= 1){
    // 戦列が1つしかない戦線では「外れ」の余地がないので、そのままその戦列を予測する
    unit.watchLanes = lanes.slice();
    unit.excludedLane = null;
  } else {
    // ランダムに1戦列だけ除外し、残り全部を「予測した戦列」とする(外れる確率は低いが、皆無ではない)
    const excluded = lanes[Math.floor(Math.random() * lanes.length)];
    unit.excludedLane = excluded;
    unit.watchLanes = lanes.filter(l => l !== excluded);
  }
  unit.courierPhase = "watching";
  unit.facing = unit.side === "player" ? -1 : 1;
  setMotion(unit, "idle", { loop:true });
  const msg = unit.excludedLane != null
    ? (LANE_LABELS[unit.excludedLane] + "以外より、鬼の出現を予測……!")
    : (LANE_LABELS[unit.watchLanes[0]] + "より、鬼の出現を予測……!");
  queueBanner(msg, true, false);
}
// 新しく敵が現れるたび呼ぶ：見張り中の伝令兵の予測に当たっていないか、また既に的中済みの戦列(弱体化ゾーン)に
// 新しく出た敵かどうかを判定する
function onEnemySpawned(u){
  if (!battle || u.side !== "enemy") return;
  battle.units.forEach(c => {
    if (c.dead || !c.def.courierUnit || c.courierPhase !== "watching") return;
    if (c.watchLanes && c.watchLanes.includes(u.lane)) fireCourierSignal(c, u);
    else fireCourierMiss(c); // 予測した戦列以外(=除外した1戦列)から出た場合は予測失敗
  });
  (battle.courierDebuffZones || []).forEach(z => {
    if (z.lane === u.lane && battle.time < z.expiresAt) applyCourierDebuffDirect(u, z.expiresAt);
  });
}
function applyCourierDebuffDirect(unit, expiresAt){
  if (!unit.buffSources) unit.buffSources = new Set();
  unit.buffSources.add(COURIER_DEBUFF_SOURCE);
  unit.courierDebuffUntil = Math.max(unit.courierDebuffUntil || 0, expiresAt);
}
function fireCourierSignal(unit, triggerEnemy){
  unit.courierPhase = "signaling";
  const expiresAt = battle.time + (unit.def.predictionDebuffMs || 80000) / 1000;
  battle.courierDebuffZones = battle.courierDebuffZones || [];
  (unit.watchLanes || [unit.watchLane]).forEach(lane => {
    battle.courierDebuffZones.push({ lane, expiresAt });
  });
  applyCourierDebuffDirect(triggerEnemy, expiresAt);
  const laneMsg = unit.excludedLane != null
    ? (LANE_LABELS[unit.excludedLane] + "以外の全戦列")
    : LANE_LABELS[(unit.watchLanes || [unit.watchLane])[0]];
  queueBanner("予測的中！　" + laneMsg + "を惑わす", true, false);
  setMotion(unit, "signal", { onEnd: () => removeUnit(unit) }); // 笛を鳴らし終えたら、役目を終えて消える
}
// 予測が外れた場合：角笛は鳴らさず、効果なしのまま静かに退場する
function fireCourierMiss(unit){
  unit.courierPhase = "signaling"; // 見張り状態から抜け、二重判定を防ぐ
  queueBanner("予測外れ……", true, false);
  removeUnit(unit);
}

// 炎の帯(地面に広がる炎)の見た目を、範囲に合わせて置く・伸ばす(fx_groundflameを敷き詰めてループさせる)
function updateFireZoneVisual(z, dtMs){
  const field = document.getElementById("battlefield");
  if (!field) return;
  if (!z.el){
    z.el = document.createElement("div");
    z.el.className = "fire-zone-visual";
    field.appendChild(z.el);
    z.visFrame = 0; z.visTimer = 0;
  }
  z.el.style.left = z.xMin + "px";
  z.el.style.width = Math.max(4, z.xMax - z.xMin) + "px";
  z.el.style.bottom = (laneFloor(z.lane) - 6) + "px";
  z.el.style.zIndex = String(laneZ({ laneLo: z.lane }) - 2);
  z.visTimer -= dtMs;
  if (z.visTimer <= 0){
    z.visTimer += 220;
    z.visFrame = (z.visFrame + 1) % 3;
    z.el.style.backgroundImage = "url(" + keyedFxSrc(IMG_FX_COMMON2 + "fx_groundflame_" + (z.visFrame + 1) + ".png", FX_KEY_DEFAULT) + ")";
  }
}
function removeFireZoneVisual(z){ if (z.el){ z.el.remove(); z.el = null; } }
// 火槍手：噴射の瞬間、噴き出す炎(fx_burn)をひと吹き分、口元に重ねて出す
function playIncendiaryBurst(unit){
  const dir = unit.facing === 1 ? 1 : -1; // 実際に今向いている方へ(通常はsideと同じだが、より正確)
  const durations = [200, 200, 200, 200, 200, 200, 200, 200, 200];
  const muzzleX = unit.x + (unit._displayWidth || 0) / 2 + dir * (unit.def.muzzleOffsetX || 60);
  for (let i = 0; i < durations.length; i++){
    btimeout(() => {
      if (!battle) return;
      const frameNum = (i % 3) + 1; // 3枚を繰り返して使う
      // 元の絵は左から噴き出る向き。右向き(dir>0)はそのまま、左向き(dir<0)は反転させる
      const el = spawnFx(keyedFxSrc(IMG_FX_COMMON2 + "fx_burn_" + frameNum + ".png", FX_KEY_DEFAULT), muzzleX, {
        height: 90, bottom: (unit.baseB || 74) - 10, lifespan: durations[i] + 80, flip: dir < 0
      });
      // 中央寄せ(-50%)は、反転(scaleX)より先に効かせないと、反転時にずれる向きが逆になる
      if (el) el.style.transform = "translateX(" + muzzleX + "px) translateX(-50%)" + (dir < 0 ? " scaleX(-1)" : "");
    }, i * 200);
  }
}

/* ---------- 指揮官：斬道の衝撃波(貫通)と、角笛(全軍バフ) ---------- */
// 斬撃の瞬間、前方へ走り抜ける斬道の衝撃波を1本発生させる。途中の敵を貫通して、それぞれに1回だけ当たる
function spawnSlashWave(unit, mult){
  if (!battle) return;
  const def = unit.def;
  const dir = unit.facing === 1 ? 1 : -1;
  battle.slashWaves = battle.slashWaves || [];
  battle.slashWaves.push({
    x: unit.x + (unit._displayWidth || 0) / 2, lane: unit.lane, dir, side: unit.side,
    speed: def.slashWaveSpeed || 900, damage: (def.slashWaveDamage || def.atk || 0) * (mult || 1),
    maxDist: def.slashWaveRange || 400, traveled: 0, hitSet: new Set(),
    visFrame: 0, visTimer: 0, el: null
  });
}
function updateSlashWaves(dtMs){
  if (!battle || !battle.slashWaves || !battle.slashWaves.length) return;
  const done = battle.slashWaves.filter(w => w.traveled >= w.maxDist);
  done.forEach(w => { if (w.el) w.el.remove(); });
  battle.slashWaves = battle.slashWaves.filter(w => w.traveled < w.maxDist);
  battle.slashWaves.forEach(w => {
    const prevX = w.x;
    const dx = w.dir * w.speed * (dtMs / 1000);
    w.x += dx;
    w.traveled += Math.abs(dx);
    const attacker = { def: { attackFlags: { bypassGuard: true } }, side: w.side }; // 波ごとに作る(使い回すと、あとで側が食い違うおそれがある)。範囲攻撃のため盾のガードを無効化する
    // 今回動いた区間全体と、相手の体の幅を比べる(速い衝撃波が、細い当たり判定をすり抜けて貫通し損ねないように)
    const segMin = Math.min(prevX, w.x) - 20, segMax = Math.max(prevX, w.x) + 20;
    battle.units.forEach(u => {
      if (u.dead || u.side === w.side || u.mounted || u.perch || w.hitSet.has(u)) return;
      if (!lanesOverlap(u.laneLo, u.laneHi, w.lane, w.lane)) return;
      const uw = bodyWidth(u);
      if (u.x + uw < segMin || u.x > segMax) return;
      applyDamageToUnit(u, w.damage, attacker);
      w.hitSet.add(u);
    });
    // 見た目：斬道そのものを、進んだ位置に重ねて表示する(黒背景は透過処理して使う)
    const field = document.getElementById("battlefield");
    if (field){
      if (!w.el){
        w.el = document.createElement("img");
        w.el.className = "fx-sprite";
        w.el.style.height = "70px";
        field.appendChild(w.el);
      }
      w.visTimer -= dtMs;
      if (w.visTimer <= 0){
        w.visTimer += 120;
        w.visFrame = (w.visFrame + 1) % 3;
      }
      w.el.src = keyedFxSrc(IMG_FX_COMMON2 + "slash_wave_" + (w.visFrame + 1) + ".png", FX_KEY_DEFAULT);
      w.el.style.bottom = (laneFloor(w.lane) + 10) + "px";
      w.el.style.transform = "translateX(" + w.x + "px) translateX(-50%)" + (w.dir > 0 ? " scaleX(-1)" : "");
    }
  });
}
// 角笛：出撃後しばらくしてから、あるいは前回から一定時間ごとに、自動で吹き鳴らす
function updateCommanderHorn(unit, dtMs){
  if (unit.dead || !unit.def.hornAbility || unit.hornState) return;
  if (unit.hornCooldown == null) return; // 出現した瞬間にすでに一度吹いているはずなので、まだの場合は何もしない
  unit.hornCooldown -= dtMs;
  if (unit.hornCooldown > 0) return;
  if (unit.motion !== "walk" && unit.motion !== "idle") return; // 戦闘・怯み等の最中は、区切りの良いタイミングまで待つ
  startCommanderHorn(unit);
}
function startCommanderHorn(unit){
  unit.hornState = "using";
  applyHornBuff(unit);
  setMotion(unit, "cmd", {
    onEnd: () => {
      unit.hornState = null;
      unit.hornCooldown = unit.def.hornCooldownMs || 60000;
      if (!unit.dead){
        const fallback = unit.def.frameCounts.walk ? "walk" : (unit.def.approachMotion || "walk");
        setMotion(unit, fallback, { loop:true });
      }
    }
  });
  playHornWindFx(unit); // motionを"cmd"にしてから呼ぶ(先に呼ぶと、まだ"cmd"でないため1回も発動しない)
}
// その瞬間ステージにいる味方全員に、スーパーアーマーと被ダメージ大幅軽減を付与する(50秒)
function applyHornBuff(unit){
  if (!battle) return;
  const until = battle.time + (unit.def.hornBuffDurationS || 50);
  battle.units.forEach(u => {
    if (u.dead || u.side !== unit.side) return;
    u.hornBuffUntil = Math.max(u.hornBuffUntil || 0, until);
    u.hornDamageCutMult = unit.def.hornDamageCutMult != null ? unit.def.hornDamageCutMult : 0.5;
  });
}
// 角笛のコマの間、左右に鏡写しで風(砂煙)のエフェクトをループ表示する
function playHornWindFx(unit){
  const totalMs = (unit.def.frameDurations.cmd || []).reduce((a, b) => a + b, 0) || 2800;
  let elapsed = 0, frame = 0;
  const step = () => {
    if (unit.dead || unit.motion !== "cmd") return;
    const cx = unit.x + (unit._displayWidth || 0) / 2;
    const bottom = (unit.baseB || 74) - 10;
    [-1, 1].forEach(side => {
      const el = spawnFx(keyedFxSrc(IMG_FX_COMMON2 + "cmd_wind_" + (frame + 1) + ".png", FX_KEY_DEFAULT), cx, {
        height: 110, bottom, lifespan: 260, flip: side > 0
      });
      if (el) el.style.transform = "translateX(" + (cx + side * 70) + "px) translateX(-50%)" + (side > 0 ? " scaleX(-1)" : "");
    });
    frame = (frame + 1) % 3;
    elapsed += 220;
    if (elapsed < totalMs) btimeout(step, 220);
  };
  step();
}

/* ---------- 火槍手(焼却兵)とガス缶：地面に広がる炎、ガス缶の誘爆 ---------- */
// 炎の帯(地面に広がる炎)を1つ登録する。側(side)と反対側の陣営にだけ、継続ダメージを与える
function addFireZone(z){
  battle.fireZones = battle.fireZones || [];
  battle.fireZones.push(Object.assign({ nextTick: 0, tickMs: 500 }, z));
}
// 毎ティック、炎の帯の成長・継続ダメージ・ガス缶の巻き込みを処理する(battleStepから1回だけ呼ぶ)
function updateFireZones(dtMs){
  if (!battle || !battle.fireZones || !battle.fireZones.length) return;
  const field = document.getElementById("battlefield");
  const fw = field ? field.clientWidth : STAGE_W;
  const expired = battle.fireZones.filter(z => z.expiresAt != null && battle.time >= z.expiresAt);
  expired.forEach(removeFireZoneVisual);
  battle.fireZones = battle.fireZones.filter(z => z.expiresAt == null || battle.time < z.expiresAt);
  battle.fireZones.forEach(z => {
    if (z.growing){
      const grow = (z.growSpeed || 150) * (dtMs / 1000);
      z.xMin = Math.max(CASTLE_APPROACH_GAP, z.xMin - grow);
      z.xMax = Math.min(fw - CASTLE_APPROACH_GAP, z.xMax + grow);
    }
    updateFireZoneVisual(z, dtMs);
    // 火槍手・ガス缶の炎に触れた罠は、起動前・起動後を問わず消え去る(発動して拘束中の罠は対象外)
    if (battle.traps && battle.traps.length){
      battle.traps.forEach(trap => {
        if (trap.removed || trap.state === "triggering" || trap.state === "holding") return;
        if (!lanesOverlap(trap.lane, trap.lane, z.lane, z.lane)) return;
        if (trap.x < z.xMin || trap.x > z.xMax) return;
        trap.removed = true;
        trap.el.remove();
      });
    }
    z.nextTick -= dtMs;
    if (z.nextTick > 0) return;
    z.nextTick += z.tickMs;
    const fireAttacker = { def: { attackFlags: { fire: true } }, side: z.side, homeAtk: z.homeAtk || 1 };
    battle.units.forEach(u => {
      if (u.dead || u.mounted || u.perch) return;
      if (!lanesOverlap(u.laneLo, u.laneHi, z.lane, z.lane)) return;
      const ucx = u.x + bodyWidth(u) / 2;
      if (ucx < z.xMin || ucx > z.xMax) return;
      if (u.def.ignitesInstantly){ explodeGasCan(u, fireAttacker); return; } // 火はどちら側のガス缶でも、敵味方に関係なく誘爆させる
      if (u.side === z.side) return; // 火元と同じ陣営の、生きているキャラには効かない
      const zDps = z.dps != null ? z.dps : 12; // 明示的に0(見た目だけの炎)の場合を、未指定と区別する
      applyDamageToUnit(u, zDps * (z.tickMs / 1000), fireAttacker);
      if (zDps > 0) addBurnBuildup(u, 5, fireAttacker); // 地面に広がる炎は、1ヒットにつき状態異常「炎上」を+5%
    });
    applyFireDamageToCastle((z.xMin + z.xMax) / 2, (z.xMax - z.xMin) / 2, z.side, (z.dps != null ? z.dps : 12) * (z.tickMs / 1000));
  });
}
// 火槍手：噴射攻撃(攻撃モーション中の合図フレームで呼ばれる)。自分のマスを含めず、前方3マスを焼き払う
function startIncendiaryAttack(unit){
  const def = unit.def;
  playIncendiaryBurst(unit);
  const dir = unit.facing === 1 ? 1 : -1;
  const fireAttacker = { def: { attackFlags: { fire: true } }, side: unit.side, homeAtk: unit.homeAtk || 1 };
  // 攻撃の火炎そのもの(自分のマスから攻撃範囲まで)にも、その場で即座にダメージがある
  const burstMin = Math.min(unit.x, unit.x + dir * (def.attackRange || 0));
  const burstMax = Math.max(unit.x, unit.x + dir * (def.attackRange || 0));
  battle.units.forEach(u => {
    if (u.dead || u.side === unit.side || u.mounted || u.perch) return;
    if (!lanesOverlap(u.laneLo, u.laneHi, unit.lane, unit.lane)) return;
    const ucx = u.x + bodyWidth(u) / 2;
    if (ucx < burstMin || ucx > burstMax) return;
    if (u.def.ignitesInstantly){ explodeGasCan(u, fireAttacker); return; }
    applyDamageToUnit(u, def.burstDamage || 20, fireAttacker);
    addBurnBuildup(u, 25, fireAttacker); // 攻撃の火炎そのものは、状態異常「炎上」の蓄積+25%
  });
  applyFireDamageToCastle(unit.x, def.attackRange || 0, unit.side, def.burstDamage || 20);
  // その範囲にも、地面に広がる炎の見た目を出す(ダメージは上のburstMin〜burstMaxで既に与えているので、見た目のみ)
  addFireZone({
    lane: unit.lane, xMin: burstMin, xMax: burstMax, side: unit.side,
    dps: 0, growing: false, tickMs: 99999, expiresAt: battle.time + 1.0, homeAtk: unit.homeAtk
  });
  // そこからさらに前方3マス(自分のマスは含まない)には、しばらく燃え続ける炎を残す
  const from = unit.x + dir * GRID_CELL * 0.5;   // 自分のマスのすぐ先から
  const to = from + dir * GRID_CELL * 3;         // 前方3マスぶん
  addFireZone({
    lane: unit.lane, xMin: Math.min(from, to), xMax: Math.max(from, to), side: unit.side,
    dps: def.fireZoneDps || 12, growing: false, tickMs: 500,
    expiresAt: battle.time + (def.fireZoneDurationS || 6), homeAtk: unit.homeAtk
  });
}
// ガス缶の誘爆：火炎属性の一撃(体力に関係なく即座)か、通常のダメージでHPが尽きたときに呼ばれる
function explodeGasCan(can, igniter){
  if (can.exploding || can.dead) return;
  can.exploding = true;
  can.explosionSide = (igniter && igniter.side) || (can.lastAttacker && can.lastAttacker.side) || "enemy";
  playGasCanStage(can, 0);
}
const GASCAN_STAGES = ["burning", "exploding", "engulfed", "smoke"];
function playGasCanStage(can, i){
  const stage = GASCAN_STAGES[i];
  // 爆発の演出は、平常時の缶より横に大きい絵になるので、もとの中心位置を保ったまま表示されるよう置き直す
  const centerX = can.x + (can._displayWidth || can.def.structureDisplayWidth || 0) / 2;
  const forced = can.def.motionForcedSize && can.def.motionForcedSize[stage];
  if (forced) can.x = centerX - forced.width / 2;
  setMotion(can, stage, {
    onEnd: () => {
      if (stage === "exploding") doGasCanBlast(can); // 爆発の瞬間に、ダメージと延焼を発生させる
      if (i + 1 < GASCAN_STAGES.length) playGasCanStage(can, i + 1);
      else { can.dead = true; removeUnit(can); }
    }
  });
}
function doGasCanBlast(can){
  const def = can.def;
  const side = can.explosionSide || "enemy";
  const targetSide = side === "player" ? "enemy" : "player";
  const centerLane = can.lane;
  const lanes = [];
  for (let l = centerLane - 2; l <= centerLane + 2; l++) if (l >= 0 && l < GRID_LANES) lanes.push(l);
  const cx = can.x + bodyWidth(can) / 2;
  const blastRadius = def.blastRadius || 200; // 爆発そのものの、即時ダメージが届く範囲(仮)
  const blastHome = (side === can.side && can.homeAtk) ? can.homeAtk : 1;          // 自軍のガス缶が、敵に爆発したときだけ、据えた兵の攻撃力が乗る
  const attacker = { def: { attackFlags: { fire: true } }, side, homeAtk: blastHome };
  battle.units.forEach(u => {
    if (u.dead || u.side !== targetSide || u.mounted) return;
    if (!lanes.includes(u.lane)) return;
    const ucx = u.x + bodyWidth(u) / 2;
    if (Math.abs(ucx - cx) > blastRadius) return;
    applyDamageToUnit(u, def.blastDamage || 60, attacker);
    addBurnBuildup(u, 35, attacker); // 爆発そのものは、状態異常「炎上」の蓄積+35%
  });
  applyFireDamageToCastle(cx, blastRadius, side, def.blastDamage || 60);
  // 爆発の範囲(5戦列)にも、地面に広がる炎の見た目を出す(ダメージは上で既に与えているので、見た目のみ)
  lanes.forEach(l => addFireZone({
    lane: l, xMin: cx - blastRadius, xMax: cx + blastRadius, side,
    dps: 0, growing: false, tickMs: 99999, expiresAt: battle.time + 1.2, homeAtk: blastHome
  }));
  // 同時に、爆発した場所から、ガス缶があった戦列1つぶんの、端から端まで広がる炎を残す(20秒)
  addFireZone({
    lane: centerLane, xMin: cx - 4, xMax: cx + 4, side,
    dps: def.fireZoneDps || 12, growing: true, growSpeed: def.fireGrowSpeed || 150, tickMs: 500,
    expiresAt: battle.time + (def.fireZoneDurationS || 20), homeAtk: blastHome
  });
}
// 炎の範囲(x方向)が、城の立つ場所まで届いていれば、城にもダメージを与える
function applyFireDamageToCastle(cx, radius, side, amount){
  const field = document.getElementById("battlefield");
  const fw = field ? field.clientWidth : STAGE_W;
  const targetSide = side === "player" ? "enemy" : "player";
  const attacker = { def: {}, side };
  if (targetSide === "enemy" && Math.abs(cx - 90) <= radius && battle && !battle.ended){
    battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - amount * getCastleDamageMult(attacker));
    updateCastleBars();
    if (battle.enemyCastleHp <= 0) endBattle(true);
  }
  if (targetSide === "player" && Math.abs(cx - (fw - 90)) <= radius && battle && !battle.ended){
    battle.playerCastleHp = Math.max(0, battle.playerCastleHp - amount * getCastleDamageMult(attacker));
    updateCastleBars();
    if (battle.playerCastleHp <= 0) endBattle(false);
  }
}

function updateChariotAI(unit, dtMs){
  if (unit.dead) return;
  const def = unit.def;
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : STAGE_W;
  const homeDir = unit.side === "player" ? -1 : 1;   // 自陣から敵城へ向かう方向
  const wu = def.hitboxWidth || 0;
  // 城そのものにも当たり判定があり(CASTLE_APPROACH_GAP)、実際に進める限界はそこで決まる。
  // 「敵城の一マス手前」「自城の前まで戻る」は、その限界を基準に計算する
  const enemyGateX = unit.side === "player" ? (CASTLE_APPROACH_GAP + GRID_CELL) : (fieldWidth - CASTLE_APPROACH_GAP - wu - GRID_CELL);
  const homeGateX = unit.side === "player" ? (fieldWidth - CASTLE_APPROACH_GAP - wu) : CASTLE_APPROACH_GAP;

  if (unit.chariotPhase === "advance1"){
    if (unit.chariotAdvanceTarget == null) unit.chariotAdvanceTarget = unit.x + homeDir * GRID_CELL;
    const dx = unit.chariotAdvanceTarget - unit.x;
    if (Math.abs(dx) <= 2){
      unit.chariotPhase = "charging";
      setMotion(unit, "attack", { loop:true }); // 轢き攻撃(往路)のループへ
      return;
    }
    unit.x += moveWithCollision(unit, Math.sign(dx) * getEffectiveSpeed(unit, def.walkSpeed) * (dtMs / 1000));
    applyFrame(unit);
    return;
  }

  if (unit.chariotPhase === "charging" || unit.chariotPhase === "returning"){
    const dir = unit.chariotPhase === "charging" ? homeDir : -homeDir;
    unit.facing = dir;
    if (unit.chariotPhase === "charging"){
      // 轢き攻撃：進路上の敵と鉢合わせたら、重さを比べる。勝てば吹き飛ばして轢き潰し、負ければ自分が壊れる
      const hitRadius = def.trampleHitRadius || 60;
      const enemySide = unit.side === "player" ? "enemy" : "player";
      const victim = battle.units.find(o =>
        !o.dead && !o.mounted && o.side === enemySide && !o.def.invulnerable &&
        lanesOverlap(unit.laneLo, unit.laneHi, o.laneLo, o.laneHi) &&
        Math.sign(o.x - unit.x) === dir && edgeDistance(unit, o) <= hitRadius
      );
      if (victim){
        if ((victim.def.weight || 0) > (def.weight || 0)){
          unit.hp = 0;
          killUnit(unit); // 体重で負けた：チャリオットごと破壊される
          return;
        }
        applyDamageToUnit(victim, getEffectiveAtk(unit), unit);
        if (!victim.dead) launchUnit(victim, unit, { upSpeed: 300, knockback: true }); // 轢き攻撃は吹き飛ばし効果を持つ
      }
    }
    unit.x += moveWithCollision(unit, dir * getEffectiveSpeed(unit, def.walkSpeed) * (dtMs / 1000));
    applyFrame(unit);

    if (unit.chariotPhase === "charging" && (unit.side === "player" ? unit.x <= enemyGateX : unit.x >= enemyGateX)){
      dropoffChariotRiders(unit);
      unit.chariotPhase = "returning";
      setMotion(unit, "walk", { loop:true }); // 復路は、素早くただ戻るだけ(轢きはしない)
      return;
    }
    if (unit.chariotPhase === "returning" && (unit.side === "player" ? unit.x >= homeGateX : unit.x <= homeGateX)){
      boardChariotRiders(unit);
      unit.chariotPhase = "advance1";
      unit.chariotAdvanceTarget = null;
      unit.facing = homeDir;
      setMotion(unit, "walk", { loop:true });
      return;
    }
    return;
  }
}

// 打ち上げ・吹き飛ばしは宙に浮かず、大きくよろめいて後退する
function startStagger(target, attacker){
  if (target.dead || target.transforming || !target.def.frameCounts.blowback) return;
  const awayDir = attacker ? (Math.sign(target.x - attacker.x) || 1) : 1;
  target.staggerVX = awayDir * (target.def.staggerSlideSpeed || 20);
  setMotion(target, "blowback", { onEnd: () => { target.staggerVX = 0; afterReaction(target); } });
}

// 踏み潰し：前方の一定距離以内にいる敵全員にダメージ(砂煙つき)
function resolveAreaHit(unit){
  const def = unit.def;
  const enemySide = unit.side === "player" ? "enemy" : "player";
  const forwardDir = unit.side === "player" ? -1 : 1;
  const centerX = unit.x + (def.hitboxWidth || 0) / 2;
  if (def.fxStompDust) spawnStompDust(unit);
  const dmg = getEffectiveAtk(unit);
  let hits = battle.units.filter(o =>
    !o.dead && !o.mounted && !o.elevated && !o.def.invulnerable && o.side === enemySide && canReachLane(unit, o) &&
    Math.sign(o.x - centerX) === forwardDir &&
    edgeDistance(unit, o) <= def.areaHitReach
  );
  if (def.hitOnePerLane){ // 群れ全滅ではなく、レーンごとに最も近い敵1体だけを狙う(狼筅手など)
    const nearestByLane = {};
    hits.forEach(o => {
      const cur = nearestByLane[o.lane];
      if (!cur || edgeDistance(unit, o) < edgeDistance(unit, cur)) nearestByLane[o.lane] = o;
    });
    hits = Object.values(nearestByLane);
  }
  hits.forEach(o => applyDamageToUnit(o, dmg, unit));
  if (def.pullToOwnLane) pullToOwnLane(unit, hits);
}
// 狼筅の薙ぎ払い：当たった敵のうち、上の戦列の敵1体と下の戦列の敵1体(それぞれ、いちばん近い敵)を、自分の戦列へ引き寄せ、絡めて動けなくする。
// 目の前の戦列の敵は、動かさない。巨体(2戦列以上)・常時スーパーアーマー・乗っている敵・拘束中の敵などは引き寄せられない
function canBePulled(attacker, o){
  const d = o.def;
  if (o.dead || o.launched || o.restrained || o.mounted || o.bearerOf || o.laneTween) return false;
  if ((d.laneSpan || 1) >= 2 || d.alwaysSuperArmored || d.immobile || d.gateUnit) return false;
  if (d.laneStep && Math.abs(attacker.lane - o.homeLane) > 1) return false; // 出現した戦列から離れすぎる魔獣は動かさない
  return true;
}
function pullToOwnLane(attacker, hits){
  [1, -1].forEach(dl => { // dl=1：上の戦列 / -1：下の戦列
    const cand = hits.filter(o => o.lane === attacker.lane + dl && canBePulled(attacker, o));
    if (!cand.length) return;
    cand.sort((a, b) => edgeDistance(attacker, a) - edgeDistance(attacker, b));
    const t = cand[0];
    if (shiftUnitLane(t, -dl)) entangleUnit(t, attacker.def.entangleMs || 2000);
  });
}
// 絡めて動けなくする(拘束と同じ状態。時間が来ると、自然にほどける)。罠の網と違い、姿は隠さない
function entangleUnit(target, ms){
  if (!target || target.dead) return;
  target.restrained = true;
  target.restrainRemainingMs = ms;
  target.target = null;
  if (target.def.frameCounts.idle) setMotion(target, "idle", { loop:true });
}

// 踏み潰しの砂煙：踏んだ足(体の前端付近)の地面に、5コマを順番に重ねる
function spawnStompDust(unit){
  const fx = unit.def.fxStompDust;
  const W = unit._displayWidth || 240;
  const fe = unit.facing === 1 ? fx.frontFrac : 1 - fx.frontFrac;
  const cx = unit.x + fe * W;
  let delay = 0;
  for (let i = 0; i < fx.count; i++){
    const dur = fx.durations[i] || 200;
    btimeout(() => {
      if (!battle) return;
      const el = spawnFx(fx.imageBase + fx.prefix + (i + 1) + ".png", cx, { height: fx.height, bottom: unit.baseB || 74, lifespan: dur });
      if (el) el.style.transform = "translateX(" + cx + "px) translateX(-50%)";
    }, delay);
    delay += dur;
  }
}

function setMotion(unit, motion, opts){
  opts = opts || {};
  // 詠唱(シールド・メテオ)の途中で別のモーションに切り替わった=中断された。詠唱に紐づく効果はキャンセルする
  if (unit.casting && motion !== unit.casting){
    unit.casting = null;
    unit.castId = (unit.castId || 0) + 1;
  }
  unit.motion = motion;
  unit.frameIndex = 0;
  unit.frameTimer = 0;
  unit.motionLoop = !!opts.loop;
  unit.onMotionEnd = opts.onEnd || null;
  unit.fireAttackFired = false; // 火槍手：長く保持するコマの間、同じ発動を繰り返さないための目印をリセット
  applyFrame(unit);
  if (motion === "discover"){
    showAlertMark(unit);
  }
}

// 発見モーションに入った瞬間、頭上に共通の「！」マークを表示する
function showAlertMark(unit){
  const fx = FX_ALERT_MARK;
  if (!fx) return;
  const headBottom = (unit.baseB || 74) + (unit.img.offsetHeight || 90) + 6; // ユニットの頭の少し上
  for (let i = 0; i < fx.count; i++){
    btimeout(() => {
      if (unit.dead) return;
      spawnFx(fx.imageBase + fx.prefix + (i+1) + ".png", unit.x, { height: 34, bottom: headBottom, lifespan: fx.durations[i] });
    }, i * (fx.durations[i] || 120));
  }
}

function applyFrame(unit){
  const def = unit.def;
  const count = def.frameCounts[unit.motion] || 1;
  const idx1 = Math.min(unit.frameIndex + 1, count);
  unit.img.dataset.motion = unit.motion; // 読み込み完了時にモーション別の縮尺補正を参照するため
  const rawSrc = frameUrl(def, unit.motion, idx1);
  // 黒背景のまま渡された炎などの演出コマ(ガス缶の爆発など)は、ここでコード側の透過処理を通す
  unit.img.src = (def.chromaKeyMotions && def.chromaKeyMotions.includes(unit.motion))
    ? keyedFxSrc(rawSrc, def.chromaKeyOpts || FX_KEY_DEFAULT) : rawSrc;

  const overrides = def.frameFacingOverride && def.frameFacingOverride[unit.motion];
  const correction = overrides ? (overrides[unit.frameIndex] ?? 1) : 1;
  const finalScale = unit.facing * correction;

  const launchOffset = unit.launched ? Math.round(unit.launchY) : 0;
  const rideOffset = Math.round(unit.rideY || 0); // フォートレスの背中に乗っている間の高さ
  unit.el.style.transform = "translateX(" + unit.x + "px) translateY(" + (-(launchOffset + rideOffset)) + "px) scaleX(" + finalScale + ")";
  unit.uhpFill.style.width = Math.max(0, unit.hp / unit.hpMax * 100) + "%";
}

function advanceUnit(unit, dtMs){
  if (unit.charging) return; // 猛突進中はupdateChargeが移動・フレーム送りを一括管理する
  const def = unit.def;

  // 攻撃モーション中、その場で殴らず前方へ踏み込みながら攻撃するキャラ用(犬など)
  const lungeMotionName = def.attackMotionName || "attack";
  if (def.attackLungeDistance && unit.motion === lungeMotionName){
    const lungeDurations = def.frameDurations[lungeMotionName] || [1000];
    const lungeTotalMs = lungeDurations.reduce((a, b) => a + b, 0) || 1;
    const forwardDir = unit.side === "player" ? -1 : 1;
    unit.x += moveWithCollision(unit, forwardDir * (def.attackLungeDistance / lungeTotalMs) * dtMs); // 踏み込みも、敵の体にはめり込まない
  }

  // よろめき後退(フォートレス)：吹き飛びモーション中、ゆっくり後ろへ下がる
  if (unit.staggerVX && unit.motion === "blowback"){
    const fieldEl = document.getElementById("battlefield");
    const fw = fieldEl ? fieldEl.clientWidth : 800;
    unit.x = Math.max(30, Math.min(fw - 30 - (def.hitboxWidth || 0), unit.x + unit.staggerVX * (dtMs / 1000)));
    applyFrame(unit);
  }

  // 中距離技(ゴブリン長)：モーション中は前進・後退しながら動く
  if (def.midrange && unit.motion === (def.midrange.motion || "midrange")){
    applyMidrangeMove(unit, dtMs);
  }

  const durations = def.frameDurations[unit.motion] || [1000];
  const count = def.frameCounts[unit.motion] || durations.length;

  unit.frameTimer += dtMs;
  const curDur = durations[Math.min(unit.frameIndex, durations.length-1)];
  if (unit.frameTimer >= curDur){
    unit.frameTimer -= curDur;
    unit.frameIndex++;
    if (unit.frameIndex >= count){
      if (unit.motionLoop){
        unit.frameIndex = 0;
      } else {
        unit.frameIndex = count - 1;
        if (unit.onMotionEnd){
          const cb = unit.onMotionEnd;
          unit.onMotionEnd = null;
          cb(unit); // コールバックの中でsetMotionする場合、そちらが既に描画済みなので、二重に描画しない(連続してsrcを差し替えると、稀に読み込みが失敗することがあった)
        } else {
          applyFrame(unit);
        }
        return;
      }
    }
    const attackMotionName = def.attackMotionName || "attack";
    // 多段攻撃(ゴブリン長の7連撃など)は attackImpactFrames に命中コマを配列で指定する
    const isImpactFrame = def.attackImpactFrames
      ? def.attackImpactFrames.includes(unit.frameIndex)
      : unit.frameIndex === def.attackImpactFrame;
    if (unit.motion === attackMotionName && isImpactFrame){
      if (def.castFx){
        startCasterFx(unit);                                              // 呪術師：陣・輪を呼ぶ
      } else if (def.ranged){
        fireProjectile(unit);
      } else {
        resolveAttackImpact(unit);
      }
    }
    if (def.midrange && unit.motion === (def.midrange.motion || "midrange")){
      (def.midrange.hits || []).forEach(h => {
        if (h.frame === unit.frameIndex) resolveMidrangeHit(unit, h);
      });
    }
    if (def.comboRole === "queen") onQueenFrame(unit);
    if (def.comboRole === "king") onKingFrame(unit);
    applyFrame(unit);
  }
}

function spawnFx(imgSrc, x, opts){
  opts = opts || {};
  const field = document.getElementById("battlefield");
  if (!field) return null;
  const el = document.createElement("img");
  el.src = imgSrc;
  el.className = "fx-sprite";
  el.style.height = (opts.height || 30) + "px";
  el.style.bottom = (opts.bottom != null ? opts.bottom : 110) + "px";
  el.style.transform = "translateX(" + x + "px)" + (opts.flip ? " scaleX(-1)" : "");
  field.appendChild(el);
  if (opts.lifespan){
    btimeout(() => el.remove(), opts.lifespan);
  }
  return el;
}

function fireProjectile(unit){
  if (!battle || battle.ended) return;
  const def = unit.def;
  const dir = unit.facing === -1 ? -1 : 1; // 発射方向(左向きユニットなら左へ)
  const capturedTarget = unit.target; // 発射時点の狙い。飛翔中に相手が死ねば外れ扱いにする

  // 銃口(発射位置)の位置(体の中心から前方・やや高めにオフセット)
  const muzzleX = unit.x + dir * (def.muzzleOffsetX || 0);
  // 発射位置・着弾位置の高さは、撃つ側と狙う側それぞれのレーンの足元を基準にする
  const muzzleOff = (def.muzzleOffsetBottom != null ? def.muzzleOffsetBottom : 110) - 74;
  const shooterBase = unit.baseB || 74;
  const targetBase = capturedTarget ? (capturedTarget.baseB || 74) + (capturedTarget.perch ? (capturedTarget.rideY || 0) : 0) : shooterBase; // 台の上の相手は、その高さへ
  const groundMuzzleBottom = targetBase + muzzleOff;
  // フォートレスの背中から撃つときは、デッキの高さから発射する(矢は地上の相手へ向かって降下する)
  // 弾の大きさ：背中に乗っているゴブリンは小さく描かれているので、矢もそれに合わせて小さくする
  const projScale = (unit.mounted ? (unit.scaleMult || 1) * 0.7 : 1) * (def.projectileScale || 1);
  const muzzleBottom = unit.mounted ? shooterBase + (unit.rideY || 0) + muzzleOff * (unit.scaleMult || 1)
    : shooterBase + (unit.perch ? (unit.rideY || 0) : 0) + muzzleOff; // 望楼台の上からは、台の高さから撃ち下ろす

  if (def.fxMuzzleFlash){
    spawnFx(def.imageBase + def.fxMuzzleFlash, muzzleX, { flip: dir < 0, lifespan: 150, height: Math.round(39 * projScale), bottom: muzzleBottom });
  }

  // 命中先の座標を決める(相手ユニット、いなければ城)
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : 800;
  const targetX = capturedTarget ? capturedTarget.x : (unit.side === "player" ? 30 : fieldWidth - 30);
  const distance = Math.abs(targetX - muzzleX);
  const speed = def.projectileSpeed || 1200;
  const travelMs = Math.max(40, (distance / speed) * 1000);

  let bullet = null;
  if (def.fxBullet){
    bullet = spawnFx(def.imageBase + def.fxBullet, muzzleX, { flip: dir < 0, height: Math.max(4, Math.round((def.projectileArc ? 34 : 10) * projScale)), bottom: muzzleBottom });

    if (def.projectileArc){
      // 放物線：JSで毎フレーム位置を更新(横方向は等速、縦方向はsinカーブで山なりに)
      const arcHeight = def.projectileArcHeight || 120;
      const startTime = performance.now();
      const step = (now) => {
        if (!bullet || !bullet.isConnected) return;
        const t = Math.min(1, (now - startTime) / travelMs);
        const x = muzzleX + (targetX - muzzleX) * t;
        const y = Math.sin(t * Math.PI) * arcHeight; // 0→最大→0の山なり
        bullet.style.transform = "translateX(" + x + "px)" + (dir < 0 ? " scaleX(-1)" : "") + " rotate(" + (t*360*2) + "deg)";
        bullet.style.bottom = (muzzleBottom + (groundMuzzleBottom - muzzleBottom) * t + y) + "px";
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    } else {
      // 直線：CSS transitionでそのまま移動
      bullet.style.transition = "transform " + travelMs + "ms linear" + (muzzleBottom !== groundMuzzleBottom ? ", bottom " + travelMs + "ms linear" : "");
      requestAnimationFrame(() => {
        bullet.style.transform = "translateX(" + targetX + "px)" + (dir < 0 ? " scaleX(-1)" : "");
        if (muzzleBottom !== groundMuzzleBottom) bullet.style.bottom = groundMuzzleBottom + "px";
      });
    }
  }

  btimeout(() => {
    if (bullet) bullet.remove();
    if (!battle || battle.ended || unit.dead) return;

    if (def.fxImpact){
      // 着弾エフェクト。背景が暗い灰色の画像(投石器の岩)は、背景を透過に変換して重ねる
      const impactUrl = def.imageBase + def.fxImpact;
      const impactEl = spawnFx(def.fxImpactKey ? keyedFxSrc(impactUrl, FX_KEY_IMPACT) : impactUrl, targetX, { lifespan: 350, height: def.splashRadius ? 90 : 45, bottom: def.fxImpactKey ? targetBase - 6 : groundMuzzleBottom });
      if (def.fxImpactKey && impactEl){
        impactEl.style.mixBlendMode = "normal";
        // 着弾した相手の体の中心の、地面の位置に合わせる
        const cx = capturedTarget ? capturedTarget.x + (capturedTarget._displayWidth || 0) / 2 : targetX;
        impactEl.style.transform = "translateX(" + cx + "px) translateX(-50%)";
      }
    }

    if (def.splashRadius){
      // 範囲ダメージ：着弾地点周辺の敵ユニットすべてに当たる
      const enemySide = unit.side === "player" ? "enemy" : "player";
      let hitAnyUnit = false;
      // 着弾の範囲は、狙った相手のレーンから splashLaneSpan レーン分(投石器は2レーン)
      const impLane = capturedTarget ? capturedTarget.lane : unit.lane;
      const splashSpan = def.splashLaneSpan || 1;
      const splashLo = Math.min(impLane, GRID_LANES - splashSpan);
      const splashHi = splashLo + splashSpan - 1;
      battle.units.forEach(other => {
        if (other.dead || other.mounted || other.side !== enemySide) return;
        if (!lanesOverlap(splashLo, splashHi, other.laneLo, other.laneHi)) return;
        if (Math.abs(other.x - targetX) <= def.splashRadius){
          hitAnyUnit = true;
          applyDamageToUnit(other, getEffectiveAtk(unit), unit);
        }
      });
      // ユニットが誰もいなければ、着弾地点が城の目の前なら城にも当たる扱いにする
      if (!hitAnyUnit && !capturedTarget){
        if (unit.side === "player"){
          battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
          updateCastleBars();
          if (battle.enemyCastleHp <= 0) endBattle(true);
        } else {
          battle.playerCastleHp = Math.max(0, battle.playerCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
          updateCastleBars();
          if (battle.playerCastleHp <= 0) endBattle(false);
        }
      }
      return;
    }

    if (capturedTarget){
      if (!capturedTarget.dead){
        applyDamageToUnit(capturedTarget, getEffectiveAtk(unit) * attackBonus(unit, capturedTarget, true), unit);
      }
      // 貫通：狙った相手の後ろにいる、同じ戦列の敵1体にも、弾が当たる
      if (def.pierce){
        const away = Math.sign(capturedTarget.x - unit.x) || (unit.side === "player" ? -1 : 1);
        let second = null, secondDist = Infinity;
        battle.units.forEach(o => {
          if (o === capturedTarget || o.dead || o.mounted || o.elevated || o.def.invulnerable || o.side === unit.side) return;
          if (!lanesOverlap(capturedTarget.laneLo, capturedTarget.laneHi, o.laneLo, o.laneHi)) return;
          const d = (o.x - capturedTarget.x) * away;
          if (d <= 0 || d > def.pierce.range) return;
          if (d < secondDist){ second = o; secondDist = d; }
        });
        if (second) applyDamageToUnit(second, getEffectiveAtk(unit) * def.pierce.mult, unit);
      }
      // 狙っていた相手が飛翔中に倒れていた場合は何も起きない(弾は外れた扱い)
      return;
    }

    // 相手ユニットがおらず、城を狙っていた場合
    if (unit.side === "player"){
      battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
      updateCastleBars();
      if (battle.enemyCastleHp <= 0) endBattle(true);
    } else {
      battle.playerCastleHp = Math.max(0, battle.playerCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
      updateCastleBars();
      if (battle.playerCastleHp <= 0) endBattle(false);
    }
  }, travelMs);
}

// バフスタック数に応じて頭上の赤いオーラを表示・更新する(1重=通常, 2重=赤みを強調, 3重=紫寄り)
// 全キャラ共通のエフェクトを使うため、キャラごとの位置調整は不要。
function updateBuffAura(unit, dtMs){
  const fx = BUFF_AURA_FX;
  const stacks = getBuffStacks(unit);

  if (stacks !== unit._lastBuffStacks){
    unit._lastBuffStacks = stacks;
    if (unit.buffFxEl){ unit.buffFxEl.remove(); unit.buffFxEl = null; }
    if (stacks >= 1){
      const img = document.createElement("img");
      img.className = "fx-sprite buff-aura";
      unit.el.appendChild(img); // unit.elの子にする = 本体と同じ座標系・向きを自動で共有
      unit.buffFxEl = img;
      unit.buffFxFrame = 0;
      unit.buffFxTimer = 0;
    }
  }

  if (!unit.buffFxEl) return;

  unit.buffFxTimer += dtMs;
  const dur = fx.durations[unit.buffFxFrame] || 150;
  if (unit.buffFxTimer >= dur){
    unit.buffFxTimer -= dur;
    unit.buffFxFrame = (unit.buffFxFrame + 1) % fx.count;
  }
  unit.buffFxEl.src = fx.imageBase + fx.prefix + (unit.buffFxFrame + 1) + ".png";
  unit.buffFxEl.style.left = "50%";
  unit.buffFxEl.style.top = "0%";
  unit.buffFxEl.style.height = (34 * (unit.scaleMult || 1)) + "px"; // フォートレスの背中で小さく描かれている間はオーラも小さく

  // 1重=そのまま, 2重=赤みを強調, 3重=紫系へ色相シフト
  if (stacks >= 3){
    unit.buffFxEl.style.filter = "hue-rotate(75deg) saturate(1.6) drop-shadow(0 0 4px #b03bff)";
  } else if (stacks === 2){
    unit.buffFxEl.style.filter = "saturate(1.8) drop-shadow(0 0 4px #ff2a2a)";
  } else {
    unit.buffFxEl.style.filter = "";
  }
}

function resolveAttackImpact(unit){
  if (!battle || battle.ended) return;
  if (unit.def.createsFireZone){ // 火槍手：対象を問わず、前方を焼き払う(長く保持するコマの間、二重に発動しない)
    if (unit.fireAttackFired) return;
    unit.fireAttackFired = true;
    startIncendiaryAttack(unit);
    return;
  }
  if (unit.def.createsSlashWave) spawnSlashWave(unit); // 指揮官：斬撃のたび、斬道の衝撃波を前方へ走らせる(通常の命中判定は、このあとに続けて行う)
  // 多段攻撃の途中で対象が倒れた場合、残りの段は空振りにする(城へダメージが流れないように)
  if (unit.def.attackImpactFrames && unit.attackHadTarget && (!unit.target || unit.target.dead)) return;
  if (unit.def.areaHitReach){
    // 範囲攻撃(フォートレスの踏み潰し)：前方の敵全員に当たる。対象がユニットなら城には当たらない
    resolveAreaHit(unit);
    if (unit.attackHadTarget) return;
  } else if (unit.target && !unit.target.dead){
    // 種族ごとの攻撃力ボーナス(槍兵は魔獣・獣に強い)
    applyDamageToUnit(unit.target, getEffectiveAtk(unit) * attackBonus(unit, unit.target, true), unit);
    return;
  }
  const buildingMult = unit.def.bonusVsBuilding || 1; // 破城槌：城そのものへも建物特攻が乗る
  if (unit.side === "player"){
    battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit) * buildingMult);
    updateCastleBars();
    if (battle.enemyCastleHp <= 0) endBattle(true);
  } else {
    battle.playerCastleHp = Math.max(0, battle.playerCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit) * buildingMult);
    updateCastleBars();
    if (battle.playerCastleHp <= 0) endBattle(false);
  }
}

// 特殊技「猛突進」：鼓舞された瞬間に発動。敵か敵城に当たるまで、最終コマ以外をループしながら前進し続ける
function startRageCharge(unit){
  if (unit.dead || unit.charging) return;
  const def = unit.def;
  if (!def.frameCounts || !def.frameCounts.rage_charge) return;
  unit.charging = true;
  unit.chargeHit = false;
  unit.chargeHitTarget = null;
  unit.target = null; // 突進中は通常の索敵ターゲットではなく、衝突判定で処理する
  unit.motion = "rage_charge";
  unit.motionLoop = false; // フレーム送りはここではなくupdateChargeで手動管理する
  unit.onMotionEnd = null;
  unit.frameIndex = 0;
  unit.frameTimer = 0;
  applyFrame(unit);
}

function updateCharge(unit, dtMs){
  if (!unit.charging) return;
  if (unit.dead){ unit.charging = false; return; }
  const def = unit.def;
  const count = def.frameCounts.rage_charge;
  const durations = def.frameDurations.rage_charge || [200];
  const finalIndex = count - 1;

  if (!unit.chargeHit){
    // 前進しながら、最終コマ以外をループ再生する
    const speed = (def.rageChargeSpeed || (def.walkSpeed * 2.5)) * (unit.aura ? unit.aura.speed : 1);          // 突進の速さにも、リーダー効果(移動速度)が乗る
    const forwardDir = unit.side === "player" ? -1 : 1;
    unit.x += forwardDir * speed * (dtMs / 1000);

    unit.frameTimer += dtMs;
    const curDur = durations[Math.min(unit.frameIndex, durations.length - 1)];
    if (unit.frameTimer >= curDur){
      unit.frameTimer -= curDur;
      unit.frameIndex++;
      if (unit.frameIndex >= finalIndex) unit.frameIndex = 0; // 最終コマの手前でループ
      applyFrame(unit);
    }

    // 衝突判定：射程内の敵、または敵城への到達
    const field = document.getElementById("battlefield");
    const fieldWidth = field.clientWidth;
    const enemySide = unit.side === "player" ? "enemy" : "player";
    const hitRadius = def.rageChargeHitRadius || 55;
    const target = battle.units.find(o =>
      !o.dead && !o.mounted && !o.elevated && !o.def.invulnerable && o.side === enemySide && canReachLane(unit, o) && o !== unit.chargePlowedThrough &&
      edgeDistance(unit, o) <= hitRadius
    );
    const castleEdgeX = unit.side === "player" ? 90 : fieldWidth - 90; // キャラが出現する位置まで(それより奥=城の中には入れない)
    const reachedCastle = !target && (unit.side === "player" ? unit.x <= castleEdgeX : unit.x >= castleEdgeX);

    if (reachedCastle){
      // 敵城に到達：そのまま最終コマへ進めて着弾処理する
      unit.chargeHit = true;
      unit.chargeHitTarget = null;
      unit.frameIndex = finalIndex;
      unit.frameTimer = 0;
      applyFrame(unit);
    } else if (target){
      // 吹き飛ばない敵(巨体など)・怯まない敵(スーパーアーマー)は突っ切れないので、その場で最終段の一撃を当てる。
      // それ以外の敵は、体当たりでかち上げながら突っ切り、突進を止めない
      const stopper = target.def.staggerOnLaunch || target.def.alwaysSuperArmored || isSuperArmored(target, unit);
      if (stopper){
        unit.chargeHit = true;
        unit.chargeHitTarget = target;
        unit.frameIndex = finalIndex;
        unit.frameTimer = 0;
        applyFrame(unit);
      } else {
        applyDamageToUnit(target, getEffectiveAtk(unit), unit);
        if (!target.dead) launchUnit(target, unit, { upSpeed: 340 });
        unit.chargePlowedThrough = target; // 同じ相手を同じ突進中に何度も巻き込まないようにする
      }
    }
    return;
  }

  // 最終コマを表示している間：表示時間が経過したら実際のダメージ処理をして通常状態へ復帰する
  unit.frameTimer += dtMs;
  const finalDur = durations[finalIndex] || 300;
  if (unit.frameTimer < finalDur) return;

  if (!battle || battle.ended) return;
  const target = unit.chargeHitTarget;
  const dmg = getEffectiveAtk(unit) * (def.rageChargeFinalMult || 2.5);
  if (target){
    if (!target.dead){
      applyDamageToUnit(target, dmg, unit);
      if (!target.dead){
        launchUnit(target, unit, { upSpeed: 340, knockback: true });
        shiftUnitLane(target, 1); // 最終段だけ、相手を一段上のレーンへ押し上げる(壁なら動かない)
      }
    }
  } else {
    if (unit.side === "player"){
      battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - dmg * castleTakenScale("player"));
      updateCastleBars();
      if (battle.enemyCastleHp <= 0) endBattle(true);
    } else {
      battle.playerCastleHp = Math.max(0, battle.playerCastleHp - dmg * castleTakenScale("enemy"));
      updateCastleBars();
      if (battle.playerCastleHp <= 0) endBattle(false);
    }
  }

  unit.charging = false;
  unit.chargeHit = false;
  unit.chargeHitTarget = null;
  unit.chargePlowedThrough = null;
  if (!unit.dead){
    const fallback = def.frameCounts.walk ? "walk" : (def.approachMotion || "walk");
    setMotion(unit, fallback, { loop: true });
  }
}

// 怯み・弾かれ・吹き飛び・ダウン・ガード関連の反応モーション中は、
// 追加の被弾があっても別の反応モーションに上書きされない(スーパーアーマー)
function isSuperArmored(unit, attacker){
  if (attacker && attacker.def.attackFlags && attacker.def.attackFlags.ignoresSuperArmor) return false; // スーパーアーマー無効の一撃は貫通する
  if (unit.hornBuffUntil && battle && battle.time < unit.hornBuffUntil) return true; // 指揮官の号令：一定時間、全軍スーパーアーマー
  if (unit.chariotPhase === "charging") return true; // チャリオット：轢き攻撃(往路)の最中はスーパーアーマー
  if (unit.def && unit.def.alwaysSuperArmored) return true; // 常時スーパーアーマー(ラッシャーなど)
  if (unit.transforming) return true; // 女王の第二形態への移行中は中断されない
  if (unit.def && unit.def.superArmorMotions && unit.def.superArmorMotions.indexOf(unit.motion) !== -1) return true; // 特定のモーション中だけスーパーアーマー(女王の近接・メテオ詠唱・シールド)
  const attackMotion = (unit.def && unit.def.attackMotionName) || "attack";
  return unit.motion === "flinch" || unit.motion === "guardbreak" ||
         unit.motion === "blowback" || unit.motion === "down" ||
         unit.motion === "guard" || unit.motion === "shieldbreak" ||
         unit.motion === "shield_destroy" ||
         (unit.motion === attackMotion && unit.def && unit.def.superArmorDuringAttack) || // 攻撃モーション中は怯まない専用キャラ
         (unit.motion === attackMotion && unit.attackArmorMs > 0); // ゴブリン長の特殊モーションによる一時的なスーパーアーマー
}

// 攻撃者がtargetの正面にいるか(盾兵のガードは前方からの攻撃にしか効かない)
// 横幅のあるユニット(投石器など)同士の距離を、単なる座標の差ではなく
// 「箱と箱の隙間」で計算する。幅を持たない通常ユニットは従来通りの点同士の距離になる。
/* ---------- 敵同士のぶつかり ---------- */
// 味方は味方をすり抜けられるが、敵の体には通り抜けられずにぶつかる。
// ぶつかり判定に使う体の幅：hitboxWidthがあればそれ、なければ絵の幅から見積もった値
function bodyWidth(u){
  if (u.def.bodyWidth != null) return u.def.bodyWidth;
  if (u.def.hitboxWidth) return u.def.hitboxWidth;
  return u._bodyW || 30;
}
// 横に dx だけ動こうとしたとき、敵の体にぶつからずに動ける量を返す。
// 例外(すり抜けられる)：ラッシャーの猛突進、passThroughEnemiesを持つキャラ、レーン移動中、宙に飛ばされている間
const CASTLE_APPROACH_GAP = 60; // 城門の手前、これより先には誰も進めない(城にも当たり判定を持たせる)
function moveWithCollision(unit, dx){
  if (!dx || !battle) return dx;
  if (unit.def.passThroughEnemies || unit.charging || unit.laneMoving || unit.launched || unit.mounted || unit.perch) return dx;
  const dir = dx > 0 ? 1 : -1;
  const wu = bodyWidth(unit);
  let allowed = Math.abs(dx);
  // 城そのものにも、壁と同じように当たり判定を持たせる。左(dir<0)の先には敵城、右(dir>0)の先には自城がある。
  // これがないと、攻撃中に少しずつ踏み込む仕様の犬などが、城へめり込み続けて画面の外まで進んでしまうことがあった
  {
    const field = document.getElementById("battlefield");
    const fieldWidth = field ? field.clientWidth : STAGE_W;
    const castleAllowed = dir < 0
      ? Math.max(0, unit.x - CASTLE_APPROACH_GAP)
      : Math.max(0, (fieldWidth - CASTLE_APPROACH_GAP) - (unit.x + wu));
    allowed = Math.min(allowed, castleAllowed);
  }
  let structAllowed = Infinity, structHit = null; // 味方の望楼台・壁による足止め
  battle.units.forEach(o => {
    if (o === unit || o.dead || o.mounted || o.launched || o.laneMoving || o.perch) return;
    const ally = o.side === unit.side;
    if (ally && !(o.def.structureUnit && structureBlocksAlly(unit, o))) return; // 味方は、すり抜けられる(望楼台・大きい味方にとっての壁は例外)
    if (!ally && unit.def.ignoresUnits && !o.def.countsAsBuilding && !o.def.structureUnit) return; // 破城槌：建物(扱い)以外の敵は、素通りする
    if (o.def.invulnerable || o.def.passThroughEnemies) return; // 壊せない巨大ゲートなどは、ぶつからない
    if (!lanesOverlap(unit.laneLo, unit.laneHi, o.laneLo, o.laneHi)) return;
    const wo = bodyWidth(o);
    const uc = unit.x + wu / 2, oc = o.x + wo / 2;
    if (dir > 0 ? !(oc > uc) : !(oc < uc)) return; // 進む方向の先にいる相手だけが対象
    const gap = Math.max(0, dir > 0 ? o.x - (unit.x + wu) : unit.x - (o.x + wo));
    allowed = Math.min(allowed, gap);
    if (ally && gap < structAllowed){ structAllowed = gap; structHit = o; }
  });
  if (structHit && structAllowed <= allowed && structAllowed < 0.5) handleTowerBlock(unit, structHit); // 望楼台に着いた：登る、または横へ避ける
  return dir * allowed;
}

// 敵と体が重なってしまったとき(魔獣・ゴブリンのレーン移動、吹き飛びの着地など、原因は問わない)は、手前(自分の後ろ側)へ引いて離れる。
// 例外：ラッシャーの猛突進、宙に飛ばされている間、レーン移動中、動かないもの、大きい体(当たり判定の幅200以上)
function resolveEnemyOverlap(unit, dtMs){
  if (!unit.needsPullBack) return; // 自分の能力(レーン移動・吹き飛びの着地など)で動いたユニットだけが、重なりを解消する
  if (!battle || unit.dead || unit.def.immobile || unit.def.passThroughEnemies || unit.charging || unit.launched ||
      unit.laneMoving || unit.mounted || unit.bearerOf || unit.perch || (unit.def.hitboxWidth || 0) >= 200){ unit.needsPullBack = false; return; }
  const wu = bodyWidth(unit);
  const uc = unit.x + wu / 2;
  const fwd = unit.side === "player" ? -1 : 1; // 進む方向
  let pullBack = 0, pushFront = 0;
  battle.units.forEach(o => {
    if (o === unit || o.dead || o.side === unit.side || o.mounted || o.launched || o.laneMoving || o.perch) return;
    if (o.def.invulnerable || o.def.passThroughEnemies) return;
    if (!lanesOverlap(unit.laneLo, unit.laneHi, o.laneLo, o.laneHi)) return;
    const wo = bodyWidth(o);
    const ov = Math.min(unit.x + wu, o.x + wo) - Math.max(unit.x, o.x);
    if (ov <= 0) return;
    const ahead = ((o.x + wo / 2) - uc) * fwd > 0;
    if (ahead) pullBack = Math.max(pullBack, ov); else pushFront = Math.max(pushFront, ov); // 相手を追い越していたら、前へ抜ける
  });
  const amt = pullBack > 0 ? pullBack : pushFront;
  if (amt <= 0){ unit.needsPullBack = false; return; } // 重なっていなければ終わり
  const step = Math.min(amt, 400 * (dtMs / 1000)); // 素早く引く(毎秒400px)
  const dirMove = pullBack > 0 ? -fwd : fwd;
  const field = document.getElementById("battlefield");
  unit.x = Math.max(30, Math.min(field.clientWidth - 30 - wu, unit.x + dirMove * step));
  applyFrame(unit);
}

/* ---------- 状態異常のゲージ ---------- */
// 状態異常(毒・出血・今後増える状態異常)は、種類ごとに、対象1体につきゲージが1つだけ。誰が攻撃しても、同じゲージにたまる。
// 蓄積が閾値に達したらtrueを返し、ゲージを0に戻す(発動の中身は呼び出し側で行う)。
function addStatusGauge(target, key, amount, threshold){
  if (!target.gauges) target.gauges = {};
  if (target.aura && target.aura.gaugeCut !== 1) amount *= target.aura.gaugeCut;
  const v = Math.min(threshold, (target.gauges[key] || 0) + amount);
  if (v >= threshold){ target.gauges[key] = 0; return true; }
  target.gauges[key] = v;
  return false;
}

// 肩代わりできる盾兵を探す：撃つ側の正面(盾の向き)にいて、守られる味方より前に立ち、同じ戦列にいて、ガードできる状態の盾兵
function findCoverShield(target, attacker){
  let best = null, bestDist = Infinity;
  battle.units.forEach(sh => {
    if (sh.dead || sh === target || sh.side !== target.side || !sh.def.canGuard || sh.shieldBroken || sh.guardCooldown > 0) return;
    if (sh.restrained || sh.launched || sh.mounted || isSuperArmored(sh, attacker)) return;
    if (!lanesOverlap(sh.lane, sh.lane, attacker.laneLo, attacker.laneHi)) return; // 撃ってくる戦列と同じ戦列
    if (!lanesOverlap(sh.lane, sh.lane, target.laneLo, target.laneHi)) return;     // 守られる味方も、その戦列
    const shooterAhead = sh.facing === -1 ? attacker.x <= sh.x : attacker.x >= sh.x; // 撃つ側は、盾の正面
    const targetBehind = sh.facing === -1 ? target.x >= sh.x : target.x <= sh.x;     // 守られる味方は、盾の後ろ
    const dist = Math.abs(target.x - sh.x);
    if (!shooterAhead || !targetBehind || dist > (sh.def.coverRange || 160)) return;
    if (dist < bestDist){ best = sh; bestDist = dist; }
  });
  return best;
}

function edgeDistance(a, b){
  // hitboxWidthを指定していない普通のキャラは、ぶつかり判定(moveWithCollisionが使うbodyWidth)と
  // 同じ幅をここでも使う。ここだけ幅0(点)で計算すると、ぶつかって止まった位置がまだ間合いの外と判定され、
  // 双方が歩みを止めたまま攻撃に移れず、突っかかり続けることがあった
  const aw = (a.def && a.def.hitboxWidth) || bodyWidth(a);
  const bw = (b.def && b.def.hitboxWidth) || bodyWidth(b);
  const aLeft = a.x, aRight = a.x + aw;
  const bLeft = b.x, bRight = b.x + bw;
  if (aRight < bLeft) return bLeft - aRight;
  if (bRight < aLeft) return aLeft - bRight;
  return 0; // 重なっている
}

function isAttackFromFront(target, attacker){
  if (!attacker) return false;
  // facing:-1は左向き(=前方は自分より左)、facing:+1は右向き(=前方は自分より右)
  return target.facing === -1 ? attacker.x <= target.x : attacker.x >= target.x;
}

// 索敵・ブロック判定の共通ルール：相手が正面にいれば反応してよい。
// 完全に背後にいる場合は、よほど近く(密着している)ない限り無視する。
const ADJACENT_ENGAGE_THRESHOLD = 20;
function isEngageable(unit, other){
  if (other.appearing) return false;                                        // 輪の中から出てくる間は、狙えない
  if (other.def.noCombat) return true; // 非戦闘ユニットは自衛できないので、前後関係に関わらず常に攻撃対象にできる
  if (unit.def.canEngageBehind) return true; // 斥候：背後に回り込まれても、振り向いて相手をする
  const forwardDir = unit.side === "player" ? -1 : 1;
  const dx = other.x - unit.x;
  if (Math.sign(dx) === forwardDir || dx === 0) return true; // 正面、または真横で重なっている
  return edgeDistance(unit, other) <= ADJACENT_ENGAGE_THRESHOLD; // 背後でも密着していれば許容
}

function afterReaction(unit){
  if (unit.dead) return;
  unit.target = null; // 攻撃してきた相手を仕切り直しで再索敵させる
  const fallback = unit.def.frameCounts.walk ? "walk" : (unit.def.approachMotion || "walk");
  setMotion(unit, fallback, { loop:true });
}

function killUnit(target){
  if (target.side === "player" && target.siteRoster && !target.isLeader && !target.noCorpse && battle && battle.stage && battle.stage.siteBattle && !target.fallenCounted){            // 療養基地：討たれた兵を数える
    target.fallenCounted = true; const fk = target.deployedKind || target.kind; if (world.fallen) world.fallen[fk] = (world.fallen[fk] || 0) + 1;
  }
  if (target.isBoss && !target.bossHandled) onBossKilled(target);        // 基地のボス・本拠地のボスが倒れた：引き連れた兵は全滅
  if (target.isLeader && !target.homeAuraCascading && battle && battle.homeAuraLeaders && battle.homeAuraLeaders.has(target.leaderId)){
    target.homeAuraCascading = true;                                    // 本拠地のリーダーが死んだ：隊員は、全員、即死する(二重に連鎖しないよう、印を付けておく)
    const mates = battle.units.filter(u => !u.dead && u !== target && u.siteOrigin === target.leaderId);
    mates.forEach(u => { u.hp = 0; killUnit(u); });
  }
  if (target.def.explodesOnDeath && !target.exploding){
    explodeGasCan(target, target.lastAttacker || null); // 通常のダメージでHPが尽きた場合も、同じ爆発演出で処理する
    return;
  }
  if (target.def.bareDef && !target.def.frameCounts.down){
    target.def = CHAR_DEFS[target.def.bareDef]; // 何かを担いだまま死んだ：専用のダウン絵は無いので、素手の姿に切り替えてから倒れる
  }
  target.dead = true;
  target.target = null;
