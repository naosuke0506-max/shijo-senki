<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>屍城戦記</title>
<style>
  :root{
    --bg: #100f0b;
    --bg-panel: #1b1911;
    --bg-panel-2: #242115;
    --line: #55492f;
    --line-dim: #3a3323;
    --text: #d9cfae;
    --text-dim: #8f8567;
    --blood: #7a2116;
    --blood-2: #9c3322;
    --rust: #a9793a;
    --gold: #c9a24a;
    --hp-enemy: #7a2116;
    --hp-player: #5c6b34;
    --shadow: rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
    width:100%; height:100%; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #app{ position:fixed; inset:0; }

  .screen{ position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  button{
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    cursor:pointer; border-radius:2px;
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
  }
  button:active{ transform:translateY(1px); }
  button.primary{ background:var(--blood); border-color:#4a140d; color:#f0e6d0; font-weight:700; }
  button:disabled{ opacity:.35; cursor:default; }

  /* 錆びた金属風の縁取り */
  .plate{
    background:linear-gradient(180deg,#2a2617,#1b1911);
    border:1px solid var(--line);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px var(--shadow);
  }

  /* ---------- タイトル ---------- */
  #screen-title{
    align-items:center; justify-content:center; text-align:center;
    background:
      radial-gradient(ellipse at 50% 25%, #241f14 0%, #0c0b08 75%);
  }
  #screen-title h1{
    font-size:2.7rem; letter-spacing:.15em; color:var(--gold);
    text-shadow:0 2px 10px rgba(0,0,0,.8);
    margin:0 0 6px;
  }
  #screen-title .sub{ color:var(--text-dim); margin-bottom:44px; font-size:.78rem; letter-spacing:.25em; font-family:'Yu Gothic',sans-serif; }
  #screen-title button{ padding:15px 50px; font-size:1.05rem; letter-spacing:.1em; }

  /* ---------- 編成 ---------- */
  #screen-formation{ padding:14px; background:linear-gradient(180deg,#181510,#100f0b); }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar h2{ margin:0; font-size:1.05rem; color:var(--gold); letter-spacing:.1em; font-weight:400; }
  .topbar button{ font-family:'Yu Gothic',sans-serif; padding:8px 16px; font-size:.8rem; }

  .unit-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; flex:1; align-content:start; overflow-y:auto; }

  .formation-slots{
    display:flex; gap:8px; padding:10px; overflow-x:auto; flex-shrink:0;
    background:#0d0c09; border:1px solid var(--line); margin-bottom:12px;
  }
  .formation-slot{
    position:relative; width:56px; height:56px; flex-shrink:0;
    border:1px solid var(--line-dim); background:#050504; cursor:pointer;
  }
  .formation-slot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .formation-slot.empty{
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:1.3rem; border-style:dashed; cursor:default;
  }
  .formation-slot .cost-tag{
    position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.75);
    font-size:.55rem; font-family:monospace; color:var(--gold); text-align:center;
  }

  .category-tabs{
    display:flex; gap:6px; padding-top:10px; margin-top:10px;
    border-top:1px solid var(--line); overflow-x:auto; flex-shrink:0;
  }
  .category-tab{
    flex-shrink:0; padding:8px 14px; font-size:.78rem; font-family:'Yu Gothic',sans-serif;
    background:#1a1710; border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
  }
  .category-tab.active{ color:var(--gold); border-color:var(--gold); }

  .unit-card{ cursor:pointer; }
  .unit-card.in-formation{ box-shadow:0 0 0 2px var(--gold) inset; }
  .unit-card{
    position:relative; padding:8px; text-align:center;
    background:linear-gradient(180deg,#252112,#1a1710);
    border:1px solid var(--line);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .unit-card.selected{ box-shadow:0 0 0 1px var(--gold) inset; }
  .unit-card .icon-wrap{
    width:64px; height:64px; margin:0 auto 6px; border-radius:2px; overflow:hidden;
    background:#050504; border:1px solid var(--line-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .unit-card .icon-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .unit-card .icon-fallback{ font-family:'Yu Gothic',sans-serif; font-size:.8rem; color:var(--text-dim); }
  .unit-card .name{ font-size:.78rem; font-family:'Yu Gothic',sans-serif; }
  .unit-card .cost{ font-size:.72rem; color:var(--rust); font-family:monospace; }
  .unit-card .rank-tag{
    position:absolute; top:2px; left:2px; font-size:.55rem; padding:1px 4px;
    background:rgba(0,0,0,.5); color:var(--text-dim); font-family:'Yu Gothic',sans-serif;
  }
  .unit-card.locked{ opacity:.32; }
  .unit-card.locked::after{ content:"近日実装"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:.66rem; color:var(--text-dim); font-family:'Yu Gothic',sans-serif; background:rgba(0,0,0,.3); }

  /* ---------- ステージ選択 ---------- */
  #screen-stage{ padding:16px; align-items:center; background:linear-gradient(180deg,#181510,#100f0b); }
  .stage-list{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .stage-card{
    background:linear-gradient(180deg,#252112,#1a1710); border:1px solid var(--line);
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .stage-card .name{ font-size:1rem; letter-spacing:.05em; }
  .stage-card .hp{ font-size:.7rem; color:var(--text-dim); font-family:'Yu Gothic',sans-serif; margin-top:2px; }
  .stage-card button{ font-family:'Yu Gothic',sans-serif; padding:8px 18px; }

  /* ---------- 戦闘 ---------- */
  #screen-battle{ position:absolute; inset:0; background:linear-gradient(#2a271e 0%, #1a1812 55%, #100f0b 100%); font-family:'Yu Gothic',sans-serif; }

  /* 上部バー：左(操作)／中央(HP)／右(所持金) */
  #battle-topbar{
    position:absolute; left:0; right:0; top:0; height:64px;
    display:flex; align-items:stretch; gap:8px; padding:8px 10px; z-index:5; box-sizing:border-box;
    background:linear-gradient(180deg, rgba(10,9,6,.92), rgba(10,9,6,.55) 80%, transparent);
  }
  #top-left-controls{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  #top-left-controls .stage-plate{
    background:rgba(20,18,12,.85); border:1px solid var(--line); padding:5px 10px;
    font-size:.68rem; color:var(--text-dim); white-space:nowrap;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%);
  }
  #top-left-controls button{ width:30px; height:30px; padding:0; font-size:.85rem; line-height:1; }

  #top-center-hp{ flex:1; display:flex; flex-direction:column; gap:3px; justify-content:center; min-width:0; padding:0 4px; }
  .hpbar{ display:flex; align-items:center; gap:6px; }
  .hpbar .tag{ font-size:.62rem; color:var(--text-dim); width:30px; flex-shrink:0; text-align:right; }
  .hpbar .track{ flex:1; height:9px; background:#0a0906; border:1px solid var(--line-dim); border-radius:1px; overflow:hidden; }
  .hpbar .fill{ height:100%; transition:width .25s linear; }
  .hpbar.enemy .fill{ background:linear-gradient(180deg,#a4392a,var(--hp-enemy)); }
  .hpbar.player .fill{ background:linear-gradient(180deg,#7c8f45,var(--hp-player)); }
  .hpbar .num{ font-size:.6rem; font-family:monospace; color:var(--text-dim); width:52px; flex-shrink:0; }

  #top-right-money{ flex:0 0 auto; text-align:right; padding:2px 4px; }
  #top-right-money .money-num{ font-family:monospace; font-size:1.05rem; color:var(--gold); line-height:1.1; }
  #top-right-money .money-cap{ font-size:.6rem; color:var(--text-dim); }

  /* ステージの広さ：戦場(#battlefield)をSTAGE_ZOOM倍の広さで作り、画面に収まるよう縮小して表示する。
     ユニットの大きさ・射程・移動速度などは、すべて拡大後の「ゲーム内の座標(px)」のまま。数字を大きくするほど広く見渡せて、キャラは小さく見える */
  :root{ --stage-zoom: 2; }
  #battlefield-frame{
    position:absolute; left:0; right:0; top:64px; bottom:90px; overflow:hidden;
  }
  #battlefield{
    position:absolute; left:0; top:0;
    width:calc(100% * var(--stage-zoom)); height:calc(100% * var(--stage-zoom));
    transform:scale(calc(1 / var(--stage-zoom))); transform-origin:0 0;
    overflow:hidden; background-color:#221f17;
  }
  #ground-line{ position:absolute; left:0; right:0; bottom:74px; height:2px; background-color:#000000; }

  .castle{
    position:absolute; bottom:74px; width:70px; height:150px;
    background:repeating-linear-gradient(0deg,#6b6248,#6b6248 8px,#544c38 8px,#544c38 16px);
    border:2px solid #2a2618; border-radius:2px 2px 0 0;
    box-shadow:0 0 18px rgba(0,0,0,.6);
  }
  .castle.enemy{ left:12px; box-shadow:0 0 22px rgba(154,50,30,.35); }
  .castle.player{ right:12px; box-shadow:0 0 22px rgba(120,130,70,.3); }
  .castle .flag{ position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:18px; }
  .castle .battlements{
    position:absolute; top:-10px; left:0; right:0; height:10px;
    background:repeating-linear-gradient(90deg,#6b6248 0 10px,transparent 10px 14px);
  }

  .unit-sprite{ position:absolute; bottom:74px; transform-origin:bottom center; }
  .unit-sprite img{ display:block; image-rendering:-webkit-optimize-contrast; filter:drop-shadow(0 4px 4px rgba(0,0,0,.5)); }
  .unit-sprite .uhp{ position:absolute; left:50%; transform:translateX(-50%); top:-10px; width:44px; height:5px; background:#0a0906; border:1px solid #000; }
  .unit-sprite .uhp i{ display:block; height:100%; background:var(--hp-player); }

  .fx-sprite{ position:absolute; bottom:110px; left:0; pointer-events:none; z-index:4; mix-blend-mode:screen; }
  .buff-aura{ bottom:auto; height:34px; transform:translate(-50%,-75%); z-index:5; }
  .trap-sprite{ mix-blend-mode:normal; bottom:66px; left:0; z-index:2; } /* 写実素材なのでscreen合成を解除、ユニットより奥に表示 */
  .bleed-fx{ bottom:auto; left:50%; top:45%; height:56px; transform:translate(-50%,-50%); z-index:5; mix-blend-mode:normal; }
  .flag-buff-icon{ bottom:auto; left:calc(50% + 28px); top:0; height:26px; transform:translate(-50%,-115%); z-index:5; mix-blend-mode:normal; } /* 旗バフ：透過PNGなのでscreen合成は使わない */
  .poison-status-fx{ bottom:auto; height:70px; transform:translate(-50%,-45%); z-index:5; opacity:.85; }

  /* 下部バー：左(財布)／中央〜(出撃キャラ)／右(予約スペース) */
  #battle-bottombar{
    position:absolute; left:0; right:0; bottom:0; height:90px; box-sizing:border-box;
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    background:linear-gradient(0deg, rgba(10,9,6,.95), rgba(10,9,6,.7) 85%, transparent);
  }
  #wallet-widget{
    flex:0 0 auto; background:rgba(20,18,12,.85); border:1px solid var(--line);
    padding:6px 10px; min-width:108px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
  }
  #wallet-widget .lv-label{ font-size:.62rem; color:var(--gold); }
  #wallet-widget .rate{ font-size:.58rem; color:var(--text-dim); margin-bottom:4px; }
  #wallet-widget .bar{ height:5px; background:#0a0906; border:1px solid var(--line-dim); border-radius:1px; overflow:hidden; margin-bottom:4px; }
  #wallet-widget .bar i{ display:block; height:100%; background:var(--rust); }
  #wallet-widget button{ width:100%; font-size:.62rem; padding:4px 0; }

  #deploy-row{ flex:1; display:flex; gap:8px; overflow-x:auto; padding:2px 0; }
  .deploy-btn{ position:relative; width:56px; height:56px; padding:0; border-radius:2px; overflow:hidden; flex-shrink:0; border:1px solid var(--line); }
  .deploy-btn img{ width:100%; height:100%; object-fit:cover; display:block; }
  .deploy-btn .icon-fallback{ display:flex; align-items:center; justify-content:center; width:100%; height:100%; background:#050504; color:var(--text-dim); font-size:.68rem; }
  .deploy-btn .cost-tag{ position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.75); font-size:.6rem; font-family:monospace; color:var(--gold); text-align:center; }
  .deploy-btn:disabled .cost-tag{ color:var(--text-dim); }

  #reserved-space{ flex:0 0 74px; height:60px; }

  #debug-tab{
    position:absolute; right:8px; top:8px; z-index:6;
    font-size:.62rem; padding:8px 10px; color:var(--text-dim);
  }
  #debug-panel{ position:absolute; right:8px; top:44px; z-index:6; display:none; flex-direction:column; gap:4px;
    background-color:rgba(0,0,0,.75); padding:6px; max-width:110px; border-radius:3px; }
  #debug-panel button{ font-size:.6rem; padding:4px 6px; }

  /* ---------- 結果 ---------- */
  #screen-result{ align-items:center; justify-content:center; text-align:center; background:linear-gradient(180deg,#181510,#0c0b08); }
  #screen-result h2{ font-size:1.7rem; margin-bottom:8px; letter-spacing:.1em; }
  #screen-result.win h2{ color:var(--gold); }
  #screen-result.lose h2{ color:var(--blood-2); }
  #screen-result p{ font-family:'Yu Gothic',sans-serif; }
  #screen-result button{ font-family:'Yu Gothic',sans-serif; }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="screen-title" class="screen active">
    <h1>屍城戦記</h1>
    <div class="sub">SHIJO SENKI</div>
    <button class="primary" id="btn-to-formation">はじめる</button>
  </section>

  <!-- 編成 -->
  <section id="screen-formation" class="screen">
    <div class="topbar">
      <h2>編成</h2>
      <button class="primary" id="btn-to-stage">ステージ選択へ</button>
    </div>
    <div class="formation-slots" id="formation-slots"></div>
    <div class="unit-grid" id="unit-grid"></div>
    <div class="category-tabs" id="category-tabs"></div>
  </section>

  <!-- ステージ選択 -->
  <section id="screen-stage" class="screen">
    <div class="topbar" style="width:100%;max-width:420px;">
      <h2>ステージ選択</h2>
      <button id="btn-back-formation">戻る</button>
    </div>
    <div class="stage-list" id="stage-list"></div>
  </section>

  <!-- 戦闘 -->
  <section id="screen-battle" class="screen">

    <div id="battle-topbar">
      <div id="top-left-controls">
        <div class="stage-plate" id="stage-name-plate">魔の平原</div>
        <button id="btn-pause" title="一時停止">Ⅱ</button>
        <button id="btn-surrender" title="投降">✕</button>
      </div>
      <div id="top-center-hp">
        <div class="hpbar enemy">
          <span class="tag">敵城</span>
          <div class="track"><div class="fill" id="enemy-hp-fill" style="width:100%"></div></div>
          <span class="num" id="enemy-hp-num">150/150</span>
        </div>
        <div class="hpbar player">
          <span class="tag">自城</span>
          <div class="track"><div class="fill" id="player-hp-fill" style="width:100%"></div></div>
          <span class="num" id="player-hp-num">150/150</span>
        </div>
      </div>
      <div id="top-right-money">
        <div class="money-num" id="money-num">0円</div>
        <div class="money-cap" id="money-cap">上限1500円</div>
      </div>
    </div>

    <div id="battlefield-frame">
    <div id="battlefield">
      <div id="ground-line"></div>
      <div class="castle enemy"><div class="battlements"></div><div class="flag">🏴</div></div>
      <div class="castle player"><div class="battlements"></div><div class="flag">🚩</div></div>
    </div>
      <button id="debug-tab">動作確認</button>
      <div id="debug-panel"></div>
      <button id="cheat-money-btn" style="position:absolute;left:0;top:40px;z-index:6;font-size:.62rem;padding:6px 8px;">+1000円(検証用)</button>
      <button id="cheat-enemy-btn" style="position:absolute;left:0;top:76px;z-index:6;font-size:.62rem;padding:6px 8px;">敵兵士召喚(検証用)</button>
      <button id="cheat-enemy-spear-btn" style="position:absolute;left:0;top:112px;z-index:6;font-size:.62rem;padding:6px 8px;">敵槍兵召喚(検証用)</button>
      <button id="cheat-enemy-shield-btn" style="position:absolute;left:0;top:148px;z-index:6;font-size:.62rem;padding:6px 8px;">敵盾兵召喚(検証用)</button>
      <button id="cheat-enemy-gun-btn" style="position:absolute;left:0;top:184px;z-index:6;font-size:.62rem;padding:6px 8px;">敵火縄銃兵召喚(検証用)</button>
      <button id="cheat-enemy-goblin-btn" style="position:absolute;left:0;top:220px;z-index:6;font-size:.62rem;padding:6px 8px;">敵ゴブリン召喚(検証用)</button>
      <button id="cheat-enemy-drummer-btn" style="position:absolute;left:0;top:256px;z-index:6;font-size:.62rem;padding:6px 8px;">敵鼓舞兵召喚(検証用)</button>
      <button id="cheat-enemy-catapult-btn" style="position:absolute;left:0;top:292px;z-index:6;font-size:.62rem;padding:6px 8px;">敵投石器召喚(検証用)</button>
      <button id="cheat-enemy-chief-btn" style="position:absolute;left:0;top:328px;z-index:6;font-size:.62rem;padding:6px 8px;">敵ゴブリン長召喚(検証用)</button>
      <button id="cheat-enemy-fortress-btn" style="position:absolute;left:0;top:364px;z-index:6;font-size:.62rem;padding:6px 8px;">敵フォートレス召喚(検証用)</button>
      <button id="cheat-enemy-queen-btn" style="position:absolute;left:0;top:400px;z-index:6;font-size:.62rem;padding:6px 8px;">敵女王召喚(検証用)</button>
      <button id="cheat-enemy-king-btn" style="position:absolute;left:0;top:436px;z-index:6;font-size:.62rem;padding:6px 8px;">敵キング召喚(検証用)</button>
    </div><!-- /battlefield-frame -->

    <div id="battle-bottombar">
      <div id="wallet-widget">
        <div class="lv-label" id="wallet-lv-label">財布Lv0</div>
        <div class="rate" id="wallet-rate-label">30円/秒</div>
        <div class="bar"><i id="money-bar" style="width:0%"></i></div>
        <button id="wallet-upgrade-btn">強化(600円)</button>
      </div>
      <div id="deploy-row"></div>
      <div id="reserved-space"></div>
    </div>

  </section>

  <!-- 結果 -->
  <section id="screen-result" class="screen">
    <h2 id="result-title">勝利</h2>
    <p id="result-sub" style="color:var(--text-dim);font-size:.85rem;"></p>
    <button class="primary" id="btn-result-continue" style="margin-top:20px;padding:12px 36px;">ステージ選択へ戻る</button>
  </section>

</div>

<script>
(function(){
"use strict";

/* =========================================================
   0. 定数・画像パス
   ========================================================= */
// @mainブランチ指定だとjsDelivr側に古い(存在しない扱いの)キャッシュが残ることがあるため、
// コミットハッシュ固定にして新しいバージョンとして扱わせる。素材を追加・更新したら、この値も都度更新すること。
const REPO_BASE = "https://cdn.jsdelivr.net/gh/naosuke0506-max/shijo-senki@a5cd397/";
const IMG_SOLDIER = REPO_BASE + "images/soldier_repo_upload/";
const ICON_SOLDIER = REPO_BASE + "icons/soldier_icon.png";
const IMG_SPEARMAN = REPO_BASE + "images/spearman_repo_upload/";
const ICON_SPEARMAN = REPO_BASE + "icons/spearman_icon.png";
const IMG_SHIELDMAN = REPO_BASE + "images/shieldman_repo_upload/";
const ICON_SHIELDMAN = REPO_BASE + "icons/shieldman_icon.png";
const IMG_ARQUEBUSIER = REPO_BASE + "images/arquebusier_repo_upload/";
const ICON_ARQUEBUSIER = REPO_BASE + "icons/arquebusier_icon.png";
const IMG_GOBLIN = REPO_BASE + "images/goblin_repo_upload/";
const IMG_GOBLIN_EXTRA = REPO_BASE + "images/goblin_extra_upload/"; // 咆哮・目のエフェクトはこちらのフォルダ
const ICON_GOBLIN = REPO_BASE + "icons/goblin_icon.png";
const IMG_DRUMMER = REPO_BASE + "images/drummer_repo_upload/";

// 画像読み込みに失敗した場合のフォールバック(キャラ名の頭文字を表示するプレースホルダー)
function attachImgFallback(imgEl, label){
  imgEl.addEventListener("error", () => {
    if (imgEl.dataset.fallbackApplied) return;
    imgEl.dataset.fallbackApplied = "1";
    const box = document.createElement("div");
    box.className = "icon-fallback";
    box.textContent = label || "?";
    imgEl.replaceWith(box);
  }, { once:true });
}

// テイマーのように、召喚すると付随するユニットも同時に出るキャラのコスト合計(セット価格)を返す
function getDeployCost(def){
  let total = def.cost;
  (def.summons || []).forEach(s => {
    const sub = CHAR_DEFS[s.kind];
    if (sub) total += sub.cost * s.count;
  });
  return total;
}

function buildFormationScreen(){
  state.selectedUnits = state.selectedUnits.filter(k => k !== "hound"); // 魔獣は単体編成不可(テイマーに付随)
  buildFormationSlots();
  buildCategoryTabs();
  buildUnitGrid();
}

// 中央：現在編成に入っているユニットのスロット表示。タップすると編成から外れる
function buildFormationSlots(){
  const wrap = document.getElementById("formation-slots");
  wrap.innerHTML = "";
  state.selectedUnits.forEach((kind, i) => {
    const def = CHAR_DEFS[kind];
    if (!def) return;
    const slot = document.createElement("div");
    slot.className = "formation-slot";
    slot.innerHTML = `<img src="${def.icon}" alt="${def.name}"><div class="cost-tag">${getDeployCost(def)}</div>`;
    attachImgFallback(slot.querySelector("img"), def.name);
    slot.title = def.name + "(タップで編成から外す)";
    slot.addEventListener("click", () => {
      state.selectedUnits.splice(i, 1);
      buildFormationScreen();
    });
    wrap.appendChild(slot);
  });
  // 空きスロットの目安を1つ表示(枠自体に上限はない)
  const hint = document.createElement("div");
  hint.className = "formation-slot empty";
  hint.textContent = "+";
  wrap.appendChild(hint);
}

// 下部：カテゴリータブ。タップで一覧の絞り込みが切り替わる
function buildCategoryTabs(){
  const wrap = document.getElementById("category-tabs");
  wrap.innerHTML = "";
  FORMATION_CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "category-tab" + (state.formationCategory === cat.id ? " active" : "");
    btn.textContent = cat.label;
    btn.addEventListener("click", () => {
      state.formationCategory = cat.id;
      buildFormationScreen();
    });
    wrap.appendChild(btn);
  });
}

// 中段：選択中のカテゴリーに属するユニット一覧。タップで編成への追加/削除をトグルする
function buildUnitGrid(){
  const grid = document.getElementById("unit-grid");
  grid.innerHTML = "";
  const activeCat = state.formationCategory || "all";
  Object.entries(CHAR_DEFS).forEach(([kind, def]) => {
    if (def.hiddenFromFormation) return; // 魔獣など、単体では編成できないユニットは一覧に出さない
    if (activeCat !== "all" && def.race !== activeCat) return;
    const inFormation = state.selectedUnits.includes(kind);
    const card = document.createElement("div");
    card.className = "unit-card" + (inFormation ? " in-formation" : "");
    card.innerHTML = `
      <div class="rank-tag">${def.rank || "―"}</div>
      <div class="icon-wrap"><img src="${def.icon}" alt="${def.name}"></div>
      <div class="name">${def.name}</div>
      <div class="cost">${getDeployCost(def)}円</div>
    `;
    attachImgFallback(card.querySelector("img"), def.name);
    card.addEventListener("click", () => {
      const idx = state.selectedUnits.indexOf(kind);
      if (idx === -1){
        state.selectedUnits.push(kind);
      } else {
        state.selectedUnits.splice(idx, 1);
      }
      buildFormationScreen();
    });
    grid.appendChild(card);
  });
}

let battle = null;

function startBattle(stage){
  const field = document.getElementById("battlefield");
  field.querySelectorAll(".unit-sprite").forEach(el => el.remove());
  field.querySelectorAll(".fx-sprite").forEach(el => el.remove());

  document.getElementById("stage-name-plate").textContent = stage.name;

  battle = {
    stage,
    enemyCastleHp: stage.enemyCastleHp,
    enemyCastleHpMax: stage.enemyCastleHp,
    playerCastleHp: stage.playerCastleHp,
    playerCastleHpMax: stage.playerCastleHp,
    money: 0,
    walletLevel: 0,
    units: [],
    traps: [],
    lastTick: performance.now(),
    ended: false,
    paused: false,
    fxList: [],                    // 毎フレーム進めるエフェクト・タイマー(一時停止に連動する)
    comboDone: { player: false, enemy: false } // 指輪コンボは陣営ごとに1回だけ
  };

  updateCastleBars();
  buildDeployRow();
  buildDebugPanel();
  showScreen("screen-battle");

  requestAnimationFrame(battleLoop);
}

function updateCastleBars(){
  document.getElementById("enemy-hp-num").textContent =
    Math.max(0,Math.ceil(battle.enemyCastleHp)) + "/" + battle.enemyCastleHpMax;
  document.getElementById("enemy-hp-fill").style.width =
    Math.max(0, battle.enemyCastleHp / battle.enemyCastleHpMax * 100) + "%";
  document.getElementById("player-hp-num").textContent =
    Math.max(0,Math.ceil(battle.playerCastleHp)) + "/" + battle.playerCastleHpMax;
  document.getElementById("player-hp-fill").style.width =
    Math.max(0, battle.playerCastleHp / battle.playerCastleHpMax * 100) + "%";
}

function buildDeployRow(){
  const row = document.getElementById("deploy-row");
  row.innerHTML = "";
  state.selectedUnits.forEach(kind => {
    const def = CHAR_DEFS[kind];
    const btn = document.createElement("button");
    btn.className = "deploy-btn";
    btn.innerHTML = `<img src="${def.icon}" alt="${def.name}"><span class="cost-tag">${getDeployCost(def)}</span>`;
    attachImgFallback(btn.querySelector("img"), def.name);
    btn.addEventListener("click", () => tryDeploy(kind));
    row.appendChild(btn);
  });
  updateWalletUI();
}

function tryUpgradeWallet(){
  const cur = WALLET_LEVELS[battle.walletLevel];
  if (cur.upgradeCost == null) return;
  if (battle.money < cur.upgradeCost) return;
  battle.money -= cur.upgradeCost;
  battle.walletLevel++;
  updateWalletUI();
}
document.getElementById("wallet-upgrade-btn").addEventListener("click", tryUpgradeWallet);

function updateWalletUI(){
  if (!battle) return;
  const lv = WALLET_LEVELS[battle.walletLevel];
  document.getElementById("money-num").textContent = Math.floor(battle.money) + "円";
  document.getElementById("money-cap").textContent = "上限" + lv.cap + "円";
  document.getElementById("money-bar").style.width = (battle.money / lv.cap * 100) + "%";
  document.getElementById("wallet-lv-label").textContent = "財布Lv" + battle.walletLevel;
  document.getElementById("wallet-rate-label").textContent = lv.rate + "円/秒";

  const upBtn = document.getElementById("wallet-upgrade-btn");
  if (lv.upgradeCost == null){
    upBtn.textContent = "最大強化";
    upBtn.disabled = true;
  } else {
    upBtn.textContent = "強化(" + lv.upgradeCost + "円)";
    upBtn.disabled = battle.money < lv.upgradeCost;
  }

  document.querySelectorAll(".deploy-btn").forEach((btn, i) => {
    const kind = state.selectedUnits[i];
    const def = CHAR_DEFS[kind];
    btn.disabled = battle.money < getDeployCost(def);
  });
}

function tryDeploy(kind){
  const def = CHAR_DEFS[kind];
  const cost = getDeployCost(def);
  if (battle.money < cost) return;
  battle.money -= cost;
  updateWalletUI();
  spawnUnit(kind, "player");
  (def.summons || []).forEach(s => {
    for (let i = 0; i < s.count; i++){
      // 複数体まとめて出る場合は少しずつ横にずらして重なりすぎないようにする
      const offset = (i - (s.count - 1) / 2) * 26;
      spawnUnit(s.kind, "player", offset);
    }
  });
}

/* ---------- ユニット生成・アニメーション ---------- */

function spawnUnit(kind, side, xOffset, opts){
  const def = CHAR_DEFS[kind];
  const field = document.getElementById("battlefield");
  const fieldWidth = field.clientWidth;

  const el = document.createElement("div");
  el.className = "unit-sprite";
  const img = document.createElement("img");
  img.addEventListener("load", () => {
    const curDef = (img._ownerUnit && img._ownerUnit.def) || def; // 形態変化(女王)で定義が入れ替わることがあるので、現在の定義を見る
    const motionScales = curDef.motionScale || {};
    const motionFactor = motionScales[img.dataset.motion] != null ? motionScales[img.dataset.motion] : 1;
    const scale = (curDef.pixelScale || 1) * motionFactor * ((img._ownerUnit && img._ownerUnit.scaleMult) || 1);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    img.style.width = dw + "px";
    img.style.height = dh + "px";
    if (img._ownerUnit){
      img._ownerUnit._displayWidth = dw;
      img._ownerUnit._displayHeight = dh;
    }
    img._retryCount = 0; // 読み込みに成功したらリトライ回数をリセット
  });
  // 読み込みに失敗した場合、少し待って同じ画像を再読込する(モバイルSafariでの一時的な読み込み失敗対策)
  img.addEventListener("error", () => {
    img._retryCount = (img._retryCount || 0) + 1;
    if (img._retryCount > 3) return; // 何度も失敗する場合は諦める(壊れた画像アイコンのまま)
    const failedSrc = img.src;
    setTimeout(() => {
      if (img.src === failedSrc){ // その間に別のコマへ進んでいなければ再読込
        img.src = "";
        img.src = failedSrc;
      }
    }, 250 * img._retryCount);
  });
  el.appendChild(img);
  const uhp = document.createElement("div");
  uhp.className = "uhp";
  uhp.innerHTML = "<i></i>";
  if (def.hpBarWidth) uhp.style.width = def.hpBarWidth + "px";
  el.appendChild(uhp);
  field.appendChild(el);

  const startX = (side === "player" ? fieldWidth - 90 - (def.spawnFullyInside ? (def.hitboxWidth || 0) : 0) : 90) + (xOffset || 0);
  // 投石器は素材の都合で通常キャラと前後の向きが逆に作られているため、キャラごとに反転させられるようにする
  const baseFacing = side === "player" ? -1 : 1;
  const facing = def.invertFacing ? -baseFacing : baseFacing;

  const unit = {
    kind, def, side, el, img, uhpFill: uhp.querySelector("i"), uhpEl: uhp,
    x: startX,
    hp: def.hp,
    hpMax: def.hp,
    facing,
    target: null,
    motion: null,
    frameIndex: 0,
    frameTimer: 0,
    dead: false,
    debugLock: false,
    guardCooldown: 0,     // 残りクールタイム(ms)。0ならガード可能
    shieldBroken: false,  // true になったらガード・近接攻撃とも二度と使えない
    dodgeUsed: false,     // true になったら特殊回避は二度と使えない(一度きり)
    dodgedPastUnit: null, // 回避してすれ違った相手(この相手とは戦わない)
    buffSources: new Set(), // このユニットを鼓舞したドラマー(死ぬとバフが消える)
    inspireCooldown: 0,     // 鼓舞兵専用：次に発動判定できるまでの残り時間
    trapCheckpointIndex: 0,        // 罠兵専用：自軍城前→中間→敵城前のうち、次に設置すべき地点の番号(0〜3、3で設置完了)
    restrained: false,            // 罠に拘束されている間はtrue(AI停止・ガード/回避不可)
    restrainRemainingMs: 0,       // 拘束の残り時間(Infinityなら自力脱出しない)
    launched: false,              // 打ち上げ/吹き飛ばし中はtrue(AI停止・見た目が浮く)
    launchVY: 0,
    launchVX: 0,
    launchY: 0,
    poisonRemainingMs: 0,         // 毒状態の残り時間
    poisonStack: 0,               // 毒の蓄積値(%)。閾値に達すると発動
    poisonTickTimer: 0,
    poisonTickIntervalMs: 0,
    poisonDamagePerTick: 0,
    poisonFxDef: null,
    poisonFxEl: null,
    poisonFxFrame: 0,
    poisonFxTimer: 0,
    midCooldown: 0,               // ゴブリン長専用：次に中距離技を出せるまでの残り時間(ms)
    attackHadTarget: false,       // 攻撃開始時に対象ユニットがいたか(多段攻撃の途中で対象が倒れたら残りの段を城へ流さない)
    flagFxEl: null,               // 旗バフのアイコン
    attackArmorMs: 0,             // 近接攻撃中スーパーアーマーの残り時間(ms)。ゴブリン長の特殊モーションで付与
    bleedStack: 0,                // 出血の蓄積値(%)
    mounted: false,               // 拠点(フォートレス)の背中に乗っている間はtrue(攻撃されず、狙われない)
    mount: null,                  // 乗っている相手(フォートレス)
    slot: null,                   // 背中での立ち位置
    scaleMult: 1,                 // 表示倍率の追加補正(乗っている間は小さく描く)
    rideY: 0,                     // 地面からの高さ(px)。乗っている間はデッキの高さ
    dismounting: false,           // 梯子から降りている最中
    riders: null,                 // フォートレス専用：背中に乗っているゴブリンの一覧
    downFinished: false,          // フォートレス専用：ダウンモーションを最後まで再生し終えた
    staggerVX: 0,                 // よろめき後退中の速度(px/秒)
    bearerOf: null,               // キングの担ぎ手として担いでいる相手
    bearers: null,                // キング専用：担ぎ手の一覧
    elevated: false,              // キング専用：担がれて宙に浮いている間はtrue(遠距離攻撃しか届かない)
    grounded: false,              // キング専用：玉座が地面に落ちた
    dropping: false,              // キング専用：玉座が落下中
    gateCooldown: 0,              // キング専用：次にゲートを召喚できるまで(ms)
    discovered: false,            // キング専用：敵を見つけて反応した
    owner: null,                  // ゲート専用：召喚したキング
    lifeMs: 0,                    // ゲート専用：残り時間(ms)
    summonTimer: 0,               // ゲート専用：次の召喚まで(ms)
    shieldCooldown: 0,            // 女王：シールドを次に張れるまで(ms)
    meteorCooldown: 0,            // 女王：メテオを次に唱えられるまで(ms)
    barrierMs: 0,                 // 女王：バリアの残り時間(ms)
    casting: null,                // 女王：詠唱中の魔法のモーション名(中断されたらキャンセル)
    castId: 0,
    transformed: false,           // 女王：第二形態へ移行済み
    transforming: false,          // 女王：移行モーション中(中断されない)
    healCooldown: 800,            // ヒーラー専用：次に回復を発動できるまでの残り時間
    isReviving: false,            // ヒーラー専用：現在蘇生の詠唱中かどうか
    reviveTarget: null,           // ヒーラー専用：蘇生対象の死体
    reviveUsesLeft: def.reviveUsesMax || 0, // ヒーラー専用：残り蘇生回数
    frozenForRevive: false,       // 死体側：蘇生対象として固定され、消滅を待たされている
    _displayWidth: 0        // 直近ロード完了した画像の表示幅(px)。オーラ位置計算に使用
  };
  img._ownerUnit = unit;
  if (def.blendScreen) img.style.mixBlendMode = "screen";
  if (def.invulnerable) uhp.style.display = "none";
  battle.units.push(unit);
  setMotion(unit, "idle");
  if (opts && opts.mount) mountRider(unit, opts.mount, opts.slot);
  if (opts && opts.bearerOf){ unit.bearerOf = opts.bearerOf; unit.slot = opts.slot; }
  if (!(opts && (opts.mount || opts.bearerOf))) checkRingCombo(unit);
  if (def.bearers){
    // 玉座を担ぐ屈強なゴブリンを一緒に出す。玉座は担ぎ手の肩の高さに浮かせる
    unit.elevated = true;
    unit.rideY = def.carryHeight;
    unit.bearers = def.bearers.map(slot => spawnUnit(slot.kind, side, 0, { bearerOf: unit, slot }));
  }
  if (def.riders){
    // 背中に乗るゴブリンたちを一緒に出す
    unit.riders = [];
    def.riders.forEach(slot => {
      unit.riders.push(spawnUnit(slot.kind, side, 0, { mount: unit, slot }));
    });
  }
  return unit;
}

function frameUrl(def, motion, frameIndex1based){
  const base = (def.motionImageBase && def.motionImageBase[motion]) || def.imageBase;
  const alias = def.motionAlias && def.motionAlias[motion]; // 別モーションの絵を(逆順で)流用する指定(ゲートの消滅など)
  let m = motion, i = frameIndex1based;
  if (alias){
    m = alias.as;
    if (alias.reverse) i = (def.frameCounts[motion] || 1) - frameIndex1based + 1;
  }
  return base + (def.imagePrefix || "") + m + "_" + i + ".png";
}

function removeUnit(unit){
  if (unit.buffFxEl) unit.buffFxEl.remove();
  unit.el.remove();
  if (battle) battle.units = battle.units.filter(u => u !== unit);
}

/* ---------- 鼓舞バフ ---------- */

function getBuffStacks(unit){
  return unit.buffSources ? unit.buffSources.size : 0;
}
// このユニットの陣営に、生きているテイマーがいるかどうか(範囲無限)
function hasLivingTamerAlly(unit){
  if (!battle) return false;
  return battle.units.some(u => !u.dead && u.side === unit.side && u.kind === "tamer");
}
function getEffectiveAtk(unit){
  const stacks = getBuffStacks(unit);
  let atk = stacks ? unit.def.atk * Math.pow(unit.def.buffAtkMult || 1, stacks) : unit.def.atk;
  if (unit.def.tamerBuffEligible && hasLivingTamerAlly(unit)){
    atk *= 1.10; // テイマーが在陣している間、攻撃力+10%(範囲無限、テイマーが死ぬと自動的に外れる)
  }
  return atk;
}
function getEffectiveSpeed(unit, baseSpeed){
  const stacks = getBuffStacks(unit);
  if (!stacks) return baseSpeed;
  return baseSpeed * Math.pow(unit.def.buffSpeedMult || 1, stacks);
}
function getDamageCutMultiplier(unit){
  const stacks = getBuffStacks(unit);
  if (!stacks) return 1;
  return Math.pow(unit.def.buffDamageCutMult != null ? unit.def.buffDamageCutMult : 1, stacks);
}

// このユニットが死亡/消滅した際、そのユニットが与えていたバフを全員から取り除く
function clearBuffsFrom(deadUnit){
  if (!battle) return;
  battle.units.forEach(u => {
    if (u.buffSources) u.buffSources.delete(deadUnit);
  });
}

// 鼓舞兵の太鼓判定：近くに味方ゴブリンが一定数いれば太鼓を叩いてバフを付与する
function updateInspire(unit, dtMs){
  const def = unit.def;
  if (!def.canInspire || unit.dead) return;
  if (unit.inspireCooldown > 0){
    unit.inspireCooldown = Math.max(0, unit.inspireCooldown - dtMs);
    return;
  }
  if (unit.motion !== "walk" && unit.motion !== "idle") return; // 怯み中などは判定しない

  const nearbyGoblinAllies = battle.units.filter(other =>
    other !== unit && !other.dead && other.side === unit.side &&
    (other.def.race === "goblin" || other.def.buffEligible) &&
    Math.abs(other.x - unit.x) <= def.inspireRange
  );

  if (nearbyGoblinAllies.length < (def.inspireRequiredAllies || 2)) return;

  // 太鼓を叩くモーションへ(数ループ再生してから歩行に戻る)
  let loops = 0;
  const maxLoops = 2;
  const onDrumLoopEnd = () => {
    loops++;
    if (loops < maxLoops && !unit.dead){
      setMotion(unit, "drum", { onEnd: onDrumLoopEnd });
    } else if (!unit.dead){
      setMotion(unit, "walk", { loop:true });
    }
  };
  setMotion(unit, "drum", { onEnd: onDrumLoopEnd });
  unit.inspireCooldown = def.inspireCooldownMs || 4000;

  // 太鼓の衝撃波エフェクト
  if (def.fxDrumWave){
    const fx = def.fxDrumWave;
    for (let i = 0; i < fx.count; i++){
      setTimeout(() => {
        spawnFx(fx.imageBase + fx.prefix + (i+1) + ".png", unit.x, { height: 60, bottom: 74, lifespan: fx.durations[i] });
      }, i * (fx.durations[i] || 130));
    }
  }

  // バフ付与(このドラマーからまだ受けていない、かつ上限未満の味方ゴブリンのみ)
  nearbyGoblinAllies.forEach(ally => {
    if (!ally.buffSources) ally.buffSources = new Set();
    if (ally.buffSources.has(unit)) return;
    if (ally.buffSources.size >= (def.buffMaxStacks || 3)) return;
    ally.buffSources.add(unit);

    // rage_charge(猛突進)を持つキャラは、鼓舞された瞬間にそれを発動する(スーパーアーマー等を無視して割り込む)
    if (ally.def.frameCounts && ally.def.frameCounts.rage_charge){
      startRageCharge(ally);
    }

    // 特殊モーション(ゴブリン長)：鼓舞された瞬間に発動する
    if (ally.def.frameCounts && ally.def.frameCounts.special){
      startChiefSpecial(ally);
    }

    // 鼓舞を受けた瞬間、そのゴブリンは何をしていても強制的に咆哮する(スーパーアーマー等を無視して割り込む)
    if (ally.def.frameCounts && ally.def.frameCounts.roar){
      setMotion(ally, "roar", {
        onEnd: () => { if (!ally.dead) setMotion(ally, "walk", { loop:true }); }
      });
      const rfx = ally.def.fxRoarWave;
      if (rfx){
        const flip = ally.facing === -1; // キャラが左向きなら音波も反転
        for (let i = 0; i < rfx.count; i++){
          setTimeout(() => {
            if (ally.dead) return;
            spawnFx(rfx.imageBase + rfx.prefix + (i+1) + ".png", ally.x, { height: 50, bottom: 100, lifespan: rfx.durations[i], flip });
          }, i * (rfx.durations[i] || 175));
        }
      }
    }
  });
}

/* ---------- 罠兵：罠の設置 ---------- */

// 罠兵が設置できる3地点(自軍城前・ステージ中間・敵城前)のx座標を返す
function getTrapCheckpoints(unit){
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : 800;
  const ownFront = unit.side === "player" ? fieldWidth - 90 : 90;
  const midPoint = fieldWidth / 2;
  const enemyFront = unit.side === "player" ? 60 : fieldWidth - 60;
  return [ownFront, midPoint, enemyFront];
}

// 罠兵の罠設置判定：自軍城前→ステージ中間→敵城前の順に、その地点へ辿り着いた時だけ1つ設置する。
// 各地点は一度設置したら二度と使わない(合計で最大3個)。
function updateTrapper(unit, dtMs){
  const def = unit.def;
  if (!def.canTrap || unit.dead || unit.restrained) return;
  if (unit.motion !== "walk") return; // 設置中・怯み中などは判定しない

  const checkpoints = getTrapCheckpoints(unit);
  const idx = unit.trapCheckpointIndex || 0;
  if (idx >= checkpoints.length) return; // 3地点とも設置済み

  const targetX = checkpoints[idx];
  const forwardDir = unit.side === "player" ? -1 : 1;
  const reachTolerance = 3; // 敵城前(最終停止地点)がわずかに手前で止まっても到達扱いにする
  const reached = forwardDir < 0 ? unit.x <= targetX + reachTolerance : unit.x >= targetX - reachTolerance;
  if (!reached) return;

  setMotion(unit, "place_trap", {
    onEnd: () => {
      if (unit.dead) return;
      spawnTrap(unit, targetX);
      unit.trapCheckpointIndex = idx + 1;
      setMotion(unit, "walk", { loop:true });
    }
  });
}

// 罠エンティティを生成(見た目の網はtrap_fx_1〜6を使い、起動するまではtrap_fx_1のまま静止)
function spawnTrap(owner, trapX){
  const def = owner.def;
  const field = document.getElementById("battlefield");
  if (!field) return;

  const el = document.createElement("img");
  el.className = "fx-sprite trap-sprite";
  el.style.height = "36px";
  el.style.transform = "translateX(" + trapX + "px)";
  el.src = def.imageBase + "trap_fx_1.png";
  field.appendChild(el);

  battle.traps.push({
    owner, side: owner.side, x: trapX, el,
    state: "arming",     // arming → armed → triggering → holding
    armTimer: def.trapArmDelayMs || 1000,
    frameIndex: 0,
    frameTimer: 0,
    captured: [],
    removed: false
  });
}

// 全ての罠の状態更新：起動判定、網の展開アニメ、拘束対象の解放チェック
function updateTraps(dtMs){
  if (!battle || !battle.traps.length) return;
  battle.traps.forEach(trap => {
    if (trap.removed) return;
    const def = trap.owner.def;
    const durations = (def.frameDurations && def.frameDurations.trap_fx) || [1000];
    const frameCount = (def.frameCounts && def.frameCounts.trap_fx) || durations.length;

    if (trap.state === "arming"){
      trap.armTimer -= dtMs;
      if (trap.armTimer <= 0) trap.state = "armed";
      return;
    }

    if (trap.state === "armed"){
      const enemySide = trap.side === "player" ? "enemy" : "player";
      const nearby = battle.units.filter(u =>
        u.side === enemySide && !u.dead && !u.restrained && !u.mounted &&
        Math.abs(u.x - trap.x) <= (def.trapTriggerRadius || 50)
      );
      const catchable = nearby.filter(u => !u.def.netResistant); // 耐性持ちは罠にかからない
      if (catchable.length === 0) return; // 誰もいない、または耐性持ちしかいない間は起動しない

      trap.state = "triggering";
      trap.frameIndex = 1; // trap_fx_2(起動の瞬間)から再生開始
      trap.frameTimer = 0;
      trap.captured = catchable;

      // 捕獲対象の中で最も表示サイズが大きいキャラに合わせて網のエフェクトサイズを調整
      const maxHeight = Math.max(36, ...catchable.map(u => u._displayHeight || 60));
      trap.el.style.height = Math.round(maxHeight * 0.9) + "px";

      catchable.forEach(u => {
        u.restrained = true;
        u.restrainRemainingMs = (u.def.netBreakTimeMs != null) ? u.def.netBreakTimeMs : Infinity;
        u.img.style.visibility = "hidden"; // 本体だけ隠す(HPバーはelの子のまま残るので見え続ける)
      });
      return;
    }

    if (trap.state === "triggering" || trap.state === "holding"){
      trap.frameTimer += dtMs;
      const curDur = durations[Math.min(trap.frameIndex, durations.length - 1)];
      if (trap.frameTimer >= curDur && trap.frameIndex < frameCount - 1){
        trap.frameTimer -= curDur;
        trap.frameIndex++;
        if (trap.frameIndex >= frameCount - 1) trap.state = "holding";
      }
      trap.el.src = def.imageBase + "trap_fx_" + (trap.frameIndex + 1) + ".png";

      // 捕獲対象が全員(死亡または脱出で)いなくなったら罠を消滅させる
      trap.captured = trap.captured.filter(u => !u.dead && u.restrained);
      if (trap.state === "holding" && trap.captured.length === 0){
        trap.removed = true;
        trap.el.remove();
      }
    }
  });
  battle.traps = battle.traps.filter(t => !t.removed);
}

// 拘束時間の経過処理：netBreakTimeMsが設定されている敵は時間経過で自力脱出する
function updateRestraints(dtMs){
  if (!battle) return;
  battle.units.forEach(unit => {
    if (!unit.restrained || unit.dead) return;
    if (unit.restrainRemainingMs === Infinity) return;
    unit.restrainRemainingMs -= dtMs;
    if (unit.restrainRemainingMs <= 0){
      unit.restrained = false;
      unit.img.style.visibility = "visible";
      unit.target = null;
      const fallback = unit.def.frameCounts.walk ? "walk" : (unit.def.approachMotion || "walk");
      setMotion(unit, fallback, { loop:true });
    }
  });
}

/* ---------- 弓兵：毒の継続ダメージ ---------- */

// 毒状態の継続ダメージ処理(attacker=nullで自傷扱いにしない、applyDamageToUnitに再度毒を上書きさせない)
function updatePoison(unit, dtMs){
  if (unit.dead || !unit.poisonRemainingMs || unit.poisonRemainingMs <= 0) return;
  unit.poisonRemainingMs -= dtMs;
  unit.poisonTickTimer -= dtMs;
  if (unit.poisonTickTimer <= 0){
    unit.poisonTickTimer += unit.poisonTickIntervalMs || 1000;
    applyDamageToUnit(unit, unit.poisonDamagePerTick || 0, null);
  }
  if (unit.poisonRemainingMs <= 0){
    unit.poisonRemainingMs = 0;
  }
}

// 毒状態の紫霧エフェクトをユニットの上に重ねてループ表示する(鼓舞バフのオーラと同じ仕組み)
function updatePoisonFx(unit, dtMs){
  const active = !unit.dead && unit.poisonRemainingMs > 0 && unit.poisonFxDef;

  if (active && !unit.poisonFxEl){
    const img = document.createElement("img");
    img.className = "fx-sprite poison-status-fx";
    unit.el.appendChild(img);
    unit.poisonFxEl = img;
    unit.poisonFxFrame = 0;
    unit.poisonFxTimer = 0;
  }
  if (!active && unit.poisonFxEl){
    unit.poisonFxEl.remove();
    unit.poisonFxEl = null;
  }
  if (!unit.poisonFxEl) return;

  const fxDef = unit.poisonFxDef;
  unit.poisonFxTimer += dtMs;
  const dur = fxDef.durations[unit.poisonFxFrame] || 300;
  if (unit.poisonFxTimer >= dur){
    unit.poisonFxTimer -= dur;
    unit.poisonFxFrame = (unit.poisonFxFrame + 1) % fxDef.count;
  }
  unit.poisonFxEl.src = fxDef.imageBase + fxDef.prefix + (unit.poisonFxFrame + 1) + ".png";
  unit.poisonFxEl.style.left = "50%";
  unit.poisonFxEl.style.top = "10%";
}

/* ---------- 打ち上げ・吹き飛ばし(ラッシャーなど) ---------- */

const LAUNCH_GRAVITY = 1400; // px/s^2

// 対象を空中に打ち上げる(knockback:trueで後方への水平吹き飛びも同時に加える)
function launchUnit(target, attacker, opts){
  if (target.dead) return;
  if (target.def.staggerOnLaunch){ startStagger(target, attacker); return; } // 巨体は宙に浮かない
  opts = opts || {};
  target.launched = true;
  target.launchVY = opts.upSpeed || 380;
  if (opts.knockback){
    // 攻撃者から見て奥(=対象から見て後方)へ弾き飛ばす
    const awayDir = attacker ? Math.sign(target.x - attacker.x) || (target.side === "player" ? 1 : -1) : 1;
    target.launchVX = awayDir * (opts.backSpeed || 250);
  } else {
    target.launchVX = 0;
  }
  // 空中にいる間は吹き飛び&かち上げモーションを表示し続ける(着地するまでループ)
  if (target.def.frameCounts && target.def.frameCounts.blowback){
    setMotion(target, "blowback", { loop: true });
  }
}

// 打ち上げ中の物理更新(重力で放物線を描き、着地したらdown→getupを経ないと動けるようにならない)
function updateLaunch(unit, dtMs){
  if (!unit.launched) return;
  if (unit.dead){ unit.launched = false; return; }
  if (unit.motion !== "blowback") return; // 既に着地後のdown→getupを再生中：通常のadvanceUnitに任せる

  const dt = dtMs / 1000;
  unit.launchVY -= LAUNCH_GRAVITY * dt;
  unit.launchY += unit.launchVY * dt;
  if (unit.launchVX){
    unit.x += unit.launchVX * dt;
  }
  if (unit.launchY <= 0){
    unit.launchY = 0;
    unit.launchVY = 0;
    unit.launchVX = 0;

    const def = unit.def;
    const finishRecovery = () => {
      unit.launched = false; // ここで初めて動けるようになる
      if (unit.dead) return;
      const fallback = def.frameCounts.walk ? "walk" : (def.approachMotion || "walk");
      setMotion(unit, fallback, { loop:true });
    };
    // 着地の衝撃：down→getupの順で再生し切るまでunit.launchedをtrueのままにしてAIを止めておく
    if (def.frameCounts && def.frameCounts.down){
      setMotion(unit, "down", {
        onEnd: () => {
          if (unit.dead) return;
          if (def.frameCounts.getup){
            setMotion(unit, "getup", { onEnd: finishRecovery });
          } else {
            finishRecovery();
          }
        }
      });
    } else if (def.frameCounts && def.frameCounts.getup){
      setMotion(unit, "getup", { onEnd: finishRecovery });
    } else {
      finishRecovery();
    }
  }
  applyFrame(unit);
}

/* ---------- ヒーラー：回復オーラ ---------- */

// 鼓舞兵の太鼓と同じ仕組み：クールタイムが明けたら詠唱モーションを1回再生し、
// その瞬間に範囲内でHPが減っている味方をまとめて固定量回復する
function updateHealer(unit, dtMs){
  const def = unit.def;
  if (!def.canHeal || unit.dead || unit.restrained || unit.isReviving) return;
  if (unit.healCooldown > 0){
    unit.healCooldown = Math.max(0, unit.healCooldown - dtMs);
    return;
  }
  if (unit.motion !== "walk" && unit.motion !== "idle") return; // 蘇生中・怯み中などは判定しない

  const nearbyAllies = battle.units.filter(other =>
    other !== unit && !other.dead && other.side === unit.side &&
    other.hp < other.hpMax &&
    edgeDistance(unit, other) <= (def.healRadius || 0)
  );
  if (!nearbyAllies.length) return; // 回復が必要な味方がいなければ詠唱しない

  setMotion(unit, "heal_cast", {
    onEnd: () => { if (!unit.dead && !unit.isReviving) setMotion(unit, "walk", { loop:true }); }
  });
  unit.healCooldown = def.healTickIntervalMs || 1500;

  nearbyAllies.forEach(ally => {
    ally.hp = Math.min(ally.hpMax, ally.hp + (def.healAmountPerTick || 0)); // 回復量は固定
    applyFrame(ally);

    const fx = def.fxHealAura;
    if (fx){
      for (let i = 0; i < fx.count; i++){
        setTimeout(() => {
          if (ally.dead) return;
          spawnFx(fx.imageBase + fx.prefix + (i+1) + ".png", ally.x, { height: 50, bottom: 100, lifespan: fx.durations[i] });
        }, i * (fx.durations[i] || 200));
      }
    }
  });
}

/* ---------- ゴブリン長：旗バフ・特殊モーション ---------- */

// このユニットに旗バフを与えているゴブリン長を返す(いなければnull)。
// 対象は味方のゴブリン族全員(ゴブリン長本人を含む)、範囲は無制限。複数いても効果は重複しない。
function getFlagSource(unit){
  if (!battle || unit.dead || unit.def.race !== "goblin") return null;
  let best = null;
  battle.units.forEach(o => {
    if (o.dead || o.side !== unit.side || !o.def.flagCastleAtkMult) return;
    if (!best || o.def.flagCastleAtkMult > best.def.flagCastleAtkMult) best = o;
  });
  return best;
}
// 敵城に与えるダメージの倍率(旗バフ)
function getCastleDamageMult(unit){
  const src = getFlagSource(unit);
  return src ? src.def.flagCastleAtkMult : 1;
}

// 特殊モーション：鼓舞を受けた瞬間に発動。ステージ上の味方ゴブリン族全員(自身も)に
// 近接攻撃中のスーパーアーマーを付与する(再度鼓舞されると10秒に延長し直す)
function startChiefSpecial(unit){
  if (unit.dead || unit.charging || !battle) return;
  const ms = unit.def.specialArmorMs || 10000;
  battle.units.forEach(o => {
    if (!o.dead && o.side === unit.side && o.def.race === "goblin") o.attackArmorMs = ms;
  });
  setMotion(unit, "special", {
    onEnd: () => { if (!unit.dead) setMotion(unit, "walk", { loop:true }); }
  });
}

// 出血エフェクト：対象の上で1回再生して消える
function playBleedFx(target, attackerDef){
  const fx = attackerDef.fxBleed;
  if (!fx || !target.el) return;
  const img = document.createElement("img");
  img.className = "fx-sprite bleed-fx";
  target.el.appendChild(img);
  let i = 0;
  const step = () => {
    if (i >= fx.count || !img.isConnected){ img.remove(); return; }
    img.src = fx.imageBase + fx.prefix + (i + 1) + ".png";
    const d = fx.durations[i] || 175;
    i++;
    setTimeout(step, d);
  };
  step();
}

// 旗バフを受けている間だけ、頭上に小さな旗のアイコンを出す
function updateFlagBuff(unit){
  const src = getFlagSource(unit);
  if (src && !unit.flagFxEl){
    const img = document.createElement("img");
    img.className = "fx-sprite flag-buff-icon";
    img.src = src.def.imageBase + (src.def.fxFlagBuff || "flag_buff_fx_1.png");
    unit.el.appendChild(img);
    unit.flagFxEl = img;
  }
  if (unit.flagFxEl) unit.flagFxEl.style.height = (26 * (unit.scaleMult || 1)) + "px";
  if (!src && unit.flagFxEl){
    unit.flagFxEl.remove();
    unit.flagFxEl = null;
  }
}

/* ---------- ゴブリン長：中距離技(突進×字斬り→後退→5連斬り) ---------- */

function startMidrange(unit){
  const mid = unit.def.midrange;
  unit.midCooldown = mid.cooldownMs || 6000;
  unit.attackHadTarget = !!unit.target;
  setMotion(unit, mid.motion || "midrange", { onEnd: onAttackEnd });
}

// 中距離技モーション中の移動。コマごとの移動量(moveByFrame)をそのコマの表示時間で按分して毎tick動かす
function applyMidrangeMove(unit, dtMs){
  const def = unit.def;
  const mid = def.midrange;
  const motion = mid.motion || "midrange";
  const disp = (mid.moveByFrame && mid.moveByFrame[unit.frameIndex]) || 0;
  if (!disp) return;
  const durs = def.frameDurations[motion] || [];
  const dur = durs[unit.frameIndex] || 100;
  let step = disp * (dtMs / dur);
  const forwardDir = unit.side === "player" ? -1 : 1;
  if (step > 0 && unit.target && !unit.target.dead){
    // 前進は相手にめり込む手前で止める
    const gap = edgeDistance(unit, unit.target);
    const stopGap = mid.stopGap != null ? mid.stopGap : 26;
    step = Math.max(0, Math.min(step, gap - stopGap));
  }
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : 800;
  unit.x = Math.max(60, Math.min(fieldWidth - 60, unit.x + forwardDir * step));
  applyFrame(unit);
}

// 中距離技の命中処理：前方の一定距離以内にいる敵全員にダメージ(範囲攻撃)
function resolveMidrangeHit(unit, hit){
  if (!battle || battle.ended || unit.dead) return;
  const mid = unit.def.midrange;
  const enemySide = unit.side === "player" ? "enemy" : "player";
  const forwardDir = unit.side === "player" ? -1 : 1;
  const reach = hit.reach != null ? hit.reach : (mid.hitReach || 80);
  const dmg = getEffectiveAtk(unit) * (hit.mult != null ? hit.mult : 1);
  const victims = battle.units.filter(o =>
    !o.dead && !o.mounted && !o.elevated && !o.def.invulnerable && o.side === enemySide &&
    (Math.sign(o.x - unit.x) === forwardDir || o.x === unit.x) &&
    edgeDistance(unit, o) <= reach
  );
  victims.forEach(o => applyDamageToUnit(o, dmg, unit));
}

/* ---------- ゴブリン・キング ---------- */

// 担ぎ手のうち、まだ担いでいる(生きている)数
function kingBearersAlive(k){
  return (k.bearers || []).filter(b => !b.dead && b.bearerOf === k).length;
}

// 担ぎ手の位置・向きを、キングの担ぎ棒の端に合わせる
function updateBearerSync(b){
  const k = b.bearerOf;
  if (!k || b.dead) return;
  const W = k._displayWidth || 100;
  const bw = b._displayWidth || 30;
  const fe = k.facing === 1 ? b.slot.frac : 1 - b.slot.frac;
  b.x = k.x + fe * W - bw / 2;
  b.facing = k.facing;
  applyFrame(b);
}

// 担ぎ手のAI：攻撃はしない。キングが歩いている間は歩き、止まっている間は立つ
function updateBearerAI(b){
  const k = b.bearerOf;
  if (!k || k.dead){ b.bearerOf = null; return; }
  if (b.motion === "walk" || b.motion === "idle"){
    const want = (k.motion === "walk" && !k.grounded) ? "walk" : "idle";
    if (b.motion !== want) setMotion(b, want, { loop: true });
  }
}

// 担ぎ手が倒れた。全員倒れたら玉座が落下する
function onBearerDied(b){
  const k = b.bearerOf;
  b.bearerOf = null;
  if (!k || k.dead) return;
  if (kingBearersAlive(k) === 0) startKingDrop(k);
}

// キングが倒れた：残っている担ぎ手は、普通のユニットに戻る
function releaseBearers(k){
  (k.bearers || []).forEach(b => { if (!b.dead && b.bearerOf === k){ b.bearerOf = null; b.target = null; } });
}

function startKingDrop(k){
  if (k.dead || k.dropping || k.grounded) return;
  k.dropping = true;
  k.elevated = false; // 落ちたら、地上の攻撃も届く
  k.casting = null;
  k.castId = (k.castId || 0) + 1; // 大笑い中だったらゲートの召喚は中止
  setMotion(k, "drop", {
    onEnd: () => {
      k.dropping = false;
      k.grounded = true;
      k.rideY = 0;
      if (!k.dead) setMotion(k, "idle", { loop: true });
    }
  });
}

// 玉座の高さ：落下中(と倒れたあと)は、担ぎ手の肩の高さから地面まで下がる
function updateKingBody(k, dtMs){
  if (!k.def.kingLogic) return;
  if ((k.dropping || k.dead) && k.rideY > 0){
    k.rideY = Math.max(0, k.rideY - (k.def.carryHeight / 0.3) * (dtMs / 1000));
    applyFrame(k);
  }
}

function updateKingAI(k, dtMs){
  const def = k.def;
  if (k.grounded && k.motion === "walk"){ setMotion(k, "idle", { loop:true }); return; }
  if (!k.grounded && k.motion === "idle"){ setMotion(k, "walk", { loop:true }); return; }
  if (k.motion !== "walk" && k.motion !== "idle") return;

  // ゲート召喚：クールタイムが明けていて、敵が近くにいれば、大笑いして玉座を叩く
  const seen = findNearestEnemyInRange(k);
  if (def.gate && k.gateCooldown <= 0 && seen){ startLaugh(k); return; }

  // 敵を初めて見つけたときの反応
  if (!k.discovered && !k.grounded && seen){
    k.discovered = true;
    setMotion(k, "discover", { onEnd: () => setMotion(k, k.grounded ? "idle" : "walk", { loop:true }) });
    return;
  }
  if (k.grounded) return; // 玉座が落ちたら動けない

  // ゆっくり自城を目指す(担ぎ手が減ると遅くなる)
  const field = document.getElementById("battlefield");
  const fieldWidth = field.clientWidth;
  const destX = k.side === "player" ? 60 : fieldWidth - 60 - def.hitboxWidth;
  const dx = destX - k.x;
  const alive = kingBearersAlive(k);
  if (Math.abs(dx) > 2 && alive > 0){
    const speed = getEffectiveSpeed(k, def.walkSpeed) * (alive >= 2 ? 1 : 0.6);
    k.x += (dx > 0 ? 1 : -1) * speed * (dtMs / 1000);
    applyFrame(k);
  }
}

function startLaugh(k){
  k.gateCooldown = k.def.gate.cooldownMs;
  k.casting = "laugh";
  k.castId = (k.castId || 0) + 1;
  setMotion(k, "laugh", { onEnd: () => { k.casting = null; if (!k.dead) setMotion(k, k.grounded ? "idle" : "walk", { loop:true }); } });
}

function onKingFrame(k){
  const def = k.def;
  if (k.motion === "laugh" && k.casting === "laugh" && k.frameIndex === def.gate.spawnFrame) spawnGate(k);
  if (k.motion === "ring" && k.frameIndex === def.ringShatterFrame) onKingRingShatter(k);
}

// キングの背後の地面から、ゲートが出てくる
function spawnGate(k){
  const dir = k.side === "player" ? -1 : 1;
  const g = spawnUnit(k.def.gate.kind, k.side, 0);
  g.owner = k;
  g.lifeMs = g.def.lifeMs || 0;
  g.summonTimer = g.def.firstSummonMs || 1500;
  setMotion(g, "appear", { onEnd: () => setMotion(g, "idle", { loop:true }) });
  const field = document.getElementById("battlefield");
  const gw = 687 * g.def.pixelScale;
  const center = k.x + (k._displayWidth || 100) / 2 - dir * k.def.gate.behind;
  // 城(端から約85px)に重ならない位置までにとどめる
  const castleMargin = 85;
  g.x = Math.max(castleMargin, Math.min(field.clientWidth - castleMargin - gw, center - gw / 2));
  applyFrame(g);
}

// ゲートのAI：動かない。時間切れなら出現の逆再生で消え、出ている間は一定間隔でゴブリンを召喚する
function updateGateAI(g, dtMs){
  const def = g.def;
  if (g.motion === "vanish" || g.dead) return;
  if (def.lifeMs){
    g.lifeMs -= dtMs;
    if (g.lifeMs <= 0){
      g.dead = true; // 敵に狙われないよう、消え始めた時点で撃破扱いにする
      setMotion(g, "vanish", { onEnd: () => removeUnit(g) });
      return;
    }
  }
  if (g.motion !== "idle") return; // 出現の最中は召喚しない
  g.summonTimer -= dtMs;
  if (g.summonTimer <= 0){
    g.summonTimer += def.summonEveryMs;
    summonFromGate(g);
  }
}

// ゲートからゴブリンを1体召喚する(ゲートの前に、光の柱とともに現れる)
function summonFromGate(g){
  const list = g.def.summonList;
  const kind = list[Math.floor(Math.random() * list.length)];
  const gw = g._displayWidth || 80;
  const dir = g.side === "player" ? -1 : 1;
  const cx = g.x + gw / 2 + dir * gw * 0.35;
  const u = spawnUnit(kind, g.side, 0);
  u.x = cx - 15;
  applyFrame(u);
  const fx = g.owner && g.owner.def.fx ? g.owner.def.fx : CHAR_DEFS.king.fx;
  const sm = fx.summon;
  playFxSeq({
    imageBase: fx.imageBase, prefix: sm.prefix, count: sm.count, durations: constDurations(sm.count, sm.dur),
    height: sm.height, pos: () => ({ x: cx, bottom: 70 })
  });
}

/* ---- キングの指輪コンボ ---- */

function startKingRingCombo(k){
  if (!k || k.dead) return;
  k.casting = null;
  k.castId = (k.castId || 0) + 1;
  setMotion(k, "ring", { onEnd: () => { if (!k.dead) setMotion(k, k.grounded ? "idle" : "walk", { loop:true }); } });
}

// 指輪が砕けた：割れるエフェクトを出し、エネルギーを自城の前の地面へ飛ばす
function onKingRingShatter(k){
  const fx = k.def.fx;
  const hp = ringHandPos(k);
  const br = fx.ringBreak;
  playFxSeq({
    imageBase: fx.imageBase, prefix: br.prefix, count: br.count, durations: constDurations(br.count, br.dur),
    height: br.height, pos: () => ({ x: hp.x, bottom: hp.b - br.height / 2 })
  });
  const field = document.getElementById("battlefield");
  const cg = k.def.comboGate;
  const tx = k.side === "player" ? field.clientWidth - cg.fromCastle : cg.fromCastle; // 自城の目の前
  const ty = 76;
  const en = fx.energy;
  const h = en.height, w = h * 1024 / 339;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = h + "px";
  el.src = fx.imageBase + en.prefix + "1.png";
  field.appendChild(el);
  const dx = tx - hp.x, db = ty - hp.b;
  const flip = dx < 0;
  const phi = Math.atan2(-db, Math.abs(dx)) * 180 / Math.PI; // 進行方向の傾き(画面上で下向きが正)
  const len = Math.hypot(dx, db) || 1;
  const ux = dx / len, ub = db / len;
  let t = 0, frame = 0, ft = 0;
  const side = k.side;
  addFxTask(dt => {
    t += dt; ft += dt;
    while (ft >= en.dur){ ft -= en.dur; frame = (frame + 1) % en.count; el.src = fx.imageBase + en.prefix + (frame + 1) + ".png"; }
    const p = Math.min(1, t / cg.flightMs);
    const headX = hp.x + dx * p, headB = hp.b + db * p;
    // 画像の右3分の1にある光の玉が先頭、左へ尾が伸びる
    const cx = headX - ux * w * 0.33, cb = headB - ub * w * 0.33;
    el.style.bottom = (cb - h / 2) + "px";
    el.style.transform = "translateX(" + cx + "px) translateX(-50%) rotate(" + (flip ? -phi : phi) + "deg)" + (flip ? " scaleX(-1)" : "");
    if (p >= 1){
      el.remove();
      const im = fx.impact;
      playFxSeq({
        imageBase: fx.imageBase, prefix: im.prefix, count: im.count, durations: constDurations(im.count, im.dur),
        height: im.height, pos: () => ({ x: tx, bottom: 74 })
      });
      let wait = 0;
      addFxTask(dt2 => { wait += dt2; if (wait < cg.gateDelayMs) return true; spawnBigGate(k, side, tx); return false; });
      return false;
    }
    return true;
  });
}

// 自城の目の前に、永遠に消えない巨大ゲートが出る
function spawnBigGate(k, side, tx){
  if (!battle) return;
  const g = spawnUnit(k.def.comboGate.kind, side, 0);
  g.owner = k;
  g.summonTimer = g.def.firstSummonMs || 2400;
  setMotion(g, "appear", { onEnd: () => setMotion(g, "idle", { loop:true }) });
  const gw = 687 * g.def.pixelScale;
  g.x = tx - gw / 2;
  applyFrame(g);
}

/* ---------- ゴブリンの女王 ---------- */

function unitCenterX(u){ return u.x + (u._displayWidth || 0) / 2; }

// 毎フレーム進めるタスクを登録する(falseを返すと終了)。一時停止中は進まない
function addFxTask(fn){ if (battle) battle.fxList.push(fn); }

// コマ送りのエフェクトを1つ再生する。loopを指定すると、keep()がtrueの間だけ from〜to のコマを繰り返す
function playFxSeq(spec){
  const field = document.getElementById("battlefield");
  if (!field || !battle) return null;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = spec.height + "px";
  if (spec.blend) el.style.mixBlendMode = spec.blend;
  const urlOf = i => spec.imageBase + spec.prefix + (i + 1) + ".png";
  let frame = 0, t = 0;
  el.src = urlOf(0);
  field.appendChild(el);
  const place = () => {
    const p = spec.pos();
    el.style.bottom = p.bottom + "px";
    el.style.transform = "translateX(" + p.x + "px) translateX(-50%)" + (p.flip ? " scaleX(-1)" : "");
  };
  place();
  addFxTask(dt => {
    if (spec.alive && !spec.alive()){ el.remove(); return false; }
    t += dt;
    place();
    let dur = spec.durations[frame] || 150;
    while (t >= dur){
      t -= dur;
      if (spec.loop && frame === spec.loop.to && spec.loop.keep()) frame = spec.loop.from;
      else frame++;
      if (frame >= spec.count){ el.remove(); if (spec.onDone) spec.onDone(); return false; }
      el.src = urlOf(frame);
      dur = spec.durations[frame] || 150;
    }
    return true;
  });
  return el;
}

function constDurations(count, dur){ const a = []; for (let i = 0; i < count; i++) a.push(dur); return a; }

// バリア内の味方(4m以下)は遠距離攻撃を受けない。バリアは女王の前方にある
function isShielded(target){
  const tx = unitCenterX(target);
  return battle.units.some(q => {
    if (q.dead || q.side !== target.side || !(q.barrierMs > 0) || !q.def.skills || !q.def.skills.shield) return false;
    const W = q._displayWidth || 110;
    const reach = q.def.skills.shield.reach;
    const lo = q.facing === -1 ? q.x - reach : q.x;
    const hi = q.facing === -1 ? q.x + W : q.x + W + reach;
    return tx >= lo && tx <= hi;
  });
}

function tryQueenSkills(unit, rangeDist){
  const sk = unit.def.skills;
  if (unit.motion !== "walk" && unit.motion !== unit.def.approachMotion) return false;
  // シールド：射程の長い(遠距離攻撃を持つ)敵が近くにいて、バリアが張られていなければ張る
  if (sk.shield && unit.shieldCooldown <= 0 && !(unit.barrierMs > 0)){
    const threat = battle.units.some(o => !o.dead && o.side !== unit.side && o.def.ranged &&
      Math.abs(unitCenterX(o) - unitCenterX(unit)) <= sk.shield.range);
    if (threat){ startShieldCast(unit); return true; }
  }
  // メテオ：近接の間合いの外にいる相手が、メテオの射程内にいれば唱える
  if (sk.meteor && unit.meteorCooldown <= 0 && rangeDist > unit.def.attackRange + 20 && rangeDist <= sk.meteor.range){
    startMeteorCast(unit);
    return true;
  }
  return false;
}

function startShieldCast(unit){
  const sk = unit.def.skills.shield;
  unit.shieldCooldown = sk.cooldownMs;
  unit.casting = "shield";
  unit.castId = (unit.castId || 0) + 1;
  setMotion(unit, "shield", { onEnd: () => { unit.casting = null; onAttackEnd(unit); } });
}

function activateBarrier(unit){
  const sk = unit.def.skills.shield;
  const fx = unit.def.fx.barrier;
  unit.barrierMs = sk.durationMs;
  const aspect = 687 / 1024;
  const width = fx.height * aspect;
  playFxSeq({
    imageBase: unit.def.fx.imageBase, prefix: fx.prefix, count: fx.count, durations: constDurations(fx.count, fx.dur),
    height: fx.height,
    // 完成のコマ(3・4番目)を、バリアが続く間だけ交互に繰り返す。残り0.4秒になったら弱まって砕ける2コマへ
    loop: { from: 2, to: 3, keep: () => unit.barrierMs > fx.dur * 2 },
    alive: () => { if (unit.dead || unit.transforming){ unit.barrierMs = 0; return false; } return true; },
    pos: () => {
      const W = unit._displayWidth || 110;
      const front = unit.facing === 1 ? unit.x + W + width * 0.45 : unit.x - width * 0.45;
      return { x: front, bottom: 74, flip: unit.facing === -1 };
    }
  });
}

function startMeteorCast(unit){
  const sk = unit.def.skills.meteor;
  unit.meteorCooldown = sk.cooldownMs;
  unit.casting = "meteor";
  unit.castId = (unit.castId || 0) + 1;
  unit.castTargetX = unit.target ? unitCenterX(unit.target) : null;
  unit.attackHadTarget = !!unit.target;
  setMotion(unit, "meteor", { onEnd: () => { unit.casting = null; onAttackEnd(unit); } });
}

// 詠唱の途中で、女王の少し斜め前の上空に黒い穴を開け、穴からメテオを1発ずつ落とす
function openRift(unit){
  const sk = unit.def.skills.meteor;
  const fx = unit.def.fx.rift;
  const id = unit.castId;
  const field = document.getElementById("battlefield");
  const dir = unit.side === "player" ? -1 : 1;
  // 穴は「狙った敵の少し前(女王に近い側)」の上空に開く。開いたあとは動かない
  const tx0 = (unit.target && !unit.target.dead) ? unitCenterX(unit.target)
    : (unit.castTargetX != null ? unit.castTargetX : unitCenterX(unit) + dir * 200);
  const hx = tx0 - dir * sk.holeInFront;
  const hb = Math.min(74 + sk.holeHeight, field.clientHeight - sk.holeSize / 2 - 6);
  playFxSeq({
    imageBase: unit.def.fx.imageBase, prefix: fx.prefix, count: fx.count, durations: fx.durations,
    height: sk.holeSize, blend: "normal", // 穴は透過PNGなので通常合成
    alive: () => !unit.dead && unit.castId === id,
    pos: () => ({ x: hx, bottom: hb - sk.holeSize / 2 })
  });
  let t = 0;
  const fired = sk.launchAt.map(() => false);
  addFxTask(dt => {
    if (unit.dead || unit.castId !== id) return false;
    t += dt;
    sk.launchAt.forEach((at, i) => {
      if (!fired[i] && t >= at){
        fired[i] = true;
        // 穴の真下へ降り注ぐ。狙った敵が動いていたら、穴の近く(±40px)まで寄せて落とす
        const tx = (unit.target && !unit.target.dead) ? unitCenterX(unit.target) : hx;
        const land = Math.max(hx - 40, Math.min(hx + 40, tx));
        launchMeteor(unit.def.fx, unit.side, { x: hx, b: hb }, land, { travelMs: sk.travelMs, damage: sk.damage, radius: sk.radius });
      }
    });
    return !fired.every(f => f);
  });
}

// メテオを1発飛ばす(from=発射位置、toX=着弾する横位置)。尾が進行方向の後ろに伸びるよう回転させる
function launchMeteor(fx, side, from, toX, o){
  const field = document.getElementById("battlefield");
  if (!field || !battle) return;
  const m = fx.meteorFly;
  const h = m.height;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = h + "px";
  field.appendChild(el);
  const gb = 74; // 地面の高さ
  const dx = toX - from.x, db = gb - from.b;
  const len = Math.hypot(dx, db) || 1;
  const ux = dx / len, ub = db / len;
  const theta = Math.atan2(-ux, -ub) * 180 / Math.PI;
  let t = 0, frame = 0, ft = 0;
  el.src = fx.imageBase + m.prefix + "1.png";
  addFxTask(dt => {
    t += dt; ft += dt;
    while (ft >= m.dur){ ft -= m.dur; frame = (frame + 1) % m.count; el.src = fx.imageBase + m.prefix + (frame + 1) + ".png"; }
    const p = Math.min(1, t / o.travelMs);
    const hx = from.x + dx * p, hb = from.b + db * p; // 先端(岩)の位置
    const cx = hx - ux * h * 0.3, cb = hb - ub * h * 0.3; // 画像の中心(尾が後ろへ伸びる)
    el.style.bottom = (cb - h / 2) + "px";
    el.style.transform = "translateX(" + cx + "px) translateX(-50%) rotate(" + theta + "deg)";
    if (p >= 1){
      el.remove();
      meteorImpact(fx, side, toX, o);
      return false;
    }
    return true;
  });
}

// 着弾：爆発を出し、範囲内の敵ユニットにダメージを与える(城には当たらない)。味方には当たらない
function meteorImpact(fx, side, ix, o){
  const im = fx.meteorImpact;
  playFxSeq({
    imageBase: fx.imageBase, prefix: im.prefix, count: im.count, durations: constDurations(im.count, im.dur),
    height: im.height, pos: () => ({ x: ix, bottom: 74 })
  });
  const enemySide = side === "player" ? "enemy" : "player";
  battle.units.filter(u => !u.dead && !u.mounted && u.side === enemySide && Math.abs(unitCenterX(u) - ix) <= o.radius)
    .forEach(u => applyDamageToUnit(u, o.damage, null));
}

/* ---- 第二形態への移行 ---- */

function startTransform(unit){
  const def = unit.def;
  unit.transformed = true;
  unit.transforming = true;
  unit.casting = null;
  unit.castId = (unit.castId || 0) + 1; // 詠唱中の魔法・バリアはキャンセル
  unit.barrierMs = 0;
  unit.target = null;
  unit.staggerVX = 0;
  setMotion(unit, "transform", { onEnd: () => finishTransform(unit) });
  // 足元に広がる魔法陣：2コマ目と3コマ目を、移行モーションが終わるまで繰り返す
  const fx = def.fx.circle;
  playFxSeq({
    imageBase: def.fx.imageBase, prefix: fx.prefix, count: fx.count, durations: constDurations(fx.count, fx.dur),
    height: fx.height,
    loop: { from: 1, to: 2, keep: () => unit.transforming && !unit.dead },
    pos: () => ({ x: unitCenterX(unit), bottom: 70 })
  });
}

function finishTransform(unit){
  if (unit.dead) return;
  unit.transforming = false;
  unit.def = CHAR_DEFS[unit.def.transformTo];
  unit.form2 = true;
  unit.target = null;
  setMotion(unit, "walk", { loop:true });
}

// 移行モーションの途中で、魔法陣からヒーラーを召喚する
function summonQueenHealers(unit){
  const n = unit.def.transformHealers || 0;
  const center = unitCenterX(unit);
  for (let i = 0; i < n; i++){
    const h = spawnUnit("healer", unit.side, 0);
    const off = (i % 2 === 0 ? 1 : -1) * (120 + Math.floor(i / 2) * 60);
    h.x = center + off - (h._displayWidth || 30) / 2;
    applyFrame(h);
  }
}

/* ---- 指輪コンボ(キングとの連携) ---- */

// キングと女王がお互い場にいる状態になった瞬間に、指輪を掲げる。キングの動きはキング実装時に追加する
function checkRingCombo(unit){
  if (!battle || !unit.def.comboRole) return;
  const partner = battle.units.find(u => u !== unit && !u.dead && u.side === unit.side &&
    u.def.comboRole && u.def.comboRole !== unit.def.comboRole);
  if (!partner || battle.comboDone[unit.side]) return;
  battle.comboDone[unit.side] = true;
  const queen = unit.def.comboRole === "queen" ? unit : partner;
  const king = unit.def.comboRole === "king" ? unit : partner;
  startRingCombo(queen);
  startKingRingCombo(king);
}

function startRingCombo(queen){
  if (queen.transforming){ // 移行モーション中なら終わるまで待つ
    addFxTask(() => { if (queen.dead) return false; if (queen.transforming) return true; startRingCombo(queen); return false; });
    return;
  }
  if (queen.dead) return;
  queen.casting = null;
  queen.castId = (queen.castId || 0) + 1;
  queen.target = null;
  setMotion(queen, "ring", { onEnd: () => { if (!queen.dead) setMotion(queen, "walk", { loop:true }); } });
  // 20秒後から隕石が降り注ぐ(女王が倒されても降る)
  const cfg = queen.def.comboMeteor;
  const fx = queen.def.fx;
  const side = queen.side;
  let t = 0;
  addFxTask(dt => {
    t += dt;
    if (t < cfg.delayMs) return true;
    startMeteorRain(fx, side, cfg);
    return false;
  });
}

// 手の位置(掲げた指輪)の画面上の位置
function ringHandPos(unit){
  const W = unit._displayWidth || 110, H = unit._displayHeight || 120;
  const hand = unit.def.ringHand;
  const fe = unit.facing === 1 ? hand.x : 1 - hand.x;
  return { x: unit.x + fe * W, b: 74 + (unit.rideY || 0) + (1 - hand.y) * H };
}

// 指輪が砕ける瞬間：割れるエフェクトを出し、紫のエネルギーが天へ昇って画面外へ消える
function onRingShatter(unit){
  const fx = unit.def.fx;
  const hp = ringHandPos(unit);
  const br = fx.ringBreak;
  playFxSeq({
    imageBase: fx.imageBase, prefix: br.prefix, count: br.count, durations: constDurations(br.count, br.dur),
    height: br.height, pos: () => ({ x: hp.x, bottom: hp.b - br.height / 2 })
  });
  const en = fx.energy;
  const field = document.getElementById("battlefield");
  const h = en.height;
  const el = document.createElement("img");
  el.className = "fx-sprite";
  el.style.height = h + "px";
  el.src = fx.imageBase + en.prefix + "1.png";
  field.appendChild(el);
  let rise = 0, frame = 0, ft = 0;
  addFxTask(dt => {
    rise += en.riseSpeed * (dt / 1000);
    ft += dt;
    while (ft >= en.dur){ ft -= en.dur; frame = (frame + 1) % en.count; el.src = fx.imageBase + en.prefix + (frame + 1) + ".png"; }
    // 画像の上側が光の玉、下側が尾。玉が手の位置から真上へ昇る
    const bottom = hp.b - h * 0.65 + rise;
    if (bottom > field.clientHeight + 20){ el.remove(); return false; }
    el.style.bottom = bottom + "px";
    el.style.transform = "translateX(" + hp.x + "px) translateX(-50%)";
    return true;
  });
}

// 隕石の雨：ランダムな位置に、同じ場所には落ちないように降らせる
function startMeteorRain(fx, side, cfg){
  const field = document.getElementById("battlefield");
  const fw = field.clientWidth, fh = field.clientHeight;
  const used = [];
  let elapsed = 0, next = 0;
  addFxTask(dt => {
    elapsed += dt;
    if (elapsed >= cfg.durationMs) return false;
    next -= dt;
    while (next <= 0){
      next += cfg.intervalMs;
      let best = null, bestD = -1;
      for (let k = 0; k < 40; k++){
        const x = 40 + Math.random() * (fw - 80);
        const d = used.length ? Math.min.apply(null, used.map(u => Math.abs(u - x))) : Infinity;
        if (d >= cfg.minSeparation){ best = x; break; }
        if (d > bestD){ bestD = d; best = x; }
      }
      used.push(best);
      const startX = best + (Math.random() * 120 - 60);
      launchMeteor(fx, side, { x: startX, b: fh + 60 }, best, { travelMs: cfg.travelMs, damage: cfg.damage, radius: cfg.radius });
    }
    return true;
  });
}

// 女王のコマごとの出来事(コマが切り替わった瞬間に呼ばれる)
function onQueenFrame(unit){
  const def = unit.def;
  const sk = def.skills;
  if (unit.motion === "shield" && sk && sk.shield && unit.frameIndex === sk.shield.activateFrame) activateBarrier(unit);
  if (unit.motion === "meteor" && sk && sk.meteor && unit.frameIndex === sk.meteor.riftFrame) openRift(unit);
  if (unit.motion === "transform" && unit.frameIndex === def.healerFrame) summonQueenHealers(unit);
  if (unit.motion === "ring" && unit.frameIndex === def.ringShatterFrame) onRingShatter(unit);
}

/* ---------- ゴブリン・ビースト・フォートレス ---------- */

// 表示倍率(scaleMult)を変えたとき、読み込み済みの画像の大きさを即座に更新する
function applyUnitScale(unit){
  const img = unit.img;
  if (!img.naturalWidth) return;
  const def = unit.def;
  const motionScales = def.motionScale || {};
  const motionFactor = motionScales[img.dataset.motion] != null ? motionScales[img.dataset.motion] : 1;
  const scale = (def.pixelScale || 1) * motionFactor * (unit.scaleMult || 1);
  const dw = img.naturalWidth * scale;
  const dh = img.naturalHeight * scale;
  img.style.width = dw + "px";
  img.style.height = dh + "px";
  unit._displayWidth = dw;
  unit._displayHeight = dh;
}

// ゴブリンをフォートレスの背中に乗せる(小さく描き、フォートレスの画像の後ろ側に重ねる=手すりの奥に見える)
function mountRider(r, mount, slot){
  r.mounted = true;
  r.mount = mount;
  r.slot = slot;
  r.scaleMult = mount.def.riderScale || 0.42;
  r.uhpEl.style.display = "none";
  r.el.parentNode.insertBefore(r.el, mount.el);
  syncRiderToMount(r);
}

// 乗っているゴブリンの位置を、フォートレスの現在の位置・向き・大きさに合わせる
function syncRiderToMount(r){
  const m = r.mount;
  if (!m) return;
  const md = m.def;
  const W = m._displayWidth || 240;
  const H = m._displayHeight || 165;
  const rw = r._displayWidth || 20;
  const fe = m.facing === 1 ? r.slot.frac : 1 - r.slot.frac; // 左向き(自軍側)は画像が反転しているので後ろ端が右側
  r.x = m.x + fe * W - rw / 2;
  r.rideY = H * (r.slot.tower ? md.towerHeightFrac : md.deckHeightFrac);
  r.facing = m.facing;
  applyFrame(r);
}

// 乗っている間のゴブリンの行動：その場に立ち、弓兵だけ射程内の敵(いなければ敵城)を撃つ
function updateMountedAI(unit){
  const def = unit.def;
  if (unit.motion === "walk"){ // 太鼓を叩き終えたあと等に歩きモーションへ戻るので、その場に立たせる
    setMotion(unit, "idle", { loop:true });
    return;
  }
  if (!def.ranged || unit.motion !== "idle") return;

  const enemy = findNearestEnemyInRange(unit);
  let shoot = false;
  unit.target = null;
  if (enemy){
    if (edgeDistance(unit, enemy) <= def.attackRange){ unit.target = enemy; shoot = true; }
  } else {
    const field = document.getElementById("battlefield");
    const castleX = unit.side === "player" ? 60 : field.clientWidth - 60;
    if (Math.abs(unit.x - castleX) <= def.attackRange) shoot = true; // 敵城が射程に入った
  }
  if (!shoot) return;
  unit.attackHadTarget = !!unit.target;
  setMotion(unit, def.attackMotionName || "attack", {
    onEnd: () => { if (!unit.dead && unit.mounted && !unit.dismounting) setMotion(unit, "idle", { loop:true }); }
  });
}

function updateMount(unit, dtMs){
  if (!unit.mounted) return;
  if (unit.dismounting) updateDismount(unit, dtMs);
  else syncRiderToMount(unit);
}

// フォートレスが倒れたとき、背中のゴブリンを一人ずつ梯子から降ろし始める
function startDismount(m){
  (m.riders || []).forEach((r, i) => {
    if (r.dead || !r.mounted) return;
    r.dismounting = true;
    r.dismountPhase = "wait";
    r.dismountDelay = 500 + i * 450;
    r.startRideY = r.rideY;
  });
}

function hasRidersLeft(m){
  return (m.riders || []).some(r => !r.dead && r.mount === m);
}

// 梯子まで歩く → 梯子を降りる(降りながら通常の大きさに戻る) → 地上に降りて通常ユニットになる
function updateDismount(r, dtMs){
  const m = r.mount;
  if (!m){ finishDismount(r); return; }
  if (r.dismountDelay > 0){ r.dismountDelay -= dtMs; return; }
  if (r.dismountPhase === "wait"){
    r.dismountPhase = "walk";
    r.el.parentNode.appendChild(r.el); // フォートレスの体より手前に出す(梯子は手前側の側面にある)
    if (r.def.frameCounts.walk) setMotion(r, "walk", { loop:true });
  }
  const W = m._displayWidth || 240;
  const fe = m.facing === 1 ? m.def.ladderFrac : 1 - m.def.ladderFrac;
  const ladderX = () => m.x + fe * W - (r._displayWidth || 20) / 2;

  if (r.dismountPhase === "walk"){
    const dx = ladderX() - r.x;
    if (Math.abs(dx) <= 2){ r.dismountPhase = "climb"; return; }
    const dir = dx > 0 ? 1 : -1;
    r.x += dir * 100 * (dtMs / 1000);
    r.facing = dir;
    applyFrame(r);
    return;
  }

  // climb
  r.rideY = Math.max(0, r.rideY - 160 * (dtMs / 1000));
  const p = 1 - r.rideY / (r.startRideY || 1);
  const base = m.def.riderScale || 0.42;
  r.scaleMult = base + (1 - base) * p;
  applyUnitScale(r);
  r.x = ladderX();
  applyFrame(r);
  if (r.rideY <= 0) finishDismount(r);
}

function finishDismount(r){
  r.mounted = false;
  r.mount = null;
  r.dismounting = false;
  r.rideY = 0;
  r.scaleMult = 1;
  applyUnitScale(r);
  r.uhpEl.style.display = "";
  r.target = null;
  r.facing = r.side === "player" ? -1 : 1;
  const fallback = r.def.frameCounts.walk ? "walk" : (r.def.approachMotion || "walk");
  setMotion(r, fallback, { loop:true });
}

// 倒れたフォートレスは、背中のゴブリンが全員降りきるまで消えない
function updateFortressCorpse(unit){
  if (unit.dead && unit.riders && unit.downFinished && !hasRidersLeft(unit)) removeUnit(unit);
}

// 打ち上げ・吹き飛ばしは宙に浮かず、大きくよろめいて後退する
function startStagger(target, attacker){
  if (target.dead || target.transforming || !target.def.frameCounts.blowback) return;
  const awayDir = attacker ? (Math.sign(target.x - attacker.x) || 1) : 1;
  target.staggerVX = awayDir * (target.def.staggerSlideSpeed || 20);
  setMotion(target, "blowback", { onEnd: () => { target.staggerVX = 0; afterReaction(target); } });
}

// 踏み潰し：前方の一定距離以内にいる敵全員にダメージ(砂煙つき)
function resolveAreaHit(unit){
  const def = unit.def;
  const enemySide = unit.side === "player" ? "enemy" : "player";
  const forwardDir = unit.side === "player" ? -1 : 1;
  const centerX = unit.x + (def.hitboxWidth || 0) / 2;
  if (def.fxStompDust) spawnStompDust(unit);
  const dmg = getEffectiveAtk(unit);
  battle.units.filter(o =>
    !o.dead && !o.mounted && !o.elevated && !o.def.invulnerable && o.side === enemySide &&
    Math.sign(o.x - centerX) === forwardDir &&
    edgeDistance(unit, o) <= def.areaHitReach
  ).forEach(o => applyDamageToUnit(o, dmg, unit));
}

// 踏み潰しの砂煙：踏んだ足(体の前端付近)の地面に、5コマを順番に重ねる
function spawnStompDust(unit){
  const fx = unit.def.fxStompDust;
  const W = unit._displayWidth || 240;
  const fe = unit.facing === 1 ? fx.frontFrac : 1 - fx.frontFrac;
  const cx = unit.x + fe * W;
  let delay = 0;
  for (let i = 0; i < fx.count; i++){
    const dur = fx.durations[i] || 200;
    setTimeout(() => {
      if (!battle) return;
      const el = spawnFx(fx.imageBase + fx.prefix + (i + 1) + ".png", cx, { height: fx.height, bottom: 74, lifespan: dur });
      if (el) el.style.transform = "translateX(" + cx + "px) translateX(-50%)";
    }, delay);
    delay += dur;
  }
}

function setMotion(unit, motion, opts){
  opts = opts || {};
  // 詠唱(シールド・メテオ)の途中で別のモーションに切り替わった=中断された。詠唱に紐づく効果はキャンセルする
  if (unit.casting && motion !== unit.casting){
    unit.casting = null;
    unit.castId = (unit.castId || 0) + 1;
  }
  unit.motion = motion;
  unit.frameIndex = 0;
  unit.frameTimer = 0;
  unit.motionLoop = !!opts.loop;
  unit.onMotionEnd = opts.onEnd || null;
  applyFrame(unit);
  if (motion === "discover"){
    showAlertMark(unit);
  }
}

// 発見モーションに入った瞬間、頭上に共通の「！」マークを表示する
function showAlertMark(unit){
  const fx = FX_ALERT_MARK;
  if (!fx) return;
  const headBottom = 74 + (unit.img.offsetHeight || 90) + 6; // ユニットの頭の少し上
  for (let i = 0; i < fx.count; i++){
    setTimeout(() => {
      if (unit.dead) return;
      spawnFx(fx.imageBase + fx.prefix + (i+1) + ".png", unit.x, { height: 34, bottom: headBottom, lifespan: fx.durations[i] });
    }, i * (fx.durations[i] || 120));
  }
}

function applyFrame(unit){
  const def = unit.def;
  const count = def.frameCounts[unit.motion] || 1;
  const idx1 = Math.min(unit.frameIndex + 1, count);
  unit.img.dataset.motion = unit.motion; // 読み込み完了時にモーション別の縮尺補正を参照するため
  unit.img.src = frameUrl(def, unit.motion, idx1);

  const overrides = def.frameFacingOverride && def.frameFacingOverride[unit.motion];
