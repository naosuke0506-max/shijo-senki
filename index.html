<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>屍城戦記</title>
<style>
  :root{
    --bg: #100f0b;
    --bg-panel: #1b1911;
    --bg-panel-2: #242115;
    --line: #55492f;
    --line-dim: #3a3323;
    --text: #d9cfae;
    --text-dim: #8f8567;
    --blood: #7a2116;
    --blood-2: #9c3322;
    --rust: #a9793a;
    --gold: #c9a24a;
    --hp-enemy: #7a2116;
    --hp-player: #5c6b34;
    --shadow: rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
    width:100%; height:100%; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #app{ position:fixed; inset:0; }

  .screen{ position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  button{
    font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    cursor:pointer; border-radius:2px;
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text);
  }
  button:active{ transform:translateY(1px); }
  button.primary{ background:var(--blood); border-color:#4a140d; color:#f0e6d0; font-weight:700; }
  button:disabled{ opacity:.35; cursor:default; }

  /* 錆びた金属風の縁取り */
  .plate{
    background:linear-gradient(180deg,#2a2617,#1b1911);
    border:1px solid var(--line);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px var(--shadow);
  }

  /* ---------- タイトル ---------- */
  #screen-title{
    align-items:center; justify-content:center; text-align:center;
    background:
      radial-gradient(ellipse at 50% 25%, #241f14 0%, #0c0b08 75%);
  }
  #screen-title .sub{ color:var(--text-dim); margin-bottom:44px; font-size:.78rem; letter-spacing:.25em; font-family:'Yu Gothic',sans-serif; }

  /* ---------- 編成 ---------- */
  #screen-formation{ padding:14px; background:linear-gradient(180deg,#181510,#100f0b); overflow-y:auto; }
  #screen-formation > *{ flex-shrink:0; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar h2{ margin:0; font-size:1.05rem; color:var(--gold); letter-spacing:.1em; font-weight:400; }
  .topbar button{ font-family:'Yu Gothic',sans-serif; padding:8px 16px; font-size:.8rem; }

  .world-intro{ margin:14px 0 22px; color:var(--text-dim); font-size:.85rem; line-height:2; letter-spacing:.22em; text-align:center; }
  .unit-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; flex:none; align-content:start; overflow:visible; }

  .formation-slots{
    display:flex; gap:14px; padding:8px 10px; overflow-x:auto; flex-shrink:0;
    background:#0d0c09; border:1px solid var(--line); margin-bottom:12px;
  }
  .formation-slot{
    position:relative; width:56px; height:56px; flex-shrink:0;
    border:1px solid var(--line-dim); background:#050504; cursor:pointer;
  }
  .formation-slot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .formation-slot.empty{
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:1.3rem; border-style:dashed; cursor:pointer;
  }
  .formation-slot.active{ border-color:var(--gold); box-shadow:0 0 8px rgba(240,207,106,.75); }
  .formation-group{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
  .slot-link{ font-size:.55rem; color:var(--text-dim); height:.8rem; text-align:center; }
  #slot-editor{ display:none; background:#0d0c09; border:1px solid var(--line); padding:6px 8px; margin-bottom:8px; flex-shrink:0; }
  #slot-editor .editor-row{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-bottom:4px; }
  #slot-editor .editor-title{ font-size:.62rem; color:var(--gold); margin-right:4px; min-width:3.2em; }
  #slot-editor .editor-btn{ font-size:.62rem; padding:4px 8px; background:#1a1710; border:1px solid var(--line-dim); color:var(--text); border-radius:2px; }
  #slot-editor .editor-btn.sel{ border-color:var(--gold); color:var(--gold); background:#2a2412; }
  #slot-editor .editor-btn:disabled{ opacity:.35; }
  #morale-select{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; background:#0d0c09; border:1px solid var(--line); padding:5px 8px; margin-bottom:8px; flex-shrink:0; }
  #morale-select .editor-title{ font-size:.62rem; color:var(--gold); margin-right:4px; }
  #morale-select .editor-btn{ font-size:.62rem; padding:4px 8px; background:#1a1710; border:1px solid var(--line-dim); color:var(--text); border-radius:2px; }
  #morale-select .editor-btn.sel{ border-color:#c8963e; color:#e0b050; background:#2a2010; }
  .formation-group .role-label{ font-size:.62rem; color:var(--gold); letter-spacing:.1em; white-space:nowrap; }
  .formation-group .role-row{ display:flex; gap:6px; }
  .formation-slot .cost-tag{
    position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.75);
    font-size:.55rem; font-family:monospace; color:var(--gold); text-align:center;
  }

  .category-tabs{
    display:flex; gap:6px; padding:10px 0; margin-top:10px;
    border-top:1px solid var(--line); overflow-x:auto; flex-shrink:0;
    position:sticky; bottom:0; background:#100f0b;
  }
  .category-tab{
    flex-shrink:0; padding:8px 14px; font-size:.78rem; font-family:'Yu Gothic',sans-serif;
    background:#1a1710; border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
  }
  .category-tab.active{ color:var(--gold); border-color:var(--gold); }

  .unit-card{ cursor:pointer; }
  .unit-card.in-formation{ box-shadow:0 0 0 2px var(--gold) inset; }
  .unit-card{
    position:relative; padding:8px; text-align:center;
    background:linear-gradient(180deg,#252112,#1a1710);
    border:1px solid var(--line);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .unit-card.selected{ box-shadow:0 0 0 1px var(--gold) inset; }
  .unit-card .icon-wrap{
    width:64px; height:64px; margin:0 auto 6px; border-radius:2px; overflow:hidden;
    background:#050504; border:1px solid var(--line-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .unit-card .icon-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .unit-card .icon-fallback{ font-family:'Yu Gothic',sans-serif; font-size:.8rem; color:var(--text-dim); }
  .unit-card .name{ font-size:.78rem; font-family:'Yu Gothic',sans-serif; }
  .unit-card .cost{ font-size:.72rem; color:#b48ce8; font-family:monospace; }
  .unit-card .rank-tag{
    position:absolute; top:2px; left:2px; font-size:.55rem; padding:1px 4px;
    background:rgba(0,0,0,.5); color:var(--text-dim); font-family:'Yu Gothic',sans-serif;
  }
  .unit-card.locked{ opacity:.32; }
  .unit-card.locked::after{ content:"近日実装"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:.66rem; color:var(--text-dim); font-family:'Yu Gothic',sans-serif; background:rgba(0,0,0,.3); }

  /* ---------- ステージ選択 ---------- */
  #screen-stage{ padding:16px; align-items:center; background:linear-gradient(180deg,#181510,#100f0b); }
  .stage-list{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .stage-card{
    background:linear-gradient(180deg,#252112,#1a1710); border:1px solid var(--line);
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .stage-card .name{ font-size:1rem; letter-spacing:.05em; }
  .stage-card .hp{ font-size:.7rem; color:var(--text-dim); font-family:'Yu Gothic',sans-serif; margin-top:2px; }
  .stage-card button{ font-family:'Yu Gothic',sans-serif; padding:8px 18px; }


  /* =====================================================================
     画面全体の意匠：リアルなダークファンタジー
     黒ずんだ鉄・煤けた革・くすんだ金。背景は、戦線ごとの景色(stage.art)を使う。
     今後、水の戦線や城内の戦線が増えても、stage.art の画像を変えるだけで、
     メニューの景色・カードの絵が、その戦線のものに変わる。
     ===================================================================== */
  :root{ --mincho:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif; --bronze:#8c6b32; --bronze-hi:#c9a24a; --gold-hi:#f0d78c; --parch:#d9cfae; }
  button{
    background:linear-gradient(180deg,#2e271b 0%,#19140d 100%); border:1px solid #6b5630; color:var(--parch); text-shadow:0 1px 0 #000;
    box-shadow:inset 0 1px 0 rgba(255,225,160,.10), inset 0 -1px 0 rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.6);
  }
  button.primary{
    background:linear-gradient(180deg,#8f2c1d 0%,#56140c 100%); border-color:#a67a35; color:#f3e6c8;
    box-shadow:inset 0 1px 0 rgba(255,190,150,.25), inset 0 -2px 0 rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.7);
  }
  #app[data-screen="screen-battle"] #menu-backdrop{ display:none; }
  #screen-title, #screen-formation, #screen-stage, #screen-result{ background:transparent; }

  /* --- 背景(景色・霧・灰・鴉) --- */
  #menu-backdrop{ position:absolute; inset:0; overflow:hidden; background:linear-gradient(180deg,#07040a 0%,#120a0d 30%,#221012 55%,#341819 100%); }
  #menu-backdrop .mb-scene{ position:absolute; left:0; bottom:0; width:100vw; height:42.85vw; transition:filter 1s; }
  #menu-backdrop .mb-img{ position:absolute; inset:0; background-size:100% 100%; opacity:0; transition:opacity 1.4s; -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%); mask-image:linear-gradient(180deg,transparent 0,#000 14%); }
  #menu-backdrop .mb-scene.loaded .mb-img{ opacity:1; }
  #menu-backdrop img.mb-keep{ position:absolute; top:-12%; height:38%; width:auto; filter:brightness(.78) drop-shadow(0 4px 10px rgba(0,0,0,.6)); opacity:0; transition:opacity 1.4s;
    -webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 100%); mask-image:linear-gradient(180deg,#000 80%,transparent 100%); }
  #menu-backdrop img.mb-keep.on{ opacity:1; }
  #menu-backdrop img.mb-keep.enemy{ left:11%; } #menu-backdrop img.mb-keep.player{ left:77%; }
  #app:not([data-screen="screen-title"]) #menu-backdrop .mb-scene{ filter:blur(3px) brightness(.78); }
  #menu-backdrop .mb-cloud{ position:absolute; left:0; width:300vw; opacity:.5; background-repeat:repeat-x; background-size:100vw 100%; animation:mbFog 220s linear infinite; pointer-events:none;
    background-image:radial-gradient(ellipse 22vw 5vh at 12vw 40%,rgba(8,4,5,.9),transparent 72%),radial-gradient(ellipse 30vw 6vh at 50vw 60%,rgba(44,16,16,.7),transparent 72%),radial-gradient(ellipse 20vw 5vh at 84vw 35%,rgba(8,4,5,.85),transparent 72%); }
  #menu-backdrop .mb-fog{ position:absolute; left:0; width:300vw; background-repeat:repeat-x; background-size:100vw 100%; animation:mbFog 140s linear infinite; pointer-events:none; }
  #menu-backdrop .mb-fog.a{ top:28vh; height:36vh; opacity:.5;
    background-image:radial-gradient(ellipse 42vw 9vh at 18vw 55%,rgba(120,96,92,.5),transparent 72%),radial-gradient(ellipse 32vw 7vh at 68vw 40%,rgba(110,88,84,.42),transparent 72%); }
  #menu-backdrop .mb-fog.b{ bottom:0; height:40vh; opacity:.5; animation-duration:90s;
    background-image:radial-gradient(ellipse 46vw 10vh at 26vw 62%,rgba(96,78,72,.5),transparent 72%),radial-gradient(ellipse 36vw 8vh at 76vw 45%,rgba(90,72,66,.4),transparent 72%); }
  @keyframes mbFog{ from{ transform:translateX(0);} to{ transform:translateX(-100vw);} }
  #menu-backdrop .mb-ash i{ position:absolute; top:-12px; border-radius:50%; background:#a29a90; opacity:0; animation:mbAsh 24s linear infinite; }
  #menu-backdrop .mb-ash i.ember{ top:auto; bottom:-10px; background:#ffb45a; box-shadow:0 0 8px 3px rgba(255,120,40,.65); animation:mbEmber 8s ease-out infinite; }
  @keyframes mbAsh{ 0%{ transform:translate(0,0) rotate(0); opacity:0;} 10%{ opacity:.7;} 90%{ opacity:.45;} 100%{ transform:translate(26vw,112vh) rotate(300deg); opacity:0;} }
  @keyframes mbEmber{ 0%{ transform:translate(0,0) scale(1); opacity:0;} 14%{ opacity:1;} 100%{ transform:translate(12vw,-62vh) scale(.25); opacity:0;} }
  #menu-backdrop .mb-crow{ position:absolute; left:0; animation:mbCrow 50s linear infinite; opacity:.9; }
  #menu-backdrop .mb-crow svg{ display:block; fill:#0b0607; animation:crowFlap .5s ease-in-out infinite alternate; transform-origin:50% 60%; }
  @keyframes mbCrow{ from{ transform:translate(-10vw,0);} to{ transform:translate(112vw,-6vh);} }
  #menu-backdrop .mb-vignette{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 45%,rgba(0,0,0,.66) 100%), linear-gradient(90deg,rgba(120,22,16,.2),rgba(120,22,16,0) 24%), linear-gradient(270deg,rgba(70,80,44,.14),rgba(70,80,44,0) 20%); }
  #menu-backdrop .mb-dim{ position:absolute; inset:0; pointer-events:none; transition:opacity .8s; opacity:.86; background:linear-gradient(180deg,rgba(8,6,6,.7),rgba(8,6,6,.9)); }
  #app[data-screen="screen-title"] #menu-backdrop .mb-dim{ opacity:.34; }

  /* --- 飾り罫 --- */
  .title-orn{ display:flex; align-items:center; gap:14px; width:min(540px,72vw); margin:10px auto; }
  .title-orn i{ flex:1; height:1px; background:linear-gradient(90deg,transparent,#b8913f 40%,#b8913f 60%,transparent); }
  .title-orn b{ color:#b8913f; font-size:.7rem; text-shadow:0 0 8px rgba(184,145,63,.6); }

  /* --- 鍛えた鉄の大ボタン --- */
  .btn-forge{
    position:relative; font-family:var(--mincho); font-weight:900; font-size:1.25rem; letter-spacing:.5em; padding:16px 66px 16px calc(66px + .5em); color:#f4e4bd; border:1px solid #b8913f; border-radius:2px;
    background:linear-gradient(180deg,#9d3121 0%,#5c160d 100%);
    box-shadow:0 0 0 1px #000, 0 0 0 3px #6f5222, 0 0 0 4px #000, inset 0 1px 0 rgba(255,200,160,.3), inset 0 -3px 0 rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.8), 0 0 34px rgba(170,40,20,.32);
    text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); animation:forgePulse 3.4s ease-in-out infinite; }
  @keyframes forgePulse{ 0%,100%{ box-shadow:0 0 0 1px #000,0 0 0 3px #6f5222,0 0 0 4px #000,inset 0 1px 0 rgba(255,200,160,.3),inset 0 -3px 0 rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.8),0 0 30px rgba(170,40,20,.25);} 50%{ box-shadow:0 0 0 1px #000,0 0 0 3px #8a6a2c,0 0 0 4px #000,inset 0 1px 0 rgba(255,200,160,.3),inset 0 -3px 0 rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.8),0 0 44px rgba(190,50,24,.5);} }
  .btn-forge.sm{ font-size:.95rem; padding:11px 40px 11px calc(40px + .5em); }

  /* --- タイトル --- */
  #screen-title{ align-items:center; justify-content:flex-start; text-align:center; padding-top:8vh; }
  #screen-title .title-block{ display:flex; flex-direction:column; align-items:center; width:100%; }
  #screen-title h1{ font-family:var(--mincho); font-size:clamp(3.2rem,10vw,6.8rem); font-weight:900; letter-spacing:.2em; padding-left:.2em; margin:4px 0; line-height:1.1;
    background:linear-gradient(180deg,#f6e2a4 0%,#d2ab52 38%,#7d5b20 52%,#c79a44 68%,#f0d27c 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 #000) drop-shadow(0 8px 18px rgba(0,0,0,.85)) drop-shadow(0 0 34px rgba(170,40,20,.42)); }
  #screen-title .world-intro{ margin:2.4vh 0 4.4vh; font-size:clamp(.86rem,2.1vw,1.15rem); line-height:2.3; letter-spacing:.3em; color:#d2c6a4; text-shadow:0 0 10px #000,0 2px 4px #000; }
  #screen-title .world-intro span{ display:block; opacity:0; animation:introLine 1.6s ease-out forwards; animation-delay:calc(var(--i) * .75s + .6s); }
  @keyframes introLine{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  @media (max-height:520px){ #screen-title{ padding-top:3vh; } #screen-title h1{ font-size:3rem; } #screen-title .world-intro{ font-size:.8rem; line-height:1.9; margin:1vh 0 2vh; } .btn-forge{ padding-top:11px; padding-bottom:11px; font-size:1.05rem; } }

  /* --- 見出し(布陣・戦線選択) --- */
  .topbar{ padding-bottom:10px; margin-bottom:16px; border-bottom:1px solid transparent; border-image:linear-gradient(90deg,rgba(201,162,74,0),rgba(201,162,74,.75) 30%,rgba(201,162,74,.75) 70%,rgba(201,162,74,0)) 1; }
  .topbar h2{ font-family:var(--mincho); font-size:1.5rem; font-weight:900; letter-spacing:.3em;
    background:linear-gradient(180deg,#f3dc9a 0%,#c9a24a 55%,#8a6420 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; filter:drop-shadow(0 2px 3px #000); }
  .topbar button{ font-family:var(--mincho); font-weight:700; letter-spacing:.2em; }

  /* --- 布陣 --- */
  #screen-formation{ padding:16px 24px; }
  .formation-slots, #slot-editor, #morale-select{
    background:linear-gradient(180deg,rgba(30,25,18,.9),rgba(12,10,8,.94)); border:1px solid #5a4a2c;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 22px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.6); }
  .formation-slot{ border:1px solid #6b5630; background:#070605; box-shadow:inset 0 0 12px #000, 0 0 0 1px #000; }
  .formation-slot.empty{ border:1px dashed #6b5630; color:#8c6b32; }
  .formation-slot.active{ border-color:#f0cf6a; box-shadow:inset 0 0 12px #000, 0 0 0 1px #000, 0 0 12px rgba(240,207,106,.7); }
  .formation-group .role-label, #slot-editor .editor-title, #morale-select .editor-title{ font-family:var(--mincho); font-weight:700; color:#c9a24a; text-shadow:0 1px 0 #000; }
  #slot-editor .editor-btn, #morale-select .editor-btn{ font-family:var(--mincho); background:linear-gradient(180deg,#2a2318,#16120c); border:1px solid #5a4a2c; }
  .unit-card{ background:linear-gradient(180deg,#2c251a 0%,#14100b 100%); border:1px solid #5a4a2c; box-shadow:inset 0 0 0 1px rgba(0,0,0,.55), inset 0 0 18px rgba(0,0,0,.5); }
  .unit-card .icon-wrap{ position:relative; border:1px solid #6b5630; box-shadow:inset 0 0 14px rgba(0,0,0,.85), 0 0 0 1px #000; }
  .unit-card .icon-wrap::after{ content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%); }
  .unit-card .name{ font-family:var(--mincho); font-weight:700; letter-spacing:.06em; color:#e0d5b4; }
  .unit-card.in-formation{ border-color:#c9a24a; box-shadow:0 0 0 1px #c9a24a inset, 0 0 14px rgba(201,162,74,.32); }
  .category-tabs{ background:linear-gradient(0deg,rgba(8,6,5,.96),rgba(8,6,5,.86)); border-top:1px solid #5a4a2c; }
  .category-tab{ font-family:var(--mincho); font-weight:700; letter-spacing:.15em; background:linear-gradient(180deg,#2a2318,#16120c); border:1px solid #5a4a2c; }
  .category-tab.active{ color:#f0cf6a; border-color:#c9a24a; box-shadow:0 0 10px rgba(201,162,74,.25); }

  /* --- 戦線選択 --- */
  #screen-stage{ padding:18px 26px; align-items:stretch; }
  .stage-list{ flex:1; max-width:none; width:100%; margin-top:0; flex-direction:row; align-items:center; gap:26px; overflow-x:auto; padding:10px 6px 24px; scroll-snap-type:x mandatory; }
  .stage-list::before, .stage-list::after{ content:""; flex:1 0 0; }
  .stage-card{ position:relative; flex:0 0 auto; width:310px; padding:0; display:flex; flex-direction:column; align-items:stretch; gap:0; scroll-snap-align:center; clip-path:none;
    background:linear-gradient(180deg,rgba(32,26,19,.95),rgba(13,10,8,.97)); border:1px solid #6b5630;
    box-shadow:0 0 0 1px #000, 0 0 0 3px #3d3220, 0 0 0 4px #000, 0 12px 30px rgba(0,0,0,.8); }
  .stage-card{ min-height:430px; }
  .stage-card .sc-thumb{ position:relative; height:170px; overflow:hidden; border-bottom:1px solid #6b5630; background:radial-gradient(ellipse at 50% 60%,#4a1c1a,#120a0c); }
  .stage-card .sc-img{ position:absolute; inset:0; background-size:cover; background-position:center 16%; }
  .stage-card .sc-shade{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(12,9,7,.96) 100%), radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%); }
  .stage-card .sc-tag{ position:absolute; left:10px; top:10px; padding:2px 10px; font-family:var(--mincho); font-size:.72rem; letter-spacing:.3em; padding-left:calc(10px + .3em); color:#e0c98a; background:rgba(10,7,6,.78); border:1px solid #7a5f2c; }

  /* ステージ：ゲーム内の広さは固定(STAGE_W x STAGE_H = 2000 x 600)で、画面の大きさに合わせて縮小して表示する。
     縮小率は fitStage() が計算する。これにより、端末が違っても、射程・速度・マスの大きさ(ゲーム内の座標)は同じになる */
  :root{ --stage-scale: .4; --stage-offx: 0px; --stage-offy: 0px; }
  #battlefield-frame{
    position:absolute; left:0; right:0; top:64px; bottom:90px; overflow:hidden; background-color:#221f17;
  }
  #battlefield{
    position:absolute; left:0; top:0; width:2000px; height:600px;
    transform-origin:0 0; transform:translate(var(--stage-offx), var(--stage-offy)) scale(var(--stage-scale));
    overflow:hidden; background-color:#221f17;
  }
  #grid-overlay{ position:absolute; left:0; top:0; width:2000px; height:600px; pointer-events:none; z-index:1; }
  /* レーン選択ボタン(左端に縦に5つ。各レーンの行に合わせて fitStage() が位置を決める) */
  #lane-buttons{ position:absolute; left:0; top:0; bottom:0; width:58px; z-index:7; pointer-events:none; }
  #lane-buttons button{ position:absolute; left:2px; width:54px; pointer-events:auto; font-size:.58rem; padding:0; line-height:1.1;
    background-color:rgba(20,18,12,.78); border:1px solid #6b6248; color:#d8ccaa; border-radius:3px; }
  #lane-buttons button.selected{ background-color:#8a6a1e; border-color:#f0cf6a; color:#fff; font-weight:bold; }
  #lane-buttons.flash button{ animation:lanepulse .35s 3; }
  @keyframes lanepulse{ 0%,100%{ box-shadow:0 0 0 rgba(240,207,106,0); } 50%{ box-shadow:0 0 10px 3px rgba(240,207,106,.95); } }
  #battlefield-frame > button[id^="cheat-"]{ left:74px !important; display:none; } /* 検証用ボタンは、動作確認を押したときだけ出す */
  #battlefield-frame.debug-on > button[id^="cheat-"]{ display:block; }
  #lane-hint{ position:absolute; left:50%; top:6px; transform:translateX(-50%); z-index:9; pointer-events:none;
    background:rgba(0,0,0,.82); color:#f0cf6a; border:1px solid #8a6a1e; padding:6px 14px; border-radius:4px; font-size:.75rem;
    opacity:0; transition:opacity .25s; white-space:nowrap; }
  .lane-tag{ position:absolute; left:2px; top:2px; font-size:.5rem; background:rgba(138,106,30,.92); color:#fff; padding:1px 3px; border-radius:2px; }
  /* 名前の読み(長押しで表示するふきだし) */
  [data-reading]{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  #reading-tip{ position:fixed; z-index:99999; left:0; top:0; pointer-events:none; opacity:0; transition:opacity .15s;
    background:rgba(0,0,0,.94); color:#f0cf6a; border:1px solid #8a6a1e; border-radius:6px; padding:10px 18px 8px; font-size:1.25rem; line-height:1.9; white-space:nowrap; }
  #reading-tip rt{ font-size:.5em; color:#e8dcb0; }
  #reading-tip .tip-desc{ font-size:.72rem; line-height:1.5; letter-spacing:0; white-space:normal; width:min(320px, 80vw); color:#d8ccaa; margin-top:2px; }
  /* 役職のオーラ(総大将は、屍が立ちのぼる禍々しいオーラ) */
  .role-aura{ position:absolute; left:50%; bottom:-6%; width:260%; height:150%; transform:translateX(-50%); z-index:-1; pointer-events:none; }
  .role-aura i, .role-aura img{ position:absolute; pointer-events:none; }
  .role-general .glow{ inset:0; background:radial-gradient(ellipse at 50% 78%, rgba(160,20,110,.62) 0%, rgba(80,10,120,.46) 30%, rgba(20,0,30,0) 68%); animation:auraPulse 1.5s ease-in-out infinite; }
  .role-general .mist{ bottom:6%; width:38%; height:78%; background:radial-gradient(ellipse at 50% 62%, rgba(70,0,90,.62), rgba(0,0,0,0) 70%); filter:blur(3px); opacity:0; animation:mistRise 3.4s linear infinite; }
  .role-general .m1{ left:8%; } .role-general .m2{ left:31%; animation-delay:1.1s; } .role-general .m3{ left:54%; animation-delay:2.2s; }
  .role-general .skull{ bottom:10%; width:11%; opacity:0; filter:drop-shadow(0 0 4px rgba(190,60,230,.9)); animation:skullRise 3.6s ease-in infinite; }
  .role-general .s0{ left:14%; animation-delay:0s; } .role-general .s1{ left:26%; animation-delay:.6s; } .role-general .s2{ left:38%; animation-delay:1.3s; }
  .role-general .s3{ left:50%; animation-delay:1.9s; } .role-general .s4{ left:62%; animation-delay:2.5s; } .role-general .s5{ left:74%; animation-delay:.9s; } .role-general .s6{ left:44%; animation-delay:3s; }
  .role-elder .ring, .role-captain .ring, .role-chief .ring{ left:22%; right:22%; bottom:4%; height:16%; border-radius:50%; animation:auraPulse 2s ease-in-out infinite; }
  .role-elder .ring{ border:2px solid rgba(220,220,235,.75); box-shadow:0 0 9px rgba(220,220,235,.55); }
  .role-captain .ring{ border:2px solid rgba(224,88,74,.85); box-shadow:0 0 9px rgba(224,88,74,.6); }
  .role-chief .ring{ border:2px solid rgba(90,180,200,.85); box-shadow:0 0 9px rgba(90,180,200,.6); }
  .role-morale .glow{ inset:0; background:radial-gradient(ellipse at 50% 80%, rgba(196,146,52,.6), rgba(150,100,30,.3) 34%, rgba(0,0,0,0) 66%); animation:auraPulse 2s ease-in-out infinite; }
  .role-morale .ring{ left:20%; right:20%; bottom:4%; height:16%; border-radius:50%; border:2px solid rgba(206,156,62,.9); box-shadow:0 0 10px rgba(206,156,62,.65); animation:auraPulse 2s ease-in-out infinite; }
  .role-vanguard .ring{ border:2px solid rgba(170,210,90,.85); box-shadow:0 0 9px rgba(170,210,90,.6); }
  .role-assault .ring{ border:2px solid rgba(255,140,50,.85); box-shadow:0 0 9px rgba(255,140,50,.6); }
  .role-special .ring{ border:2px solid rgba(240,207,106,.9); box-shadow:0 0 9px rgba(240,207,106,.65); }
  .role-vanguard .ring, .role-assault .ring, .role-special .ring{ left:22%; right:22%; bottom:4%; height:16%; border-radius:50%; animation:auraPulse 2s ease-in-out infinite; }
  .role-name-vanguard{ color:#b8e06a; } .role-name-assault{ color:#ffa060; } .role-name-special{ color:#f0cf6a; }
  @keyframes auraPulse{ 0%,100%{ opacity:.7; transform:scale(1); } 50%{ opacity:1; transform:scale(1.07); } }
  @keyframes mistRise{ 0%{ transform:translateY(25%) scale(.8); opacity:0; } 30%{ opacity:.95; } 100%{ transform:translateY(-95%) scale(1.35); opacity:0; } }
  @keyframes skullRise{ 0%{ transform:translateY(0) scale(.7); opacity:0; } 15%{ opacity:.9; } 100%{ transform:translateY(-230%) scale(1.2) rotate(9deg); opacity:0; } }
  /* HPバーの上の役職名 */
  .role-name{ position:absolute; left:50%; top:-36px; white-space:nowrap; font-size:20px; letter-spacing:.12em; font-weight:bold; pointer-events:none; z-index:7;
    text-shadow:0 0 3px #000, 0 0 3px #000, 0 1px 2px #000; }
  .role-name-general{ color:#e4a6ff; } .role-name-elder{ color:#e6e6f0; } .role-name-captain{ color:#ff8a7a; } .role-name-chief{ color:#7fd0e4; }
  /* 役職の告知 */
  #role-banner-layer{ position:fixed; left:0; right:0; top:26%; z-index:99990; pointer-events:none; text-align:center; }
  .role-banner{ display:block; margin:0 auto 6px; width:fit-content; color:#f0cf6a; letter-spacing:.35em; white-space:nowrap; opacity:0;
    background:linear-gradient(90deg, rgba(20,0,10,0), rgba(24,0,16,.92) 18%, rgba(24,0,16,.92) 82%, rgba(20,0,10,0));
    border-top:1px solid #8a6a1e; border-bottom:1px solid #8a6a1e; text-shadow:0 0 14px rgba(170,50,220,.95); }
  .role-banner.big{ font-size:1.7rem; padding:10px 60px; animation:bannerBig 2.4s ease forwards; }
  .role-banner.small{ font-size:.85rem; padding:3px 26px; animation:bannerSmall 1.5s ease forwards; }
  .role-banner.enemy{ color:#ff7a68; text-shadow:0 0 14px rgba(255,60,40,.95); border-color:#8a2a1e; }
  @keyframes bannerBig{ 0%{ opacity:0; transform:scale(1.5); } 12%{ opacity:1; transform:scale(1); } 80%{ opacity:1; } 100%{ opacity:0; } }
  @keyframes bannerSmall{ 0%{ opacity:0; transform:translateY(6px); } 15%{ opacity:1; transform:none; } 80%{ opacity:1; } 100%{ opacity:0; } }
  /* 戦列の選択の強調(戦場を直接タップして選ぶ) */
  .lane-band{ position:absolute; left:0; width:100%; height:100px; background:rgba(240,207,106,.10); border-top:1px solid rgba(240,207,106,.45); border-bottom:1px solid rgba(240,207,106,.45); pointer-events:none; z-index:2; display:none; }

  /* 城：戦列が5本あるので、塔を1つ置くのではなく、全戦列に沿う城壁として描く。壁の手前(戦場側)に兵が立つ。壁の奥の遠い角に、城の本体が見える */
  .castle{ position:absolute; top:26px; bottom:0; width:64px; z-index:4; pointer-events:none; }
  .castle.enemy{ left:0; box-shadow:10px 0 18px rgba(0,0,0,.6); }

  .castle.player .w-body{ background:linear-gradient(270deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,0) 46%,rgba(0,0,0,.34) 100%), repeating-linear-gradient(180deg,#6b6556 0 18px,#2d2922 18px 20px); }
  .castle .w-teeth{ position:absolute; top:0; bottom:0; }

  .castle.player .w-teeth{ left:0; width:13px; background:repeating-linear-gradient(180deg,#8d8471 0 13px,transparent 13px 25px); }
  .castle .w-gate{ position:absolute; width:30px; height:60px; border-radius:15px 15px 2px 2px; }

  .castle.player .w-gate{ left:7px; background:linear-gradient(180deg,#17100a,#33261a); border:2px solid #12100c; box-sizing:border-box; box-shadow:inset 0 0 8px #000; }
  .castle .w-torch{ position:absolute; width:8px; height:8px; border-radius:50%; background:#ffc36a; box-shadow:0 0 14px 6px rgba(255,130,40,.6); animation:torchFlicker 1.3s ease-in-out infinite alternate; }
  .castle.enemy .w-torch{ right:20px; } .castle.player .w-torch{ left:22px; }
  .castle .w-banner{ position:absolute; width:12px; height:38px; background:linear-gradient(180deg,#7a1f18,#43100c); clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); }
  .castle.player .w-banner{ left:30px; }
  .castle .w-skull{ position:absolute; right:24px; width:12px; height:12px; border-radius:50% 50% 42% 42%; background:#c8b898; box-shadow:inset -2px -2px 0 rgba(0,0,0,.28); }
  @keyframes torchFlicker{ from{ opacity:.72; transform:scale(.9);} to{ opacity:1; transform:scale(1.1);} }



  /* ===== 使えない戦列(闇に沈む)・導き ===== */

    background-image:radial-gradient(ellipse 380px 60px at 200px 50%,rgba(80,64,60,.55),transparent 72%),radial-gradient(ellipse 300px 50px at 700px 40%,rgba(70,56,52,.45),transparent 72%); }
  .castle .w-gate.off{ background:#0b0806; box-shadow:inset 0 0 8px #000; border-color:#0b0806; }
  #guide-bar{ position:absolute; left:50%; top:74px; transform:translate(-50%,-8px); z-index:9; max-width:min(600px,82vw); padding:9px 26px; text-align:center; font-family:var(--mincho); font-size:.95rem; letter-spacing:.16em; color:#efe0b8;

// 画像読み込みに失敗した場合のフォールバック(キャラ名の頭文字を表示するプレースホルダー)
function attachImgFallback(imgEl, label){
  imgEl.addEventListener("error", () => {
    if (imgEl.dataset.fallbackApplied) return;
    imgEl.dataset.fallbackApplied = "1";
    const box = document.createElement("div");
    box.className = "icon-fallback";
    box.textContent = label || "?";
    imgEl.replaceWith(box);
  }, { once:true });
}

   ランク名は後日決定(仮に rank:null としておく)。
   ========================================================= */
// ゲートの召喚予定を作る。「残り何秒のときに召喚するか」を、キャラごとに並べて指定する(ゲートが出現してからの経過秒に直して並べ替える)
function buildSummonSchedule(remainingByKind, totalSec){
  const list = [];
  Object.keys(remainingByKind).forEach(kind => {
    remainingByKind[kind].forEach(r => list.push({ at: totalSec - r, kind }));
  });
  list.sort((a, b) => a.at - b.at);
  return list;
}

const screens = {};
document.querySelectorAll(".screen").forEach(el => screens[el.id] = el);
function showScreen(id){
  Object.values(screens).forEach(el => el.classList.remove("active"));
  screens[id].classList.add("active");
  const app = document.getElementById("app"); if (app) app.dataset.screen = id; // 背景の景色・暗さが、画面ごとに変わる
}

// 布陣の役職(名前は仮)。布陣は10枠で、役職ごとの枠数が決まっている。役職に就けるのも、空けておくのも自由。
// limit: 招集の制限。perBattle=1試合に出せる回数、alive=同時に戦場にいられる数(1種類のキャラごと)
// 効果(数値は仮)：
//  先手   … 自分の移動速度が上がる。新しい相手への最初の一撃が、威力を増す(先手必勝)
//  斬込隊 … 敵の役職者(総大将・宿老・部隊長・組頭・先手・斬込隊・特殊兵)への攻撃力が上がる(役職狩り)
//  総大将 … 自分のHPが増える。生きている間、毎秒 corpsePerSec の屍を生む。倒れると、味方全員が shakenMs の間、攻撃が shakenAtkMult 倍になる。禍々しい屍のオーラをまとう
//  宿老   … 自分の戦列と上下1つの戦列の、半径 auraRadius 以内の味方の、被ダメージが auraDmgMult 倍になる
//  部隊長 … 自分と同じ戦列の、半径 auraRadius 以内の味方の、移動速度が auraSpeedMult 倍になる
//  組頭   … 自分のHPと攻撃が、それぞれ selfHpMult・selfAtkMult 倍になる
//  big=true の役職は、出現・討死のときに、画面に大きく告知が出る

function makeEmptySlots(){
  const slots = [];
  FORMATION_ROLES.forEach(r => { for (let i = 0; i < r.defaultCount; i++) slots.push({ role: r.id, kind: null, parent: null }); });
  return slots;
}

  formationSlots: makeEmptySlots(),  // 10枠。それぞれ {role, kind, parent(上官・守る相手の枠の番号)}
  selectedUnits: [],                 // 枠の順に並べた、布陣しているキャラ(枠から自動で作る)

function loadCleared(){ try { return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || "[]")); } catch (e) { return new Set(); } }
function saveCleared(){ try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(Array.from(state.cleared))); } catch (e) {} }
state.cleared = loadCleared();
function stageUnlocked(i){ return i === 0 || state.cleared.has(STAGES[i - 1].id); }
// 上官の指定が、いまの役職・キャラの状態と合っているかを確認して、合わないものは外す
function sanitizeFormation(){
  const slots = state.formationSlots;
  slots.forEach((sl, i) => {
    if (sl.parent == null) return;
    const ps = slots[sl.parent];
    const ok = ps && ps.kind && sl.parent !== i && (FOLLOW_RULES[ps.role] || []).indexOf(sl.role) !== -1;
    if (!ok) sl.parent = null;
  });
}
function syncSelectedUnits(){ sanitizeFormation(); state.selectedUnits = state.formationSlots.filter(sl => sl.kind).map(sl => sl.kind); }
function setDefaultFormation(){
  const slots = makeEmptySlots();
  const place = (role, kinds) => { let i = 0; slots.forEach(sl => { if (sl.role === role && i < kinds.length) sl.kind = kinds[i++]; }); };
  place("elder",   ["drummerGoblin"]);
  place("captain", ["bruteGoblin", "catapult"]);
  place("chief",   ["goblin", "trapper"]);
  place("foot",    ["soldier", "spearman", "shieldman", "arquebusier"]);
  state.formationSlots = slots;
  syncSelectedUnits();
}

}
function roleOfKind(kind){
  const sl = state.formationSlots.find(x => x.kind === kind);

}

// テイマーのように、召喚すると付随するユニットも同時に出るキャラのコスト合計(セット価格)を返す
function getDeployCost(def){
  let total = def.cost;
  (def.summons || []).forEach(s => {
    const sub = CHAR_DEFS[s.kind];
    if (sub) total += sub.cost * s.count;
  });
  return total;
}

  let el = document.getElementById("toast");

// 上部：10枠の布陣。枠ごとに役職を変えられる(何かを削って、何かを足す)。
// 枠をタップして選び、下の一覧のキャラをタップすると、その枠に入る。選んだ枠の下に、役職と上官(守る相手)を選ぶ画面が出る。
function roleCount(roleId){ return state.formationSlots.filter(sl => sl.role === roleId).length; }

function buildFormationSlots(){
  const wrap = document.getElementById("formation-slots");
  wrap.innerHTML = "";
  state.formationSlots.forEach((sl, idx) => {
    const role = roleCfg(sl.role);
    const cell = document.createElement("div");
    cell.className = "formation-group";
    const label = document.createElement("div");
    label.className = "role-label";
    label.textContent = role.label;
    label.dataset.reading = role.reading;
    label.dataset.desc = role.intro;
    cell.appendChild(label);
    const slot = document.createElement("div");
    if (sl.kind){
      const def = CHAR_DEFS[sl.kind];
      slot.className = "formation-slot" + (state.activeSlot === idx ? " active" : "");
      slot.dataset.rname = def.name; slot.dataset.reading = def.reading || ""; slot.dataset.desc = unitDesc(def);
      slot.innerHTML = `<img src="${def.icon}" alt="${def.name}"><div class="cost-tag corpse">${getDeployCost(def)}</div>`;
      attachImgFallback(slot.querySelector("img"), def.name);
    } else {
      slot.className = "formation-slot empty" + (state.activeSlot === idx ? " active" : "");
      slot.textContent = "+";
    }
    slot.addEventListener("click", () => {
      state.activeSlot = state.activeSlot === idx ? null : idx; // 枠を選ぶ(もう一度押すと解除)
      buildFormationScreen();
    });
    cell.appendChild(slot);
    // 上官(守る相手)の表示
    const link = document.createElement("div");
    link.className = "slot-link";
    if (sl.parent != null){
      const pr = roleCfg(state.formationSlots[sl.parent].role);
      link.textContent = "従:" + pr.short;
    }
    cell.appendChild(link);
    wrap.appendChild(cell);
  });
  const count = document.createElement("div");
  count.className = "formation-count";
  count.textContent = state.selectedUnits.length + "/" + MAX_FORMATION;
  count.style.cssText = "align-self:center;margin-left:4px;color:var(--text-dim);font-size:.9rem;white-space:nowrap;";
  wrap.appendChild(count);
  buildSlotEditor();
  buildMoraleSelect();
}

// 選んでいる枠の、役職・キャラ・上官を編集する画面
function buildSlotEditor(){
  const box = document.getElementById("slot-editor");
  box.innerHTML = "";
  const idx = state.activeSlot;
  if (idx == null){ box.style.display = "none"; return; }
  box.style.display = "block";
  const sl = state.formationSlots[idx];
  const mk = (text, cls, onclick, reading, desc) => {
    const b = document.createElement("button");
    b.className = "editor-btn" + (cls ? " " + cls : "");
    b.textContent = text;
    if (reading) b.dataset.reading = reading;
    if (desc) b.dataset.desc = desc;
    if (onclick) b.addEventListener("click", onclick); else b.disabled = true;
    return b;
  };
  // キャラ(外す・入れ替え)
  if (sl.kind){
    const r0 = document.createElement("div"); r0.className = "editor-row";
    const t0 = document.createElement("span"); t0.className = "editor-title"; t0.textContent = "キャラ"; r0.appendChild(t0);
    const nm = document.createElement("span"); nm.style.cssText = "font-size:.7rem;color:var(--text);margin-right:6px;"; nm.textContent = CHAR_DEFS[sl.kind].name + "(下の一覧から選ぶと入れ替わる)"; r0.appendChild(nm);
    r0.appendChild(mk("外す", "", () => { sl.kind = null; sl.parent = null; syncSelectedUnits(); buildFormationScreen(); }));
    box.appendChild(r0);
  }
  // 役職
  const r1 = document.createElement("div"); r1.className = "editor-row";
  const t1 = document.createElement("span"); t1.className = "editor-title"; t1.textContent = "役職"; r1.appendChild(t1);
  FORMATION_ROLES.forEach(role => {
    const n = roleCount(role.id);
    const cur = sl.role === role.id;
    const full = !cur && n >= role.max;
    const b = mk(role.label + " " + n + "/" + role.max, cur ? "sel" : "", full ? null : () => {
      sl.role = role.id;
      syncSelectedUnits();
      buildFormationScreen();
    }, role.reading, role.intro);
    r1.appendChild(b);
  });
  box.appendChild(r1);
  // 上官・守る相手
  if (sl.role !== "general"){
    const r2 = document.createElement("div"); r2.className = "editor-row";
    const t2 = document.createElement("span"); t2.className = "editor-title"; t2.textContent = "上官"; r2.appendChild(t2);
    r2.appendChild(mk("なし", sl.parent == null ? "sel" : "", () => { sl.parent = null; buildFormationScreen(); }));
    state.formationSlots.forEach((ps, pi) => {
      if (pi === idx || !ps.kind || (FOLLOW_RULES[ps.role] || []).indexOf(sl.role) === -1) return;
      r2.appendChild(mk(roleCfg(ps.role).label + ":" + CHAR_DEFS[ps.kind].name, sl.parent === pi ? "sel" : "", () => { sl.parent = pi; buildFormationScreen(); }));
    });
    box.appendChild(r2);
  }
}

// 中段：選択中のカテゴリーに属するユニット一覧。タップで編成への追加/削除をトグルする
function buildUnitGrid(){
  const grid = document.getElementById("unit-grid");
  grid.innerHTML = "";
  const activeCat = state.formationCategory || "all";
  Object.entries(CHAR_DEFS).forEach(([kind, def]) => {
    if (def.hiddenFromFormation) return; // 魔獣など、単体では編成できないユニットは一覧に出さない
    if (activeCat !== "all" && def.race !== activeCat) return;
    const inFormation = state.selectedUnits.includes(kind);
    const card = document.createElement("div");
    card.className = "unit-card" + (inFormation ? " in-formation" : "");
    card.dataset.rname = def.name; card.dataset.reading = def.reading || ""; card.dataset.desc = unitDesc(def);
    card.innerHTML = `
      <div class="rank-tag">${def.rank || "―"}</div>
      <div class="icon-wrap"><img src="${def.icon}" alt="${def.name}"></div>
      <div class="name">${def.name}</div>
      <div class="cost${currencyKey(def) === "corpse" ? " corpse" : ""}">${getDeployCost(def)}${currencyUnit(def)}</div>
    `;
    attachImgFallback(card.querySelector("img"), def.name);
    card.addEventListener("click", () => {
      const cur = state.formationSlots.findIndex(sl => sl.kind === kind);
      if (cur !== -1){
        // すでに布陣しているキャラは、外す
        state.formationSlots[cur].kind = null;
        state.activeSlot = cur;
      } else {
        // 選んでいる枠(空いていれば)に入れる。なければ、歩兵の空き枠、それもなければ、どこかの空き枠
        const act = state.activeSlot;
        // 選んでいる枠があれば、そこに入れる(埋まっている枠なら、入れ替える)。なければ、歩兵の空き枠へ
        let target = (act != null && state.formationSlots[act]) ? act : -1;
        if (target === -1) target = state.formationSlots.findIndex(sl => !sl.kind && sl.role === "foot");
        if (target === -1) target = state.formationSlots.findIndex(sl => !sl.kind);
        if (target === -1){ showToast("布陣は" + MAX_FORMATION + "体まで"); return; } // 上限
        state.formationSlots[target].kind = kind;
        state.activeSlot = null;
      }
      syncSelectedUnits();
      buildFormationScreen();
    });
    grid.appendChild(card);
  });
}

    const card = document.createElement("div");

    const thumb = menu.thumb || art.bg;
    const nLanes = stage.lanes ? stage.lanes.length : GRID_LANES;
    card.innerHTML = `
      <div class="sc-thumb"><div class="sc-img"></div><div class="sc-shade"></div><div class="sc-tag">${menu.tag || "戦線"}</div></div>
      <div class="sc-body">
        <div class="sc-name">${stage.name}</div>
        <div class="sc-read">${stage.reading || ""}</div>
        <div class="title-orn"><i></i><b>◆</b><i></i></div>
        <div class="sc-intro">${open ? (stage.intro || "") : "先の戦線を制せば、道は開く。"}</div>
        <div class="sc-stats"><span>戦列<b>${nLanes}</b></span><span>敵城<b>${stage.enemyCastleHp}</b></span><span>自城<b>${stage.playerCastleHp}</b></span></div>
      </div>
      <button class="${open ? "primary " : ""}btn-forge sm"${open ? "" : " disabled"}>${open ? "出撃" : "封"}</button>
    `;
    if (thumb) card.querySelector(".sc-img").style.backgroundImage = "url(" + STAGE_ART_BASE + thumb + ")";
    const nameEl = card.querySelector(".sc-name");
    nameEl.dataset.reading = stage.reading || "";
    nameEl.dataset.desc = open ? (stage.intro || "") : "";
    if (open) card.querySelector("button").addEventListener("click", () => {
      state.stage = stage;
      startBattle(stage);
    });
    list.appendChild(card);
  });
  // 未踏の戦線(今後、戦線が増えたときの枠)
  const lk = document.createElement("div");
  lk.className = "stage-card locked";
  lk.innerHTML = `
    <div class="sc-thumb"><div class="sc-shade"></div></div>
    <div class="sc-body">
      <div class="sc-name">未踏</div>
      <div class="sc-read">みとう</div>
      <div class="title-orn"><i></i><b>◆</b><i></i></div>
      <div class="sc-intro">いまだ、兵の踏み入れざる地。</div>
    </div>
    <button disabled class="btn-forge sm">封</button>
  `;
  list.appendChild(lk);
}
document.getElementById("btn-unlock-all").addEventListener("click", () => {
  STAGES.forEach(st => state.cleared.add(st.id)); saveCleared(); buildStageScreen();
});

/* =========================================================
   メニュー画面の背景(タイトル・布陣・戦線選択・結果)
   戦線の stage.art.bg の景色と、両城(stage.art.castleEnemy / castlePlayer)を敷き、霧・灰・火の粉・鴉を重ねる。

function buildMenuBackdrop(stage){
  const root = document.getElementById("menu-backdrop"); if (!root) return;
  root.innerHTML = "";
  const art = (stage && stage.art) || {};
  const rand = seededRand(4242);
  const R = (a, b) => a + rand() * (b - a);
  const scene = document.createElement("div"); scene.className = "mb-scene";
  const img = document.createElement("div"); img.className = "mb-img"; scene.appendChild(img);
  const addKeep = (file, side) => {
    if (!file) return;
    const k = new Image(); k.className = "mb-keep " + side; k.alt = ""; k.draggable = false;
    k.onload = () => { scene.appendChild(k); requestAnimationFrame(() => k.classList.add("on")); };
    k.src = STAGE_ART_BASE + file;
  };
  if (art.bg){
    const probe = new Image();
    probe.onload = () => { img.style.backgroundImage = "url(" + probe.src + ")"; scene.classList.add("loaded"); addKeep(art.castleEnemy, "enemy"); addKeep(art.castlePlayer, "player"); };
    probe.src = STAGE_ART_BASE + art.bg;
  }
  root.appendChild(scene);
  [[6, 12, .55, 260], [22, 14, .42, 340]].forEach(c => { const cl = document.createElement("div"); cl.className = "mb-cloud"; cl.style.cssText = "top:" + c[0] + "vh;height:" + c[1] + "vh;opacity:" + c[2] + ";animation-duration:" + c[3] + "s;animation-delay:" + (-R(0, 100)) + "s;"; root.appendChild(cl); });
  ["a", "b"].forEach(c => { const f = document.createElement("div"); f.className = "mb-fog " + c; f.style.animationDelay = (-R(0, 60)) + "s"; root.appendChild(f); });
  const ash = document.createElement("div"); ash.className = "mb-ash";
  for (let i = 0; i < 46; i++){
    const a = document.createElement("i"); const sz = R(2, 5);
    a.style.cssText = "left:" + R(-5, 100).toFixed(1) + "vw;width:" + sz.toFixed(1) + "px;height:" + sz.toFixed(1) + "px;animation-duration:" + R(18, 34).toFixed(1) + "s;animation-delay:" + (-R(0, 34)).toFixed(1) + "s;";
    ash.appendChild(a);
  }
  for (let i = 0; i < 14; i++){
    const e = document.createElement("i"); e.className = "ember"; const sz = R(2.5, 5);
    e.style.cssText = "left:" + R(0, 100).toFixed(1) + "vw;width:" + sz.toFixed(1) + "px;height:" + sz.toFixed(1) + "px;animation-duration:" + R(6, 11).toFixed(1) + "s;animation-delay:" + (-R(0, 11)).toFixed(1) + "s;";
    ash.appendChild(e);
  }
  root.appendChild(ash);
  for (let i = 0; i < 3; i++){
    const c = document.createElement("div"); c.className = "mb-crow";
    c.style.cssText = "top:" + R(4, 26).toFixed(0) + "vh;width:" + R(26, 44).toFixed(0) + "px;animation-duration:" + R(44, 70).toFixed(0) + "s;animation-delay:" + (-R(0, 60)).toFixed(0) + "s;";
    c.innerHTML = '<svg viewBox="0 0 24 10"><path d="M0 4 Q6 -2 12 5 Q18 -2 24 4 Q18 3 12 8 Q6 3 0 4Z"/></svg>';
    root.appendChild(c);
  }
  ["mb-dim", "mb-vignette"].forEach(c => { const d = document.createElement("div"); d.className = c; root.appendChild(d); });
}

/* =========================================================
   7. 戦闘ロジック
   ========================================================= */
let battle = null;


/* =========================================================
   ステージの見た目(背景・大気・城)
   画像がなくても、コードで描いた荒野が出る。stage.art に画像名があり、STAGE_ART_BASE に置いてあれば、そちらを使う。
   画像の置き場：GitHubの stages/ フォルダ(REPO_BASE のコミットを更新すること)
   ========================================================= */
const STAGE_ART_BASE = REPO_BASE + "images/stages/";
function seededRand(seed){ let a = seed >>> 0; return function(){ a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }
function svgEl(name, attrs){ const e = document.createElementNS("http://www.w3.org/2000/svg", name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

function buildStageArt(stage){
  const field = document.getElementById("battlefield");
  ["stage-art","stage-fog","stage-atmo","stage-backdrop","stage-vignette"].forEach(id => { const o = document.getElementById(id); if (o) o.remove(); });
  field.classList.remove("bd-on");
  const frame = document.getElementById("battlefield-frame"); frame.classList.remove("bd-on");
  const art = stage.art || {};
  const rand = seededRand(art.seed || 20260921);
  const R = (a, b) => a + rand() * (b - a);
  const W = 2000, H = 600;
  const GT = H - GRID_GROUND - GRID_CELL * GRID_LANES; // 地面の上端(=最奥の戦列の上端)＝26

  const root = document.createElement("div"); root.id = "stage-art";
  const codeLayer = (cls, parent, extra) => { const d = document.createElement("div"); d.className = cls + " " + (extra || "code-layer"); (parent || root).appendChild(d); return d; };

  // ---- 背景画像がないときの、コード描きの空と遠景(背景画像があれば隠れる) ----
  codeLayer("art-sky"); codeLayer("art-sun"); codeLayer("art-cloud");
  const skySvg = svgEl("svg", { "class": "art-svg code-layer", viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none" });
  const ridge = (base, amp, fill) => {
    let d = "M0," + (GT + 20); const ph = [R(0,6), R(0,6), R(0,6)];
    for (let x = 0; x <= W; x += 36){
      const n = Math.sin(x/210 + ph[0]) * .5 + Math.sin(x/95 + ph[1]) * .3 + Math.sin(x/41 + ph[2]) * .2 + (rand() - .5) * .25;
      d += " L" + x + "," + (base - amp * (n * .5 + .5)).toFixed(1);
    }
    skySvg.appendChild(svgEl("path", { d: d + " L" + W + "," + (GT + 20) + " Z", fill }));
  };
  ridge(GT + 2, 26, "#2c1613"); ridge(GT + 8, 14, "#1b0f0d");
  root.appendChild(skySvg);

  // ---- 地面(コード描き。地面の画像があれば隠れる)。遠近をつけず、どこでも同じ縮尺で描く ----
  const floor = document.createElement("div"); floor.className = "art-floor code-ground"; root.appendChild(floor);
  codeLayer("art-ground-base", floor, "");
  const gc = document.createElement("canvas"); gc.width = gc.height = 160;
  const gx = gc.getContext("2d"), idt = gx.createImageData(160, 160);
  for (let i = 0; i < idt.data.length; i += 4){ const v = rand() < .5 ? 0 : 255; idt.data[i] = idt.data[i+1] = idt.data[i+2] = v; idt.data[i+3] = Math.floor(rand() * 26); }
  gx.putImageData(idt, 0, 0);
  const grain = codeLayer("art-grain", floor, ""); grain.style.backgroundImage = "url(" + gc.toDataURL() + ")"; grain.style.backgroundSize = "160px 160px";

  const gsvg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none" });
  const items = [];
  const add = (type, n) => { for (let i = 0; i < n; i++){ const y = GT + 14 + rand() * (H - GT - 22); items.push({ type, x: R(80, W - 80), y, sc: .85 + .3 * (y - GT) / (H - GT) }); } };
  add("stain", 16); add("crack", 22); add("rock", 26); add("grass", 36); add("bone", 16); add("skull", 8); add("spear", 8); add("banner", 2);
  items.sort((a, b) => a.y - b.y);
  items.forEach(it => {
    const { x, y, sc, type } = it, g = svgEl("g", { opacity: .8 });
    if (type === "stain"){
      g.appendChild(svgEl("ellipse", { cx: x, cy: y, rx: R(24, 58) * sc, ry: R(8, 16) * sc, fill: "#3a0c0a", opacity: R(.22, .4) }));
    } else if (type === "crack"){
      let d = "M" + x + "," + y, cx = x, cy = y;
      for (let i = 0; i < 6; i++){ cx += R(6, 20) * sc * (rand() < .5 ? -1 : 1); cy += R(-4, 6) * sc; d += " L" + cx + "," + cy; }
      g.appendChild(svgEl("path", { d, stroke: "#0f0a07", "stroke-width": 1.6 * sc, fill: "none", opacity: .5 }));
    } else if (type === "rock"){
      const rx = R(8, 20) * sc, ry = rx * R(.45, .7);
      g.appendChild(svgEl("ellipse", { cx: x, cy: y, rx, ry, fill: "#2b2119", stroke: "#100b08", "stroke-width": 1.4 }));
      g.appendChild(svgEl("ellipse", { cx: x - rx * .25, cy: y - ry * .3, rx: rx * .5, ry: ry * .35, fill: "#4a3b2c", opacity: .55 }));
    } else if (type === "grass"){
      let d = ""; const n = 4 + Math.floor(rand() * 3);
      for (let i = 0; i < n; i++){ const a = (i - (n - 1) / 2) * .32 + R(-.1, .1), l = R(10, 22) * sc; d += "M" + x + "," + y + " L" + (x + Math.sin(a) * l) + "," + (y - Math.cos(a) * l) + " "; }
      g.appendChild(svgEl("path", { d, stroke: "#5b4c26", "stroke-width": 1.6 * sc, fill: "none", "stroke-linecap": "round", opacity: .8 }));
    } else if (type === "bone"){
      const l = R(12, 26) * sc, a = R(-.6, .6), dx = Math.cos(a) * l / 2, dy = Math.sin(a) * l / 2;
      g.appendChild(svgEl("line", { x1: x - dx, y1: y - dy, x2: x + dx, y2: y + dy, stroke: "#b8a888", "stroke-width": 2.6 * sc, "stroke-linecap": "round", opacity: .55 }));
      g.appendChild(svgEl("circle", { cx: x + dx, cy: y + dy, r: 2.6 * sc, fill: "#b8a888", opacity: .55 }));
      g.appendChild(svgEl("circle", { cx: x - dx, cy: y - dy, r: 2.6 * sc, fill: "#b8a888", opacity: .55 }));
    } else if (type === "skull"){
      g.appendChild(svgEl("ellipse", { cx: x, cy: y + 2 * sc, rx: 8 * sc, ry: 3 * sc, fill: "#000", opacity: .35 }));
      g.appendChild(svgEl("circle", { cx: x, cy: y - 3 * sc, r: 6.5 * sc, fill: "#a99a7a", opacity: .65 }));
      g.appendChild(svgEl("circle", { cx: x - 2.4 * sc, cy: y - 3.4 * sc, r: 1.6 * sc, fill: "#120b08" }));
      g.appendChild(svgEl("circle", { cx: x + 2.4 * sc, cy: y - 3.4 * sc, r: 1.6 * sc, fill: "#120b08" }));
    } else if (type === "spear"){
      const l = R(40, 64) * sc, a = R(-.5, .5) + (rand() < .5 ? 0 : Math.PI * .22), ex = x + Math.sin(a) * l, ey = y - Math.cos(a) * l;
      g.appendChild(svgEl("line", { x1: x, y1: y, x2: ex, y2: ey, stroke: "#4b3a27", "stroke-width": 2.6 * sc, "stroke-linecap": "round" }));
    } else if (type === "banner"){
      const h = R(50, 70) * sc;
      g.appendChild(svgEl("line", { x1: x, y1: y, x2: x + 3, y2: y - h, stroke: "#3c2d1f", "stroke-width": 3 * sc }));
      g.appendChild(svgEl("path", { d: "M" + (x + 3) + "," + (y - h) + " l" + (26 * sc) + ",4 l" + (-6 * sc) + "," + (8 * sc) + " l" + (8 * sc) + "," + (9 * sc) + " l" + (-28 * sc) + ",-2 z", fill: "#5a1a14", opacity: .8 }));
    }
    gsvg.appendChild(g);
  });
  floor.appendChild(gsvg);

  // ---- 地面の画像(あれば、コード描きの地面の代わりに使う) ----
  if (art.ground){
    const gi = document.createElement("img"); gi.className = "art-ground-img"; gi.alt = ""; gi.draggable = false;
    const gList = Array.isArray(art.ground) ? art.ground.slice() : [art.ground]; // 拡張子が違っても読めるよう、順に試す
    gi.onload = () => root.classList.add("has-ground");
    gi.onerror = () => { gList.shift(); if (gList.length) gi.src = STAGE_ART_BASE + gList[0]; else gi.remove(); };
    gi.src = STAGE_ART_BASE + gList[0]; root.appendChild(gi);
  }

  // ---- 戦列：床をマス目にはせず、うっすらとした畝(うね)だけで分ける。よく見ればわかる程度 ----
  const lsvg = svgEl("svg", { "class": "art-svg", viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none" });
  for (let k = 0; k < GRID_LANES; k += 2){
    lsvg.appendChild(svgEl("rect", { x: 0, y: H - GRID_GROUND - GRID_CELL * (k + 1), width: W, height: GRID_CELL, fill: "rgba(0,0,0,.05)" }));
  }
  for (let k = 0; k <= GRID_LANES; k++){
    const y = H - GRID_GROUND - GRID_CELL * k; let d = "M0," + y;
    for (let x = 40; x <= W; x += 40) d += " L" + x + "," + (y + (rand() - .5) * 3).toFixed(1);
    lsvg.appendChild(svgEl("path", { d, stroke: "rgba(6,3,2,.34)", "stroke-width": 3, fill: "none" }));
    lsvg.appendChild(svgEl("path", { d: d.replace(/,(-?[\d.]+)/g, (m, v) => "," + (parseFloat(v) + 3)), stroke: "rgba(226,188,150,.05)", "stroke-width": 1.6, fill: "none" }));
  }
  root.appendChild(lsvg);
  const haze = document.createElement("div"); haze.className = "art-haze"; root.appendChild(haze);

  field.insertBefore(root, field.firstChild);
  field.classList.add("themed");

  // ---- 背景画像(あれば)：地平線より上の景色を、戦場の上に余る画面まで延ばす ----
  if (art.bg){
    const probe = new Image();
    probe.onload = () => {
      if (!document.body.contains(root)) return; // 別の戦闘に入り直していたら捨てる
      const bd = document.createElement("div"); bd.id = "stage-backdrop";
      const sky = document.createElement("div"); sky.className = "bd-sky"; bd.appendChild(sky);
      [[-300,150,.5,200],[-520,170,.42,260],[-760,190,.34,320],[-1000,200,.28,380]].forEach(c => {
        const cl = document.createElement("div"); cl.className = "bd-cloud"; cl.style.top = c[0] + "px"; cl.style.height = c[1] + "px"; cl.style.opacity = c[2]; cl.style.animationDuration = c[3] + "s"; cl.style.animationDelay = (-R(0, 100)) + "s"; bd.appendChild(cl);
      });
      const fl = document.createElement("div"); fl.className = "bd-floor"; bd.appendChild(fl);
      [-2000, 0, 2000].forEach((x, i) => {
        const h = document.createElement("div"); h.className = "bd-horizon" + (i === 1 ? "" : " mirror"); h.style.left = x + "px"; h.style.backgroundImage = "url(" + probe.src + ")"; bd.appendChild(h);
      });
      for (let i = 0; i < 4; i++){
        const c = document.createElement("div"); c.className = "crow";
        c.style.cssText = "top:" + R(-700, 0).toFixed(0) + "px;width:" + R(36, 64).toFixed(0) + "px;animation-duration:" + R(40, 70).toFixed(0) + "s;animation-delay:" + (-R(0, 60)).toFixed(0) + "s;";
        c.innerHTML = '<svg viewBox="0 0 24 10"><path d="M0 4 Q6 -2 12 5 Q18 -2 24 4 Q18 3 12 8 Q6 3 0 4Z"/></svg>';
        bd.appendChild(c);
      }
      // 城の本体：壁の奥、遠い角にそびえる
      const keep = (file, side) => {
        if (!file) return;
        const im = new Image(); im.className = "bd-keep"; im.alt = ""; im.draggable = false; im.dataset.side = side;
        im.onload = () => { const w = 330 * im.naturalWidth / im.naturalHeight; im.style.left = (side === "enemy" ? -14 : W - w + 14) + "px"; bd.appendChild(im); };
        im.src = STAGE_ART_BASE + file;
      };
      keep(art.castleEnemy, "enemy"); keep(art.castlePlayer, "player");
      [["enemy", 60], ["enemy", 130], ["player", W - 130], ["player", W - 60]].forEach((sm, i) => { // 損傷したときに、城の上から上がる煙
        const d = document.createElement("div"); d.className = "bd-smoke " + sm[0]; d.style.left = sm[1] + "px"; d.style.animationDelay = (-i * 1.3) + "s"; bd.appendChild(d);
      });
      frame.insertBefore(bd, frame.firstChild);
      field.classList.add("bd-on"); frame.classList.add("bd-on");
      root.classList.add("has-bg");
    };
    probe.onerror = () => {};
    probe.src = STAGE_ART_BASE + art.bg;
  }

  // ---- 流れる霧(ユニットの後ろ) ----
  const fog = document.createElement("div"); fog.id = "stage-fog";
  ["far", "low"].forEach(c => { const f = document.createElement("div"); f.className = "fog " + c; f.style.animationDelay = (-rand() * 60) + "s"; fog.appendChild(f); });
  field.appendChild(fog);

  // ---- 灰・火の粉・暗がり(ユニットの前) ----
  const atmo = document.createElement("div"); atmo.id = "stage-atmo";
  const vg = document.createElement("div"); vg.id = "stage-vignette"; frame.appendChild(vg);
  for (let i = 0; i < 60; i++){
    const a = document.createElement("i"); a.className = "ash"; const sz = R(4, 9);
    a.style.cssText = "left:" + R(-100, 1900).toFixed(0) + "px;top:0;width:" + sz.toFixed(1) + "px;height:" + sz.toFixed(1) + "px;animation-duration:" + R(28, 52).toFixed(1) + "s;animation-delay:" + (-R(0, 52)).toFixed(1) + "s;";
    atmo.appendChild(a);
  }
  for (let i = 0; i < 16; i++){
    const e = document.createElement("i"); e.className = "ember"; const sz = R(3, 6);
    e.style.cssText = "left:" + R(0, 1900).toFixed(0) + "px;top:" + R(1400, 1700).toFixed(0) + "px;width:" + sz.toFixed(1) + "px;height:" + sz.toFixed(1) + "px;animation-duration:" + R(5, 10).toFixed(1) + "s;animation-delay:" + (-R(0, 10)).toFixed(1) + "s;";
    atmo.appendChild(e);
  }
  field.appendChild(atmo);

  // ---- 城壁(全戦列に沿う。兵は壁の手前に立つ) ----
  field.querySelectorAll(".castle").forEach(c => {
    const side = c.classList.contains("enemy") ? "enemy" : "player";
    c.className = "castle " + side; // 前の戦闘の損傷・崩壊の表示を消す
    c.innerHTML = "";
    const add2 = (cls, top) => { const d = document.createElement("div"); d.className = cls; if (top != null) d.style.top = top + "px"; c.appendChild(d); return d; };
    add2("w-body"); add2("w-cracks"); add2("w-teeth");
    for (let k = 0; k < GRID_LANES; k++){
      const cy = 450 - GRID_CELL * k; // このレーンの中央(壁の上端から)
      add2("w-gate", cy - 30);
      if (side === "enemy") add2("w-skull", cy - 44);
    }
    [[70, 2], [200, 3], [330, 2], [460, 3]].forEach(f => { // 燃え上がる場所(損傷が進むと出る。lv=出はじめる段階)
      const sm = add2("w-smoke", f[0] - 40); sm.dataset.lv = f[1]; sm.style.animationDelay = (-Math.random() * 2.6) + "s";
      const fr = add2("w-fire", f[0]); fr.dataset.lv = f[1];
    });
    for (let k = 0; k <= GRID_LANES; k++){
      add2("w-torch", GRID_CELL * k - 4);
      if (side === "player" && k % 2 === 1 && k < GRID_LANES) add2("w-banner", GRID_CELL * k + 8);
    }
  });
}


/* =========================================================
   戦線の規則：使える戦列・使える兵・導き
   ========================================================= */
function applyStageLanes(stage){
  const field = document.getElementById("battlefield");
  field.querySelectorAll(".lane-block").forEach(e => e.remove());
  const allowed = stage.lanes || null;
  const box = document.getElementById("lane-buttons");
  Array.from(box.children).forEach(b => {
    if (b.id === "lane-all-btn") b.style.display = (allowed && allowed.length <= 1) ? "none" : "";
    else b.style.display = (allowed && allowed.indexOf(Number(b.dataset.lane)) === -1) ? "none" : "";
  });
  if (!allowed) return;
  if (allowed.length === 1) battle.selectedLanes = new Set(allowed); // 戦列が1つなら、最初から選んでおく
  const ok = k => allowed.indexOf(k) !== -1;
  for (let k = 0; k < GRID_LANES; ){
    if (ok(k)){ k++; continue; }
    let j = k; while (j + 1 < GRID_LANES && !ok(j + 1)) j++;
    const d = document.createElement("div"); d.className = "lane-block";
    const top = STAGE_H - GRID_GROUND - GRID_CELL * (j + 1);
    const h = GRID_CELL * (j - k + 1) + (k === 0 ? GRID_GROUND : 0);
    d.style.top = top + "px"; d.style.height = h + "px";
    const fadeTop = j + 1 < GRID_LANES && ok(j + 1), fadeBottom = k - 1 >= 0 && ok(k - 1);
    const dk = "rgba(5,3,3,.86)";
    d.style.background = "linear-gradient(180deg," + (fadeTop ? "rgba(5,3,3,0)" : dk) + " 0," + dk + " 26px," + dk + " calc(100% - 26px)," + (fadeBottom ? "rgba(5,3,3,0)" : dk) + " 100%)";
    field.appendChild(d);
    k = j + 1;
  }
  // 城壁の門も、使えない戦列は闇に沈める
  field.querySelectorAll(".castle").forEach(c => {
    const gates = c.querySelectorAll(".w-gate");
    gates.forEach((g, idx) => { if (!ok(idx)) g.classList.add("off"); });
  });
}
// この戦線で使える兵だけを、布陣にする(戦闘が終わったら、元の布陣に戻す)
function applyStageUnits(stage){
  restoreFormation();
  if (!stage.units) return;
  state._backup = { slots: JSON.parse(JSON.stringify(state.formationSlots)), morale: state.moraleRole };
  const slots = makeEmptySlots();
  for (const role in stage.units){ let i = 0; slots.forEach(sl => { if (sl.role === role && i < stage.units[role].length) sl.kind = stage.units[role][i++]; }); }
  state.formationSlots = slots; state.moraleRole = null;
  syncSelectedUnits();
}
function restoreFormation(){
  if (!state._backup) return;
  state.formationSlots = state._backup.slots; state.moraleRole = state._backup.morale; state._backup = null;
  syncSelectedUnits();
}
// 導き：戦闘の時間に合わせて、上に短い文を出す
function updateGuide(){
  const el = document.getElementById("guide-bar"); if (!el || !battle) return;
  const g = battle.stage && battle.stage.guide;
  let act = null;
  if (g && !battle.ended){
    const t = battle.time, deployed = battle.roleUsed && Object.keys(battle.roleUsed).length > 0;
    g.forEach(e => { if (t >= e.t && (e.untilDeploy ? !deployed : t < e.t + e.dur)) act = e; });
  }
  if (battle._guideCur === act) return;
  battle._guideCur = act;
  if (act){ el.textContent = act.text; el.classList.add("on"); } else el.classList.remove("on");
  document.querySelectorAll(".deploy-btn").forEach(b => b.classList.toggle("guide-pulse", !!act && act.pulse === b.dataset.kind));
}

function updateCastleBars(){
  // 城が受けたダメージの一部が、屍になる(敵城でも自城でも)。前回からのHPの減り分を数える
  if (battle.castlePrev){
    const dmg = Math.max(0, battle.castlePrev.enemy - battle.enemyCastleHp) + Math.max(0, battle.castlePrev.player - battle.playerCastleHp);
    if (dmg > 0){ battle.corpse += dmg * CASTLE_CORPSE_RATE; updateWalletUI(); }
  }
  if (battle.castlePrev){
    if (battle.castlePrev.enemy > battle.enemyCastleHp) castleHitFx("enemy");
    if (battle.castlePrev.player > battle.playerCastleHp) castleHitFx("player");
  }
  battle.castlePrev = { enemy: battle.enemyCastleHp, player: battle.playerCastleHp };
  applyCastleDamageState("enemy", battle.enemyCastleHp / battle.enemyCastleHpMax);
  applyCastleDamageState("player", battle.playerCastleHp / battle.playerCastleHpMax);
  document.getElementById("enemy-hp-num").textContent =
    Math.max(0,Math.ceil(battle.enemyCastleHp)) + "/" + battle.enemyCastleHpMax;
  document.getElementById("enemy-hp-fill").style.width =
    Math.max(0, battle.enemyCastleHp / battle.enemyCastleHpMax * 100) + "%";
  document.getElementById("player-hp-num").textContent =
    Math.max(0,Math.ceil(battle.playerCastleHp)) + "/" + battle.playerCastleHpMax;
  document.getElementById("player-hp-fill").style.width =
    Math.max(0, battle.playerCastleHp / battle.playerCastleHpMax * 100) + "%";
}

function roleShort(kind){
  const r = FORMATION_ROLES.find(x => x.id === roleOfKind(kind));
  return r ? r.short : "";
}

// 役職による招集の制限：あと何体まで出せるか。総大将は1試合に1回、宿老は同時に1体、部隊長・組頭は同時に2体(1種類のキャラごと)まで
function deployAllowance(kind){
  const role = FORMATION_ROLES.find(x => x.id === roleOfKind(kind));
  if (!role || !role.limit) return { max: Infinity, reason: "" };
  if (role.limit.perBattle != null){
    const used = (battle.roleUsed && battle.roleUsed[kind]) || 0;
    return { max: Math.max(0, role.limit.perBattle - used), reason: role.label + "は、1度しか出せない" };
  }
  const alive = battle.units.filter(u => u.side === "player" && u.deployedKind === kind && !u.dead).length;
  return { max: Math.max(0, role.limit.alive - alive), reason: role.label + "は、同時に" + role.limit.alive + "体まで" };
}

function buildDeployRow(){
  const row = document.getElementById("deploy-row");
  row.innerHTML = "";
  state.selectedUnits.forEach(kind => {
    const def = CHAR_DEFS[kind];
    const btn = document.createElement("button");
    btn.className = "deploy-btn";
    btn.dataset.rname = def.name; btn.dataset.reading = def.reading || ""; btn.dataset.desc = unitDesc(def); btn.dataset.kind = kind;
    btn.innerHTML = `<img src="${def.icon}" alt="${def.name}"><span class="cost-tag${currencyKey(def) === "corpse" ? " corpse" : ""}">${getDeployCost(def)}</span>` +
      ((def.laneSpan || 1) > 1 ? `<span class="lane-tag">${def.laneSpan}戦列</span>` : "") +
      (roleShort(kind) ? `<span class="role-tag">${roleShort(kind)}</span>` : "");
    attachImgFallback(btn.querySelector("img"), def.name);
    btn.addEventListener("click", () => tryDeploy(kind));
    row.appendChild(btn);
  });
  updateWalletUI();
}



// 召喚の資金は、全キャラ共通で「屍」だけ(銭・軍資は廃止)。
// 屍は、時間では増えない。戦闘の開始時に START_CORPSE を持ち、あとは、敵味方を問わず、ユニットが倒れたときに、
// そのユニットの値段の CORPSE_GAIN_RATE 倍がたまる。
const START_CORPSE = 500;      // 最初に持っている屍(戍卒1体か、餓鬼2体ぶん)
const CORPSE_GAIN_RATE = 0.5;
const CASTLE_CORPSE_RATE = 0.3;   // 城が受けたダメージ1につき、屍がこれだけたまる(敵城でも自城でも)
const STARVE_GRACE_MS = 3000;     // 味方が全滅して、屍が最も安いキャラに足りない状態が、これだけ続いたら、1体ぶんの屍を与える(詰み防止)
function currencyKey(def){ return "corpse"; }
function currencyUnit(def){ return "屍"; }

function updateWalletUI(){
  if (!battle) return;
  document.getElementById("corpse-num").textContent = "屍 " + Math.floor(battle.corpse);
  // 召喚ボタン：1戦列のキャラは、選んでいる戦列の数だけ出るので、「×数」と合計の屍を出す(役職の制限で出せる数まで)
  const nLanes = battle.selectedLanes.size;
  document.querySelectorAll(".deploy-btn").forEach(btn => {
    const kind = btn.dataset.kind;
    const def = CHAR_DEFS[kind];
    if (!def) return;
    const allow = deployAllowance(kind).max;
    let count = 1;
    if ((def.laneSpan || 1) === 1 && nLanes > 0) count = Math.max(1, Math.min(nLanes, allow));
    const total = getDeployCost(def) * count;
    const tag = btn.querySelector(".cost-tag");
    if (tag) tag.textContent = (count > 1 ? "×" + count + " " : "") + total;
    btn.disabled = battle.corpse < total || allow <= 0;
  });
}

// 特殊兵は、待機の軍令が出ている間、自分の特殊技(女王の結界・メテオ、鬼将の中距離技、鬼王のゲートなど)のクールタイムが短くなる
function skillCd(unit, ms){
  return (unit.role === "special" && unit.cmd && unit.cmd.type === "hold") ? ms * CMD_BUFF.specialCd : ms;
}

function tryDeploy(kind){
  const def = CHAR_DEFS[kind];
  const cost = getDeployCost(def);
  const lanes = Array.from(battle.selectedLanes).sort((a, b) => a - b);
  if (!lanes.length){ flashLaneButtons(); showLaneHint("先に戦列を選べ"); return; } // 先にレーンを選ばないと召喚できない
  const allow = deployAllowance(kind);
  if (allow.max <= 0){ showToast(allow.reason); return; } // 役職の制限で、いま出せない
  const span = def.laneSpan || 1;
  if (span >= 2){
    // 複数レーンを占めるキャラは、必要な数のレーンを連続で選んだときだけ、1体だけ出せる(複数同時には出せない)。
    // 選んだレーンが、またぐ位置になる(2レーンなら2つの真ん中、3レーンなら真ん中のレーンが中心)
    const contiguous = lanes.every((l, i) => i === 0 || l === lanes[i - 1] + 1);
    if (lanes.length !== span || !contiguous){
      flashLaneButtons();
      showLaneHint(def.name + "は、隣り合う" + span + "戦列を選べ(1体のみ)");
      return;
    }
    const cur = currencyKey(def);
    if (battle[cur] < cost) return;
    battle[cur] -= cost;
    const big = spawnUnit(kind, "player", 0, { lane: span >= 3 ? lanes[1] : lanes[0] });
    big.deployedKind = kind;
    big.slotIdx = state.formationSlots.findIndex(sl => sl.kind === kind);
    big.slotRole = roleOfKind(kind);
    pickLeader(big);
    applyRole(big, roleOfKind(kind));
    battle.roleUsed[kind] = (battle.roleUsed[kind] || 0) + 1;
    updateWalletUI();
    return;
  }
  // 役職の制限で、出せる数が選んだ戦列の数より少ないときは、下の戦列から順に、出せる数だけ出す
  if (lanes.length > allow.max){
    lanes.length = allow.max;
    showToast(allow.reason);
  }
  const total = cost * lanes.length; // 1レーンのキャラは、選んだレーンの数だけ、1体(1セット)ずつ出る。値段もその分かかる
  const cur = currencyKey(def);
  if (battle[cur] < total) return;
  battle[cur] -= total;
  updateWalletUI();
  lanes.forEach(lane => {
    const main = spawnUnit(kind, "player", 0, { lane });
    main.deployedKind = kind;
    main.slotIdx = state.formationSlots.findIndex(sl => sl.kind === kind);
    main.slotRole = roleOfKind(kind);
    pickLeader(main);
    applyRole(main, roleOfKind(kind));
    battle.roleUsed[kind] = (battle.roleUsed[kind] || 0) + 1;
    (def.summons || []).forEach(s => {
      // 魔獣などは、両隣のレーンに1匹ずつ(壁があれば、その側の1匹は本体と同じレーン)
      const subLanes = summonLanes(main.lane, s.count);
      for (let i = 0; i < s.count; i++){
        // 同じレーンに重なる場合は、少しずつ横にずらして重なりすぎないようにする
        const offset = (i - (s.count - 1) / 2) * 26;
        spawnUnit(s.kind, "player", offset, { lane: subLanes[i] });
      }
    });
  });
}

// 召喚できなかった理由などを、画面の上に短く表示する
let laneHintTimer = null;
function showLaneHint(text){
  const el = document.getElementById("lane-hint");

/* ---------- ユニット生成・アニメーション ---------- */

function spawnUnit(kind, side, xOffset, opts){
  const def = CHAR_DEFS[kind];
  const field = document.getElementById("battlefield");
  const fieldWidth = field.clientWidth;

  const el = document.createElement("div");
  el.className = "unit-sprite";
  const img = document.createElement("img");
  img.addEventListener("load", () => {
    const curDef = (img._ownerUnit && img._ownerUnit.def) || def; // 形態変化(女王)で定義が入れ替わることがあるので、現在の定義を見る
    const motionScales = curDef.motionScale || {};
    const motionFactor = motionScales[img.dataset.motion] != null ? motionScales[img.dataset.motion] : 1;
    const scale = (curDef.pixelScale || 1) * motionFactor * ((img._ownerUnit && img._ownerUnit.scaleMult) || 1);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    img.style.width = dw + "px";
    img.style.height = dh + "px";
    if (img._ownerUnit){
      img._ownerUnit._displayWidth = dw;
      img._ownerUnit._displayHeight = dh;
      if (!img._ownerUnit._bodyW) img._ownerUnit._bodyW = Math.max(20, Math.min(80, Math.round(dw * 0.55))); // ぶつかり判定に使う体の幅(武器などを除いた目安)
      el.style.setProperty("--sw", Math.round(Math.max(36, dw * 0.6)) + "px"); // 足元の影の幅
    }
    img._retryCount = 0; // 読み込みに成功したらリトライ回数をリセット
  });
  // 読み込みに失敗した場合、少し待って同じ画像を再読込する(モバイルSafariでの一時的な読み込み失敗対策)
  img.addEventListener("error", () => {
    img._retryCount = (img._retryCount || 0) + 1;
    if (img._retryCount > 3) return; // 何度も失敗する場合は諦める(壊れた画像アイコンのまま)
    const failedSrc = img.src;
    setTimeout(() => {
      if (img.src === failedSrc){ // その間に別のコマへ進んでいなければ再読込
        img.src = "";
        img.src = failedSrc;
      }
    }, 250 * img._retryCount);
  });
  el.appendChild(img);
  const uhp = document.createElement("div");
  uhp.className = "uhp";
  uhp.innerHTML = "<i></i>";
  if (def.hpBarWidth) uhp.style.width = def.hpBarWidth + "px";
  el.appendChild(uhp);
  const statusBox = document.createElement("div");
  statusBox.className = "ustatus";
  el.appendChild(statusBox);
  field.appendChild(el);

  const startX = (side === "player" ? fieldWidth - 90 - (def.spawnFullyInside ? (def.hitboxWidth || 0) : 0) : 90) + (xOffset || 0);
  // 投石器は素材の都合で通常キャラと前後の向きが逆に作られているため、キャラごとに反転させられるようにする
  const baseFacing = side === "player" ? -1 : 1;
  const facing = def.invertFacing ? -baseFacing : baseFacing;

  const unit = {
    kind, def, side, el, img, uhpFill: uhp.querySelector("i"), uhpEl: uhp, statusEl: statusBox, statusSig: "",
    x: startX,
    hp: def.hp,
    hpMax: def.hp,
    facing,
    target: null,
    motion: null,
    frameIndex: 0,
    frameTimer: 0,
    dead: false,
    debugLock: false,
    guardCooldown: 0,     // 残りクールタイム(ms)。0ならガード可能
    shieldBroken: false,  // true になったらガード・近接攻撃とも二度と使えない
    dodgeUsed: false,     // true になったら特殊回避は二度と使えない(一度きり)
    dodgedPastUnit: null, // 回避してすれ違った相手(この相手とは戦わない)
    buffSources: new Set(), // このユニットを鼓舞したドラマー(死ぬとバフが消える)
    inspireCooldown: 0,     // 鼓舞兵専用：次に発動判定できるまでの残り時間
    trapCheckpointIndex: 0,        // 罠兵専用：18マス目→10マス目のうち、次に設置すべき地点の番号(0〜2、2で設置完了)
    restrained: false,            // 罠に拘束されている間はtrue(AI停止・ガード/回避不可)
    restrainRemainingMs: 0,       // 拘束の残り時間(Infinityなら自力脱出しない)
    launched: false,              // 打ち上げ/吹き飛ばし中はtrue(AI停止・見た目が浮く)
    launchVY: 0,
    launchVX: 0,
    launchY: 0,
    poisonRemainingMs: 0,         // 毒状態の残り時間
    gauges: {},                   // 状態異常のゲージ(毒・出血など。種類ごとに1つで、誰が攻撃しても共有)。閾値に達すると発動
    poisonTickTimer: 0,
    poisonTickIntervalMs: 0,
    poisonDamagePerTick: 0,
    poisonFxDef: null,
    poisonFxEl: null,
    poisonFxFrame: 0,
    poisonFxTimer: 0,
    midCooldown: 0,               // ゴブリン長専用：次に中距離技を出せるまでの残り時間(ms)
    attackHadTarget: false,       // 攻撃開始時に対象ユニットがいたか(多段攻撃の途中で対象が倒れたら残りの段を城へ流さない)
    flagFxEl: null,               // 旗バフのアイコン
    attackArmorMs: 0,             // 近接攻撃中スーパーアーマーの残り時間(ms)。ゴブリン長の特殊モーションで付与
    mounted: false,               // 拠点(フォートレス)の背中に乗っている間はtrue(攻撃されず、狙われない)

    lane: 0, laneLo: 0, laneHi: 0, // いるレーン(下から0〜4)。laneLo〜laneHiが占有レーン
