  unit._displayHeight = dh;
}

// ゴブリンをフォートレスの背中に乗せる(小さく描き、フォートレスの画像の後ろ側に重ねる=手すりの奥に見える)
function mountRider(r, mount, slot){
  r.mounted = true;
  r.mount = mount;
  r.slot = slot;
  copyLane(r, mount, -1); // フォートレスと同じレーン(画像の奥側に描く)
  r.scaleMult = mount.def.riderScale || 0.42;
  r.uhpEl.style.display = "none";
  r.el.parentNode.insertBefore(r.el, mount.el);
  syncRiderToMount(r);
}

// 乗っているゴブリンの位置を、フォートレスの現在の位置・向き・大きさに合わせる
function syncRiderToMount(r){
  const m = r.mount;
  if (!m) return;
  const md = m.def;
  const W = m._displayWidth || 240;
  const H = m._displayHeight || 165;
  const rw = r._displayWidth || 20;
  const fe = m.facing === 1 ? r.slot.frac : 1 - r.slot.frac; // 左向き(自軍側)は画像が反転しているので後ろ端が右側
  r.x = m.x + fe * W - rw / 2;
  r.rideY = H * (r.slot.tower ? md.towerHeightFrac : md.deckHeightFrac);
  r.facing = m.facing;
  applyFrame(r);
}

// 乗っている間のゴブリンの行動：その場に立ち、弓兵だけ射程内の敵(いなければ敵城)を撃つ
function updateMountedAI(unit){
  const def = unit.def;
  if (unit.motion === "walk"){ // 太鼓を叩き終えたあと等に歩きモーションへ戻るので、その場に立たせる
    setMotion(unit, "idle", { loop:true });
    return;
  }
  if (!def.ranged || unit.motion !== "idle") return;

  const enemy = findNearestEnemyInRange(unit);
  let shoot = false;
  unit.target = null;
  if (enemy){
    if (edgeDistance(unit, enemy) <= def.attackRange){ unit.target = enemy; shoot = true; }
  } else {
    const field = document.getElementById("battlefield");
    const castleX = unit.side === "player" ? 60 : field.clientWidth - 60;
    if (Math.abs(unit.x - castleX) <= def.attackRange) shoot = true; // 敵城が射程に入った
  }
  if (!shoot) return;
  unit.attackHadTarget = !!unit.target;
  setMotion(unit, def.attackMotionName || "attack", {
    onEnd: () => { if (!unit.dead && unit.mounted && !unit.dismounting) setMotion(unit, "idle", { loop:true }); }
  });
}

function updateMount(unit, dtMs){
  if (!unit.mounted) return;
  if (unit.dismounting) updateDismount(unit, dtMs);
  else syncRiderToMount(unit);
}

// フォートレスが倒れたとき、背中のゴブリンを一人ずつ梯子から降ろし始める
function startDismount(m){
  (m.riders || []).forEach((r, i) => {
    if (r.dead || !r.mounted) return;
    r.dismounting = true;
    r.dismountPhase = "wait";
    r.dismountDelay = 500 + i * 450;
    r.startRideY = r.rideY;
  });
}

function hasRidersLeft(m){
  return (m.riders || []).some(r => !r.dead && r.mount === m);
}

// 梯子まで歩く → 梯子を降りる(降りながら通常の大きさに戻る) → 地上に降りて通常ユニットになる
function updateDismount(r, dtMs){
  const m = r.mount;
  if (!m){ finishDismount(r); return; }
  if (r.dismountDelay > 0){ r.dismountDelay -= dtMs; return; }
  if (r.dismountPhase === "wait"){
    r.dismountPhase = "walk";
    r.el.parentNode.appendChild(r.el); // フォートレスの体より手前に出す(梯子は手前側の側面にある)
    r.el.style.zIndex = String(laneZ(r) + 2);
    if (r.def.frameCounts.walk) setMotion(r, "walk", { loop:true });
  }
  const W = m._displayWidth || 240;
  const fe = m.facing === 1 ? m.def.ladderFrac : 1 - m.def.ladderFrac;
  const ladderX = () => m.x + fe * W - (r._displayWidth || 20) / 2;

  if (r.dismountPhase === "walk"){
    const dx = ladderX() - r.x;
    if (Math.abs(dx) <= 2){ r.dismountPhase = "climb"; return; }
    const dir = dx > 0 ? 1 : -1;
    r.x += dir * 100 * (dtMs / 1000);
    r.facing = dir;
    applyFrame(r);
    return;
  }

  // climb
  r.rideY = Math.max(0, r.rideY - 160 * (dtMs / 1000));
  const p = 1 - r.rideY / (r.startRideY || 1);
  const base = m.def.riderScale || 0.42;
  r.scaleMult = base + (1 - base) * p;
  applyUnitScale(r);
  r.x = ladderX();
  applyFrame(r);
  if (r.rideY <= 0) finishDismount(r);
}

function finishDismount(r){
  r.mounted = false;
  r.mount = null;
  r.dismounting = false;
  r.rideY = 0;
  r.scaleMult = 1;
  applyUnitScale(r);
  r.uhpEl.style.display = "";
  r.target = null;
  r.facing = r.side === "player" ? -1 : 1;
  const fallback = r.def.frameCounts.walk ? "walk" : (r.def.approachMotion || "walk");
  setMotion(r, fallback, { loop:true });
}

// 倒れたフォートレスは、背中のゴブリンが全員降りきるまで消えない
function updateFortressCorpse(unit){
  if (unit.dead && unit.riders && unit.downFinished && !hasRidersLeft(unit)) removeUnit(unit);
}

// 打ち上げ・吹き飛ばしは宙に浮かず、大きくよろめいて後退する
function startStagger(target, attacker){
  if (target.dead || target.transforming || !target.def.frameCounts.blowback) return;
  const awayDir = attacker ? (Math.sign(target.x - attacker.x) || 1) : 1;
  target.staggerVX = awayDir * (target.def.staggerSlideSpeed || 20);
  setMotion(target, "blowback", { onEnd: () => { target.staggerVX = 0; afterReaction(target); } });
}

// 踏み潰し：前方の一定距離以内にいる敵全員にダメージ(砂煙つき)
function resolveAreaHit(unit){
  const def = unit.def;
  const enemySide = unit.side === "player" ? "enemy" : "player";
  const forwardDir = unit.side === "player" ? -1 : 1;
  const centerX = unit.x + (def.hitboxWidth || 0) / 2;
  if (def.fxStompDust) spawnStompDust(unit);
  const dmg = getEffectiveAtk(unit);
  const hits = battle.units.filter(o =>
    !o.dead && !o.mounted && !o.elevated && !o.def.invulnerable && o.side === enemySide && canReachLane(unit, o) &&
    Math.sign(o.x - centerX) === forwardDir &&
    edgeDistance(unit, o) <= def.areaHitReach
  );
  hits.forEach(o => applyDamageToUnit(o, dmg, unit));
  if (def.pullToOwnLane) pullToOwnLane(unit, hits);
}
// 狼筅の薙ぎ払い：当たった敵のうち、上の戦列の敵1体と下の戦列の敵1体(それぞれ、いちばん近い敵)を、自分の戦列へ引き寄せ、絡めて動けなくする。
// 目の前の戦列の敵は、動かさない。巨体(2戦列以上)・常時スーパーアーマー・乗っている敵・拘束中の敵などは引き寄せられない
function canBePulled(attacker, o){
  const d = o.def;
  if (o.dead || o.launched || o.restrained || o.mounted || o.bearerOf || o.laneTween) return false;
  if ((d.laneSpan || 1) >= 2 || d.alwaysSuperArmored || d.immobile || d.gateUnit) return false;
  if (d.laneStep && Math.abs(attacker.lane - o.homeLane) > 1) return false; // 出現した戦列から離れすぎる魔獣は動かさない
  return true;
}
function pullToOwnLane(attacker, hits){
  [1, -1].forEach(dl => { // dl=1：上の戦列 / -1：下の戦列
    const cand = hits.filter(o => o.lane === attacker.lane + dl && canBePulled(attacker, o));
    if (!cand.length) return;
    cand.sort((a, b) => edgeDistance(attacker, a) - edgeDistance(attacker, b));
    const t = cand[0];
    if (shiftUnitLane(t, -dl)) entangleUnit(t, attacker.def.entangleMs || 2000);
  });
}
// 絡めて動けなくする(拘束と同じ状態。時間が来ると、自然にほどける)。罠の網と違い、姿は隠さない
function entangleUnit(target, ms){
  if (!target || target.dead) return;
  target.restrained = true;
  target.restrainRemainingMs = ms;
  target.target = null;
  if (target.def.frameCounts.idle) setMotion(target, "idle", { loop:true });
}

// 踏み潰しの砂煙：踏んだ足(体の前端付近)の地面に、5コマを順番に重ねる
function spawnStompDust(unit){
  const fx = unit.def.fxStompDust;
  const W = unit._displayWidth || 240;
  const fe = unit.facing === 1 ? fx.frontFrac : 1 - fx.frontFrac;
  const cx = unit.x + fe * W;
  let delay = 0;
  for (let i = 0; i < fx.count; i++){
    const dur = fx.durations[i] || 200;
    setTimeout(() => {
      if (!battle) return;
      const el = spawnFx(fx.imageBase + fx.prefix + (i + 1) + ".png", cx, { height: fx.height, bottom: unit.baseB || 74, lifespan: dur });
      if (el) el.style.transform = "translateX(" + cx + "px) translateX(-50%)";
    }, delay);
    delay += dur;
  }
}

function setMotion(unit, motion, opts){
  opts = opts || {};
  // 詠唱(シールド・メテオ)の途中で別のモーションに切り替わった=中断された。詠唱に紐づく効果はキャンセルする
  if (unit.casting && motion !== unit.casting){
    unit.casting = null;
    unit.castId = (unit.castId || 0) + 1;
  }
  unit.motion = motion;
  unit.frameIndex = 0;
  unit.frameTimer = 0;
  unit.motionLoop = !!opts.loop;
  unit.onMotionEnd = opts.onEnd || null;
  applyFrame(unit);
  if (motion === "discover"){
    showAlertMark(unit);
  }
}

// 発見モーションに入った瞬間、頭上に共通の「！」マークを表示する
function showAlertMark(unit){
  const fx = FX_ALERT_MARK;
  if (!fx) return;
  const headBottom = (unit.baseB || 74) + (unit.img.offsetHeight || 90) + 6; // ユニットの頭の少し上
  for (let i = 0; i < fx.count; i++){
    setTimeout(() => {
      if (unit.dead) return;
      spawnFx(fx.imageBase + fx.prefix + (i+1) + ".png", unit.x, { height: 34, bottom: headBottom, lifespan: fx.durations[i] });
    }, i * (fx.durations[i] || 120));
  }
}

function applyFrame(unit){
  const def = unit.def;
  const count = def.frameCounts[unit.motion] || 1;
  const idx1 = Math.min(unit.frameIndex + 1, count);
  unit.img.dataset.motion = unit.motion; // 読み込み完了時にモーション別の縮尺補正を参照するため
  unit.img.src = frameUrl(def, unit.motion, idx1);

  const overrides = def.frameFacingOverride && def.frameFacingOverride[unit.motion];
  const correction = overrides ? (overrides[unit.frameIndex] ?? 1) : 1;
  const finalScale = unit.facing * correction;

  const launchOffset = unit.launched ? Math.round(unit.launchY) : 0;
  const rideOffset = Math.round(unit.rideY || 0); // フォートレスの背中に乗っている間の高さ
  unit.el.style.transform = "translateX(" + unit.x + "px) translateY(" + (-(launchOffset + rideOffset)) + "px) scaleX(" + finalScale + ")";
  unit.uhpFill.style.width = Math.max(0, unit.hp / unit.hpMax * 100) + "%";
}

function advanceUnit(unit, dtMs){
  if (unit.charging) return; // 猛突進中はupdateChargeが移動・フレーム送りを一括管理する
  const def = unit.def;

  // 攻撃モーション中、その場で殴らず前方へ踏み込みながら攻撃するキャラ用(犬など)
  const lungeMotionName = def.attackMotionName || "attack";
  if (def.attackLungeDistance && unit.motion === lungeMotionName){
    const lungeDurations = def.frameDurations[lungeMotionName] || [1000];
    const lungeTotalMs = lungeDurations.reduce((a, b) => a + b, 0) || 1;
    const forwardDir = unit.side === "player" ? -1 : 1;
    unit.x += moveWithCollision(unit, forwardDir * (def.attackLungeDistance / lungeTotalMs) * dtMs); // 踏み込みも、敵の体にはめり込まない
  }

  // よろめき後退(フォートレス)：吹き飛びモーション中、ゆっくり後ろへ下がる
  if (unit.staggerVX && unit.motion === "blowback"){
    const fieldEl = document.getElementById("battlefield");
    const fw = fieldEl ? fieldEl.clientWidth : 800;
    unit.x = Math.max(30, Math.min(fw - 30 - (def.hitboxWidth || 0), unit.x + unit.staggerVX * (dtMs / 1000)));
    applyFrame(unit);
  }

  // 中距離技(ゴブリン長)：モーション中は前進・後退しながら動く
  if (def.midrange && unit.motion === (def.midrange.motion || "midrange")){
    applyMidrangeMove(unit, dtMs);
  }

  const durations = def.frameDurations[unit.motion] || [1000];
  const count = def.frameCounts[unit.motion] || durations.length;

  unit.frameTimer += dtMs;
  const curDur = durations[Math.min(unit.frameIndex, durations.length-1)];
  if (unit.frameTimer >= curDur){
    unit.frameTimer -= curDur;
    unit.frameIndex++;
    if (unit.frameIndex >= count){
      if (unit.motionLoop){
        unit.frameIndex = 0;
      } else {
        unit.frameIndex = count - 1;
        if (unit.onMotionEnd){
          const cb = unit.onMotionEnd;
          unit.onMotionEnd = null;
          cb(unit);
        }
        applyFrame(unit);
        return;
      }
    }
    const attackMotionName = def.attackMotionName || "attack";
    // 多段攻撃(ゴブリン長の7連撃など)は attackImpactFrames に命中コマを配列で指定する
    const isImpactFrame = def.attackImpactFrames
      ? def.attackImpactFrames.includes(unit.frameIndex)
      : unit.frameIndex === def.attackImpactFrame;
    if (unit.motion === attackMotionName && isImpactFrame){
      if (def.ranged){
        fireProjectile(unit);
      } else {
        resolveAttackImpact(unit);
      }
    }
    if (def.midrange && unit.motion === (def.midrange.motion || "midrange")){
      (def.midrange.hits || []).forEach(h => {
        if (h.frame === unit.frameIndex) resolveMidrangeHit(unit, h);
      });
    }
    if (def.comboRole === "queen") onQueenFrame(unit);
    if (def.comboRole === "king") onKingFrame(unit);
    applyFrame(unit);
  }
}

function spawnFx(imgSrc, x, opts){
  opts = opts || {};
  const field = document.getElementById("battlefield");
  if (!field) return null;
  const el = document.createElement("img");
  el.src = imgSrc;
  el.className = "fx-sprite";
  el.style.height = (opts.height || 30) + "px";
  el.style.bottom = (opts.bottom != null ? opts.bottom : 110) + "px";
  el.style.transform = "translateX(" + x + "px)" + (opts.flip ? " scaleX(-1)" : "");
  field.appendChild(el);
  if (opts.lifespan){
    setTimeout(() => el.remove(), opts.lifespan);
  }
  return el;
}

function fireProjectile(unit){
  if (!battle || battle.ended) return;
  const def = unit.def;
  const dir = unit.facing === -1 ? -1 : 1; // 発射方向(左向きユニットなら左へ)
  const capturedTarget = unit.target; // 発射時点の狙い。飛翔中に相手が死ねば外れ扱いにする

  // 銃口(発射位置)の位置(体の中心から前方・やや高めにオフセット)
  const muzzleX = unit.x + dir * (def.muzzleOffsetX || 0);
  // 発射位置・着弾位置の高さは、撃つ側と狙う側それぞれのレーンの足元を基準にする
  const muzzleOff = (def.muzzleOffsetBottom != null ? def.muzzleOffsetBottom : 110) - 74;
  const shooterBase = unit.baseB || 74;
  const targetBase = capturedTarget ? (capturedTarget.baseB || 74) : shooterBase;
  const groundMuzzleBottom = targetBase + muzzleOff;
  // フォートレスの背中から撃つときは、デッキの高さから発射する(矢は地上の相手へ向かって降下する)
  // 弾の大きさ：背中に乗っているゴブリンは小さく描かれているので、矢もそれに合わせて小さくする
  const projScale = (unit.mounted ? (unit.scaleMult || 1) * 0.7 : 1) * (def.projectileScale || 1);
  const muzzleBottom = unit.mounted ? shooterBase + (unit.rideY || 0) + muzzleOff * (unit.scaleMult || 1) : shooterBase + muzzleOff;

  if (def.fxMuzzleFlash){
    spawnFx(def.imageBase + def.fxMuzzleFlash, muzzleX, { flip: dir < 0, lifespan: 150, height: Math.round(39 * projScale), bottom: muzzleBottom });
  }

  // 命中先の座標を決める(相手ユニット、いなければ城)
  const field = document.getElementById("battlefield");
  const fieldWidth = field ? field.clientWidth : 800;
  const targetX = capturedTarget ? capturedTarget.x : (unit.side === "player" ? 30 : fieldWidth - 30);
  const distance = Math.abs(targetX - muzzleX);
  const speed = def.projectileSpeed || 1200;
  const travelMs = Math.max(40, (distance / speed) * 1000);

  let bullet = null;
  if (def.fxBullet){
    bullet = spawnFx(def.imageBase + def.fxBullet, muzzleX, { flip: dir < 0, height: Math.max(4, Math.round((def.projectileArc ? 34 : 10) * projScale)), bottom: muzzleBottom });

    if (def.projectileArc){
      // 放物線：JSで毎フレーム位置を更新(横方向は等速、縦方向はsinカーブで山なりに)
      const arcHeight = def.projectileArcHeight || 120;
      const startTime = performance.now();
      const step = (now) => {
        if (!bullet || !bullet.isConnected) return;
        const t = Math.min(1, (now - startTime) / travelMs);
        const x = muzzleX + (targetX - muzzleX) * t;
        const y = Math.sin(t * Math.PI) * arcHeight; // 0→最大→0の山なり
        bullet.style.transform = "translateX(" + x + "px)" + (dir < 0 ? " scaleX(-1)" : "") + " rotate(" + (t*360*2) + "deg)";
        bullet.style.bottom = (muzzleBottom + (groundMuzzleBottom - muzzleBottom) * t + y) + "px";
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    } else {
      // 直線：CSS transitionでそのまま移動
      bullet.style.transition = "transform " + travelMs + "ms linear" + (muzzleBottom !== groundMuzzleBottom ? ", bottom " + travelMs + "ms linear" : "");
      requestAnimationFrame(() => {
        bullet.style.transform = "translateX(" + targetX + "px)" + (dir < 0 ? " scaleX(-1)" : "");
        if (muzzleBottom !== groundMuzzleBottom) bullet.style.bottom = groundMuzzleBottom + "px";
      });
    }
  }

  setTimeout(() => {
    if (bullet) bullet.remove();
    if (!battle || battle.ended || unit.dead) return;

    if (def.fxImpact){
      // 着弾エフェクト。背景が暗い灰色の画像(投石器の岩)は、背景を透過に変換して重ねる
      const impactUrl = def.imageBase + def.fxImpact;
      const impactEl = spawnFx(def.fxImpactKey ? keyedFxSrc(impactUrl, FX_KEY_IMPACT) : impactUrl, targetX, { lifespan: 350, height: def.splashRadius ? 90 : 45, bottom: def.fxImpactKey ? targetBase - 6 : groundMuzzleBottom });
      if (def.fxImpactKey && impactEl){
        impactEl.style.mixBlendMode = "normal";
        // 着弾した相手の体の中心の、地面の位置に合わせる
        const cx = capturedTarget ? capturedTarget.x + (capturedTarget._displayWidth || 0) / 2 : targetX;
        impactEl.style.transform = "translateX(" + cx + "px) translateX(-50%)";
      }
    }

    if (def.splashRadius){
      // 範囲ダメージ：着弾地点周辺の敵ユニットすべてに当たる
      const enemySide = unit.side === "player" ? "enemy" : "player";
      let hitAnyUnit = false;
      // 着弾の範囲は、狙った相手のレーンから splashLaneSpan レーン分(投石器は2レーン)
      const impLane = capturedTarget ? capturedTarget.lane : unit.lane;
      const splashSpan = def.splashLaneSpan || 1;
      const splashLo = Math.min(impLane, GRID_LANES - splashSpan);
      const splashHi = splashLo + splashSpan - 1;
      battle.units.forEach(other => {
        if (other.dead || other.mounted || other.side !== enemySide) return;
        if (!lanesOverlap(splashLo, splashHi, other.laneLo, other.laneHi)) return;
        if (Math.abs(other.x - targetX) <= def.splashRadius){
          hitAnyUnit = true;
          applyDamageToUnit(other, getEffectiveAtk(unit), unit);
        }
      });
      // ユニットが誰もいなければ、着弾地点が城の目の前なら城にも当たる扱いにする
      if (!hitAnyUnit && !capturedTarget){
        if (unit.side === "player"){
          battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
          updateCastleBars();
          if (battle.enemyCastleHp <= 0) endBattle(true);
        } else {
          battle.playerCastleHp = Math.max(0, battle.playerCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
          updateCastleBars();
          if (battle.playerCastleHp <= 0) endBattle(false);
        }
      }
      return;
    }

    if (capturedTarget){
      if (!capturedTarget.dead){
        applyDamageToUnit(capturedTarget, getEffectiveAtk(unit) * attackBonus(unit, capturedTarget, true), unit);
      }
      // 貫通：狙った相手の後ろにいる、同じ戦列の敵1体にも、弾が当たる
      if (def.pierce){
        const away = Math.sign(capturedTarget.x - unit.x) || (unit.side === "player" ? -1 : 1);
        let second = null, secondDist = Infinity;
        battle.units.forEach(o => {
          if (o === capturedTarget || o.dead || o.mounted || o.elevated || o.def.invulnerable || o.side === unit.side) return;
          if (!lanesOverlap(capturedTarget.laneLo, capturedTarget.laneHi, o.laneLo, o.laneHi)) return;
          const d = (o.x - capturedTarget.x) * away;
          if (d <= 0 || d > def.pierce.range) return;
          if (d < secondDist){ second = o; secondDist = d; }
        });
        if (second) applyDamageToUnit(second, getEffectiveAtk(unit) * def.pierce.mult, unit);
      }
      // 狙っていた相手が飛翔中に倒れていた場合は何も起きない(弾は外れた扱い)
      return;
    }

    // 相手ユニットがおらず、城を狙っていた場合
    if (unit.side === "player"){
      battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
      updateCastleBars();
      if (battle.enemyCastleHp <= 0) endBattle(true);
    } else {
      battle.playerCastleHp = Math.max(0, battle.playerCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
      updateCastleBars();
      if (battle.playerCastleHp <= 0) endBattle(false);
    }
  }, travelMs);
}

// バフスタック数に応じて頭上の赤いオーラを表示・更新する(1重=通常, 2重=赤みを強調, 3重=紫寄り)
// 全キャラ共通のエフェクトを使うため、キャラごとの位置調整は不要。
function updateBuffAura(unit, dtMs){
  const fx = BUFF_AURA_FX;
  const stacks = getBuffStacks(unit);

  if (stacks !== unit._lastBuffStacks){
    unit._lastBuffStacks = stacks;
    if (unit.buffFxEl){ unit.buffFxEl.remove(); unit.buffFxEl = null; }
    if (stacks >= 1){
      const img = document.createElement("img");
      img.className = "fx-sprite buff-aura";
      unit.el.appendChild(img); // unit.elの子にする = 本体と同じ座標系・向きを自動で共有
      unit.buffFxEl = img;
      unit.buffFxFrame = 0;
      unit.buffFxTimer = 0;
    }
  }

  if (!unit.buffFxEl) return;

  unit.buffFxTimer += dtMs;
  const dur = fx.durations[unit.buffFxFrame] || 150;
  if (unit.buffFxTimer >= dur){
    unit.buffFxTimer -= dur;
    unit.buffFxFrame = (unit.buffFxFrame + 1) % fx.count;
  }
  unit.buffFxEl.src = fx.imageBase + fx.prefix + (unit.buffFxFrame + 1) + ".png";
  unit.buffFxEl.style.left = "50%";
  unit.buffFxEl.style.top = "0%";
  unit.buffFxEl.style.height = (34 * (unit.scaleMult || 1)) + "px"; // フォートレスの背中で小さく描かれている間はオーラも小さく

  // 1重=そのまま, 2重=赤みを強調, 3重=紫系へ色相シフト
  if (stacks >= 3){
    unit.buffFxEl.style.filter = "hue-rotate(75deg) saturate(1.6) drop-shadow(0 0 4px #b03bff)";
  } else if (stacks === 2){
    unit.buffFxEl.style.filter = "saturate(1.8) drop-shadow(0 0 4px #ff2a2a)";
  } else {
    unit.buffFxEl.style.filter = "";
  }
}

function resolveAttackImpact(unit){
  if (!battle || battle.ended) return;
  // 多段攻撃の途中で対象が倒れた場合、残りの段は空振りにする(城へダメージが流れないように)
  if (unit.def.attackImpactFrames && unit.attackHadTarget && (!unit.target || unit.target.dead)) return;
  if (unit.def.areaHitReach){
    // 範囲攻撃(フォートレスの踏み潰し)：前方の敵全員に当たる。対象がユニットなら城には当たらない
    resolveAreaHit(unit);
    if (unit.attackHadTarget) return;
  } else if (unit.target && !unit.target.dead){
    // 種族ごとの攻撃力ボーナス(槍兵は魔獣・獣に強い)
    applyDamageToUnit(unit.target, getEffectiveAtk(unit) * attackBonus(unit, unit.target, true), unit);
    return;
  }
  if (unit.side === "player"){
    battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
    updateCastleBars();
    if (battle.enemyCastleHp <= 0) endBattle(true);
  } else {
    battle.playerCastleHp = Math.max(0, battle.playerCastleHp - getEffectiveAtk(unit) * getCastleDamageMult(unit));
    updateCastleBars();
    if (battle.playerCastleHp <= 0) endBattle(false);
  }
}

// 特殊技「猛突進」：鼓舞された瞬間に発動。敵か敵城に当たるまで、最終コマ以外をループしながら前進し続ける
function startRageCharge(unit){
  if (unit.dead || unit.charging) return;
  const def = unit.def;
  if (!def.frameCounts || !def.frameCounts.rage_charge) return;
  unit.charging = true;
  unit.chargeHit = false;
  unit.chargeHitTarget = null;
  unit.target = null; // 突進中は通常の索敵ターゲットではなく、衝突判定で処理する
  unit.motion = "rage_charge";
  unit.motionLoop = false; // フレーム送りはここではなくupdateChargeで手動管理する
  unit.onMotionEnd = null;
  unit.frameIndex = 0;
  unit.frameTimer = 0;
  applyFrame(unit);
}

function updateCharge(unit, dtMs){
  if (!unit.charging) return;
  if (unit.dead){ unit.charging = false; return; }
  const def = unit.def;
  const count = def.frameCounts.rage_charge;
  const durations = def.frameDurations.rage_charge || [200];
  const finalIndex = count - 1;

  if (!unit.chargeHit){
    // 前進しながら、最終コマ以外をループ再生する
    const speed = def.rageChargeSpeed || (def.walkSpeed * 2.5);
    const forwardDir = unit.side === "player" ? -1 : 1;
    unit.x += forwardDir * speed * (dtMs / 1000);

    unit.frameTimer += dtMs;
    const curDur = durations[Math.min(unit.frameIndex, durations.length - 1)];
    if (unit.frameTimer >= curDur){
      unit.frameTimer -= curDur;
      unit.frameIndex++;
      if (unit.frameIndex >= finalIndex) unit.frameIndex = 0; // 最終コマの手前でループ
      applyFrame(unit);
    }

    // 衝突判定：射程内の敵、または敵城への到達
    const field = document.getElementById("battlefield");
    const fieldWidth = field.clientWidth;
    const enemySide = unit.side === "player" ? "enemy" : "player";
    const hitRadius = def.rageChargeHitRadius || 55;
    const target = battle.units.find(o =>
      !o.dead && !o.mounted && !o.elevated && !o.def.invulnerable && o.side === enemySide && canReachLane(unit, o) && o !== unit.chargePlowedThrough &&
      edgeDistance(unit, o) <= hitRadius
    );
    const castleEdgeX = unit.side === "player" ? 90 : fieldWidth - 90; // キャラが出現する位置まで(それより奥=城の中には入れない)
    const reachedCastle = !target && (unit.side === "player" ? unit.x <= castleEdgeX : unit.x >= castleEdgeX);

    if (reachedCastle){
      // 敵城に到達：そのまま最終コマへ進めて着弾処理する
      unit.chargeHit = true;
      unit.chargeHitTarget = null;
      unit.frameIndex = finalIndex;
      unit.frameTimer = 0;
      applyFrame(unit);
    } else if (target){
      // 吹き飛ばない敵(巨体など)・怯まない敵(スーパーアーマー)は突っ切れないので、その場で最終段の一撃を当てる。
      // それ以外の敵は、体当たりでかち上げながら突っ切り、突進を止めない
      const stopper = target.def.staggerOnLaunch || target.def.alwaysSuperArmored || isSuperArmored(target, unit);
      if (stopper){
        unit.chargeHit = true;
        unit.chargeHitTarget = target;
        unit.frameIndex = finalIndex;
        unit.frameTimer = 0;
        applyFrame(unit);
      } else {
        applyDamageToUnit(target, getEffectiveAtk(unit), unit);
        if (!target.dead) launchUnit(target, unit, { upSpeed: 340 });
        unit.chargePlowedThrough = target; // 同じ相手を同じ突進中に何度も巻き込まないようにする
      }
    }
    return;
  }

  // 最終コマを表示している間：表示時間が経過したら実際のダメージ処理をして通常状態へ復帰する
  unit.frameTimer += dtMs;
  const finalDur = durations[finalIndex] || 300;
  if (unit.frameTimer < finalDur) return;

  if (!battle || battle.ended) return;
  const target = unit.chargeHitTarget;
  const dmg = getEffectiveAtk(unit) * (def.rageChargeFinalMult || 2.5);
  if (target){
    if (!target.dead){
      applyDamageToUnit(target, dmg, unit);
      if (!target.dead){
        launchUnit(target, unit, { upSpeed: 340, knockback: true });
        shiftUnitLane(target, 1); // 最終段だけ、相手を一段上のレーンへ押し上げる(壁なら動かない)
      }
    }
  } else {
    if (unit.side === "player"){
      battle.enemyCastleHp = Math.max(0, battle.enemyCastleHp - dmg * castleTakenScale("player"));
      updateCastleBars();
      if (battle.enemyCastleHp <= 0) endBattle(true);
    } else {
      battle.playerCastleHp = Math.max(0, battle.playerCastleHp - dmg * castleTakenScale("enemy"));
      updateCastleBars();
      if (battle.playerCastleHp <= 0) endBattle(false);
    }
  }

  unit.charging = false;
  unit.chargeHit = false;
  unit.chargeHitTarget = null;
  unit.chargePlowedThrough = null;
  if (!unit.dead){
    const fallback = def.frameCounts.walk ? "walk" : (def.approachMotion || "walk");
    setMotion(unit, fallback, { loop: true });
  }
}

// 怯み・弾かれ・吹き飛び・ダウン・ガード関連の反応モーション中は、
// 追加の被弾があっても別の反応モーションに上書きされない(スーパーアーマー)
function isSuperArmored(unit, attacker){
  if (attacker && attacker.def.attackFlags && attacker.def.attackFlags.ignoresSuperArmor) return false; // スーパーアーマー無効の一撃は貫通する
  if (unit.def && unit.def.alwaysSuperArmored) return true; // 常時スーパーアーマー(ラッシャーなど)
  if (unit.transforming) return true; // 女王の第二形態への移行中は中断されない
  if (unit.def && unit.def.superArmorMotions && unit.def.superArmorMotions.indexOf(unit.motion) !== -1) return true; // 特定のモーション中だけスーパーアーマー(女王の近接・メテオ詠唱・シールド)
  const attackMotion = (unit.def && unit.def.attackMotionName) || "attack";
  return unit.motion === "flinch" || unit.motion === "guardbreak" ||
         unit.motion === "blowback" || unit.motion === "down" ||
         unit.motion === "guard" || unit.motion === "shieldbreak" ||
         unit.motion === "shield_destroy" ||
         (unit.motion === attackMotion && unit.def && unit.def.superArmorDuringAttack) || // 攻撃モーション中は怯まない専用キャラ
         (unit.motion === attackMotion && unit.attackArmorMs > 0); // ゴブリン長の特殊モーションによる一時的なスーパーアーマー
}

// 攻撃者がtargetの正面にいるか(盾兵のガードは前方からの攻撃にしか効かない)
// 横幅のあるユニット(投石器など)同士の距離を、単なる座標の差ではなく
// 「箱と箱の隙間」で計算する。幅を持たない通常ユニットは従来通りの点同士の距離になる。
/* ---------- 敵同士のぶつかり ---------- */
// 味方は味方をすり抜けられるが、敵の体には通り抜けられずにぶつかる。
// ぶつかり判定に使う体の幅：hitboxWidthがあればそれ、なければ絵の幅から見積もった値
function bodyWidth(u){
  if (u.def.bodyWidth != null) return u.def.bodyWidth;
  if (u.def.hitboxWidth) return u.def.hitboxWidth;
  return u._bodyW || 30;
}
// 横に dx だけ動こうとしたとき、敵の体にぶつからずに動ける量を返す。
// 例外(すり抜けられる)：ラッシャーの猛突進、passThroughEnemiesを持つキャラ、レーン移動中、宙に飛ばされている間
function moveWithCollision(unit, dx){
  if (!dx || !battle) return dx;
  if (unit.def.passThroughEnemies || unit.charging || unit.laneMoving || unit.launched || unit.mounted) return dx;
  const dir = dx > 0 ? 1 : -1;
  const wu = bodyWidth(unit);
  let allowed = Math.abs(dx);
  battle.units.forEach(o => {
    if (o === unit || o.dead || o.side === unit.side || o.mounted || o.launched || o.laneMoving) return;
    if (o.def.invulnerable || o.def.passThroughEnemies) return; // 壊せない巨大ゲートなどは、ぶつからない
    if (!lanesOverlap(unit.laneLo, unit.laneHi, o.laneLo, o.laneHi)) return;
    const wo = bodyWidth(o);
    const uc = unit.x + wu / 2, oc = o.x + wo / 2;
    if (dir > 0 ? !(oc > uc) : !(oc < uc)) return; // 進む方向の先にいる敵だけが対象
    const gap = dir > 0 ? o.x - (unit.x + wu) : unit.x - (o.x + wo);
    allowed = Math.min(allowed, Math.max(0, gap));
  });
  return dir * allowed;
}

// 敵と体が重なってしまったとき(魔獣・ゴブリンのレーン移動、吹き飛びの着地など、原因は問わない)は、手前(自分の後ろ側)へ引いて離れる。
// 例外：ラッシャーの猛突進、宙に飛ばされている間、レーン移動中、動かないもの、大きい体(当たり判定の幅200以上)
function resolveEnemyOverlap(unit, dtMs){
  if (!unit.needsPullBack) return; // 自分の能力(レーン移動・吹き飛びの着地など)で動いたユニットだけが、重なりを解消する
  if (!battle || unit.dead || unit.def.immobile || unit.def.passThroughEnemies || unit.charging || unit.launched ||
      unit.laneMoving || unit.mounted || unit.bearerOf || (unit.def.hitboxWidth || 0) >= 200) return;
  const wu = bodyWidth(unit);
  const uc = unit.x + wu / 2;
  const fwd = unit.side === "player" ? -1 : 1; // 進む方向
  let pullBack = 0, pushFront = 0;
  battle.units.forEach(o => {
    if (o === unit || o.dead || o.side === unit.side || o.mounted || o.launched || o.laneMoving) return;
    if (o.def.invulnerable || o.def.passThroughEnemies) return;
    if (!lanesOverlap(unit.laneLo, unit.laneHi, o.laneLo, o.laneHi)) return;
    const wo = bodyWidth(o);
    const ov = Math.min(unit.x + wu, o.x + wo) - Math.max(unit.x, o.x);
    if (ov <= 0) return;
    const ahead = ((o.x + wo / 2) - uc) * fwd > 0;
    if (ahead) pullBack = Math.max(pullBack, ov); else pushFront = Math.max(pushFront, ov); // 相手を追い越していたら、前へ抜ける
  });
  const amt = pullBack > 0 ? pullBack : pushFront;
  if (amt <= 0){ unit.needsPullBack = false; return; } // 重なっていなければ終わり
  const step = Math.min(amt, 400 * (dtMs / 1000)); // 素早く引く(毎秒400px)
  const dirMove = pullBack > 0 ? -fwd : fwd;
  const field = document.getElementById("battlefield");
  unit.x = Math.max(30, Math.min(field.clientWidth - 30 - wu, unit.x + dirMove * step));
  applyFrame(unit);
}

/* ---------- 状態異常のゲージ ---------- */
// 状態異常(毒・出血・今後増える状態異常)は、種類ごとに、対象1体につきゲージが1つだけ。誰が攻撃しても、同じゲージにたまる。
// 蓄積が閾値に達したらtrueを返し、ゲージを0に戻す(発動の中身は呼び出し側で行う)。
function addStatusGauge(target, key, amount, threshold){
  if (!target.gauges) target.gauges = {};
  const v = Math.min(threshold, (target.gauges[key] || 0) + amount);
  if (v >= threshold){ target.gauges[key] = 0; return true; }
  target.gauges[key] = v;
  return false;
}

// 肩代わりできる盾兵を探す：撃つ側の正面(盾の向き)にいて、守られる味方より前に立ち、同じ戦列にいて、ガードできる状態の盾兵
function findCoverShield(target, attacker){
  let best = null, bestDist = Infinity;
  battle.units.forEach(sh => {
    if (sh.dead || sh === target || sh.side !== target.side || !sh.def.canGuard || sh.shieldBroken || sh.guardCooldown > 0) return;
    if (sh.restrained || sh.launched || sh.mounted || isSuperArmored(sh, attacker)) return;
    if (!lanesOverlap(sh.lane, sh.lane, attacker.laneLo, attacker.laneHi)) return; // 撃ってくる戦列と同じ戦列
    if (!lanesOverlap(sh.lane, sh.lane, target.laneLo, target.laneHi)) return;     // 守られる味方も、その戦列
    const shooterAhead = sh.facing === -1 ? attacker.x <= sh.x : attacker.x >= sh.x; // 撃つ側は、盾の正面
    const targetBehind = sh.facing === -1 ? target.x >= sh.x : target.x <= sh.x;     // 守られる味方は、盾の後ろ
    const dist = Math.abs(target.x - sh.x);
    if (!shooterAhead || !targetBehind || dist > (sh.def.coverRange || 160)) return;
    if (dist < bestDist){ best = sh; bestDist = dist; }
  });
  return best;
}

function edgeDistance(a, b){
  const aw = (a.def && a.def.hitboxWidth) || 0;
  const bw = (b.def && b.def.hitboxWidth) || 0;
  const aLeft = a.x, aRight = a.x + aw;
  const bLeft = b.x, bRight = b.x + bw;
  if (aRight < bLeft) return bLeft - aRight;
  if (bRight < aLeft) return aLeft - bRight;
  return 0; // 重なっている
}

function isAttackFromFront(target, attacker){
  if (!attacker) return false;
  // facing:-1は左向き(=前方は自分より左)、facing:+1は右向き(=前方は自分より右)
  return target.facing === -1 ? attacker.x <= target.x : attacker.x >= target.x;
}

// 索敵・ブロック判定の共通ルール：相手が正面にいれば反応してよい。
// 完全に背後にいる場合は、よほど近く(密着している)ない限り無視する。
const ADJACENT_ENGAGE_THRESHOLD = 20;
function isEngageable(unit, other){
  if (other.def.noCombat) return true; // 非戦闘ユニットは自衛できないので、前後関係に関わらず常に攻撃対象にできる
  if (unit.def.canEngageBehind) return true; // 斥候：背後に回り込まれても、振り向いて相手をする
  const forwardDir = unit.side === "player" ? -1 : 1;
  const dx = other.x - unit.x;
  if (Math.sign(dx) === forwardDir || dx === 0) return true; // 正面、または真横で重なっている
  return edgeDistance(unit, other) <= ADJACENT_ENGAGE_THRESHOLD; // 背後でも密着していれば許容
}

function afterReaction(unit){
  if (unit.dead) return;
  unit.target = null; // 攻撃してきた相手を仕切り直しで再索敵させる
  const fallback = unit.def.frameCounts.walk ? "walk" : (unit.def.approachMotion || "walk");
  setMotion(unit, fallback, { loop:true });
}

function killUnit(target){
  target.dead = true;
  target.target = null;
  // 屍：敵味方を問わず、倒れたユニットの値段に応じてたまる(ゲートなど値段のないものは、たまらない)
  if (battle && target.def.cost > 0){
    battle.corpse += target.def.cost * (battle.stage.corpseGainRate != null ? battle.stage.corpseGainRate : CORPSE_GAIN_RATE);
    updateWalletUI();
  }
  // ゲートが壊された：キングのゲート召喚クールタイムを延ばす
  if (target.def.gateUnit && target.owner && target.owner.def.gate){
    target.owner.gateCooldown += target.owner.def.gate.breakPenaltyMs;
  }
  if (target.role) onRoleUnitDied(target);            // 役職者が倒れた：告知(総大将なら、味方が動揺する)
  if (target.bearerOf) onBearerDied(target);          // 担ぎ手が倒れた：全員倒れたら玉座が落下する
  if (target.def.bearers) releaseBearers(target);     // キングが倒れた：残った担ぎ手は普通のユニットに戻る
  clearBuffsFrom(target); // このユニットが死んだので、与えていたバフも消える

  // ゴブリン・ヒーラーの自動蘇生判定：味方のゴブリン族が死亡した瞬間、
  // その時点でフィールドに残っている中で最も価値(コスト)の高いゴブリンであれば、
  // 範囲内の未使用ヒーラーが自動で蘇生の詠唱を始める
  if (target.def.race === "goblin"){
    tryAutoRevive(target);
  }

  setMotion(target, "down", {
    onEnd: () => {
      if (target.frozenForRevive) return; // 蘇生対象として固定中は、詠唱が終わる/中断されるまで消えずに待つ
      if (target.riders){
        // フォートレス：ダウンの最終コマで止まったまま、背中のゴブリンが全員降りるまで消えない
        target.downFinished = true;
        if (hasRidersLeft(target)) return;
      }
      removeUnit(target);
    }
  });
  if (target.riders) startDismount(target);
}

// 死んだ味方ゴブリンが、現時点でフィールドに残っている中で最も価値の高いゴブリンかどうかを判定し、
// 範囲内で手が空いているヒーラーがいれば蘇生の詠唱を開始させる
function tryAutoRevive(target){
  if (!battle) return;
  if (target.def.noRevive) return; // 女王など、蘇生できないユニット
  const sameRaceAllies = battle.units.filter(u =>
    u !== target && !u.dead && u.side === target.side && u.def.race === "goblin" &&
    !u.def.canRevive // ヒーラー自身は「価値比較」の対象から除外(蘇生役がいることで蘇生が妨げられないように)
  );
  const maxOtherCost = sameRaceAllies.reduce((m, u) => Math.max(m, u.def.cost || 0), 0);
  if ((target.def.cost || 0) < maxOtherCost) return; // 他にもっと価値の高いゴブリンがまだ生きている

  const candidates = battle.units.filter(u =>
    !u.dead && u.side === target.side && u.def.canRevive &&
    !u.isReviving && u.reviveUsesLeft > 0 &&
    edgeDistance(u, target) <= (u.def.reviveRadius || 0)
  );
  if (!candidates.length) return; // 範囲外、または蘇生できるヒーラーがいない

  candidates.sort((a, b) => edgeDistance(a, target) - edgeDistance(b, target));
  startRevive(candidates[0], target);
}

function startRevive(healer, corpse){
  healer.isReviving = true;
  healer.reviveTarget = corpse;
  corpse.frozenForRevive = true;

  setMotion(healer, "revive", {
    onEnd: () => {
      // 妨害されずに最後まで唱え切った＝蘇生成功。ヒーラーは代償として息絶える
      healer.isReviving = false;
      healer.reviveTarget = null;
      healer.reviveUsesLeft = Math.max(0, healer.reviveUsesLeft - 1);
      completeRevive(healer, corpse);
    }
  });
}

function completeRevive(healer, corpse){
  corpse.frozenForRevive = false;
  corpse.dead = false;
  const restorePercent = corpse.def.corpseRestoreHpPercent != null ? corpse.def.corpseRestoreHpPercent : 0.4;
  corpse.hp = Math.max(1, Math.round(corpse.hpMax * restorePercent));
  corpse.reviveInvulnMs = healer.def.reviveInvulnMs || 0; // 蘇生された側は、しばらく攻撃を受けない
  corpse.target = null;
  applyFrame(corpse);
  const fallback = corpse.def.frameCounts.walk ? "walk" : (corpse.def.approachMotion || "walk");
  setMotion(corpse, "getup", { onEnd: () => { if (!corpse.dead) setMotion(corpse, fallback, { loop:true }); } });

  // 禁忌の代償：蘇生を成し遂げたヒーラー自身は爆発とともに焼け焦げて死亡する
  healer.dead = true;
  removeUnit(healer);
}

// 蘇生の詠唱中に被弾などでモーションが強制的に変わってしまったら、蘇生失敗として扱う
// (ヒーラーは死なずに生き残るが、対象の死体は固定を解除されて通常通り消える)
function updateRevive(dtMs){
  if (!battle) return;
  battle.units.forEach(u => {
    if (!u.isReviving) return;
    if (u.motion !== "revive"){
      u.isReviving = false;
      const corpse = u.reviveTarget;
      u.reviveTarget = null;
      if (corpse){
        corpse.frozenForRevive = false;
        if (corpse.dead) removeUnit(corpse);
      }
    }
  });
}

function applyDamageToUnit(target, amount, attacker){
  if (target.dead || target.mounted) return; // フォートレスの背中に乗っている間は攻撃を受けない
  if (target.def.invulnerable) return;       // 巨大ゲートは壊せない
  if (target.reviveInvulnMs > 0) return;     // 蘇生直後の無敵時間中
  // 担がれているキングは、遠距離攻撃(空中に届く攻撃)でしか攻撃できない
  if (target.elevated && attacker && !(attacker.def.ranged || attacker.def.canHitAir)) return;
  if (target.transforming) return; // 女王の第二形態への移行モーション中は無敵(毒などのダメージも受けない)
  if (target.laneMoving) return;   // レーン移動(回避)のモーション中は無敵
  // 女王のバリア：範囲内の味方(4m以下)は、敵の遠距離攻撃を受けない
  if (attacker && attacker.def.ranged && (target.def.heightM || 2) <= 4 && isShielded(target)) return;
  // 楯衛の肩代わり：撃ってくる戦列と同じ戦列で、味方の前に立つ盾兵が、ガードできる状態なら、遠距離攻撃を代わりに防ぐ
  if (attacker && attacker.def.ranged && !target.def.canGuard && !attacker.def.splashRadius &&
      !(attacker.def.attackFlags && (attacker.def.attackFlags.ignoresGuard || attacker.def.attackFlags.breaksShield))){
    const cover = findCoverShield(target, attacker);
    if (cover){
      cover.guardCooldown = cover.def.guardCooldownMs || 1000;
      setMotion(cover, "guard", { onEnd: () => afterReaction(cover) });
      return;
    }
  }
  const def = target.def;
  const attackerFlags = (attacker && attacker.def.attackFlags) || {};
  const meleeRangeCheck = attacker && edgeDistance(target, attacker) <= def.attackRange;
  amount = amount * getDamageCutMultiplier(target); // 鼓舞バフの被ダメージカットを適用
  // 甲冑兵などの、鎧そのものによる近接ダメージ軽減(ガードとは別判定なので、ガード貫通の一撃にも効く)
  if (def.meleeDamageCutPercent && !(attacker && attacker.def.ranged)){
    amount = amount * (1 - def.meleeDamageCutPercent);
  }

  // 特殊回避：自分の攻撃射程内(=近接で殴られた時)の前方攻撃だけを一度限り確定で避ける
  // (火縄銃などの遠距離攻撃は射程外からの被弾になるため対象外)
  const dodgeReady = def.canDodge && !target.dodgeUsed && !isSuperArmored(target, attacker) && !target.restrained &&
    meleeRangeCheck && isAttackFromFront(target, attacker) && !attackerFlags.sideHitbox;

  if (dodgeReady && startLaneDodge(target)){
    // 回避：上下どちらかの隣のレーンへ移動する(モーション中は無敵、着いて2秒後にまた回避モーションで元のレーンへ戻る)
    // 攻撃していた側は、戦列を外れた相手をもう追わない：狙いを外し、その場に立ち止まらず前進を続ける
    if (attacker){
      if (attacker.target === target) attacker.target = null;
      attacker.dodgedPastUnit = target; // この相手とはもう戦わない(戻ってきてすれ違っても、狙い直さない)
    }
    return; // ダメージなし
  }

  const guardReady = def.canGuard && !target.shieldBroken &&
    target.guardCooldown <= 0 && !isSuperArmored(target, attacker) && !target.restrained &&
    isAttackFromFront(target, attacker) &&
    (!attacker || lanesOverlap(target.lane, target.lane, attacker.laneLo, attacker.laneHi)); // 自分のレーンからの正面の攻撃だけガードできる(横のレーンからの攻撃は不可)

  if (guardReady){
    const flags = attackerFlags;

    if (flags.breaksShield){
      // ガードブレイカー攻撃：盾が完全に壊れ、以後ガードも近接攻撃も使えなくなる
      target.shieldBroken = true;
      target.hp = Math.max(0, target.hp - amount);
      applyFrame(target);
      if (target.hp <= 0){ killUnit(target); return; }
      setMotion(target, "shield_destroy", { onEnd: () => afterReaction(target) });
      return;
    }

    if (flags.ignoresGuard){
      // ガード無効攻撃：ダメージは通らない。ガードが弾かれ、ガードのクールタイムが余分に増えるだけ
      target.guardCooldown = (def.guardCooldownMs || 1000) + (def.guardIgnoredPenaltyMs || 0);
      setMotion(target, "shieldbreak", { onEnd: () => afterReaction(target) });
      return;
    }

    // 通常攻撃はガードで無効化
    target.guardCooldown = def.guardCooldownMs || 1000;
    setMotion(target, "guard", { onEnd: () => afterReaction(target) });
    return;
  }

  target.hp = Math.max(0, target.hp - amount);
  applyFrame(target);

  // 毒付与(弓兵の矢など)：蓄積式。閾値に達すると発動し、最大HPの一定割合を効果時間で分割して与える
  if (attacker && attacker.def.poisonOnHit && target.hp > 0 && !target.def.poisonImmune){
    const stackPerHit = attacker.def.poisonStackPerHit || 0;
    const threshold = attacker.def.poisonStackThreshold || 100;
    const poisonTriggered = addStatusGauge(target, "poison", stackPerHit, threshold); // 毒ゲージは、対象ごとに1つ(誰の矢でも同じゲージにたまる)
    target.poisonFxDef = attacker.def.fxPoisonStatus || target.poisonFxDef;

    if (poisonTriggered){
      const durationMs = attacker.def.poisonDurationMs || 0;
      const tickInterval = attacker.def.poisonTickIntervalMs || 1000;
      const tickCount = Math.max(1, Math.round(durationMs / tickInterval));
      const totalDamage = target.hpMax * (attacker.def.poisonMaxHpPercent || 0);
      target.poisonRemainingMs = durationMs;
      target.poisonTickTimer = tickInterval;
      target.poisonTickIntervalMs = tickInterval;
      target.poisonDamagePerTick = totalDamage / tickCount;
    }
  }

  // 出血付与(ゴブリン長の斬撃)：蓄積式。100%で発動し「最大HPの一定割合＋固定値」のダメージ
  if (attacker && attacker.def.bleedStackPerHit && target.hp > 0 && !target.def.bleedImmune){
    const threshold = attacker.def.bleedStackThreshold || 100;
    if (addStatusGauge(target, "bleed", attacker.def.bleedStackPerHit, threshold)){ // 出血ゲージも、対象ごとに1つ
      const bleedDmg = target.hpMax * (attacker.def.bleedMaxHpPercent || 0) + (attacker.def.bleedFixedDamage || 0);
      target.hp = Math.max(0, target.hp - bleedDmg);
      applyFrame(target);
      playBleedFx(target, attacker.def);
    }
  }

  if (target.hp <= 0){
    killUnit(target);
    return;
  }

  // 打ち上げ・吹き飛ばし効果：スーパーアーマー中の相手にも適用される(ラッシャーの一撃など)
  // rage_charge中は各ヒットの効果をresolveRageChargeHit側で個別に指定するため、ここでは重複適用しない
  if (attacker && attacker.def.attackFlags && attacker.motion !== "rage_charge"){
    if (attacker.def.attackFlags.launchesUp){
      launchUnit(target, attacker, { upSpeed: 380 });
    } else if (attacker.def.attackFlags.knocksBack){
      launchUnit(target, attacker, { upSpeed: 340, knockback: true }); // 後ろへ2マス分
    }
  }

  // 女王：HPが一定割合以下になったら、一度だけ第二形態へ移行する(その一撃では怯まず、移行モーションに入る)
  if (def.transformAtHpRatio && !target.transformed && target.hp / target.hpMax <= def.transformAtHpRatio){
    startTransform(target);
    return;
  }

  if (isSuperArmored(target, attacker) || target.restrained || target.launched) return; // スーパーアーマー中・拘束中・打ち上げ中は怯まない
  if (def.gateUnit || !def.frameCounts.flinch) return; // 怯みモーションを持たないもの(ゲートなど)は、殴られても見た目が変わらない

  setMotion(target, "flinch", { onEnd: () => afterReaction(target) });
}

/* ---------- ユニットのAI(索敵→接敵→攻撃) ---------- */

function findNearestEnemyInRange(unit){
  if (!battle) return null;
  let nearest = null, nearestDist = Infinity;
  let priority = null, priorityDist = Infinity; // 斥候：非戦闘の支援役がいれば、そちらを優先して探す
  battle.units.forEach(other => {
    if (other === unit || other.dead || other.side === unit.side) return;
    if (other.mounted) return; // フォートレスの背中に乗っている間は狙えない
    if (!canReachLane(unit, other)) return; // 自分のレーン(遠距離はさらに隣のレーン)にいない敵は、見つけられない・狙えない
    if (other.def.invulnerable) return; // 壊せない巨大ゲートは狙わない
    if (other.elevated && !(unit.def.ranged || unit.def.canHitAir)) return; // 担がれたキングは遠距離攻撃しか届かない
    if (other === unit.dodgedPastUnit && !unit.def.canEngageBehind) return; // 回避してすれ違った相手とは戦わない(斥候は例外)
    const d = edgeDistance(unit, other);
    if (d > unit.def.detectionRange) return;
    if (!isEngageable(unit, other)) return; // 完全に背後の敵は無視(密着していれば例外)
    if (d < nearestDist){
      nearest = other;
      nearestDist = d;
    }
    if (unit.def.preferNoCombatTargets && other.def.noCombat && d < priorityDist){
      priority = other;
      priorityDist = d;
    }
  });
  return priority || nearest;
}

function onAttackEnd(unit){
  if (unit.dead) return;
  if (unit.target && unit.target.dead) unit.target = null;
  const def = unit.def;
  const approachMotion = def.approachMotion || "run";
  // いったん歩き/接近モーションへ戻し、次のtickで距離を再評価させる(範囲内ならすぐ攻撃に戻る)
  const fallback = def.frameCounts.walk ? "walk" : approachMotion;
  setMotion(unit, unit.target ? approachMotion : fallback, { loop:true });
}
function updateUnitAI(unit, dtMs){
  if (unit.dead || unit.debugLock || unit.restrained || unit.launched || unit.charging) return;
  const def = unit.def;

  if (unit.mounted){ // フォートレスの背中に乗っている間は、自分では移動しない
    if (!unit.dismounting) updateMountedAI(unit);
    return;
  }

  if (def.immobile){ updateGateAI(unit, dtMs); return; }        // ゲート：動かず、時間が来たら召喚する
  if (unit.cmd && commandStep(unit, dtMs)) return;              // 軍令(守り・待機・進撃)を受けている間の動き
  if (unit.bearerOf){ updateBearerAI(unit); return; }            // キングの担ぎ手：担いでいる間は攻撃しない
  if (def.kingLogic){ updateKingAI(unit, dtMs); return; }         // キング：ゆっくり進み、ゲートを召喚する

  if (def.noCombat){
    // 非戦闘ユニット(鼓舞兵など)：戦わないが、目の前に敵がいる間は立ち尽くして待つ
    const blocker = battle.units.find(other =>
      other !== unit && !other.dead && !other.mounted && !other.def.invulnerable && other.side !== unit.side &&
      isEngageable(unit, other) &&
      Math.abs(other.x - unit.x) <= (def.personalSpace || 50)
    );

    if (blocker){
      if (unit.motion !== "idle") setMotion(unit, "idle", { loop:true });
      return;
    }

    if (unit.motion !== "walk"){
      if (unit.motion === "idle") setMotion(unit, "walk", { loop:true });
      return; // 太鼓演奏中などはそのまま(updateInspire側で管理)
    }

    const field = document.getElementById("battlefield");
    const fieldWidth = field.clientWidth;
    const destX = unit.side === "player" ? 60 : fieldWidth - 60;
    const dx = destX - unit.x;
    if (Math.abs(dx) > 2){
      const dir = dx > 0 ? 1 : -1;
      const speed = getEffectiveSpeed(unit, def.walkSpeed);
      unit.x += moveWithCollision(unit, dir * speed * (dtMs/1000));
      applyFrame(unit);
    }
    return;
  }

  const approachMotion = def.approachMotion || "run"; // 発見後の接近モーション(兵士は走り、槍兵は忍び足)
  const approachSpeed = def.approachSpeed != null ? def.approachSpeed : def.runSpeed;
  const attackMotionName = def.attackMotionName || "attack"; // 攻撃モーションの呼び名(火縄銃兵はshoot)

  // 一撃モーション中・怯み中などは、それぞれのonMotionEndで次の状態が決まるので何もしない
  if (unit.motion === "idle"){
    // "walk"という名前のコマを持たないキャラ(投石器など)は、代わりにapproachMotionを使う
    const initialMoveMotion = def.frameCounts.walk ? "walk" : approachMotion;
    if (!unit.shieldBroken) setMotion(unit, initialMoveMotion, { loop:true }); // 出現直後は発見モーションなしでそのまま歩く
    return; // 盾破壊で立ち尽くしているユニットはidleのまま(次の索敵チェックだけ継続したいので下に続けたいところだが、単純化のためここで留める)
  }
  if (unit.motion !== "walk" && unit.motion !== approachMotion) return;
  const walkFallback = def.frameCounts.walk ? "walk" : approachMotion;

  // 敵ユニットの索敵(検知範囲内の最も近い敵)
  if (!unit.target || unit.target.dead){
    const found = findNearestEnemyInRange(unit);
    if (found && unit.motion === walkFallback){
      unit.target = found;
      setMotion(unit, "discover", { onEnd: () => setMotion(unit, approachMotion, { loop:true }) });
      return;
    }
    if (!found && unit.target){
      unit.target = null;
    }
    if (!found && unit.motion === approachMotion && unit.motion !== walkFallback){
      setMotion(unit, walkFallback, { loop:true }); // 追っていた敵を見失ったら歩きに戻る
      return;
    }
  }

  const field = document.getElementById("battlefield");
  const fieldWidth = field.clientWidth;
  const forwardDir = unit.side === "player" ? -1 : 1; // 自陣営が進むべき方向。これと逆には進まない
  let destX = unit.target ? unit.target.x : (unit.side === "player" ? 60 : fieldWidth - 60 - (def.spawnFullyInside ? (def.hitboxWidth || 0) : 0));
  let dx = destX - unit.x;

  if (unit.target && dx !== 0 && Math.sign(dx) !== forwardDir && !def.canEngageBehind){
    // 索敵対象が自分の後方にいる(回避で追い抜かれた場合など)：後退はせず、その相手は諦めて前進を続ける
    // (斥候は例外：振り向いて追いかける)
    unit.target = null;
    destX = unit.side === "player" ? 60 : fieldWidth - 60;
    dx = destX - unit.x;
  }

  const rangeDist = unit.target ? edgeDistance(unit, unit.target) : Math.abs(dx);
  const minRange = unit.def.minAttackRange || 0;

  // 中距離技(ゴブリン長)：近接の間合いの外で、中距離の間合いに入っていてクールタイムが明けていれば発動
  // 中距離技は、隣のレーンの敵に対しても使える(その場合、突進しながら隣のレーンへ移る)
  const mid = def.midrange;
  if (mid && !unit.shieldBroken && unit.midCooldown <= 0 && !(unit.target && rangeDist <= def.attackRange)){
    const cand = findMidrangeTarget(unit, mid);
    if (cand){
      unit.target = cand;
      startMidrange(unit);
      return;
    }
  }

  // 女王の魔法(シールド・メテオ)
  if (def.skills && unit.target && tryQueenSkills(unit, rangeDist)) return;

  if (rangeDist <= unit.def.attackRange && rangeDist >= minRange){
    if (unit.shieldBroken){
      // 盾が壊れて近接攻撃ができない：その場に立ち尽くす
      if (unit.motion !== "idle") setMotion(unit, "idle", { loop:true });
    } else {
      unit.attackHadTarget = !!unit.target;
      // 魔獣：隣のレーンの敵を攻撃するときは、攻撃の動きに合わせてそのレーンへ移動する
      if (def.laneStep && unit.target && !lanesOverlap(unit.lane, unit.lane, unit.target.laneLo, unit.target.laneHi)){
        startLaneStep(unit, laneTowards(unit, unit.target), 250);
      }
      setMotion(unit, attackMotionName, { onEnd: onAttackEnd });
    }
  } else if (rangeDist < minRange){
    // 近すぎて撃てない：後退はせず、モーションもそのままにその場で留まる(何もしない)
  } else {
    const dir = dx > 0 ? 1 : -1;
    const baseSpeed = unit.motion === approachMotion ? approachSpeed : unit.def.walkSpeed;
    const speed = getEffectiveSpeed(unit, baseSpeed);
    const moveAmount = dir * speed * (dtMs/1000);

    // 今の交戦相手を追っている最中でも、通り道に未交戦の非戦闘ユニットがいればすり抜けずに足止めする
    const passThroughBlocker = battle.units.find(other =>
      other !== unit.target && !other.dead && !other.mounted && !other.def.invulnerable && other.side !== unit.side && other.def.noCombat &&
      Math.sign(other.x - unit.x) === dir &&
      Math.abs(other.x - unit.x) <= Math.abs(moveAmount)
    );
    if (passThroughBlocker){
      unit.target = passThroughBlocker;
      return;
    }

    unit.x += moveWithCollision(unit, moveAmount);
    applyFrame(unit);

    // 車輪の回転を再現できない代わりに、移動中は足元に砂埃をまとわせて誤魔化す
    const dustFx = unit.def.fxDustMove;
    if (dustFx){
      unit.dustTimer = (unit.dustTimer || 0) + dtMs;
      const interval = dustFx.durations[0] || 600;
      if (unit.dustTimer >= interval){
        unit.dustTimer -= interval;
        spawnFx(dustFx.imageBase + dustFx.prefix + "1.png", unit.x, {
          flip: Math.random() < 0.5, height: 70, bottom: 68, lifespan: interval * 1.4
        });
      }
    }
  }
}

/* ---------- メインループ ---------- */

function battleLoop(now){
  if (!battle || battle.ended){ return; }
  if (battle.paused){
    battle.lastTick = now;
    requestAnimationFrame(battleLoop);
    return;
  }
  // 経過時間を、倍速(speed)に応じて増やし、40msずつに区切って進める(倍速でも、当たり判定などが粗くならないように)
  let dt = Math.min(now - battle.lastTick, 100) * (battle.speed || 1);
  battle.lastTick = now;
  while (dt > 0 && battle && !battle.ended){
    const step = Math.min(dt, 40);
    battleStep(step);
    dt -= step;
  }
  if (battle && !battle.ended) requestAnimationFrame(battleLoop);
}

function battleStep(dt){
  updateGuide();
  // 屍は時間では増えない(倒れたユニットのときだけ増える)ので、ここでは何もためない

  updateCommands(dt); // 軍令の終了判定・クールタイム・強化のフラグ

  // 総大将(自軍)が生きている間は、屍を生み続ける。画面の表示は、0.2秒ごとに更新する
  {
    let income = 0;
    battle.units.forEach(u => {
      if (u.side === "player" && !u.dead && u.role === "general") income += roleCfg("general").corpsePerSec;
    });
    if (income > 0){
      battle.corpse += income * (dt / 1000);
      battle.uiTimer = (battle.uiTimer || 0) + dt;
      if (battle.uiTimer >= 200){ battle.uiTimer = 0; updateWalletUI(); }
    }
  }

  // 詰み防止：味方が1体もいなくて、屍が、布陣の中で最も安いキャラの値段に足りない状態が続いたら、1体ぶんだけ屍を与える
  {
    const alive = battle.units.some(u => u.side === "player" && !u.dead && !u.def.gateUnit);
    const cheapest = Math.min.apply(null, state.selectedUnits.map(k => getDeployCost(CHAR_DEFS[k])));
    if (!alive && isFinite(cheapest) && battle.corpse < cheapest){
      battle.starveMs = (battle.starveMs || 0) + dt;
      if (battle.starveMs >= STARVE_GRACE_MS){
        battle.corpse = cheapest;
        battle.starveMs = 0;
        updateWalletUI();
        showToast("最後の屍を得た");
      }
    } else {
      battle.starveMs = 0;
    }
  }

  // 敵ウェーブ：ステージの enemyWaves に、出す時間(秒)・種類・レーンを並べておく
  battle.time += dt / 1000;
  const waves = battle.stage.enemyWaves || [];
  while (battle.nextWave < waves.length && waves[battle.nextWave].t <= battle.time){
    const w = waves[battle.nextWave++];
    if (w.msg) queueBanner(w.msg, false, true); // 敵の出現の告知(赤い文字)
    const wu = spawnUnit(w.kind, "enemy", w.xOffset || 0, { lane: w.lane });
    if (w.role) applyRole(wu, w.role); // 敵の役職(enemyWavesの role に general/elder/captain/chief)
  }

  battle.units.forEach(unit => {
    if (unit.guardCooldown > 0) unit.guardCooldown = Math.max(0, unit.guardCooldown - dt);
    if (unit.midCooldown > 0) unit.midCooldown = Math.max(0, unit.midCooldown - dt);
    if (unit.attackArmorMs > 0) unit.attackArmorMs = Math.max(0, unit.attackArmorMs - dt);
    if (unit.shakenMs > 0) unit.shakenMs = Math.max(0, unit.shakenMs - dt);
    if (unit.shieldCooldown > 0) unit.shieldCooldown = Math.max(0, unit.shieldCooldown - dt);
    if (unit.meteorCooldown > 0) unit.meteorCooldown = Math.max(0, unit.meteorCooldown - dt);
    if (unit.barrierMs > 0) unit.barrierMs = Math.max(0, unit.barrierMs - dt);
    updateLaneTween(unit, dt);
    resolveEnemyOverlap(unit, dt);
    updateMount(unit, dt);
    updateStatusIcons(unit);
    updateBearerSync(unit);
    updateKingBody(unit, dt);
    if (unit.gateCooldown > 0) unit.gateCooldown = Math.max(0, unit.gateCooldown - dt);
    if (unit.reviveInvulnMs > 0) unit.reviveInvulnMs = Math.max(0, unit.reviveInvulnMs - dt); // 蘇生直後の無敵時間
    updateFortressCorpse(unit);
    updateBuffAura(unit, dt);
    updateFlagBuff(unit);
    updateInspire(unit, dt);
    updateTrapper(unit, dt);
    updateHealer(unit, dt);
    updatePoison(unit, dt);
    updatePoisonFx(unit, dt);
    updateLaunch(unit, dt);
    updateCharge(unit, dt);
    updateUnitAI(unit, dt);
    advanceUnit(unit, dt);
  });
  updateTraps(dt);
  updateRestraints(dt);
  updateRevive(dt);
  // エフェクト・タイマーを進める。実行中に新しく登録されたタスク(メテオの発射など)を取りこぼさないよう、いったん退避してから戻す
  const runningTasks = battle.fxList;
  battle.fxList = [];
  const keptTasks = runningTasks.filter(task => task(dt) !== false);
  battle.fxList = keptTasks.concat(battle.fxList);

}

function castleSide(side){ return document.querySelector("#battlefield .castle." + side); }
function applyCastleDamageState(side, ratio){
  const w = castleSide(side); if (!w || w.classList.contains("collapse")) return;
  const lv = ratio <= .25 ? 3 : ratio <= .5 ? 2 : ratio <= .75 ? 1 : 0;
  ["d1","d2","d3"].forEach(c => w.classList.remove(c));
  if (lv) w.classList.add("d" + lv);
  const bd = document.getElementById("stage-backdrop");
  if (bd){ ["d1","d2","d3"].forEach(c => bd.classList.remove(side[0] + "-" + c)); if (lv) bd.classList.add(side[0] + "-d" + lv); }
}
function castleHitFx(side){
  if (!battle) return;

  battle.hitFxAt = battle.hitFxAt || {};
  if (now - (battle.hitFxAt[side] || 0) < 260) return;
  battle.hitFxAt[side] = now;
  const w = castleSide(side); if (!w) return;
  w.classList.remove("hit"); void w.offsetWidth; w.classList.add("hit");
  const field = document.getElementById("battlefield");

  const col = side === "enemy" ? ["#5b4128", "#8a7048", "#bfae8c"] : ["#8a8170", "#5f584b", "#a89f8a"];

function playCastleFall(side, win){
  const w = castleSide(side), field = document.getElementById("battlefield"), frame = document.getElementById("battlefield-frame");
  frame.classList.remove("quake"); void frame.offsetWidth; frame.classList.add("quake");

  if (w){ w.classList.add("d3", "collapse"); }

  const dir = side === "enemy" ? 1 : -1, x = side === "enemy" ? 62 : STAGE_W - 62;

function endBattle(win, instant){
  if (!battle || battle.ended) return;
  battle.ended = true;
  const b = battle;
  if (win && b.stage && b.stage.id){ state.cleared.add(b.stage.id); saveCleared(); } // 制した戦線を覚える
  restoreFormation();
  updateGuide();
  const showResult = () => {

    const resultScreen = document.getElementById("screen-result");

    showScreen("screen-result");
  };
  if (instant){ showResult(); return; }
  playCastleFall(win ? "enemy" : "player", win); // 城が崩れる間、戦場は止まって見せる
  setTimeout(showResult, 2700);
}

/* ---------- マス(グリッド)の表示 ---------- */
// ゲーム内の広さ：横2000 x 縦600。1マスは正方形(GRID_CELL)で、横に20マス・縦に5レーン。
// 縦は、いまの地面(下から74px)を最下段のレーンの足元とし、その上に4レーンを重ねる。兵士(高さ約92px)がほぼ1マスの大きさ。
const STAGE_W = 2000, STAGE_H = 600;
const LANE_GUTTER = 62;
const GRID_CELL = 100, GRID_LANES = 5, GRID_GROUND = 74;
const LANE_LABELS = ["最左翼", "左翼", "中央", "右翼", "最右翼"]; // 下から上の順(仮)
const LANE_READINGS = ["さいさよく", "さよく", "ちゅうおう", "うよく", "さいうよく"];
let gridVisible = false;

// 画面(枠)の大きさに合わせて、ステージ全体を縮小して表示する
function fitStage(){
  const frame = document.getElementById("battlefield-frame");
  if (!frame || !frame.clientWidth || !frame.clientHeight) return;
  const availW = frame.clientWidth - LANE_GUTTER; // 左はレーンボタンの置き場(城を隠さないよう、戦場はその右から)
  const scale = Math.min(availW / STAGE_W, frame.clientHeight / STAGE_H);
  const root = document.documentElement.style;
  root.setProperty("--stage-scale", scale);
  root.setProperty("--stage-offx", (LANE_GUTTER + (availW - STAGE_W * scale) / 2) + "px");
  root.setProperty("--stage-offy", (frame.clientHeight - STAGE_H * scale) + "px"); // 下に揃える
}

function buildGrid(){
  const field = document.getElementById("battlefield");
  let overlay = document.getElementById("grid-overlay");
  if (overlay) overlay.remove();
  const cols = Math.floor(STAGE_W / GRID_CELL);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.id = "grid-overlay";
  svg.setAttribute("viewBox", "0 0 " + STAGE_W + " " + STAGE_H);
  const add = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    if (text != null) e.textContent = text;
    svg.appendChild(e);
    return e;
  };
  const yTop = k => STAGE_H - (GRID_GROUND + GRID_CELL * (k + 1)); // レーンkの上端(画面の上からの位置)
  // レーンの色分け(1つおきに薄く塗る)
  for (let k = 0; k < GRID_LANES; k++){
    add("rect", { x: 0, y: yTop(k), width: cols * GRID_CELL, height: GRID_CELL, fill: k % 2 === 0 ? "rgba(255,255,255,0.045)" : "rgba(255,255,255,0.0)" });
  }
  // 縦線(マスの境目)と横線(レーンの足元)
  for (let c = 0; c <= cols; c++){
    add("line", { x1: c * GRID_CELL, y1: yTop(GRID_LANES - 1), x2: c * GRID_CELL, y2: STAGE_H - GRID_GROUND, stroke: "rgba(255,255,255,0.16)", "stroke-width": 2 });
  }
  for (let k = 0; k <= GRID_LANES; k++){
    const y = STAGE_H - (GRID_GROUND + GRID_CELL * k);
    add("line", { x1: 0, y1: y, x2: cols * GRID_CELL, y2: y, stroke: k === 0 ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.16)", "stroke-width": 2 });
  }
  // レーン名(左端)と、列の番号(下)
  for (let k = 0; k < GRID_LANES; k++){
    add("text", { x: 60, y: yTop(k) + GRID_CELL / 2 + 8, fill: "rgba(255,255,255,0.55)", "font-size": 24, "font-family": "sans-serif" }, LANE_LABELS[k]);
    add("text", { x: STAGE_W - 60, y: yTop(k) + GRID_CELL / 2 + 8, fill: "rgba(255,255,255,0.55)", "font-size": 24, "font-family": "sans-serif", "text-anchor": "end" }, LANE_LABELS[k]);
  }
  for (let c = 0; c < cols; c++){
    add("text", { x: c * GRID_CELL + GRID_CELL / 2, y: STAGE_H - GRID_GROUND + 30, fill: "rgba(255,255,255,0.5)", "font-size": 22, "font-family": "sans-serif", "text-anchor": "middle" }, String(c + 1));
  }
  add("text", { x: STAGE_W / 2, y: 30, fill: "rgba(255,255,255,0.6)", "font-size": 24, "font-family": "sans-serif", "text-anchor": "middle" },
      "1区画 = " + GRID_CELL + "px (戍卒1体分) / 横" + cols + "区画 × " + GRID_LANES + "戦列");
  svg.style.display = gridVisible ? "" : "none";
  field.insertBefore(svg, field.firstChild);
}

/* ---------- 名前の読み：長押しで表示 ---------- */
// data-reading を持つ要素(キャラのカード・召喚ボタン・システム名など)を長押しすると、読みをふりがなで表示する。
// 長押しのあとに指を離しても、その要素のタップ(召喚など)は実行しない。
// 陣形の形を、図で見せる(進む方向は左。丸が兵1体。nは配下の数で、足りないときは、組める最少の数ぶんを見せる)
function formationDiagramHTML(id, n){
  const fm = FORMATIONS.find(f => f.id === id);
  if (!fm) return "";
  const need = Math.max(FORMATION_MIN_ALL, fm.min);
  const N = Math.max(n, need);
  const offs = formationOffsets(fm, N);
  const amin = Math.min.apply(null, offs.map(o => o.a)), amax = Math.max.apply(null, offs.map(o => o.a));
  const cell = 26, cols = amax - amin + 1;
  const W = cols * cell + 44, H = GRID_LANES * cell + 8;
  let g = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="display:block;margin:6px auto 2px;background:#120e08;border:1px solid #6b5a30;border-radius:3px">';
  for (let r = 0; r <= GRID_LANES; r++) g += '<line x1="40" y1="' + (4 + r * cell) + '" x2="' + W + '" y2="' + (4 + r * cell) + '" stroke="#3a3020" stroke-width="1"/>';
  for (let c = 0; c <= cols; c++) g += '<line x1="' + (40 + c * cell) + '" y1="4" x2="' + (40 + c * cell) + '" y2="' + (4 + GRID_LANES * cell) + '" stroke="#3a3020" stroke-width="1"/>';
  // 中心の戦列は、真ん中(l=0)。下(最左翼)が図の下
  offs.forEach((o, i) => {
    const x = 40 + (amax - o.a) * cell + cell / 2;                  // 進む方向(前)が左
    const y = 4 + (GRID_LANES - 1 - (2 + o.l)) * cell + cell / 2;   // 戦列のずれ(+が上)
    g += '<circle cx="' + x + '" cy="' + y + '" r="9" fill="#c8a04a" stroke="#3a2a08" stroke-width="1.5"/>';
    if (i === 0) g += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="#3a2a08"/>';
  });
  g += '<text x="4" y="' + (H / 2 - 4) + '" fill="#f0cf6a" font-size="12">前</text><text x="4" y="' + (H / 2 + 12) + '" fill="#f0cf6a" font-size="14">←</text>';
  g += '</svg>';
  return g + '<div style="font-size:.66rem;color:#b8ac88;text-align:center;">' + N + '体の場合(黒い点が先頭)</div>';
}

(function setupReadingTips(){
  const tip = document.createElement("div");
  tip.id = "reading-tip";
  document.body.appendChild(tip);
  let timer = null, hideTimer = null, fired = false, startX = 0, startY = 0, tipPaused = false;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  function show(el){
    const name = el.dataset.rname || el.textContent.trim().replace(/[A-Za-z0-9:\s銭]+$/, "").trim() || el.textContent.trim();
    const reading = el.dataset.reading;
    if (!reading) return;
    tip.innerHTML = "<ruby>" + esc(name) + "<rt>" + esc(reading) + "</rt></ruby>" + (el.dataset.fm ? formationDiagramHTML(el.dataset.fm, Number(el.dataset.fmN) || 0) : "") + (el.dataset.desc ? '<div class="tip-desc">' + esc(el.dataset.desc) + "</div>" : "");
    // 陣形の説明を見ている間は、ゲームを一時停止する(見終わったら、もとに戻す)
    if (el.dataset.pause && battle && !battle.paused){
      battle.paused = true; tipPaused = true;
      const pb = document.getElementById("btn-pause"); if (pb) pb.textContent = "▶";
    }
    const r = el.getBoundingClientRect();
    tip.style.opacity = "1";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.left + r.width / 2 - tw / 2;
    left = Math.max(6, Math.min(window.innerWidth - tw - 6, left));
    let top = r.top - th - 8;
    if (top < 6) top = r.bottom + 8;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hide(){
    tip.style.opacity = "0";
    if (tipPaused && battle){
      battle.paused = false; tipPaused = false;
      const pb = document.getElementById("btn-pause"); if (pb) pb.textContent = "Ⅱ";
    }
  }
  document.addEventListener("pointerdown", e => {
    fired = false;
    clearTimeout(timer); clearTimeout(hideTimer); hide();
    const el = e.target.closest ? e.target.closest("[data-reading]") : null;
    if (!el || !el.dataset.reading) return;
    startX = e.clientX; startY = e.clientY;
    timer = setTimeout(() => { fired = true; show(el); }, 450);
  }, true);
  document.addEventListener("pointermove", e => {
    if (timer && !fired && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) clearTimeout(timer); // スクロール・ドラッグなら長押しにしない
  }, true);
  ["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, () => {
    clearTimeout(timer);
    if (fired){ clearTimeout(hideTimer); hideTimer = setTimeout(hide, 1600); }
  }, true));
  document.addEventListener("click", e => {
    if (fired && e.target.closest && e.target.closest("[data-reading]")){
      e.stopPropagation(); e.preventDefault(); // 長押しのあとのタップは、実行しない
      fired = false;
    }
  }, true);
  document.addEventListener("contextmenu", e => {
    if (e.target.closest && e.target.closest("[data-reading]")) e.preventDefault();
  }, true);
})();

/* ---------- 戦場のタップ：兵の情報・戦列の選択 ---------- */
const infoUI = { unit: null };
function fieldPointToLogical(e){
  const field = document.getElementById("battlefield");
  const r = field.getBoundingClientRect();
  const scale = r.width / STAGE_W;
  return { lx: (e.clientX - r.left) / scale, ly: (e.clientY - r.top) / scale };
}
// タップした位置にいる兵(小さい兵でも押せるよう、少し広めに判定する)
function unitAtPoint(lx, ly){
  const by = STAGE_H - ly; // 下からの高さ
  let best = null, bd = Infinity;
  battle.units.forEach(u => {
    if (u.dead || u.mounted || u.def.invulnerable || u.def.gateUnit) return;
    const w = u._displayWidth || 60, h = u._displayHeight || 80, pad = 16;
    const bottom = (u.baseB || GRID_GROUND) + Math.round(u.launchY || 0) + Math.round(u.rideY || 0);
    if (lx < u.x - pad || lx > u.x + w + pad) return;
    if (by < bottom - pad || by > bottom + h + pad) return;
    const d = Math.abs((u.x + w / 2) - lx) + Math.abs((bottom + h / 2) - by);
    if (d < bd){ bd = d; best = u; }
  });
  return best;
}
function showUnitInfo(u){
  infoUI.unit = u;
  renderUnitInfo();
}
function closeUnitInfo(){
  infoUI.unit = null;
  const box = document.getElementById("unit-info");
  if (box) box.style.display = "none";
}
function renderUnitInfo(){
  const box = document.getElementById("unit-info");
  const u = infoUI.unit;
  if (!u || u.dead || !battle){ closeUnitInfo(); return; }
  box.style.display = "block";
  box.innerHTML = "";
  const role = u.role ? roleCfg(u.role) : null;
  const title = document.createElement("div"); title.className = "ui-title";
  title.textContent = (u.side === "enemy" ? "敵 " : "") + u.def.name + (role ? "　" + role.label : "");
  box.appendChild(title);
  const line = t => { const d = document.createElement("div"); d.textContent = t; box.appendChild(d); };
  line("HP " + Math.ceil(u.hp) + " / " + u.hpMax + "　攻 " + Math.round(getEffectiveAtk(u) * 10) / 10);
  line(LANE_LABELS[u.lane] + (u.laneHi > u.laneLo ? "ほか" : "") + "　" + (u.side === "player" ? "味方" : "敵"));
  if (u.side === "player" && u.slotIdx >= 0){
    const slRole = roleCfg(u.slotRole);
    if (slRole && u.slotRole !== "foot" && !u.role) line("役職 " + slRole.label);
    if (u.leader && !u.leader.dead) line("上官 " + roleCfg(u.leader.role).label + "(" + u.leader.def.name + ")");
    if (u.cmd) line("軍令 " + CMD_LABEL[u.cmd.type]);
  }
  if (u.shakenMs > 0) line("動揺");
  const row = document.createElement("div"); row.className = "ui-row";
  if (u.side === "player" && u.role && COMMANDER_ROLES.indexOf(u.role) !== -1){
    const b = document.createElement("button"); b.textContent = "軍令を出す";
    b.addEventListener("click", () => {
      cmdUI.open = true; cmdUI.cmdrId = u.id; cmdUI.branch = null; cmdUI.pickTarget = false; cmdUI.pickFormation = false;
      renderCmdPanel(); closeUnitInfo();
    });
    row.appendChild(b);
  }
  const c = document.createElement("button"); c.textContent = "閉"; c.addEventListener("click", closeUnitInfo); row.appendChild(c);
  box.appendChild(row);
  // 兵の近くに置く(画面の外にはみ出さないように)
  const frame = document.getElementById("battlefield-frame").getBoundingClientRect();
  const r = u.el.getBoundingClientRect();
  const bw = box.offsetWidth, bh = box.offsetHeight;
  let left = r.left - frame.left + r.width / 2 - bw / 2;
  left = Math.max(4, Math.min(frame.width - bw - 4, left));
  let top = r.top - frame.top - bh - 6;
  if (top < 4) top = r.bottom - frame.top + 6;
  top = Math.max(4, Math.min(frame.height - bh - 4, top));
  box.style.left = left + "px";
  box.style.top = top + "px";
}
document.getElementById("battlefield").addEventListener("click", e => {
  if (!battle || battle.ended) return;
  const p = fieldPointToLogical(e);
  const u = unitAtPoint(p.lx, p.ly);
  if (u){ showUnitInfo(u); return; }               // 兵をタップ：情報を出す
  closeUnitInfo();
  // 何もない所をタップ：その戦列を、選ぶ・解除する(複数選べる)
  const lane = Math.floor((STAGE_H - GRID_GROUND - p.ly) / GRID_CELL);
  if (lane < 0 || lane >= GRID_LANES || !laneAllowed(lane)) return;
  if (battle.selectedLanes.has(lane)) battle.selectedLanes.delete(lane); else battle.selectedLanes.add(lane);
  updateLaneButtons();
});
setInterval(() => { if (infoUI.unit && battle && !battle.paused) renderUnitInfo(); }, 300);

/* ---------- 軍令の画面 ---------- */
const cmdUI = { open: false, cmdrId: null, branch: null, pickTarget: false, pickFormation: false };
function unitLabel(u){ return roleCfg(u.role).label + "(" + u.def.name + ") " + LANE_LABELS[u.lane]; }

function renderCmdPanel(){
  const panel = document.getElementById("cmd-panel");
  if (!cmdUI.open || !battle){ panel.style.display = "none"; return; }
  panel.style.display = "block";
  panel.innerHTML = "";
  const mk = (text, cls, fn, dis) => {
    const b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    if (dis) b.disabled = true; else if (fn) b.addEventListener("click", fn);
    return b;
  };
  const head = document.createElement("div"); head.className = "cmd-head";
  const ht = document.createElement("span"); ht.textContent = "軍令"; ht.dataset.reading = "ぐんれい"; head.appendChild(ht);
  head.appendChild(mk("閉", "", () => { cmdUI.open = false; renderCmdPanel(); }));
  panel.appendChild(head);

  // いま出ている軍令(手動で解除できる)
  if (battle.commands.length){
    const sec = document.createElement("div"); sec.className = "cmd-sec"; sec.textContent = "発令中"; panel.appendChild(sec);
    battle.commands.forEach(c => {
      const row = document.createElement("div"); row.className = "cmd-active";
      const t = document.createElement("span");
      t.textContent = roleCfg(c.commander.role).label + (c.branchRole ? "→" + roleCfg(c.branchRole).label : "") + " " + CMD_LABEL[c.type] +
        (c.type === "attack" && c.target ? "(敵" + (roleCfg(c.target.role) ? roleCfg(c.target.role).label : "") + ")" : "");
      row.appendChild(t);
      row.appendChild(mk("解除", "", () => { releaseCommand(c); renderCmdPanel(); }));
      panel.appendChild(row);
    });
  }

  // 命令者
  const cmdrs = listCommanders();
  const sec2 = document.createElement("div"); sec2.className = "cmd-sec"; sec2.textContent = "命令者"; panel.appendChild(sec2);
  if (!cmdrs.length){
    const n = document.createElement("div"); n.style.cssText = "font-size:.66rem;color:var(--text-dim);"; n.textContent = "命令できる役職の兵が、戦場にいない"; panel.appendChild(n);
  }
  const row = document.createElement("div"); row.className = "cmd-row";
  cmdrs.forEach(u => {
    row.appendChild(mk(unitLabel(u), cmdUI.cmdrId === u.id ? "sel" : "", () => { cmdUI.cmdrId = u.id; cmdUI.branch = null; cmdUI.pickTarget = false; cmdUI.pickFormation = false; renderCmdPanel(); }));
  });
  panel.appendChild(row);

  const cmdr = cmdrs.find(u => u.id === cmdUI.cmdrId);
  if (!cmdr) return;
  // 直属の役職の選択(総大将・宿老)
  const branches = commandBranches(cmdr);
  if (branches.length){
    if (!cmdUI.branch || branches.indexOf(cmdUI.branch) === -1) cmdUI.branch = branches[0];
    const sec3 = document.createElement("div"); sec3.className = "cmd-sec"; sec3.textContent = "指示する相手"; panel.appendChild(sec3);
    const r3 = document.createElement("div"); r3.className = "cmd-row";
    branches.forEach(b => r3.appendChild(mk(roleCfg(b).label, cmdUI.branch === b ? "sel" : "", () => { cmdUI.branch = b; renderCmdPanel(); })));
    panel.appendChild(r3);
  } else if (cmdr.role === "general" || cmdr.role === "elder"){
    const n = document.createElement("div"); n.style.cssText = "font-size:.66rem;color:var(--text-dim);"; n.textContent = "配下が、戦場にいない"; panel.appendChild(n);
    return;
  }
  const branch = branches.length ? cmdUI.branch : null;
  const members = commandMembers(cmdr, branch);
  // 軍令
  const sec4 = document.createElement("div"); sec4.className = "cmd-sec"; sec4.textContent = "軍令(配下 " + members.length + "体)"; panel.appendChild(sec4);
  const r4 = document.createElement("div"); r4.className = "cmd-row";
  ["guard", "hold", "advance", "retreat", "attack"].forEach(type => {
    const cd = cmdr.cmdCd[type];
    const label = CMD_LABEL[type] + (cd > 0 ? " " + Math.ceil(cd / 1000) + "秒" : "");
    const selected = (type === "attack" && cmdUI.pickTarget) || (type === "advance" && cmdUI.pickFormation);
    r4.appendChild(mk(label, selected ? "sel" : "", () => {
      if (type === "attack"){ cmdUI.pickTarget = !cmdUI.pickTarget; cmdUI.pickFormation = false; renderCmdPanel(); return; }
      if (type === "advance"){ cmdUI.pickFormation = !cmdUI.pickFormation; cmdUI.pickTarget = false; renderCmdPanel(); return; }
      cmdUI.pickTarget = false; cmdUI.pickFormation = false;
      issueCommand(cmdr, type, branch);
      renderCmdPanel();
    }, cd > 0 || !members.length));
  });
  panel.appendChild(r4);
  // 進撃：陣形を選ぶ(配下の数が足りない陣形は、選べない。3体未満は、どれも組めない)
  if (cmdUI.pickFormation){
    const sec6 = document.createElement("div"); sec6.className = "cmd-sec"; sec6.textContent = "陣形(長押しで説明)"; panel.appendChild(sec6);
    const r6 = document.createElement("div"); r6.className = "cmd-row";
    FORMATIONS.forEach(f => {
      const need = Math.max(FORMATION_MIN_ALL, f.min);
      const b = mk(f.name, "", () => {
        if (issueCommand(cmdr, "advance", branch, null, { formation: f.id })){ cmdUI.pickFormation = false; }
        renderCmdPanel();
      }, members.length < need);
      b.dataset.rname = f.name; b.dataset.reading = f.reading; b.dataset.desc = f.desc + "(配下" + need + "体以上)";
      b.dataset.fm = f.id; b.dataset.fmN = members.length; b.dataset.pause = "1"; // 長押しで、陣形の形を図で見せて、ゲームを一時停止する
      r6.appendChild(b);
    });
    panel.appendChild(r6);
  }
  // 標的：敵の役職者を選ぶ
  if (cmdUI.pickTarget){
    const sec5 = document.createElement("div"); sec5.className = "cmd-sec"; sec5.textContent = "標的(敵の役職)"; panel.appendChild(sec5);
    const targets = battle.units.filter(u => u.side === "enemy" && !u.dead && u.role && ["general", "elder", "captain", "chief", "vanguard", "assault"].indexOf(u.role) !== -1);
    const r5 = document.createElement("div"); r5.className = "cmd-row";
    if (!targets.length){
      const n = document.createElement("div"); n.style.cssText = "font-size:.66rem;color:var(--text-dim);"; n.textContent = "敵の役職者が、いない"; panel.appendChild(n);
    }
    targets.forEach(t => r5.appendChild(mk("敵" + roleCfg(t.role).label + " " + LANE_LABELS[t.lane], "", () => {
      if (issueCommand(cmdr, "attack", branch, t)) cmdUI.pickTarget = false;
      renderCmdPanel();
    })));
    panel.appendChild(r5);
  }
}
document.getElementById("cmd-open-btn").addEventListener("click", () => { cmdUI.open = !cmdUI.open; renderCmdPanel(); });
setInterval(() => { if (cmdUI.open && battle && !battle.paused) renderCmdPanel(); }, 500); // クールタイムの表示を更新する
window.addEventListener("resize", () => { fitStage(); layoutLaneButtons(); });
buildGrid();
buildLaneButtons();
fitStage();
layoutLaneButtons();
/* ---------- レーン選択ボタン ---------- */
// 左端に縦に5つ(下から 最左翼 〜 最右翼)。ここでレーンを選んでから、キャラを召喚する
function buildLaneButtons(){
  const box = document.getElementById("lane-buttons");
  box.innerHTML = "";
  for (let k = 0; k < GRID_LANES; k++){
    const b = document.createElement("button");
    b.textContent = LANE_LABELS[k];
    b.dataset.lane = k;
    b.dataset.reading = LANE_READINGS[k];
    b.addEventListener("click", () => {
      if (!battle) return;
      // タップするたびに、選択・解除が切り替わる(5レーン全て選べる)
      if (battle.selectedLanes.has(k)) battle.selectedLanes.delete(k); else battle.selectedLanes.add(k);
      updateLaneButtons();
    });
    box.appendChild(b);
  }
  // 全レーンの選択・解除をまとめて切り替えるボタン
  const all = document.createElement("button");
  all.id = "lane-all-btn";
  all.textContent = "全戦列";
  all.dataset.reading = "ぜんせんれつ";
  all.addEventListener("click", () => {
    if (!battle) return;
    const al = allowedLaneList();
    if (battle.selectedLanes.size >= al.length) battle.selectedLanes.clear();
    else al.forEach(k => battle.selectedLanes.add(k));
    updateLaneButtons();
  });
  box.appendChild(all);
  layoutLaneButtons();
}
function layoutLaneButtons(){
  const frame = document.getElementById("battlefield-frame");
  const box = document.getElementById("lane-buttons");
  if (!frame || !box || !frame.clientHeight) return;
  const scale = Math.min((frame.clientWidth - LANE_GUTTER) / STAGE_W, frame.clientHeight / STAGE_H);
  const offy = frame.clientHeight - STAGE_H * scale;
  Array.from(box.children).forEach(b => {
    if (b.id === "lane-all-btn"){
      // 「全レーン」ボタンは、いちばん下のレーンの下(地面の下の余白)に置く
      const t = offy + (STAGE_H - GRID_GROUND) * scale + 2;
      b.style.top = t + "px";
      b.style.height = Math.max(16, GRID_GROUND * scale - 4) + "px";
      return;
    }
    const k = Number(b.dataset.lane);
    const top = offy + (STAGE_H - GRID_GROUND - GRID_CELL * (k + 1)) * scale;
    b.style.top = (top + 1) + "px";
    b.style.height = Math.max(20, GRID_CELL * scale - 3) + "px";
  });
}
function updateLaneBands(){
  const field = document.getElementById("battlefield");
  if (!field) return;
  for (let k = 0; k < GRID_LANES; k++){
    let band = document.getElementById("lane-band-" + k);
    if (!band){
      band = document.createElement("div");
      band.id = "lane-band-" + k;
      band.className = "lane-band";
      band.style.bottom = laneFloor(k) + "px";
      field.appendChild(band);
    }
    const single = !!(battle && battle.stage && battle.stage.lanes && battle.stage.lanes.length <= 1); // 戦列が1つだけの戦線では、帯を光らせない
    band.classList.toggle("on", !!battle && !single && battle.selectedLanes.has(k));
  }
}
function updateLaneButtons(){
  updateLaneBands();
  if (battle) updateWalletUI(); // 召喚ボタンの「×選んだ戦列の数」と合計の屍を更新する
  const box = document.getElementById("lane-buttons");
  if (!box) return;
  Array.from(box.children).forEach(b => {
    if (b.id === "lane-all-btn"){
      b.classList.toggle("selected", !!battle && battle.selectedLanes.size >= allowedLaneList().length);
      return;
    }
    b.classList.toggle("selected", !!battle && battle.selectedLanes.has(Number(b.dataset.lane)));
  });
}
function allowedLaneList(){ const r = []; for (let k = 0; k < GRID_LANES; k++) if (laneAllowed(k)) r.push(k); return r; }
function flashLaneButtons(){
  const box = document.getElementById("lane-buttons");
  box.classList.remove("flash");
  void box.offsetWidth;
  box.classList.add("flash");
  setTimeout(() => box.classList.remove("flash"), 1200);
}

})();
