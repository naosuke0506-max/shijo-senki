  if (target.chariotRiders && target.chariotRiders.length){
    // チャリオットが(体重負け・被弾のどちらであれ)壊れた瞬間、乗っていた者は全員死ぬ
    target.chariotRiders.forEach(r => { if (!r.dead){ r.dead = true; r.mounted = false; r.mount = null; removeUnit(r); } });
    target.chariotRiders = [];
  }
  if (target.perch) dropDeadFromTower(target); // 台の上・壁の上で倒れた：地面へ落ちる
  if (target.def.structureUnit){ collapseStructure(target); return; } // 望楼台・壁は、専用の崩れ方をする
  // 屍：敵味方を問わず、倒れたユニットの値段に応じてたまる(ゲートなど値段のないものは、たまらない)
  if (battle && target.def.cost > 0 && !target.noCorpse){
    const rate = battle.stage.corpseGainRate != null ? battle.stage.corpseGainRate : CORPSE_GAIN_RATE;
    if (battle.stage.siteBattle){                                      // 拠点の戦闘：倒された側ではなく、倒した側の屍になる(リーダーを倒すと、上乗せ)
      const amt = target.def.cost * rate + ((target.isLeader || target.isEnemyLeader) ? LEADER_KILL_CORPSE : 0);
      if (target.side === "enemy") battle.corpse += amt; else battle.enemyCorpse = (battle.enemyCorpse || 0) + amt;
    } else battle.corpse += target.def.cost * rate;                    // 従来の戦線(検証用)は、これまで通り
    updateWalletUI();
  }
  // ゲートが壊された：キングのゲート召喚クールタイムを延ばす
  if (target.def.gateUnit && target.owner && target.owner.def.gate){
    target.owner.gateCooldown += target.owner.def.gate.breakPenaltyMs;
  }
  if (target.bearerOf) onBearerDied(target);          // 担ぎ手が倒れた：全員倒れたら玉座が落下する
  if (target.def.bearers) releaseBearers(target);     // キングが倒れた：残った担ぎ手は普通のユニットに戻る
  clearBuffsFrom(target); // このユニットが死んだので、与えていたバフも消える

  // ゴブリン・ヒーラーの自動蘇生判定：味方のゴブリン族が死亡した瞬間、
  // その時点でフィールドに残っている中で最も価値(コスト)の高いゴブリンであれば、
  // 範囲内の未使用ヒーラーが自動で蘇生の詠唱を始める
  if (target.def.race === "goblin"){
    tryAutoRevive(target);
  }
  tryMedicRescue(target); // 軍医：同じレーンの味方が死んだ瞬間、死体を目の前へ運んで治療を始める

  setMotion(target, "down", {
    onEnd: () => {
      if (target.frozenForRevive) return; // 蘇生対象として固定中は、詠唱が終わる/中断されるまで消えずに待つ
      if (target.riders){
        // フォートレス：ダウンの最終コマで止まったまま、背中のゴブリンが全員降りるまで消えない
        target.downFinished = true;
        if (hasRidersLeft(target)) return;
      }
      removeUnit(target);
    }
  });
  if (target.riders) startDismount(target);
}

// 死んだ味方ゴブリンが、現時点でフィールドに残っている中で最も価値の高いゴブリンかどうかを判定し、
// 範囲内で手が空いているヒーラーがいれば蘇生の詠唱を開始させる
function tryAutoRevive(target){
  if (!battle) return;
  if (target.def.noRevive) return; // 女王など、蘇生できないユニット
  const sameRaceAllies = battle.units.filter(u =>
    u !== target && !u.dead && u.side === target.side && u.def.race === "goblin" &&
    !u.def.canRevive // ヒーラー自身は「価値比較」の対象から除外(蘇生役がいることで蘇生が妨げられないように)
  );
  const maxOtherCost = sameRaceAllies.reduce((m, u) => Math.max(m, u.def.cost || 0), 0);
  if ((target.def.cost || 0) < maxOtherCost) return; // 他にもっと価値の高いゴブリンがまだ生きている

  const candidates = battle.units.filter(u =>
    !u.dead && u.side === target.side && u.def.canRevive &&
    !u.isReviving && u.reviveUsesLeft > 0 &&
    edgeDistance(u, target) <= (u.def.reviveRadius || 0)
  );
  if (!candidates.length) return; // 範囲外、または蘇生できるヒーラーがいない

  candidates.sort((a, b) => edgeDistance(a, target) - edgeDistance(b, target));
  startRevive(candidates[0], target);
}

function startRevive(healer, corpse){
  healer.isReviving = true;
  healer.reviveTarget = corpse;
  corpse.frozenForRevive = true;

  setMotion(healer, "revive", {
    onEnd: () => {
      // 妨害されずに最後まで唱え切った＝蘇生成功。ヒーラーは代償として息絶える
      healer.isReviving = false;
      healer.reviveTarget = null;
      healer.reviveUsesLeft = Math.max(0, healer.reviveUsesLeft - 1);
      completeRevive(healer, corpse);
    }
  });
}

// 軍医：同じレーンの味方が死んだ瞬間、手が空いていて(治療中でなく、クールタイム明けの)軍医がいれば、
// その死体を瞬間移動させて目の前に置き、治療(応急処置)を始める
function tryMedicRescue(corpse){
  if (!battle || corpse.def.noRevive) return;
  const medic = battle.units.find(u =>
    !u.dead && u.def.canRescue && !u.isReviving && u.side === corpse.side &&
    (u.medicCooldown || 0) <= 0 && lanesOverlap(u.lane, u.lane, corpse.laneLo, corpse.laneHi)
  );
  if (!medic) return;
  startMedicRescue(medic, corpse);
}
function startMedicRescue(medic, corpse){
  medic.isReviving = true;
  medic.reviveMotionName = "treat";
  medic.reviveTarget = corpse;
  corpse.frozenForRevive = true; // 治療が終わる/中断されるまで、死体を消滅させずに固定する

  // 死体を、軍医の目の前(進行方向の少し先)へ瞬間移動させる
  const dir = medic.side === "player" ? -1 : 1;
  corpse.x = medic.x + dir * 40;
  corpse.facing = -dir;
  applyFrame(corpse);

  setMotion(medic, "treat", {
    onEnd: () => {
      medic.isReviving = false;
      medic.reviveMotionName = null;
      medic.reviveTarget = null;
      medic.medicCooldown = medic.def.rescueCooldownMs || 10000;
      completeMedicRescue(medic, corpse);
    }
  });
}
function unitBaseFacing(u){ const base = u.side === "player" ? -1 : 1; return u.def.invertFacing ? -base : base; }
function completeMedicRescue(medic, corpse){
  corpse.frozenForRevive = false;
  corpse.dead = false;
  corpse.facing = unitBaseFacing(corpse);                                     // 蘇生された兵は、もとの向き(進む方向)に戻す
  corpse.hp = corpse.hpMax; // 全回復
  corpse.reviveInvulnMs = medic.def.reviveInvulnMs || 0;
  corpse.target = null;
  applyFrame(corpse);
  playReviveFx(corpse, medic.def.fxReviveAura);
  const fallback = corpse.def.frameCounts.walk ? "walk" : (corpse.def.approachMotion || "walk");
  if (corpse.def.frameCounts.getup){
    setMotion(corpse, "getup", { onEnd: () => { if (!corpse.dead) setMotion(corpse, fallback, { loop:true }); } });
  } else {
    setMotion(corpse, fallback, { loop:true });
  }
  if (!medic.dead) setMotion(medic, "idle", { loop:true }); // 軍医自身は、巫鬼と違って代償なく生き残る
}
// 蘇生・治療完了の瞬間に、対象の体の中心へ重ねて出す一連のエフェクト(黒背景は透過に変換して使う)
function playReviveFx(unit, fx){
  if (!fx) return;
  for (let i = 0; i < fx.count; i++){
    btimeout(() => {
      if (unit.dead) return;
      const H = unit._displayHeight || 92;
      const cx = unit.x + (unit._displayWidth || 0) / 2;
      const el = spawnFx(keyedFxSrc(fx.imageBase + fx.prefix + (i + 1) + ".png", FX_KEY_HEAL), cx, {
        height: Math.round(H * 0.6), bottom: Math.round((unit.baseB || 74) + (unit.rideY || 0) + H * 0.25), lifespan: fx.durations[i]
      });
      if (el){
        el.style.mixBlendMode = "normal";
        el.style.transform = "translateX(" + cx + "px) translateX(-50%)";
      }
    }, i * (fx.durations[i] || 200));
  }
}
function completeRevive(healer, corpse){
  corpse.frozenForRevive = false;
  corpse.dead = false;
  corpse.facing = unitBaseFacing(corpse);
  const restorePercent = corpse.def.corpseRestoreHpPercent != null ? corpse.def.corpseRestoreHpPercent : 0.4;
  corpse.hp = Math.max(1, Math.round(corpse.hpMax * restorePercent));
  corpse.reviveInvulnMs = healer.def.reviveInvulnMs || 0; // 蘇生された側は、しばらく攻撃を受けない
  corpse.target = null;
  applyFrame(corpse);
  const fallback = corpse.def.frameCounts.walk ? "walk" : (corpse.def.approachMotion || "walk");
  setMotion(corpse, "getup", { onEnd: () => { if (!corpse.dead) setMotion(corpse, fallback, { loop:true }); } });

  // 禁忌の代償：蘇生を成し遂げたヒーラー自身は爆発とともに焼け焦げて死亡する
  healer.dead = true;
  removeUnit(healer);
}

// 蘇生の詠唱中に被弾などでモーションが強制的に変わってしまったら、蘇生失敗として扱う
// (ヒーラーは死なずに生き残るが、対象の死体は固定を解除されて通常通り消える)
function updateRevive(dtMs){
  if (!battle) return;
  battle.units.forEach(u => {
    if (!u.isReviving) return;
    const expectMotion = u.reviveMotionName || "revive"; // 軍医は"treat"、巫鬼は従来通り"revive"
    if (u.motion !== expectMotion){
      u.isReviving = false;
      u.reviveMotionName = null;
      const corpse = u.reviveTarget;
      u.reviveTarget = null;
      if (corpse){
        corpse.frozenForRevive = false;
        if (corpse.dead) removeUnit(corpse);
      }
    }
  });
}

function applyDamageToUnit(target, amount, attacker){
  if (target.dead) return;
  if (attacker) amount = upgradeHitMod(attacker, target, amount);       // 強化の、3段階めの能力
  // 火炎属性の攻撃(通常攻撃・地面に広がる炎など)がガス缶に触れると、体力に関係なく即座に爆発する
  if (target.def.ignitesInstantly && !target.exploding && attacker && attacker.def && attacker.def.attackFlags && attacker.def.attackFlags.fire){
    explodeGasCan(target, attacker);
    return;
  }
  if (attacker) target.lastAttacker = attacker; // 通常のダメージでHPが尽きた時、誰の一撃だったかを覚えておく(ガス缶の爆発の向き先などに使う)
  // フォートレスの背中や、チャリオットに乗っている間は攻撃を受けない。
  // ただしチャリオットの乗員だけは例外で、遠距離攻撃(弓など)なら乗ったままでも狙い撃たれる
  if (target.mounted && !(target.mount && target.mount.def.chariotUnit && attacker && attacker.def.ranged)) return;
  if (target.def.invulnerable) return;       // 巨大ゲートは壊せない
  if (attacker && target.def.structureKind === "barricade" && attacker.def.race === "beast" && (attacker.def.laneSpan || 1) === 1 && !attacker.dead){   // 拒馬に突っ込んだ魔獣(犬・鬼犀)：反射ダメージ＋出血の蓄積
    const back = Math.max(1, amount * 0.5); attacker.hp = Math.max(0, attacker.hp - back); applyFrame(attacker);
    if (addStatusGauge(attacker, "bleed", 60, 100) && attacker.hp > 0){ attacker.hp = Math.max(0, attacker.hp - (attacker.hpMax * 0.15 + 5)); applyFrame(attacker); playBleedFx(attacker, CHAR_DEFS.chief); }
    if (attacker.hp <= 0) killUnit(attacker);
  }
  if (target.reviveInvulnMs > 0) return;     // 蘇生直後の無敵時間中
  // 担がれているキングは、遠距離攻撃(空中に届く攻撃)でしか攻撃できない
  if (target.elevated && attacker && !(attacker.def.ranged || attacker.def.canHitAir)) return;
  if (target.transforming) return; // 女王の第二形態への移行モーション中は無敵(毒などのダメージも受けない)
  if (target.laneMoving) return;   // レーン移動(回避)のモーション中は無敵
  // 女王のバリア：範囲内の味方(4m以下)は、敵の遠距離攻撃を受けない
  if (attacker && attacker.def.ranged && (target.def.heightM || 2) <= 4 && isShielded(target)) return;
  // 楯衛の肩代わり：撃ってくる戦列と同じ戦列で、味方の前に立つ盾兵が、ガードできる状態なら、遠距離攻撃を代わりに防ぐ
  if (attacker && attacker.def.ranged && !target.def.canGuard && !attacker.def.splashRadius && !target.perch &&
      !(attacker.def.attackFlags && (attacker.def.attackFlags.ignoresGuard || attacker.def.attackFlags.breaksShield))){
    const cover = findCoverShield(target, attacker);
    if (cover){
      cover.guardCooldown = cover.def.guardCooldownMs || 1000;
      setMotion(cover, "guard", { onEnd: () => afterReaction(cover) });
      return;
    }
  }
  const def = target.def;
  const attackerFlags = (attacker && attacker.def.attackFlags) || {};
  if (attackerFlags.fire && battle && battle.env) amount *= envFireMult(battle.env);       // 雨：火の威力が弱まる
  const meleeRangeCheck = attacker && edgeDistance(target, attacker) <= def.attackRange;
  if (attacker && attacker.aura && attacker.aura.splash !== 1 && attacker.def.splashRadius) amount *= attacker.aura.splash;     // 範囲攻撃の威力(鬼象砦のリーダー効果)
  if (attacker && attacker.homeAtk) amount *= attacker.homeAtk;     // 本拠地の力：与えるダメージ全て(物理・火炎・爆発・範囲・特殊攻撃)が上がる
  amount = amount * getDamageCutMultiplier(target); // 鼓舞バフの被ダメージカットを適用
  // 甲冑兵などの、鎧そのものによる近接ダメージ軽減(ガードとは別判定なので、ガード貫通の一撃にも効く)
  if (def.meleeDamageCutPercent && !(attacker && attacker.def.ranged)){
    amount = amount * (1 - def.meleeDamageCutPercent);
  }

  // 特殊回避：自分の攻撃射程内(=近接で殴られた時)の前方攻撃だけを一度限り確定で避ける
  // (火縄銃などの遠距離攻撃は射程外からの被弾になるため対象外)
  const dodgeReady = def.canDodge && !target.dodgeUsed && !isSuperArmored(target, attacker) && !target.restrained &&
    meleeRangeCheck && isAttackFromFront(target, attacker) && !attackerFlags.sideHitbox;

  if (dodgeReady && startLaneDodge(target)){
    // 回避：上下どちらかの隣のレーンへ移動する(モーション中は無敵、着いて2秒後にまた回避モーションで元のレーンへ戻る)
    // 攻撃していた側は、戦列を外れた相手をもう追わない：狙いを外し、その場に立ち止まらず前進を続ける
    if (attacker){
      if (attacker.target === target) attacker.target = null;
      attacker.dodgedPastUnit = target; // この相手とはもう戦わない(戻ってきてすれ違っても、狙い直さない)
    }
    return; // ダメージなし
  }

  const guardReady = def.canGuard && !target.shieldBroken &&
    target.guardCooldown <= 0 && !isSuperArmored(target, attacker) && !target.restrained &&
    !attackerFlags.bypassGuard &&
    isAttackFromFront(target, attacker) &&
    (!attacker || lanesOverlap(target.lane, target.lane, attacker.laneLo, attacker.laneHi)); // 自分のレーンからの正面の攻撃だけガードできる(横のレーンからの攻撃は不可)

  if (guardReady){
    const flags = attackerFlags;

    if ((flags.breaksShield || flags.ignoresGuard) && target.aura && target.aura.antiBreak > 0){
      target.aura.antiBreak--;                                     // 盾兵のリーダー効果：ガード無効・ガードブレイカーを、一度だけ無効にする(通常のガードとして防ぐ)
      target.guardCooldown = def.guardCooldownMs || 1000;
      setMotion(target, "guard", { onEnd: () => afterReaction(target) });
      return;
    }
    if (flags.breaksShield){
      // ガードブレイカー攻撃：盾が完全に壊れ、以後ガードも近接攻撃も使えなくなる
      target.shieldBroken = true;
      target.hp = Math.max(0, target.hp - amount);
      applyFrame(target);
      if (target.hp <= 0){ killUnit(target); return; }
      setMotion(target, "shield_destroy", { onEnd: () => afterReaction(target) });
      return;
    }

    if (flags.ignoresGuard){
      // ガード無効攻撃：ダメージは通らない。ガードが弾かれ、ガードのクールタイムが余分に増えるだけ
      target.guardCooldown = (def.guardCooldownMs || 1000) + (def.guardIgnoredPenaltyMs || 0);
      setMotion(target, "shieldbreak", { onEnd: () => afterReaction(target) });
      return;
    }

    // 通常攻撃はガードで無効化
    target.guardCooldown = def.guardCooldownMs || 1000;
    setMotion(target, "guard", { onEnd: () => afterReaction(target) });
    return;
  }

  target.hp = Math.max(0, target.hp - amount);
  applyFrame(target);
  if (target.def.structureUnit && target.hp > 0) updateStructureStage(target); // 望楼台・壁：傷の見た目を切り替える

  // 毒付与(弓兵の矢など)：蓄積式。閾値に達すると発動し、最大HPの一定割合を効果時間で分割して与える
  if (attacker && attacker.def.poisonOnHit && target.hp > 0 && !target.def.poisonImmune && !target.def.structureUnit){ // 建物は生き物ではないので、毒などの状態異常は効かない
    const stackPerHit = attacker.def.poisonStackPerHit || 0;
    const threshold = attacker.def.poisonStackThreshold || 100;
    const poisonTriggered = addStatusGauge(target, "poison", stackPerHit, threshold); // 毒ゲージは、対象ごとに1つ(誰の矢でも同じゲージにたまる)
    target.poisonFxDef = attacker.def.fxPoisonStatus || target.poisonFxDef;

    if (poisonTriggered){
      const durationMs = attacker.def.poisonDurationMs || 0;
      const tickInterval = attacker.def.poisonTickIntervalMs || 1000;
      const tickCount = Math.max(1, Math.round(durationMs / tickInterval));
      const totalDamage = target.hpMax * (attacker.def.poisonMaxHpPercent || 0) * (attacker.homeAtk || 1);   // 本拠地の力：状態異常ダメージも上がる
      target.poisonRemainingMs = durationMs;
      target.poisonTickTimer = tickInterval;
      target.poisonTickIntervalMs = tickInterval;
      target.poisonDamagePerTick = totalDamage / tickCount;
    }
  }

  // 出血付与(ゴブリン長の斬撃)：蓄積式。100%で発動し「最大HPの一定割合＋固定値」のダメージ
  if (attacker && attacker.def.bleedStackPerHit && target.hp > 0 && !target.def.bleedImmune && !target.def.structureUnit){ // 建物は生き物ではないので、出血などの状態異常は効かない
    const threshold = attacker.def.bleedStackThreshold || 100;
    if (addStatusGauge(target, "bleed", attacker.def.bleedStackPerHit * (attacker.aura ? attacker.aura.bleed : 1), threshold)){ // 出血ゲージも、対象ごとに1つ
      const bleedDmg = (target.hpMax * (attacker.def.bleedMaxHpPercent || 0) + (attacker.def.bleedFixedDamage || 0)) * (attacker.homeAtk || 1) * (target.homeCut || 1);   // 本拠地の力：与える側は上がり、受ける側は軽くなる
      target.hp = Math.max(0, target.hp - bleedDmg);
      applyFrame(target);
      playBleedFx(target, attacker.def);
    }
  }

  if (target.hp <= 0){
    killUnit(target);
    return;
  }

  // 打ち上げ・吹き飛ばし効果：スーパーアーマー中の相手にも適用される(ラッシャーの一撃など)
  // rage_charge中は各ヒットの効果をresolveRageChargeHit側で個別に指定するため、ここでは重複適用しない
  if (attacker && attacker.def.attackFlags && attacker.motion !== "rage_charge"){
    if (attacker.def.attackFlags.launchesUp){
      launchUnit(target, attacker, { upSpeed: 380 });
    } else if (attacker.def.attackFlags.knocksBack){
      launchUnit(target, attacker, { upSpeed: 340, knockback: true }); // 後ろへ2マス分
    }
  }

  // 女王：HPが一定割合以下になったら、一度だけ第二形態へ移行する(その一撃では怯まず、移行モーションに入る)
  if (def.transformAtHpRatio && !target.transformed && target.hp / target.hpMax <= def.transformAtHpRatio){
    startTransform(target);
    return;
  }

  if (isSuperArmored(target, attacker) || target.restrained || target.launched || target.berserk) return; // スーパーアーマー中・拘束中・打ち上げ中・凶暴化中は怯まない
  if (def.gateUnit || !def.frameCounts.flinch) return; // 怯みモーションを持たないもの(ゲートなど)は、殴られても見た目が変わらない

  setMotion(target, "flinch", { onEnd: () => afterReaction(target) });
}

/* ---------- ユニットのAI(索敵→接敵→攻撃) ---------- */

function findNearestEnemyInRange(unit){
  if (!battle) return null;
  let nearest = null, nearestDist = Infinity;
  const detectR = unit.def.detectionRange * envMult(battle.env, unit, "detect");     // 夜・霧では、遠くの敵に気づきにくい
  let priority = null, priorityDist = Infinity; // 斥候：非戦闘の支援役がいれば、そちらを優先して探す
  battle.units.forEach(other => {
    if (other === unit || other.dead || !hostile(unit, other)) return;                  // 凶暴化した兵は、味方も敵になる(味方にとっても、凶暴化した兵は敵)
    if (unit.def.ignoresUnits && !other.def.countsAsBuilding) return; // 破城槌：建物(扱い)以外の敵ユニットは眼中にない
    if (other.mounted && !(other.mount && other.mount.def.chariotUnit && unit.def.ranged)) return; // フォートレスの背中や、チャリオットの上は狙えない(遠距離がチャリオットの乗員を狙う場合を除く)
    if (!canReachLane(unit, other)) return; // 自分のレーン(遠距離はさらに隣のレーン)にいない敵は、見つけられない・狙えない
    if (other.def.invulnerable) return; // 壊せない巨大ゲートは狙わない
    if (other.elevated && !(unit.def.ranged || unit.def.canHitAir)) return; // 担がれたキングは遠距離攻撃しか届かない
    if (other === unit.dodgedPastUnit && !unit.def.canEngageBehind) return; // 回避してすれ違った相手とは戦わない(斥候は例外)
    const d = edgeDistance(unit, other);
    if (d > detectR) return;
    if (!isEngageable(unit, other)) return; // 完全に背後の敵は無視(密着していれば例外)
    if (d < nearestDist){
      nearest = other;
      nearestDist = d;
    }
    if (unit.def.preferNoCombatTargets && other.def.noCombat && d < priorityDist){
      priority = other;
      priorityDist = d;
    }
  });
  return priority || nearest;
}

function onAttackEnd(unit){
  if (unit.dead) return;
  if (unit.target && unit.target.dead) unit.target = null;
  const def = unit.def;
  if (def.castRestMs){ unit.restMs = def.castRestMs; unit.target = null; setMotion(unit, "idle", { loop:true }); return; }      // 呪術師：唱えたあとは、少し間をおく
  const approachMotion = def.approachMotion || "run";
  // いったん歩き/接近モーションへ戻し、次のtickで距離を再評価させる(範囲内ならすぐ攻撃に戻る)
  const fallback = def.frameCounts.walk ? "walk" : approachMotion;
  setMotion(unit, unit.target ? approachMotion : fallback, { loop:true });
}
function updateUnitAI(unit, dtMs){
  if (unit.dead || unit.debugLock || unit.restrained || unit.launched || unit.charging) return;
  const def = unit.def;
  if (unit.appearing) return;                                                      // 輪の中から出てくる間は、動かない
  if (unit.restMs > 0){ unit.restMs -= dtMs; if (unit.restMs > 0) return; unit.restMs = 0; }   // 唱えたあとの間

  if (unit.mounted){ // フォートレスの背中や、チャリオットに乗っている間は、自分では移動しない
    if (!unit.dismounting) updateMountedAI(unit); // 乗ったまま、遠距離系だけは射程内を狙って撃てる(フォートレスと共通)
    return;
  }
  if (def.chariotUnit){ updateChariotAI(unit, dtMs); return; } // チャリオット本体：専用の往復AI(持ち場の概念を持たず、出たら、すぐ動き出す)
  if (def.courierUnit){ updateCourierAI(unit, dtMs); return; } // 伝令兵：専用の往復・見張りAI(同上)
  if (def.trapperUnit){ updateTrapperAI(unit, dtMs); return; } // 穽鬼：専用の「置く→帰る→クールタイム→また出る」巡回AI(同上)

  if (unit.standX != null && battle.stage.siteBattle && siteStandStep(unit, dtMs)) return;      // 持ち場へ歩く・持ち場で待つ(軍医や、リーダーの設置系の兵も、これに従う)

  if (unit.returningHome){ updateReturnHomeAI(unit, dtMs); return; } // 設置後、自城へ戻っている最中(望楼兵・拒馬兵など)
  if (unit.awaitingResupply || unit.resupplied) return; // 自城で、クールタイム明け・次の指示を待っている間は、その場に留まる

  if (unit.perch){ updatePerchAI(unit, dtMs); return; }         // 望楼台・壁の上：その場から、全ての戦列を撃つ(軍令は受けない)
  if (unit.towerDetourMs > 0) unit.towerDetourMs = Math.max(0, unit.towerDetourMs - dtMs);
  if (def.immobile){ updateGateAI(unit, dtMs); return; }        // ゲート：動かず、時間が来たら召喚する
  if (unit.bearerOf){ updateBearerAI(unit); return; }            // キングの担ぎ手：担いでいる間は攻撃しない
  if (def.kingLogic){ updateKingAI(unit, dtMs); return; }         // キング：ゆっくり進み、ゲートを召喚する

  if (unit.buildTargetX != null){ updateBuilderAI(unit, dtMs); return; } // 望楼兵：指定のマス目まで歩き、着いたら築き始める
  if (unit.repairTarget){ updateRepairerAI(unit, dtMs); return; } // 修復兵：選んだ対象のそばに留まり、直し続ける
  if (def.noCombat){
    // 非戦闘ユニット(鼓舞兵など)：戦わないが、目の前に敵がいる間は立ち尽くして待つ
    const blocker = battle.units.find(other =>
      other !== unit && !other.dead && !other.mounted && !other.def.invulnerable && other.side !== unit.side &&
      isEngageable(unit, other) &&
      Math.abs(other.x - unit.x) <= (def.personalSpace || 50)
    );

    if (blocker){
      if (unit.motion !== "idle") setMotion(unit, "idle", { loop:true });
      return;
    }

    if (unit.motion !== "walk"){
      if (unit.motion === "idle") setMotion(unit, "walk", { loop:true });
      return; // 太鼓演奏中などはそのまま(updateInspire側で管理)
    }

    const field = document.getElementById("battlefield");
    const fieldWidth = field.clientWidth;
    const destX = unit.side === "player" ? 60 : fieldWidth - 60;
    const dx = destX - unit.x;
    if (Math.abs(dx) > 2){
      const dir = dx > 0 ? 1 : -1;
      const speed = getEffectiveSpeed(unit, def.walkSpeed);
      unit.x += moveWithCollision(unit, dir * speed * (dtMs/1000));
      applyFrame(unit);
    }
    return;
  }

  const approachMotion = def.approachMotion || "run"; // 発見後の接近モーション(兵士は走り、槍兵は忍び足)
  const approachSpeed = def.approachSpeed != null ? def.approachSpeed : def.runSpeed;
  const attackMotionName = def.attackMotionName || "attack"; // 攻撃モーションの呼び名(火縄銃兵はshoot)

  // 拠点の戦闘：待ち伏せ・持ち場。敵が見つからない間は、待機のモーションで立ち止まる(歩き↔待機を行き来して、ブレることがないよう、ここで先に決める)
  const placerBusy = unit.buildTargetX != null || unit.returningHome || unit.awaitingResupply || unit.resupplied || !!unit.repairTarget || def.chariotUnit || def.courierUnit;   // 築く・戻る・直す・戦車の動きは、待ち伏せで止めない
  if (battle.hold && battle.hold[unit.side] && battle.stage.siteBattle && !placerBusy && (unit.motion === "idle" || unit.motion === "walk" || unit.motion === approachMotion) && def.frameCounts.idle){
    const seen = (unit.target && !unit.target.dead) ? unit.target : findNearestEnemyInRange(unit);
    if (!seen){ if (unit.target) unit.target = null; if (unit.motion !== "idle") setMotion(unit, "idle", { loop:true }); return; }
  }
  // 一撃モーション中・怯み中などは、それぞれのonMotionEndで次の状態が決まるので何もしない
  if (unit.motion === "idle"){
    // "walk"という名前のコマを持たないキャラ(投石器など)は、代わりにapproachMotionを使う
    const initialMoveMotion = def.frameCounts.walk ? "walk" : approachMotion;
    if (!unit.shieldBroken) setMotion(unit, initialMoveMotion, { loop:true }); // 出現直後は発見モーションなしでそのまま歩く
    return; // 盾破壊で立ち尽くしているユニットはidleのまま(次の索敵チェックだけ継続したいので下に続けたいところだが、単純化のためここで留める)
  }
  if (unit.motion !== "walk" && unit.motion !== approachMotion) return;
  const walkFallback = def.frameCounts.walk ? "walk" : approachMotion;

  // 穢れの解除：穢れの溜まった味方が射程にいれば、そちらを先に狙う(ダメージなしで、穢れを減らす)
  if (def.canCleanse){
    if (unit.target && unit.target.side === unit.side && !unit.target.berserk && !((unit.target.defile || 0) >= DEFILE_CLEANSE_MIN)) unit.target = null;
    if (!unit.target || unit.target.side !== unit.side){ const al = findCleanseAlly(unit); if (al) unit.target = al; }
  }
  // 敵ユニットの索敵(検知範囲内の最も近い敵)
  if (!unit.target || unit.target.dead){
    const found = findNearestEnemyInRange(unit);
    if (found && unit.motion === walkFallback){
      unit.target = found;
      if (def.frameCounts.discover){
        setMotion(unit, "discover", { onEnd: () => setMotion(unit, approachMotion, { loop:true }) });
      } else {
        setMotion(unit, approachMotion, { loop:true }); // 発見の絵を持たないキャラは、そのまま接近コマへ
      }
      return;
    }
    if (!found && unit.target){
      unit.target = null;
    }
    if (!found && unit.motion === approachMotion && unit.motion !== walkFallback){
      setMotion(unit, walkFallback, { loop:true }); // 追っていた敵を見失ったら歩きに戻る
      return;
    }
  }

  const field = document.getElementById("battlefield");
  const fieldWidth = field.clientWidth;
  const forwardDir = unit.side === "player" ? -1 : 1; // 自陣営が進むべき方向。これと逆には進まない
  let destX = unit.target ? unit.target.x : (unit.side === "player" ? 60 : fieldWidth - 60 - (def.spawnFullyInside ? (def.hitboxWidth || 0) : 0));
  if (!unit.target && unit.side === "player" && battle.stage.siteBattle && battle.stage.siteBattle.mode === "defend") destX = -260;   // 敵の城がない拠点：進み続けて、画面の外へ出ていく
  let dx = destX - unit.x;

  if (unit.target && dx !== 0 && Math.sign(dx) !== forwardDir && !def.canEngageBehind){
    // 索敵対象が自分の後方にいる(回避で追い抜かれた場合など)：後退はせず、その相手は諦めて前進を続ける
    // (斥候は例外：振り向いて追いかける)
    unit.target = null;
    destX = unit.side === "player" ? 60 : fieldWidth - 60;
    dx = destX - unit.x;
  }

  const rangeDist = unit.target ? edgeDistance(unit, unit.target) : Math.abs(dx);
  const minRange = unit.def.minAttackRange || 0;

  // 中距離技(ゴブリン長)：近接の間合いの外で、中距離の間合いに入っていてクールタイムが明けていれば発動
  // 中距離技は、隣のレーンの敵に対しても使える(その場合、突進しながら隣のレーンへ移る)
  const mid = def.midrange;
  if (mid && !unit.shieldBroken && unit.midCooldown <= 0 && !(unit.target && rangeDist <= def.attackRange)){
    const cand = findMidrangeTarget(unit, mid);
    if (cand){
      unit.target = cand;
      startMidrange(unit);
      return;
    }
  }

  // 女王の魔法(シールド・メテオ)
  if (def.skills && unit.target && tryQueenSkills(unit, rangeDist)) return;

  if (rangeDist <= unit.def.attackRange && rangeDist >= minRange){
    if (unit.shieldBroken){
      // 盾が壊れて近接攻撃ができない：その場に立ち尽くす
      if (unit.motion !== "idle") setMotion(unit, "idle", { loop:true });
    } else {
      unit.attackHadTarget = !!unit.target;
      // 魔獣：隣のレーンの敵を攻撃するときは、攻撃の動きに合わせてそのレーンへ移動する
      if (def.laneStep && unit.target && !lanesOverlap(unit.lane, unit.lane, unit.target.laneLo, unit.target.laneHi)){
        startLaneStep(unit, laneTowards(unit, unit.target), 250);
      }
      setMotion(unit, attackMotionName, { onEnd: onAttackEnd });
    }
  } else if (rangeDist < minRange){
    // 近すぎて撃てない：後退はせず、モーションもそのままにその場で留まる(何もしない)
  } else {
    const dir = dx > 0 ? 1 : -1;
    const baseSpeed = unit.motion === approachMotion ? approachSpeed : unit.def.walkSpeed;
    const speed = getEffectiveSpeed(unit, baseSpeed);
    const moveAmount = dir * speed * (dtMs/1000);

    // 今の交戦相手を追っている最中でも、通り道(自分と同じ戦列)に未交戦の非戦闘ユニットがいればすり抜けずに足止めする。
    // 戦列が違えば、望楼台・壁など(noCombat)がどれだけ近くにあっても無視して通り過ぎる(遠距離は別途laneReachで届く)
    const passThroughBlocker = !unit.def.ignoresUnits && battle.units.find(other =>
      other !== unit.target && !other.dead && !other.mounted && !other.def.invulnerable && other.side !== unit.side && other.def.noCombat &&
      lanesOverlap(unit.laneLo, unit.laneHi, other.laneLo, other.laneHi) &&
      Math.sign(other.x - unit.x) === dir &&
      Math.abs(other.x - unit.x) <= Math.abs(moveAmount)
    );
    if (passThroughBlocker){
      unit.target = passThroughBlocker;
      return;
    }

    unit.x += moveWithCollision(unit, moveAmount);
    applyFrame(unit);

    // 車輪の回転を再現できない代わりに、移動中は足元に砂埃をまとわせて誤魔化す
    const dustFx = unit.def.fxDustMove;
    if (dustFx){
      unit.dustTimer = (unit.dustTimer || 0) + dtMs;
      const interval = dustFx.durations[0] || 600;
      if (unit.dustTimer >= interval){
        unit.dustTimer -= interval;
        spawnFx(dustFx.imageBase + dustFx.prefix + "1.png", unit.x, {
          flip: Math.random() < 0.5, height: 70, bottom: 68, lifespan: interval * 1.4
        });
      }
    }
  }
}

/* ---------- メインループ ---------- */

function battleLoop(now){
  requestAnimationFrame(battleLoop);
  if (!battles.length) return;
  for (const b of battles.slice()){
    if (b.ended) continue;
    if (b.frozen){
      if (now < b.freezeUntil){
        b.lastTick = now;
        if (b === shownBattle && (b.freezeUiAt == null || now - b.freezeUiAt > 400)){ b.freezeUiAt = now; buildSiteDeployRow(); }   // 残り秒数を、少しずつ更新する
        continue;
      }
      b.frozen = false; b.lastTick = now;
      if (b === shownBattle) buildSiteDeployRow();
      continue;
    }
    if (b.paused){ b.lastTick = now; continue; }
    // 経過時間を、倍速(speed)に応じて増やし、40msずつに区切って進める(倍速でも、当たり判定などが粗くならないように)
    let dt = Math.min(now - b.lastTick, 100) * (b.speed || 1);
    b.lastTick = now;
    withBattle(b, () => { while (dt > 0 && !b.ended){ const step = Math.min(dt, 40); battleStep(step); dt -= step; } });
  }
  battleSwitchTick(now);
}

function battleStep(dt){
  battle.env = envBattleOf(battle);                    // 昼夜・天気(拠点の戦闘だけ。従来の戦線は、影響なし)
  updateGuide();
  if (battle.placementCooldowns){
    for (const k in battle.placementCooldowns){ if (battle.placementCooldowns[k] > 0) battle.placementCooldowns[k] = Math.max(0, battle.placementCooldowns[k] - dt); }
  }
  // 屍は時間では増えない(倒れたユニットのときだけ増える)ので、ここでは何もためない

  battle.units.forEach(u => { if (u.aura && u.aura.regen && !u.dead && u.hp < u.hpMax) u.hp = Math.min(u.hpMax, u.hp + u.hpMax * u.aura.regen * dt / 1000); });   // 軍医のリーダー効果：常に少しずつ回復

  // 詰み防止：味方が1体もいなくて、屍が、布陣の中で最も安いキャラの値段に足りない状態が続いたら、1体ぶんだけ屍を与える
  {
    const alive = battle.units.some(u => u.side === "player" && !u.dead && !u.def.gateUnit);
    const cheapest = Math.min.apply(null, state.selectedUnits.map(k => getDeployCost(CHAR_DEFS[k])));
    if (!alive && isFinite(cheapest) && battle.corpse < cheapest && !battle.stage.siteBattle){
      battle.starveMs = (battle.starveMs || 0) + dt;
      if (battle.starveMs >= STARVE_GRACE_MS){
        battle.corpse = cheapest;
        battle.starveMs = 0;
        updateWalletUI();
        showToast("最後の屍を得た");
      }
    } else {
      battle.starveMs = 0;
    }
  }

  // 敵ウェーブ：ステージの enemyWaves に、出す時間(秒)・種類・レーンを並べておく
  battle.time += dt / 1000;
  const waves = battle.stage.enemyWaves || [];
  while (battle.nextWave < waves.length && waves[battle.nextWave].t <= battle.time){
    const w = waves[battle.nextWave++];
    if (w.msg) queueBanner(w.msg, false, true); // 敵の出現の告知(赤い文字)
    const wu = spawnUnit(w.kind, "enemy", w.xOffset || 0, { lane: w.lane });
    if (w.boss && w.bossInfo){ unitApplyBoss(wu, w.bossInfo); (battle.bossUnits = battle.bossUnits || {}).enemy = wu; (battle.bossInfo = battle.bossInfo || {}).enemy = w.bossInfo; }     // 基地のボス：大きく、HPが高い
    if (w.bossKid && battle.bossUnits && battle.bossUnits.enemy) wu.bossLeaderUnit = battle.bossUnits.enemy;                                                                            // 引き連れた兵
    if (w.leader){                                                       // 敵のリーダー：常に強化されている(最大HP+25%・攻撃力+10%)
      wu.isEnemyLeader = true;
      const st = document.createElement("div"); st.className = "leader-star"; st.textContent = "★"; wu.el.appendChild(st); wu.el.classList.add("is-leader");
      if (LEADER_AURA[w.kind]) battleAddAura(w.kind, "enemy");                       // 敵のリーダー効果：味方(自身も)に付く
    }
    onEnemySpawned(wu); // 伝令兵：予測していた戦列に敵が現れたか判定する
    // 馭獣鬼(鬼犬2匹つき)など、召喚すると子分も連れてくるキャラは、敵側でも同じように一緒に出す
    (wu.def.summons || []).forEach(s => {
      const subLanes = summonLanes(wu.lane, s.count);
      for (let i = 0; i < s.count; i++){
        const offset = (i - (s.count - 1) / 2) * 26;
        const sub = spawnUnit(s.kind, "enemy", (w.xOffset || 0) + offset, { lane: subLanes[i] });
        onEnemySpawned(sub);
      }
    });
  }
  if (battle.stage.siteBattle) siteBattleCheck();
  // 戦線ごとの警告(ステージのwarningsに、時間(秒)・文言を並べておく。最終波の予告などに使う)
  const warns = battle.stage.warnings || [];
  while (battle.nextWarn < warns.length && warns[battle.nextWarn].t <= battle.time){
    const w = warns[battle.nextWarn++];
    queueBanner(w.msg, !!w.big, true);
  }
  // 最終波を、決めた時間だけ耐え抜いたら、その瞬間に勝利する戦線がある(敵城を落として勝つことも、引き続きできる)
  if (battle.stage.finalWaveAt != null && battle.stage.survivalDuration != null && !battle.ended &&
      battle.time >= battle.stage.finalWaveAt + battle.stage.survivalDuration){
    endBattle(true, false, "survive");
  }
  updateFinalWaveTimer();
  updateFireZones(dt); // 地面に広がる炎(火槍手・ガス缶)の、成長・継続ダメージ・ガス缶の巻き込み
  updateSlashWaves(dt); // 指揮官：斬道の衝撃波の移動・貫通ダメージ

  battle.units.forEach(unit => {
    if (unit.guardCooldown > 0) unit.guardCooldown = Math.max(0, unit.guardCooldown - dt * ((unit.side === "player" && unit.kind === "shieldman" && upgradeTier("shieldman") >= 3) ? 2 : 1));     // 強化3段階めの楯衛：ガードの待ち時間が半分
    if (unit.slowMs > 0) unit.slowMs = Math.max(0, unit.slowMs - dt);
    if (unit.midCooldown > 0) unit.midCooldown = Math.max(0, unit.midCooldown - dt);
    if (unit.attackArmorMs > 0) unit.attackArmorMs = Math.max(0, unit.attackArmorMs - dt);
    if (unit.shieldCooldown > 0) unit.shieldCooldown = Math.max(0, unit.shieldCooldown - dt);
    if (unit.medicCooldown > 0) unit.medicCooldown = Math.max(0, unit.medicCooldown - dt);
    if (unit.courierDebuffUntil && battle.time >= unit.courierDebuffUntil){
      if (unit.buffSources) unit.buffSources.delete(COURIER_DEBUFF_SOURCE);
      unit.courierDebuffUntil = 0;
    }
    if (unit.awaitingResupply){
      unit.resupplyCooldown = Math.max(0, (unit.resupplyCooldown || 0) - dt);
      if (unit.resupplyCooldown <= 0){
        unit.awaitingResupply = false;
        unit.resupplied = true; // 補充完了。次にプレイヤーが召喚ボタンを押すまで、その場で待つ
        if (unit.originalKind && unit.def !== CHAR_DEFS[unit.originalKind]) unit.def = CHAR_DEFS[unit.originalKind]; // 元の(装備を担いだ)姿に戻す
        setMotion(unit, "idle", { loop:true });
        updateDeployReadyTags(); // 「準備完了」の札を出す
      }
    }
    if (unit.meteorCooldown > 0) unit.meteorCooldown = Math.max(0, unit.meteorCooldown - dt);
    if (unit.barrierMs > 0) unit.barrierMs = Math.max(0, unit.barrierMs - dt);
    updateLaneTween(unit, dt);
    resolveEnemyOverlap(unit, dt);
    updateMount(unit, dt);
    updateStatusIcons(unit);
    updateBearerSync(unit);
    updateKingBody(unit, dt);
    if (unit.gateCooldown > 0) unit.gateCooldown = Math.max(0, unit.gateCooldown - dt);
    if (unit.reviveInvulnMs > 0) unit.reviveInvulnMs = Math.max(0, unit.reviveInvulnMs - dt); // 蘇生直後の無敵時間
    updateFortressCorpse(unit);
    updateBuffAura(unit, dt);
    updateFlagBuff(unit);
    updateInspire(unit, dt);
    updateHealer(unit, dt);
    updatePoison(unit, dt);
    updatePoisonFx(unit, dt);
    updateDefile(unit, dt);
    updateBurningStatus(unit, dt);
    updateBurningFx(unit, dt);
    updateCommanderHorn(unit, dt);
    updateLaunch(unit, dt);
    updateCharge(unit, dt);
    updateUnitAI(unit, dt);
    advanceUnit(unit, dt);
  });
  updateTraps(dt);
  updateRestraints(dt);
  updateRevive(dt);
  // エフェクト・タイマーを進める。実行中に新しく登録されたタスク(メテオの発射など)を取りこぼさないよう、いったん退避してから戻す
  const runningTasks = battle.fxList;
  battle.fxList = [];
  const keptTasks = runningTasks.filter(task => task(dt) !== false);
  battle.fxList = keptTasks.concat(battle.fxList);

}


/* =========================================================
   城の損傷・命中・陥落の演出
   損傷：HPが75%・50%・25%を切るたびに、壁のひび・炎・煙が増える
   命中：壁が揺れて光り、破片が飛ぶ
   陥落：壁が崩れ、奥の城も沈み、土煙と揺れのあとに結果の画面へ
   ========================================================= */
function castleSide(side){ return document.querySelector("#battlefield .castle." + side); }
function applyCastleDamageState(side, ratio){
  const w = castleSide(side); if (!w || w.classList.contains("collapse")) return;
  const lv = ratio <= .25 ? 3 : ratio <= .5 ? 2 : ratio <= .75 ? 1 : 0;
  ["d1","d2","d3"].forEach(c => w.classList.remove(c));
  if (lv) w.classList.add("d" + lv);
  const bd = document.getElementById("stage-backdrop");
  if (bd){ ["d1","d2","d3"].forEach(c => bd.classList.remove(side[0] + "-" + c)); if (lv) bd.classList.add(side[0] + "-d" + lv); }
}
function castleHitFx(side){
  if (!battle) return;
  const now = performance.now();
  battle.hitFxAt = battle.hitFxAt || {};
  if (now - (battle.hitFxAt[side] || 0) < 260) return;
  battle.hitFxAt[side] = now;
  const w = castleSide(side); if (!w) return;
  w.classList.remove("hit"); void w.offsetWidth; w.classList.add("hit");
  const field = document.getElementById("battlefield");
  const dir = side === "enemy" ? 1 : -1;
  const x = side === "enemy" ? 62 : STAGE_W - 62;
  const y = 26 + 40 + Math.random() * 420;
  const fl = document.createElement("div"); fl.className = "castle-flash"; fl.style.left = x + "px"; fl.style.top = y + "px"; field.appendChild(fl);
  btimeout(() => fl.remove(), 320);
  const col = side === "enemy" ? ["#5b4128", "#8a7048", "#bfae8c"] : ["#8a8170", "#5f584b", "#a89f8a"];
  for (let i = 0; i < 6; i++){
    const c = document.createElement("i"); c.className = "castle-chip";
    c.style.left = x + "px"; c.style.top = (y + (Math.random() - .5) * 30) + "px"; c.style.background = col[i % 3];
    c.style.setProperty("--dx", (dir * (20 + Math.random() * 70)) + "px"); c.style.setProperty("--dy", (-(20 + Math.random() * 50)) + "px");
    c.style.animationDuration = (.55 + Math.random() * .3) + "s";
    field.appendChild(c); btimeout(() => c.remove(), 950);
  }
}
function playCastleFall(side, win){
  const w = castleSide(side), field = document.getElementById("battlefield"), frame = document.getElementById("battlefield-frame");
  frame.classList.remove("quake"); void frame.offsetWidth; frame.classList.add("quake");
  btimeout(() => frame.classList.remove("quake"), 1000);
  if (w){ w.classList.add("d3", "collapse"); }
  // 壁に沿って、破片と閃光をまき散らす
  const dir = side === "enemy" ? 1 : -1, x = side === "enemy" ? 62 : STAGE_W - 62;
  for (let i = 0; i < 26; i++){
    btimeout(() => {
      const y = 40 + Math.random() * 520;
      const c = document.createElement("i"); c.className = "castle-chip"; c.style.left = x + "px"; c.style.top = y + "px";
      c.style.background = side === "enemy" ? "#6a4d2e" : "#8a8170"; c.style.width = c.style.height = (5 + Math.random() * 8) + "px";
      c.style.setProperty("--dx", (dir * (30 + Math.random() * 130)) + "px"); c.style.setProperty("--dy", (-(30 + Math.random() * 90)) + "px");
      c.style.animationDuration = (.7 + Math.random() * .5) + "s";
      field.appendChild(c); btimeout(() => c.remove(), 1400);
      if (i % 4 === 0){ const fl = document.createElement("div"); fl.className = "castle-flash"; fl.style.left = x + "px"; fl.style.top = y + "px"; field.appendChild(fl); btimeout(() => fl.remove(), 320); }
    }, i * 70);
  }
  // 奥の城：沈み、土煙を上げる
  const bd = document.getElementById("stage-backdrop");
  if (bd){
    const keep = bd.querySelector('img.bd-keep[data-side="' + side + '"]');
    if (keep){ keep.style.setProperty("--tilt", (side === "enemy" ? 3 : -3) + "deg"); keep.classList.add("collapse"); }
    for (let i = 0; i < 6; i++){
      const d = document.createElement("div"); d.className = "bd-dust";
      d.style.left = ((side === "enemy" ? 110 : STAGE_W - 110) + (Math.random() - .5) * 220) + "px"; d.style.top = (-40 + Math.random() * 80) + "px";
      d.style.animationDelay = (i * .18) + "s"; bd.appendChild(d);
    }
  }
  const bn = document.createElement("div"); bn.id = "fall-banner"; bn.className = win ? "win" : "lose"; bn.textContent = win ? "敵城、陥落" : "自城、陥落";
  document.getElementById("screen-battle").appendChild(bn);
  btimeout(() => bn.remove(), 2600);
}
function endBattle(win, instant, reason){
  if (!battle || battle.ended) return;
  battle.ended = true;
  playSfx(win ? REPO_BASE + "audio/sfx_victory.opus" : REPO_BASE + "audio/sfx_defeat.opus", .85);
  const b = battle;
  if (win && b.stage && b.stage.id && !b.stage.siteBattle){ state.cleared.add(b.stage.id); saveCleared(); } // 制した戦線を覚える
  if (b.stage && b.stage.siteBattle) siteBattleFinish(b, win, reason);
  restoreFormation();
  updateGuide();
  if (b.bg && b.stage && b.stage.siteBattle){ battleBgFinish(b, win, reason); return; }         // 画面に出していない間に決着：結果は自動で反映し、知らせるだけ
  const showResult = () => {
    if (shownBattle !== b){ if (b.stage && b.stage.siteBattle && battles.indexOf(b) >= 0) battleBgFinish(b, win, reason); return; } // 演出のあいだに、別の戦闘へ移っていたら、結果画面は出さず、知らせるだけ
    const resultScreen = document.getElementById("screen-result");
    resultScreen.classList.remove("win","lose");
    resultScreen.classList.add(win ? "win" : "lose");
    document.getElementById("result-title").textContent = reason === "retreat" ? "撤退" : (win ? "勝利" : "敗北");
    document.getElementById("result-sub").textContent =
      b.stage && b.stage.siteBattle ? battleResultText(b, win, reason) :
      reason === "repair" ? "自城、すべて直った。" :
      reason === "survive" ? "鬼の大群、ついに退けたり。" :
      (win ? "敵城、陥落。" : "自城、陥落。");
    showScreen("screen-result");
  };
  if (instant){ showResult(); return; }
  if (reason === "repair" || reason === "repel"){ btimeout(showResult, 1200); return; } // 崩れる城はないので、演出は挟まず短い間だけ置く
  playCastleFall(win ? "enemy" : "player", win); // 城が崩れる間、戦場は止まって見せる
  btimeout(showResult, 2700);
}

let openingState = null; // 再生中のタイマーをまとめて持つ(スキップ時に、これらを一括で止める)

// --- 音声要素は使い回す。iOSは「タップの直後に作った音」しか自動再生を許さないことがあるため、
//     毎回 new Audio() する代わりに、起動時のタップで一度だけ「解禁」した要素のsrcを毎回差し替えて使う ---
const SILENT_AUDIO_SRC = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
function primeAudioElement(el){
  try {
    el.src = SILENT_AUDIO_SRC;
    const p = el.play();
    if (p && p.then) p.then(() => { try { el.pause(); } catch(e){} }).catch(() => {});
  } catch(e){}
}
const bgmEls = [new Audio(), new Audio()];
bgmEls.forEach(a => { a.loop = true; a.volume = 0; });
let bgmActiveIdx = 0, bgmCurrentKey = null, bgmFadeTimer = null;
const openingNarrationEl = new Audio();
const openingSfxEl = new Audio();
openingSfxEl.loop = true;
const SFX_POOL_SIZE = 4;
const sfxPool = Array.from({ length: SFX_POOL_SIZE }, () => new Audio());
let sfxPoolIdx = 0;
function primeAllAudioElements(){
  bgmEls.forEach(primeAudioElement);
  primeAudioElement(openingNarrationEl);
  primeAudioElement(openingSfxEl);
  sfxPool.forEach(primeAudioElement);
}

/* ---------- BGM：オープニングと本編(タイトル・編成・マップ・戦闘)で共通の1系統。要素を使い回してクロスフェードする ---------- */
function playBgm(key){
  if (!key || !BGM_TRACKS[key]) return;
  if (bgmCurrentKey === key) return; // 既にこの曲を指定中
  const activeEl = bgmEls[bgmActiveIdx];
  const nextIdx = 1 - bgmActiveIdx;
  const nextEl = bgmEls[nextIdx];
  nextEl.pause();
  nextEl.src = BGM_TRACKS[key];
  nextEl.currentTime = 0;
  nextEl.volume = 0;
  nextEl.play().catch(() => {});
  if (bgmFadeTimer) clearInterval(bgmFadeTimer);
  const steps = 20, stepMs = 1400 / steps;
  let i = 0;
  bgmFadeTimer = setInterval(() => {
    i++;
    const t = Math.min(1, i / steps);
    nextEl.volume = t * .72;
    activeEl.volume = Math.max(0, .72 - t * .72);
    if (i >= steps){
      clearInterval(bgmFadeTimer);
      try { activeEl.pause(); } catch(e){}
    }
  }, stepMs);
  bgmActiveIdx = nextIdx;
  bgmCurrentKey = key;
}
let bgmUnlocked = false;
function unlockMainBgmOnce(){
  // 序幕(オープニング)を見ずにタイトル画面へ来た場合、最初のタップで音声要素を解禁し、テーマ曲を鳴らし始める
  if (bgmUnlocked) return;
  bgmUnlocked = true;
  primeAllAudioElements();
  if (!openingState && !bgmCurrentKey) playBgm("theme");
}
document.addEventListener("pointerdown", unlockMainBgmOnce, { once:true });

/* ---------- 単発の効果音(タップ・軍令・召喚・勝敗など)。数個の要素を使い回して重なりにも耐える ---------- */
function playSfx(src, volume){
  if (typeof battle !== "undefined" && battle && battle.bg && !/tap_common|tap_command|sfx_victory|sfx_defeat/.test(src)) return;   // 裏で進む戦闘の音は、出さない
  const el = sfxPool[sfxPoolIdx];
  sfxPoolIdx = (sfxPoolIdx + 1) % SFX_POOL_SIZE;
  try {
    el.pause();
    el.src = src;
    el.currentTime = 0;
    el.volume = volume != null ? volume : .7;
    el.play().catch(() => {});
  } catch(e){}
}

function stopOpeningAudio(){
  if (!openingState) return;
  try { openingNarrationEl.pause(); } catch(e){}
  try { openingSfxEl.pause(); } catch(e){}
  if (openingState.timer) clearTimeout(openingState.timer);
  openingState = null;
}

function playOpeningBeat(beatIndex, els){
  if (!openingState || openingState.stopped) return;
  if (beatIndex >= OPENING_BEATS.length){ finishOpening(); return; }
  const beat = OPENING_BEATS[beatIndex];

  playBgm(beat.bgm);

  openingSfxEl.pause();
  if (beat.sfx){
    openingSfxEl.src = beat.sfx;
    openingSfxEl.currentTime = 0;
    openingSfxEl.volume = beat.sfxVolume != null ? beat.sfxVolume : .45;
    openingSfxEl.play().catch(() => {});
  }

  const images = beat.images || (beat.image ? [beat.image] : []);
  delete els.image.dataset.swapped; // scene6のような2枚構成のシーンで、前回の再生の状態を持ち越さない
  if (images.length){
    els.image.classList.remove("showing");
    setTimeout(() => {
      if (!openingState || openingState.stopped) return;
      els.image.src = images[0];
      void els.image.offsetWidth; // Ken Burnsのアニメーションを、毎回最初からやり直させる
      els.image.classList.add("showing");
    }, beatIndex === 0 ? 0 : 300);
  }

  els.text.classList.remove("showing");
  setTimeout(() => {
    if (!openingState || openingState.stopped) return;
    els.text.textContent = beat.text;
    els.text.classList.add("showing");
  }, 260);

  openingNarrationEl.pause();
  openingNarrationEl.onended = null;
  openingNarrationEl.onerror = null;
  openingNarrationEl.ontimeupdate = null;
  openingNarrationEl.src = beat.narration;
  openingNarrationEl.currentTime = 0;
  if (images.length > 1){
    // 2枚構成のシーン(裂け目の目→宇宙からの俯瞰など)：ナレーションが半分を過ぎた時点で、次の絵へ切り替える
    openingNarrationEl.ontimeupdate = () => {
      if (!openingNarrationEl.duration || els.image.dataset.swapped === "1") return;
      if (openingNarrationEl.currentTime / openingNarrationEl.duration >= .5){
        els.image.dataset.swapped = "1";
        els.image.classList.remove("showing");
        setTimeout(() => {
          if (!openingState || openingState.stopped) return;
          els.image.src = images[1];
          void els.image.offsetWidth;
          els.image.classList.add("showing");
        }, 260);
      }
    };
  }
  let advanced = false;
  const advance = () => {
    if (advanced || !openingState || openingState.stopped) return;
    advanced = true;
    if (openingState.timer) clearTimeout(openingState.timer);
    playOpeningBeat(beatIndex + 1, els);
  };
  openingNarrationEl.onended = advance;
  openingNarrationEl.onerror = () => { openingState.timer = setTimeout(advance, 4800); }; // ファイルが無い場合のフォールバック
  const playPromise = openingNarrationEl.play();
  if (playPromise && playPromise.catch) playPromise.catch(() => { openingState.timer = setTimeout(advance, 4800); });
  openingState.timer = setTimeout(advance, 45000); // ended が発火しない不具合への保険(どのシーンよりも十分長い時間で最後の保険)
}

function finishOpening(){
  try { localStorage.setItem(OPENING_SEEN_KEY, "1"); } catch(e){}
  bgmUnlocked = true; // これ以降、テーマ曲は既に鳴っているので、unlockMainBgmOnceで鳴らし直さない
  stopOpeningAudio();
  showScreen("screen-title");
  playBgm("theme"); // 早送り(スキップ)された場合も含め、タイトル画面では必ずテーマ曲に落ち着かせる
}

function startOpening(){
  stopOpeningAudio();
  primeAllAudioElements(); // 起動直後のタップから呼ばれるので、ここで全ての音声要素を解禁する
  openingState = { stopped:false };

    image: document.getElementById("opening-image"),

  };
  els.text.classList.remove("showing");

}

/* ---------- マス(グリッド)の表示 ---------- */
// ゲーム内の広さ：横2000 x 縦600。1マスは正方形(GRID_CELL)で、横に20マス・縦に5レーン。
// 縦は、いまの地面(下から74px)を最下段のレーンの足元とし、その上に4レーンを重ねる。兵士(高さ約92px)がほぼ1マスの大きさ。
const STAGE_W = 2000, STAGE_H = 600;
const LANE_GUTTER = 62;
const GRID_CELL = 100, GRID_LANES = 5, GRID_GROUND = 74;
const LANE_LABELS = ["最左翼", "左翼", "中央", "右翼", "最右翼"]; // 下から上の順(仮)
const LANE_READINGS = ["さいさよく", "さよく", "ちゅうおう", "うよく", "さいうよく"];
let gridVisible = false;

// 画面(枠)の大きさに合わせて、ステージ全体を縮小して表示する
function fitStage(){
  const frame = document.getElementById("battlefield-frame");
  if (!frame || !frame.clientWidth || !frame.clientHeight) return;
  const availW = frame.clientWidth - LANE_GUTTER; // 左はレーンボタンの置き場(城を隠さないよう、戦場はその右から)
  const scale = Math.min(availW / STAGE_W, frame.clientHeight / STAGE_H);
  const root = document.documentElement.style;
  root.setProperty("--stage-scale", scale);
  root.setProperty("--stage-offx", (LANE_GUTTER + (availW - STAGE_W * scale) / 2) + "px");
  root.setProperty("--stage-offy", (frame.clientHeight - STAGE_H * scale) + "px"); // 下に揃える
}

{ const bf = document.getElementById("battlefield-frame"); if (bf && !document.getElementById("battle-env")){ const l = envMakeLayer(""); l.id = "battle-env"; bf.appendChild(l); } }
function buildGrid(){
  const field = document.getElementById("battlefield");
  let overlay = document.getElementById("grid-overlay");
  if (overlay) overlay.remove();
  const cols = Math.floor(STAGE_W / GRID_CELL);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.id = "grid-overlay";
  svg.setAttribute("viewBox", "0 0 " + STAGE_W + " " + STAGE_H);
  const add = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    if (text != null) e.textContent = text;
    svg.appendChild(e);
    return e;
  };
  const yTop = k => STAGE_H - (GRID_GROUND + GRID_CELL * (k + 1)); // レーンkの上端(画面の上からの位置)
  // レーンの色分け(1つおきに薄く塗る)
  for (let k = 0; k < GRID_LANES; k++){
    add("rect", { x: 0, y: yTop(k), width: cols * GRID_CELL, height: GRID_CELL, fill: k % 2 === 0 ? "rgba(255,255,255,0.045)" : "rgba(255,255,255,0.0)" });
  }
  // 縦線(マスの境目)と横線(レーンの足元)
  for (let c = 0; c <= cols; c++){
    add("line", { x1: c * GRID_CELL, y1: yTop(GRID_LANES - 1), x2: c * GRID_CELL, y2: STAGE_H - GRID_GROUND, stroke: "rgba(255,255,255,0.16)", "stroke-width": 2 });
  }
  for (let k = 0; k <= GRID_LANES; k++){
    const y = STAGE_H - (GRID_GROUND + GRID_CELL * k);
    add("line", { x1: 0, y1: y, x2: cols * GRID_CELL, y2: y, stroke: k === 0 ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.16)", "stroke-width": 2 });
  }
  // レーン名(左端)と、列の番号(下)
  for (let k = 0; k < GRID_LANES; k++){
    add("text", { x: 60, y: yTop(k) + GRID_CELL / 2 + 8, fill: "rgba(255,255,255,0.55)", "font-size": 24, "font-family": "sans-serif" }, LANE_LABELS[k]);
    add("text", { x: STAGE_W - 60, y: yTop(k) + GRID_CELL / 2 + 8, fill: "rgba(255,255,255,0.55)", "font-size": 24, "font-family": "sans-serif", "text-anchor": "end" }, LANE_LABELS[k]);
  }
  for (let c = 0; c < cols; c++){
    add("text", { x: c * GRID_CELL + GRID_CELL / 2, y: STAGE_H - GRID_GROUND + 30, fill: "rgba(255,255,255,0.5)", "font-size": 22, "font-family": "sans-serif", "text-anchor": "middle" }, String(c + 1));
  }
  add("text", { x: STAGE_W / 2, y: 30, fill: "rgba(255,255,255,0.6)", "font-size": 24, "font-family": "sans-serif", "text-anchor": "middle" },
      "1区画 = " + GRID_CELL + "px (戍卒1体分) / 横" + cols + "区画 × " + GRID_LANES + "戦列");
  svg.style.display = gridVisible ? "" : "none";
  field.insertBefore(svg, field.firstChild);
}

document.getElementById("grid-toggle").addEventListener("click", e => {

  const ov = document.getElementById("grid-overlay");
  if (ov) ov.style.display = gridVisible ? "" : "none";

(function setupReadingTips(){
  const tip = document.createElement("div");
  tip.id = "reading-tip";
  document.body.appendChild(tip);
  let timer = null, hideTimer = null, fired = false, startX = 0, startY = 0, tipPaused = false;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  function show(el){
    const name = el.dataset.rname || el.textContent.trim().replace(/[A-Za-z0-9:\s銭]+$/, "").trim() || el.textContent.trim();
    const reading = el.dataset.reading;
    if (!reading) return;
    tip.innerHTML = "<ruby>" + esc(name) + "<rt>" + esc(reading) + "</rt></ruby>" + (el.dataset.desc ? '<div class="tip-desc">' + esc(el.dataset.desc) + "</div>" : "");
    // 陣形の説明を見ている間は、ゲームを一時停止する(見終わったら、もとに戻す)
    if (el.dataset.pause && battle && !battle.paused){
      battle.paused = true; tipPaused = true;
      const pb = document.getElementById("btn-pause"); if (pb) pb.textContent = "▶";
    }
    const r = el.getBoundingClientRect();
    tip.style.opacity = "1";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.left + r.width / 2 - tw / 2;
    left = Math.max(6, Math.min(window.innerWidth - tw - 6, left));
    let top = r.top - th - 8;
    if (top < 6) top = r.bottom + 8;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hide(){
    tip.style.opacity = "0";
    if (tipPaused && battle){
      battle.paused = false; tipPaused = false;
      const pb = document.getElementById("btn-pause"); if (pb) pb.textContent = "Ⅱ";
    }
  }
  document.addEventListener("pointerdown", e => {
    fired = false;
    clearTimeout(timer); clearTimeout(hideTimer); hide();
    const el = e.target.closest ? e.target.closest("[data-reading]") : null;
    if (!el || !el.dataset.reading) return;
    startX = e.clientX; startY = e.clientY;
    timer = setTimeout(() => { fired = true; show(el); }, 450);
  }, true);
  document.addEventListener("pointermove", e => {
    if (timer && !fired && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) clearTimeout(timer); // スクロール・ドラッグなら長押しにしない
  }, true);
  ["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, () => {
    clearTimeout(timer);
    if (fired){ clearTimeout(hideTimer); hideTimer = setTimeout(hide, 1600); }
  }, true));
  document.addEventListener("click", e => {
    if (fired && e.target.closest && e.target.closest("[data-reading]")){
      e.stopPropagation(); e.preventDefault(); // 長押しのあとのタップは、実行しない
      fired = false;
    }
  }, true);
  document.addEventListener("contextmenu", e => {
    if (e.target.closest && e.target.closest("[data-reading]")) e.preventDefault();
  }, true);
})();

const infoUI = { unit: null };
function fieldPointToLogical(e){
  const field = document.getElementById("battlefield");
  const r = field.getBoundingClientRect();
  const scale = r.width / STAGE_W;
  // 戦場は左右反転して描いている(敵は右、自軍は左)。画面の位置から、内部の座標(自軍が右)へ戻す
  return { lx: STAGE_W - (e.clientX - r.left) / scale, ly: (e.clientY - r.top) / scale };
}
// タップした位置にいる兵(小さい兵でも押せるよう、少し広めに判定する)
function unitAtPoint(lx, ly){
  const by = STAGE_H - ly; // 下からの高さ
  let best = null, bd = Infinity;
  battle.units.forEach(u => {
    if (u.dead || u.mounted || u.def.invulnerable || u.def.gateUnit) return;
    const w = u._displayWidth || 60, h = u._displayHeight || 80, pad = 16;
    const bottom = (u.baseB || GRID_GROUND) + Math.round(u.launchY || 0) + Math.round(u.rideY || 0);
    if (lx < u.x - pad || lx > u.x + w + pad) return;
    if (by < bottom - pad || by > bottom + h + pad) return;
    const d = Math.abs((u.x + w / 2) - lx) + Math.abs((bottom + h / 2) - by);
    if (d < bd){ bd = d; best = u; }
  });
  return best;
}
function showUnitInfo(u){
  infoUI.unit = u;
  renderUnitInfo();
}
function closeUnitInfo(){
  infoUI.unit = null;
  const box = document.getElementById("unit-info");
  if (box) box.style.display = "none";
}
function renderUnitInfo(){
  const box = document.getElementById("unit-info");
  const u = infoUI.unit;
  if (!u || u.dead || !battle){ closeUnitInfo(); return; }
  box.style.display = "block";
  box.innerHTML = "";
  const title = document.createElement("div"); title.className = "ui-title";
  title.textContent = (u.side === "enemy" ? "敵 " : "") + u.def.name;
  box.appendChild(title);
  const line = t => { const d = document.createElement("div"); d.textContent = t; box.appendChild(d); };
  line("HP " + Math.ceil(u.hp) + " / " + u.hpMax + "　攻 " + Math.round(getEffectiveAtk(u) * (u.homeAtk || 1) * 10) / 10);
  if (u.berserk) line("凶暴化：あと" + Math.ceil(u.rageMs / 1000) + "秒　攻撃×1.5・速さ×1.3・被ダメージ×0.8　敵味方の見境なし");
  else if ((u.defile || 0) > 0.5) line("穢れ " + Math.round(u.defile) + "/" + DEFILE_MAX + "　(100で、凶暴化)");
  if (u.upgTier){ const k = u.deployedKind || u.kind; line("強化 Lv" + u.upgTier + "/3　" + upgradeStatText(u.upgTier) + (u.upgTier >= 3 && UPG_T3[k] ? "　" + UPG_T3[k].name : "")); }
  if (u.rankName){ const r = u.mods && u.mods.rank; line("階級 " + u.rankName + (r ? "　攻撃×" + r.atk + "・被ダメージ×" + r.cut : "")); }
  if (u.homeAura){ const h = u.mods && u.mods.home; line((u.isLeader ? "本拠地の力(リーダー)" : "本拠地の力(隊員)") + (h ? "　攻撃×" + h.atk + "・被ダメージ×" + h.cut : "")); }
  if (u.isBoss){
    if (u.bossLeader) line("本拠地のボス：倒れると、隊員は全滅し、屍城は滅びる");
    else { const bi = battle.bossInfo && battle.bossInfo[u.side]; if (bi){ line("基地のボス　強さ " + bi.T.stars + "　大きさ×" + BOSS_SIZE + "・HP×" + bi.T.hp); line("引き連れた兵：" + bossLineupText(bi)); line("倒れると、兵は全滅し、基地は" + (u.side === "player" ? "奪われる" : "占領される")); } }
  }
  line(LANE_LABELS[u.lane] + (u.laneHi > u.laneLo ? "ほか" : "") + "　" + (u.side === "player" ? "味方" : "敵"));
  if (u.perch && u.perch.phase === "deck") line((findStructureAt(u.perch.col, u.perch.lane) || {}).def?.structureKind === "wall" ? "壁の上　射程1.2倍・全戦列" : "望楼台の上　射程1.2倍・全戦列");
  const row = document.createElement("div"); row.className = "ui-row";
  const c = document.createElement("button"); c.textContent = "閉"; c.addEventListener("click", closeUnitInfo); row.appendChild(c);
  box.appendChild(row);
  // 兵の近くに置く(画面の外にはみ出さないように)
  const frame = document.getElementById("battlefield-frame").getBoundingClientRect();
  const r = u.el.getBoundingClientRect();
  const bw = box.offsetWidth, bh = box.offsetHeight;
  let left = r.left - frame.left + r.width / 2 - bw / 2;
  left = Math.max(4, Math.min(frame.width - bw - 4, left));
  let top = r.top - frame.top - bh - 6;
  if (top < 4) top = r.bottom - frame.top + 6;
  top = Math.max(4, Math.min(frame.height - bh - 4, top));
  box.style.left = left + "px";
  box.style.top = top + "px";
}
function onFieldClick(e){
  if (!battle || battle.ended) return;
  const p = fieldPointToLogical(e);
  if (battle.repairPickPending){
    const target = repairTargetAtPoint(p.lx, p.ly);
    if (!target){ showToast("そこは直せぬ"); return; }
    const cur = battle.repairPickPending.target;
    const same = cur && cur.kind === target.kind && (cur.kind === "castle" || cur.ref === target.ref);
    if (same){ battle.repairPickPending.target = null; clearRepairHighlight(); } // 同じ所をもう一度タップで、選び直し
    else { battle.repairPickPending.target = target; setRepairHighlight(target); }
    return; // 対象待ちの間は、タップを対象選び(ハイライト)だけに使う。召喚は札をもう一度押す
  }
  if (battle.placementPending){
    const col = columnOfX(p.lx);
    const lane = Math.floor((STAGE_H - GRID_GROUND - p.ly) / GRID_CELL);
    if (lane >= 0 && lane < GRID_LANES && laneAllowed(lane)){
      if (commitPlacement(battle.placementPending.kind, col, lane)) battle.placementPending = null;
    } else {
      battle.placementPending = null; // 使えない場所をタップしたら、設置待ちを取り消す
    }
    if (!battle.placementPending){
      const ov = document.getElementById("grid-overlay"); if (ov) ov.style.display = gridVisible ? "" : "none"; // 普段の表示設定に戻す
    }
    return; // 設置の場所待ちの間は、タップを場所選びだけに使う
  }
  if (battle.stage.siteBattle && siteBattleFieldTap(p)) return;      // 拠点の戦闘：兵を置く・動かす
  const u = unitAtPoint(p.lx, p.ly);
  if (u){ showUnitInfo(u); return; }               // 兵をタップ：情報を出す
  closeUnitInfo();
  // 何もない所をタップ：その戦列を、選ぶ・解除する(複数選べる)
  const lane = Math.floor((STAGE_H - GRID_GROUND - p.ly) / GRID_CELL);
  if (lane < 0 || lane >= GRID_LANES || !laneAllowed(lane)) return;
  if (battle.selectedLanes.has(lane)) battle.selectedLanes.delete(lane); else battle.selectedLanes.add(lane);
  updateLaneButtons();
}
// 戦場は、戦闘ごとに別の要素なので、タップは、外側の枠でまとめて受ける
document.getElementById("battlefield-frame").addEventListener("click", e => { if (e.target.closest && e.target.closest("#battlefield")) onFieldClick(e); });
setInterval(() => { if (infoUI.unit && battle && !battle.paused) renderUnitInfo(); }, 300);

window.addEventListener("resize", () => { fitStage(); layoutLaneButtons(); });
buildGrid();
buildLaneButtons();
fitStage();
layoutLaneButtons();
/* ---------- レーン選択ボタン ---------- */
// 左端に縦に5つ(下から 最左翼 〜 最右翼)。ここでレーンを選んでから、キャラを召喚する
function buildLaneButtons(){
  const box = document.getElementById("lane-buttons");
  box.innerHTML = "";
  for (let k = 0; k < GRID_LANES; k++){
    const b = document.createElement("button");
    b.textContent = LANE_LABELS[k];
    b.dataset.lane = k;
    b.dataset.reading = LANE_READINGS[k];
    b.addEventListener("click", () => {
      if (!battle) return;
      // タップするたびに、選択・解除が切り替わる(5レーン全て選べる)
      if (battle.selectedLanes.has(k)) battle.selectedLanes.delete(k); else battle.selectedLanes.add(k);
      updateLaneButtons();
    });
    box.appendChild(b);
  }
  // 全レーンの選択・解除をまとめて切り替えるボタン
  const all = document.createElement("button");
  all.id = "lane-all-btn";
  all.textContent = "全戦列";
  all.dataset.reading = "ぜんせんれつ";
  all.addEventListener("click", () => {
    if (!battle) return;
    const al = allowedLaneList();
    if (battle.selectedLanes.size >= al.length) battle.selectedLanes.clear();
    else al.forEach(k => battle.selectedLanes.add(k));
    updateLaneButtons();
  });
  box.appendChild(all);
  layoutLaneButtons();
}
function layoutLaneButtons(){
  const frame = document.getElementById("battlefield-frame");
  const box = document.getElementById("lane-buttons");
  if (!frame || !box || !frame.clientHeight) return;
  const scale = Math.min((frame.clientWidth - LANE_GUTTER) / STAGE_W, frame.clientHeight / STAGE_H);
  const offy = frame.clientHeight - STAGE_H * scale;
  Array.from(box.children).forEach(b => {
    if (b.id === "lane-all-btn"){
      // 「全レーン」ボタンは、いちばん下のレーンの下(地面の下の余白)に置く
      const t = offy + (STAGE_H - GRID_GROUND) * scale + 2;
      b.style.top = t + "px";
      b.style.height = Math.max(16, GRID_GROUND * scale - 4) + "px";
      return;
    }
    const k = Number(b.dataset.lane);
    const top = offy + (STAGE_H - GRID_GROUND - GRID_CELL * (k + 1)) * scale;
    b.style.top = (top + 1) + "px";
    b.style.height = Math.max(20, GRID_CELL * scale - 3) + "px";
  });
}
function updateLaneBands(){
  const field = document.getElementById("battlefield");
  if (!field) return;
  for (let k = 0; k < GRID_LANES; k++){
    let band = document.getElementById("lane-band-" + k);
    if (!band){
      band = document.createElement("div");
      band.id = "lane-band-" + k;
      band.className = "lane-band";
      band.style.bottom = laneFloor(k) + "px";
      field.appendChild(band);
    }
    const single = !!(battle && battle.stage && battle.stage.lanes && battle.stage.lanes.length <= 1); // 戦列が1つだけの戦線では、帯を光らせない
    band.classList.toggle("on", !!battle && !single && battle.selectedLanes.has(k));
  }
}
function updateLaneButtons(){
  updateLaneBands();
  if (battle) updateWalletUI(); // 召喚ボタンの「×選んだ戦列の数」と合計の屍を更新する
  const box = document.getElementById("lane-buttons");
  if (!box) return;
  Array.from(box.children).forEach(b => {
    if (b.id === "lane-all-btn"){
      b.classList.toggle("selected", !!battle && battle.selectedLanes.size >= allowedLaneList().length);
      return;
    }
    b.classList.toggle("selected", !!battle && battle.selectedLanes.has(Number(b.dataset.lane)));
  });
}
function allowedLaneList(){ const r = []; for (let k = 0; k < GRID_LANES; k++) if (laneAllowed(k)) r.push(k); return r; }
function flashLaneButtons(){
  const box = document.getElementById("lane-buttons");
  box.classList.remove("flash");
  void box.offsetWidth;
  box.classList.add("flash");
  setTimeout(() => box.classList.remove("flash"), 1200);
}

})();
